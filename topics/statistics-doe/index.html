<title>統計學、假設檢定與實驗設計：完整推導 ｜ 博雅書院</title>
<meta name="description" content="從機率公理一路推導到實驗設計的完整課程，每一個公式都推出來而不是背下來。前置知識為微積分（偏微分、重積分、變數變換的 Jacobian）與線性代數（矩陣乘法、反矩陣、特徵值）。第一部分建立機率、隨機變數與動差生成函數（它就是機率密度的拉普拉斯轉換），並推導卜瓦松如何從二項的極限浮現、用極座標證明高斯積分、用 MGF 給出中央極限定理的證明骨架。第二部分是全課的技術核心：完整推導卡方、t、F 三大抽樣分布，證明樣本變異數為何除以 n−1，並用 Helmert 正交變換證明 (n−1)S²/σ² 服從卡方且與樣本平均獨立。第三部分處理假設檢定：完整證明奈曼—皮爾森引理（為什麼拒絕域必須按概似比排序）、廣義似然比與 Wilks 定理，並證明 t 檢定就是常態模型的似然比檢定；逐一推導合併變異數、Welch–Satterthwaite 自由度、Wilson 區間、卡方與費雪精確檢定、無母數方法；再誠實面對 p 值的誤用、多重比較（用布爾不等式推出 Bonferroni）、偽發現率與 BH 程序、p-hacking 與複製危機。第四部分建立線性模型：最小平方的微分法與投影法兩種推導、高斯—馬可夫定理的完整證明（它完全不需要常態假設）、帽子矩陣與自由度的統一解釋、變異數分析中 E[MSB] 與 E[MSW] 的推導。第五部分是實驗設計：費雪三原則、女士品茶的超幾何精確計算、區集化的相對效率、拉丁方、巢狀設計與變異成分；二水準因子設計的正交性與 Var(效果)=4σ²/N、Yates 演算法、無重複時的常態機率圖與 Lenth 法；分數因子設計的定義關係與別名結構推導、解析度、摺疊設計；反應曲面法的最陡上升路徑、曲率檢定、中央合成設計與旋轉性條件 α=n_F^(1/4)、以及用特徵值分解做標準點分析；最後處理裂區設計的兩個誤差項、田口方法的貢獻與爭議、最適設計，並以一個六週把不良率從 8% 降到 0.6% 的完整案例收尾。">
