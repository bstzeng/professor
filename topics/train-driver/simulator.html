    <article class="lesson-content">

      <script>
      (function () {
        if (window.__trLib) return; window.__trLib = 1;
        function btn(t) { var b = document.createElement('button'); b.type = 'button'; b.textContent = t;
          b.style.cssText = 'padding:4px 10px;margin:4px 6px 0 0;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer;font:inherit;font-size:0.92em'; return b; }
        function head(root, q) { if (q) { var p = document.createElement('p'); p.style.margin = '0 0 8px'; p.innerHTML = q; root.appendChild(p); } }
        function n1(v) { return Math.round(v * 10) / 10; }
        function tx(x, y, s, sz, c, anc, ex) { return '<text x="' + n1(x) + '" y="' + n1(y) + '" font-size="' + sz + '" fill="' + c + '" text-anchor="' + (anc || 'middle') + '" ' + (ex || '') + '>' + s + '</text>'; }
        function rc(x, y, w, h, f, s, ex) { return '<rect x="' + n1(x) + '" y="' + n1(y) + '" width="' + n1(w) + '" height="' + n1(h) + '" fill="' + (f || 'none') + '" stroke="' + (s || 'none') + '" ' + (ex || '') + '/>'; }
        function ci(x, y, r, f, s) { return '<circle cx="' + n1(x) + '" cy="' + n1(y) + '" r="' + r + '" fill="' + f + '" stroke="' + (s || 'none') + '"/>'; }
        function ln(x1, y1, x2, y2, c, w, ex) { return '<line x1="' + n1(x1) + '" y1="' + n1(y1) + '" x2="' + n1(x2) + '" y2="' + n1(y2) + '" stroke="' + c + '" stroke-width="' + (w || 1) + '" ' + (ex || '') + '/>'; }
        var LC = { r: '#ff3b3b', y: '#ffc61a', g: '#2fe06a', o: '#333a40' };
        function sigSvg(x, y, lamps, s) { s = s || 1; var r = 9 * s, h = lamps.length * 2.4 * r + r, o = ln(x, y + h, x, y + h + 30 * s, '#777', 3 * s) + rc(x - 1.7 * r, y, 3.4 * r, h, '#14181c', '#555', 'rx="' + 5 * s + '"');
          lamps.split('').forEach(function (c, i) { o += ci(x, y + r * 1.7 + i * 2.4 * r, r, LC[c], '#555'); }); return o; }
        var ASPECT = { g: ['og', '進行', '可以用規定的最高速度通過'], yg: ['yg', '減速', '下一個號誌可能是「注意」，要開始減速'], y: ['yo', '注意', '下一個號誌可能是停止，要減到注意速度並準備停車'],
          yy: ['yy', '警戒', '前方很近處可能有停止號誌或列車，用很低的速度前進'], r: ['ro', '停止', '不可以越過這個號誌'] };

        /* ---------- 號誌判讀測驗 ---------- */
        function initSig(root, cfg) {
          head(root, cfg.q); var keys = Object.keys(ASPECT), cur, score = 0, n = 0;
          var view = document.createElement('div'); view.style.cssText = 'display:flex;gap:16px;align-items:center;flex-wrap:wrap'; root.appendChild(view);
          var opts = document.createElement('div'), fb = document.createElement('p'); fb.style.margin = '8px 0 0'; root.appendChild(opts); root.appendChild(fb);
          function ask() { var nx; do { nx = keys[Math.floor(Math.random() * keys.length)]; } while (nx === cur && keys.length > 1); cur = nx;
            view.innerHTML = '<svg viewBox="0 0 60 110" style="width:60px;background:#1d2329;border-radius:8px">' + sigSvg(30, 10, ASPECT[cur][0], 1.4) + '</svg><div>這個色燈號誌的意思是？<br><span style="color:var(--text-muted);font-size:0.9em">答對 ' + score + ' / ' + n + '</span></div>';
            opts.innerHTML = ''; keys.forEach(function (k) { var b = btn(ASPECT[k][1]); b.addEventListener('click', function () { n++; var good = k === cur; if (good) score++;
              fb.innerHTML = (good ? '✅ 正確：' : '❌ 這是「' + ASPECT[cur][1] + '」：') + ASPECT[cur][2] + '。'; ask(); }); opts.appendChild(b); }); }
          ask();
        }

        /* ---------- 煞車距離計算器 ---------- */
        function initBrake(root, cfg) {
          head(root, cfg.q); var v = { spd: 130, dec: 0.8, rt: 3, grade: 0 };
          var view = document.createElement('div'); root.appendChild(view); var box = document.createElement('div');
          box.style.cssText = 'display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:4px 14px;margin-top:8px'; root.appendChild(box);
          var defs = [['spd', '速度', 20, 300, 5, ' km/h'], ['dec', '減速度', 0.3, 1.4, 0.05, ' m/s²'], ['rt', '反應＋煞車作動時間', 0, 8, 0.5, ' 秒'], ['grade', '坡度（下坡為負）', -25, 25, 1, ' ‰']], els = {};
          defs.forEach(function (d) { var l = document.createElement('label'); l.style.fontSize = '0.88em'; l.innerHTML = d[1] + '：<b></b>'; var s = document.createElement('input'); s.type = 'range'; s.min = d[2]; s.max = d[3]; s.step = d[4]; s.value = v[d[0]]; s.style.cssText = 'width:100%;display:block';
            s.setAttribute('data-k', d[0]); s.addEventListener('input', function () { v[d[0]] = +s.value; draw(); }); l.appendChild(s); box.appendChild(l); els[d[0]] = [l.querySelector('b'), d[5]]; });
          var pre = document.createElement('div'); root.appendChild(pre);
          [['區間車 110', { spd: 110, dec: 0.8 }], ['自強號 130', { spd: 130, dec: 0.8 }], ['高鐵 300', { spd: 300, dec: 0.75 }], ['濕滑軌道', { dec: 0.5 }], ['汽車 100（對照）', { spd: 100, dec: 6, rt: 1.5, grade: 0 }]].forEach(function (p) {
            var b = btn(p[0]); b.addEventListener('click', function () { for (var k in p[1]) v[k] = p[1][k]; box.querySelectorAll('input').forEach(function (s) { s.value = v[s.getAttribute('data-k')]; }); draw(); }); pre.appendChild(b); });
          if (cfg.car !== false) {}
          function draw() { for (var k in els) els[k][0].textContent = v[k] + els[k][1];
            var ms = v.spd / 3.6, a = Math.max(0.05, v.dec + v.grade / 1000 * 9.8), d1 = ms * v.rt, d2 = ms * ms / (2 * a), tot = d1 + d2, sc = 560 / Math.max(1500, tot * 1.05);
            var o = rc(0, 0, 640, 110, '#1d2329', 'none', 'rx="10"') + ln(40, 70, 600, 70, '#888', 2);
            o += rc(40, 56, d1 * sc, 14, '#ffc61a', 'none', 'opacity="0.85"') + rc(40 + d1 * sc, 56, d2 * sc, 14, '#ff6b5a', 'none', 'opacity="0.85"');
            for (var m = 0; m <= 1500 * Math.ceil(tot / 1500 + 0.01); m += (tot > 3000 ? 1000 : 250)) { var x = 40 + m * sc; if (x > 610) break; o += ln(x, 72, x, 78, '#aaa', 1) + tx(x, 92, m, 10, '#ccc'); }
            o += tx(40, 44, '反應／作動 ' + Math.round(d1) + ' m', 11, '#ffc61a', 'start') + tx(600, 44, '煞車 ' + Math.round(d2) + ' m', 11, '#ff6b5a', 'end') + tx(320, 22, '總停車距離約 ' + Math.round(tot) + ' 公尺', 14, '#fff', 'middle', 'font-weight="bold"');
            view.innerHTML = '<svg viewBox="0 0 640 110" style="width:100%;display:block">' + o + '</svg>'; }
          draw();
        }

        /* ---------- 指差確認練習 ---------- */
        var PC = [
          ['出發號誌顯示綠燈', 'og', '出發，進行！', ['出發，進行！', '出發，停止！', '場內，注意！']],
          ['前方號誌顯示黃燈', 'yo', '注意！', ['進行！', '注意！', '警戒！']],
          ['前方號誌顯示紅燈', 'ro', '停止！', ['停止！', '注意！', '減速！']],
          ['速度限制標「60」', 's60', '速限 60！', ['速限 60！', '速限 90！', '停車位置！']],
          ['月台上的停車位置標「8」（本列車 8 輛）', 'st8', '8 輛，停車位置！', ['8 輛，停車位置！', '12 輛，停車位置！', '出發，進行！']],
          ['號誌顯示黃綠', 'yg', '減速！', ['減速！', '進行！', '警戒！']],
          ['列車長關門完成的信號燈亮起', 'door', '關門，確認！', ['關門，確認！', '出發，進行！', '停止！']]
        ];
        function pcIcon(k) { var o = '<svg viewBox="0 0 70 110" style="width:64px;background:#1d2329;border-radius:8px">';
          if (k === 's60') o += rc(12, 20, 46, 46, '#fff', '#333', 'rx="4"') + tx(35, 52, '60', 22, '#111') + ln(35, 66, 35, 100, '#888', 3);
          else if (k === 'st8') o += rc(10, 20, 50, 46, '#fff', '#333') + tx(35, 54, '8', 28, '#c00') + ln(35, 66, 35, 100, '#888', 3);
          else if (k === 'door') o += rc(10, 35, 50, 30, '#111', '#555', 'rx="4"') + ci(35, 50, 10, '#ffc61a') + tx(35, 85, '車門', 11, '#ccc');
          else o += sigSvg(35, 10, k, 1.4);
          return o + '</svg>'; }
        function initPC(root, cfg) {
          head(root, cfg.q); var i = 0, score = 0;
          var view = document.createElement('div'); view.style.cssText = 'display:flex;gap:16px;align-items:center'; root.appendChild(view);
          var opts = document.createElement('div'), fb = document.createElement('p'); fb.style.margin = '8px 0 0'; root.appendChild(opts); root.appendChild(fb);
          function show() { if (i >= PC.length) { view.innerHTML = '<p style="margin:0">🎉 完成！答對 <b>' + score + ' / ' + PC.length + '</b>。</p>'; opts.innerHTML = ''; var r = btn('再練一次'); r.addEventListener('click', function () { i = 0; score = 0; fb.innerHTML = ''; show(); }); opts.appendChild(r); return; }
            var s = PC[i]; view.innerHTML = pcIcon(s[1]) + '<div><b>情境 ' + (i + 1) + ' / ' + PC.length + '：</b>' + s[0] + '<br><span style="color:var(--text-muted);font-size:0.9em">👉 手指著它，要唸出什麼？</span></div>';
            opts.innerHTML = ''; s[3].slice().sort(function () { return Math.random() - 0.5; }).forEach(function (o) { var b = btn('☝️ ' + o); b.addEventListener('click', function () { var good = o === s[2]; if (good) score++;
              fb.innerHTML = good ? '✅ 正確。' : '❌ 應該唸「' + s[2] + '」。'; i++; show(); }); opts.appendChild(b); }); }
          show();
        }

        /* ---------- 運行圖 ---------- */
        function initDia(root, cfg) {
          head(root, cfg.q); var st = cfg.st, tr = cfg.tr, t0 = cfg.t0, t1 = cfg.t1, X0 = 70, X1 = 620, Y0 = 20, Y1 = 250, sel = -1, cur = cfg.cur || t0;
          function sx(t) { return X0 + (t - t0) / (t1 - t0) * (X1 - X0); }
          function sy(km) { return Y0 + km / st[st.length - 1][1] * (Y1 - Y0); }
          function hm(t) { var h = Math.floor(t / 60), m = t % 60; return (h < 10 ? '0' : '') + h + ':' + (m < 10 ? '0' : '') + Math.round(m); }
          var view = document.createElement('div'); root.appendChild(view);
          var sl = document.createElement('input'); sl.type = 'range'; sl.min = t0; sl.max = t1; sl.value = cur; sl.style.width = '100%'; root.appendChild(sl);
          var info = document.createElement('p'); info.style.margin = '6px 0 0'; root.appendChild(info);
          function posAt(p, t) { for (var k = 0; k < p.length - 1; k++) if (t >= p[k][0] && t <= p[k + 1][0]) { var f = p[k + 1][0] === p[k][0] ? 0 : (t - p[k][0]) / (p[k + 1][0] - p[k][0]); return p[k][1] + (p[k + 1][1] - p[k][1]) * f; } return null; }
          function draw() { var o = rc(0, 0, 640, 300, 'var(--surface)', 'none');
            st.forEach(function (s) { var y = sy(s[1]); o += ln(X0, y, X1, y, '#999', 0.6, 'stroke-dasharray="2 3"') + tx(X0 - 6, y + 4, s[0], 11, 'currentColor', 'end'); });
            for (var t = Math.ceil(t0 / 10) * 10; t <= t1; t += 10) { var x = sx(t); o += ln(x, Y0, x, Y1, '#999', t % 60 === 0 ? 1 : 0.4) + (t % 30 === 0 ? tx(x, Y1 + 16, hm(t), 10, 'currentColor') : ''); }
            tr.forEach(function (r, i) { var d = r.p.map(function (q, k) { return (k ? 'L' : 'M') + n1(sx(q[0])) + ' ' + n1(sy(q[1])); }).join(' ');
              o += '<path d="' + d + '" stroke="' + r.c + '" stroke-width="' + (sel === i ? 4.5 : 2.2) + '" fill="none" ' + (r.dash ? 'stroke-dasharray="6 4"' : '') + '/>';
              o += '<path d="' + d + '" stroke="transparent" stroke-width="14" fill="none" data-i="' + i + '" style="cursor:pointer"/>';
              var p0 = r.p[0]; o += tx(sx(p0[0]) + (r.p[1][1] > p0[1] ? 4 : -4), sy(p0[1]) + (r.p[1][1] > p0[1] ? -5 : -6), r.n, 10, r.c, r.p[1][1] > p0[1] ? 'start' : 'end'); });
            var xc = sx(cur); o += ln(xc, Y0 - 6, xc, Y1, '#e0605a', 1.5);
            // 下方路線圖
            var yb = 280; o += ln(X0, yb, X1, yb, '#888', 3);
            st.forEach(function (s) { var x = X0 + s[1] / st[st.length - 1][1] * (X1 - X0); o += ci(x, yb, 4, '#fff', '#555'); });
            tr.forEach(function (r) { var km = posAt(r.p, cur); if (km === null) return; var x = X0 + km / st[st.length - 1][1] * (X1 - X0); o += rc(x - 8, yb - 14, 16, 9, r.c, 'none', 'rx="2"'); });
            view.innerHTML = '<svg viewBox="0 0 640 296" style="width:100%;display:block;color:var(--text)">' + o + '</svg>';
            view.querySelectorAll('path[data-i]').forEach(function (p) { p.addEventListener('click', function () { sel = +p.getAttribute('data-i'); draw(); }); });
            var txt = '⏱️ ' + hm(cur) + '　'; tr.forEach(function (r) { var km = posAt(r.p, cur); if (km === null) return; var near = st.filter(function (s) { return Math.abs(s[1] - km) < 0.3; })[0];
              txt += '<span style="color:' + r.c + '">■</span> ' + r.n + (near ? '（' + near[0] + '）' : '') + '　'; });
            if (sel >= 0) txt += '<br><b>' + tr[sel].n + '：</b>' + tr[sel].d;
            info.innerHTML = txt; }
          sl.addEventListener('input', function () { cur = +sl.value; draw(); }); draw();
        }

        /* ---------- 駕駛模擬器 ---------- */
        function initDrive(root, cfg) {
          head(root, cfg.q);
          var C = cfg, s = { x: 0, v: 0, n: 0, t: 0, atp: false, done: false, msg: '', eb: false, alert: 0, alertT: 0 };
          var NOTCH = ['緊急', 'B7', 'B6', 'B5', 'B4', 'B3', 'B2', 'B1', '惰行', 'P1', 'P2', 'P3', 'P4'], N0 = 8;
          s.n = N0;
          var view = document.createElement('div'); root.appendChild(view);
          var ctl = document.createElement('div'); ctl.style.cssText = 'display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:8px'; root.appendChild(ctl);
          var bUp = btn('⬆ 推（加速）'), bDn = btn('⬇ 拉（煞車）'), bEB = btn('🛑 緊急煞車'), bAck = btn('✋ 警醒確認'), bRs = btn('↺ 重來');
          var nl = document.createElement('b'); nl.style.cssText = 'min-width:4em;text-align:center;font-family:ui-monospace,monospace';
          [bDn, nl, bUp, bEB, bAck, bRs].forEach(function (b) { ctl.appendChild(b); });
          bUp.setAttribute('data-k', 'up'); bDn.setAttribute('data-k', 'dn'); bAck.setAttribute('data-k', 'ack');
          var out = document.createElement('p'); out.style.cssText = 'margin:8px 0 0;min-height:3em'; root.appendChild(out);
          function lim(x) { var L = C.vmax; C.zones.forEach(function (z) { if (x >= z[0] - 0 && x <= z[1]) L = Math.min(L, z[2]); }); return L; }
          function sigLim(x) { var L = 999; C.sigs.forEach(function (g) { if (x < g[0] && g[0] - x < 900 && g[1] === 'yo') L = Math.min(L, 45 + (g[0] - x) / 30); }); return L; }
          function stopTarget() { return C.stop; }
          function atpLim(x) { var L = Math.min(lim(x), sigLim(x));
            C.zones.forEach(function (z) { if (x < z[0]) { var d = z[0] - x, vv = Math.sqrt(Math.pow(z[2] / 3.6, 2) + 2 * 0.6 * Math.max(0, d - 80)) * 3.6; L = Math.min(L, vv); } });
            var d = C.stop + 30 - x; if (d > 0) L = Math.min(L, Math.max(15, Math.sqrt(2 * 0.6 * Math.max(0, d - 40)) * 3.6)); return L; }
          function key(k) { if (s.done) return; if (k === 'up' && s.n < NOTCH.length - 1 && !s.eb) s.n++; if (k === 'dn' && s.n > 1) s.n--; if (k === 'up' && s.eb && s.v === 0) { s.eb = false; s.n = N0; } s.alert = 0; s.alertT = 0; draw(); }
          bUp.addEventListener('click', function () { key('up'); }); bDn.addEventListener('click', function () { key('dn'); });
          bEB.addEventListener('click', function () { s.eb = true; s.n = 0; draw(); }); bAck.addEventListener('click', function () { s.alert = 0; s.alertT = 0; draw(); });
          bRs.addEventListener('click', function () { s = { x: 0, v: 0, n: N0, t: 0, atp: false, done: false, msg: '', eb: false, alert: 0, alertT: 0 }; draw(); });
          function draw() {
            var x = s.x, kmh = s.v * 3.6, L = atpLim(x), W = 640, o = rc(0, 0, W, 210, '#1d2329', 'none', 'rx="10"');
            // 前方 1000 m
            var sc = 0.56, yb = 120; function px(m) { return 40 + (m - x) * sc; }
            o += ln(20, yb - 4, W - 10, yb - 4, '#777', 1.6) + ln(20, yb + 4, W - 10, yb + 4, '#777', 1.6);
            for (var m = Math.floor(x / 20) * 20; px(m) < W; m += 20) if (px(m) > 20) o += ln(px(m), yb - 7, px(m), yb + 7, '#7a6248', 2.5);
            C.zones.forEach(function (z) { var a = px(z[0]), b = px(z[1]); if (b < 20 || a > W) return; o += rc(Math.max(20, a), yb + 14, Math.min(W - 10, b) - Math.max(20, a), 5, '#ffc61a', 'none', 'opacity="0.7"');
              if (a > 20 && a < W - 30) o += rc(a - 13, yb - 62, 26, 22, '#fff', '#333', 'rx="3"') + tx(a, yb - 46, z[2], 13, '#111') + ln(a, yb - 40, a, yb - 8, '#999', 2); });
            C.sigs.forEach(function (g) { var a = px(g[0]); if (a > 20 && a < W - 20) o += sigSvg(a, yb - 86, g[1], 0.9); });
            if (C.stop) { var ps = px(C.stop); if (ps > 20 && ps < W) { o += rc(px(C.stop - 170), yb + 22, 170 * sc, 10, '#888', 'none') + rc(ps - 10, yb - 50, 20, 22, '#fff', '#333') + tx(ps, yb - 33, C.cars, 14, '#c00') + ln(ps, yb - 28, ps, yb - 8, '#999', 2); } }
            o += rc(2, yb - 16, 38, 14, '#3a6ea5', 'none', 'rx="3"') + tx(21, yb - 22, '本列車', 9, '#9cf');
            // 儀表
            var lab = function (t, xx, yy, c) { return tx(xx, yy, t, 11, c || '#ccc', 'start'); };
            o += rc(10, 150, 620, 52, '#0f1316', '#444', 'rx="6"');
            o += lab('速度', 22, 170) + tx(110, 192, Math.round(kmh), 26, kmh > L + 0.5 ? '#ff6b5a' : '#2fe06a', 'end', 'font-family="ui-monospace,monospace"') + lab('km/h', 114, 192);
            o += lab('ATP 容許', 170, 170) + tx(250, 192, Math.round(Math.min(L, C.vmax)), 20, '#ffc61a', 'end', 'font-family="ui-monospace,monospace"');
            o += lab('距停車位置', 290, 170) + tx(400, 192, Math.max(0, Math.round(C.stop - x)) + ' m', 18, '#fff', 'end', 'font-family="ui-monospace,monospace"');
            o += lab('主控制器', 430, 170) + tx(520, 192, NOTCH[s.n], 18, s.n < N0 ? '#ff9a7a' : s.n > N0 ? '#7ad7ff' : '#fff', 'middle', 'font-family="ui-monospace,monospace"');
            if (s.atp) o += rc(560, 158, 60, 36, '#a11', 'none', 'rx="4"') + tx(590, 181, 'ATP', 14, '#fff', 'middle', 'font-weight="bold"');
            if (s.alert) o += rc(220, 12, 200, 26, s.alertT % 2 ? '#c80' : '#a60', 'none', 'rx="4"') + tx(320, 30, '警醒裝置：請按確認！', 13, '#fff');
            view.innerHTML = '<svg viewBox="0 0 640 210" style="width:100%;display:block">' + o + '</svg>';
            nl.textContent = NOTCH[s.n]; out.innerHTML = s.msg;
          }
          var last = Date.now();
          setInterval(function () { var now = Date.now(), dt = Math.min(0.25, (now - last) / 1000) * (C.speedup || 1); last = now; if (s.done) return;
            s.t += dt; var a = 0, n = s.n;
            if (s.eb) a = -1.2; else if (s.atp) a = -0.9; else if (n > N0) a = (n - N0) * 0.22 * Math.max(0.25, 1 - s.v * 3.6 / 160); else if (n < N0) a = -(N0 - n) * 0.13;
            a -= 0.01 + 0.00002 * s.v * s.v; if (s.v <= 0 && a < 0) a = 0;
            s.v = Math.max(0, s.v + a * dt); s.x += s.v * dt;
            var kmh = s.v * 3.6, L = atpLim(s.x);
            if (!s.atp && kmh > L + 3) { s.atp = true; s.msg = '⚠️ <b>ATP 介入</b>：速度超過容許速度，系統自動煞車。降到容許速度以下後才會解除。'; }
            if (s.atp && kmh < L - 2) { s.atp = false; s.msg = 'ATP 已解除。下次請提早減速。'; }
            // 警醒裝置：一段時間沒有操作就警告
            if (s.v > 1 && !s.eb) { s.alertT += dt; if (s.alertT > 25 && !s.alert) s.alert = 1; if (s.alert && s.alertT > 31) { s.eb = true; s.n = 0; s.msg = '🛑 <b>警醒裝置作動</b>：太久沒有確認，系統判斷司機員可能失去反應，自動緊急煞車。'; } }
            if (s.alert) s.alertT += 0;
            if (s.v === 0 && s.x > C.stop - 250 && s.t > 3) { s.done = true; var err = s.x - C.stop;
              s.msg = Math.abs(err) <= 1 ? '🎯 <b>完美停車！</b>誤差 ' + err.toFixed(1) + ' 公尺。' : Math.abs(err) <= 5 ? '👍 停好了，誤差 ' + err.toFixed(1) + ' 公尺（' + (err > 0 ? '超過' : '未到') + '）。' :
                err > 0 ? '⚠️ 停車越過停車位置 ' + err.toFixed(1) + ' 公尺，部分車門可能不在月台範圍內。' : '⚠️ 停在停車位置前 ' + (-err).toFixed(1) + ' 公尺，最後一節車廂可能不在月台上。';
              s.msg += ' 用時 ' + Math.round(s.t) + ' 秒。按「重來」再試一次。'; }
            draw(); }, 100);
          draw();
        }

        function initAll() { document.querySelectorAll('.tr-w').forEach(function (w) { if (w.__d) return; w.__d = 1; var cfg = JSON.parse(w.getAttribute('data-cfg'));
          ({ sig: initSig, brake: initBrake, pc: initPC, dia: initDia, drive: initDrive })[cfg.t](w, cfg); }); }
        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', initAll); else initAll();
      })();
      </script>
