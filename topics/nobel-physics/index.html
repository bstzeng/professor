<meta name="description" content="從一九〇一年到最新年度的諾貝爾物理獎完整整理，並設計成每年十月可以自行擴充的形式。先講清楚規則本身——最多三人、不追授、不頒給機構、提名保密五十年——因為大部分爭議與遺珠都是這些規則直接造成的。一九〇一至二〇〇五年以四張大表呈現，每張表後附一課分析該時期的形勢：早期為何實驗壓倒理論、量子力學如何被逐步認證、物理學怎麼裂成粒子與凝態兩半、標準模型的驗證時間軸與量子技術的伏筆。二〇〇六年之後每一年獨立一課，固定六段格式：得獎者與官方獎項理由、那到底是什麼的白話解釋、在此之前卡在哪裡、從發現到獲獎的時間差、今天的影響、站上延伸連結。最後橫向分析時間差的規律、遺珠的三種成因、女性得主的實際數字與斷層、物理學重心的六個時期，並整理出「獎項沿技術線成串出現」這個最有效的預測線索，附上公布當天的十分鐘判讀法與新增年度的三個步驟。">
