      <script>
      (function () {
        if (window.__klgLib) return; window.__klgLib = 1;

        function btn(t, k) { var b = document.createElement('button'); b.type = 'button'; b.textContent = t; if (k !== undefined) b.setAttribute('data-k', k);
          b.style.cssText = 'padding:4px 10px;margin:4px 6px 0 0;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer;font:inherit;font-size:0.9em'; return b; }

        function head(root, q) { if (q) { var p = document.createElement('p'); p.style.margin = '0 0 8px'; p.innerHTML = q; root.appendChild(p); } }
        function el(tag, css, html) { var e = document.createElement(tag); if (css) e.style.cssText = css; if (html !== undefined) e.innerHTML = html; return e; }
        function n1(v) { return Math.round(v * 10) / 10; }
        function f1(v) { return (Math.round(v * 10) / 10).toString(); }
        function f2(v) { return (Math.round(v * 100) / 100).toString(); }
        function tx(x, y, s, sz, c, anc) { return '<text x="' + n1(x) + '" y="' + n1(y) + '" font-size="' + sz + '" fill="' + (c || 'currentColor') + '" text-anchor="' + (anc || 'middle') + '">' + s + '</text>'; }
        function ln(x1, y1, x2, y2, c, w, ex) { return '<line x1="' + n1(x1) + '" y1="' + n1(y1) + '" x2="' + n1(x2) + '" y2="' + n1(y2) + '" stroke="' + c + '" stroke-width="' + (w || 1) + '" ' + (ex || '') + '/>'; }
        function svgw(vb, inner) { return '<svg viewBox="' + vb + '" style="width:100%;display:block;color:var(--text)">' + inner + '</svg>'; }
        function slider(root, lab, min, max, step, val, fmt, k, cb) { var l = el('label', 'display:block;font-size:0.88em;margin-top:6px', lab + '：<b></b>'); var s = document.createElement('input');
          s.type = 'range'; s.min = min; s.max = max; s.step = step; s.value = val; s.style.cssText = 'width:100%;display:block'; if (k) s.setAttribute('data-k', k); l.appendChild(s); root.appendChild(l);
          function u() { l.querySelector('b').textContent = fmt(+s.value); cb(+s.value); } s.addEventListener('input', u); return u; }
        function nice(lo, hi, n) { var span = hi - lo || 1, st = Math.pow(10, Math.floor(Math.log10(span / n))), e = span / n / st; st *= e >= 5 ? 5 : e >= 2 ? 2 : 1; var t = [], v = Math.ceil(lo / st - 1e-9) * st; for (; v <= hi + 1e-9; v += st) t.push(Math.round(v / st) * st); return t; }
        function fmtT(v) { var a = Math.abs(v); return a >= 1e6 ? f1(v / 1e6) + 'M' : a >= 1e4 ? f1(v / 1e3) + 'k' : (Math.round(v * 100) / 100).toString(); }
        var CID = 0;
        function chart(W, H, S, o) { o = o || {}; var L = 48, R = 12, T = 22, B = 34, xs = [], ys = [];
          S.forEach(function (s) { s.d.forEach(function (p) { xs.push(p[0]); if (isFinite(p[1])) ys.push(p[1]); }); });
          var x0 = o.x0 !== undefined ? o.x0 : Math.min.apply(null, xs), x1 = o.x1 !== undefined ? o.x1 : Math.max.apply(null, xs);

          function sx(v) { return L + (v - x0) / (x1 - x0 || 1) * (W - L - R); } function sy(v) { return H - B - (v - y0) / (y1 - y0 || 1) * (H - T - B); }
          var id = 'qc' + (++CID), g = '<clipPath id="' + id + '"><rect x="' + L + '" y="' + (T - 2) + '" width="' + (W - L - R) + '" height="' + (H - T - B + 4) + '"/></clipPath>';
          nice(y0, y1, 4).forEach(function (v) { g += ln(L, sy(v), W - R, sy(v), 'var(--border)', 0.6, 'stroke-dasharray="2 3"') + tx(L - 5, sy(v) + 3, fmtT(v), 9, 'var(--text-muted)', 'end'); });
          nice(x0, x1, 6).forEach(function (v) { g += tx(sx(v), H - B + 14, fmtT(v), 9, 'var(--text-muted)'); });
          g += ln(L, T - 4, L, H - B, '#999') + ln(L, H - B, W - R, H - B, '#999');
          if (o.xl) g += tx((L + W - R) / 2, H - 4, o.xl, 9.5, 'var(--text-muted)');
          if (o.yl) g += tx(L - 40, T - 8, o.yl, 9.5, 'var(--text-muted)', 'start');

          (o.vl || []).forEach(function (h) { g += ln(sx(h.x), T, sx(h.x), H - B, h.c, 1, 'stroke-dasharray="5 4"') + tx(sx(h.x) + 3, H - B - 6, h.n, 9, h.c, 'start'); });
          S.forEach(function (s) { var d = '', m = 'M'; s.d.forEach(function (p) { if (!isFinite(p[1])) { m = 'M'; return; } d += m + n1(sx(p[0])) + ' ' + n1(sy(Math.max(Math.min(p[1], y1 + (y1 - y0)), y0 - (y1 - y0)))); m = 'L'; });
            g += '<path clip-path="url(#' + id + ')" d="' + d + '" fill="none" stroke="' + s.c + '" stroke-width="' + (s.w || 2) + '"' + (s.dash ? ' stroke-dasharray="' + s.dash + '"' : '') + '/>'; });

          var lx = L + 8, ly = T + 2; S.forEach(function (s) { if (!s.n) return; g += ln(lx, ly, lx + 16, ly, s.c, 2.5, s.dash ? 'stroke-dasharray="' + s.dash + '"' : '') + tx(lx + 20, ly + 4, s.n, 9.5, 'currentColor', 'start'); lx += 34 + s.n.length * 10.5; if (lx > W - 120) { lx = L + 8; ly += 15; } });
          return svgw('0 0 ' + W + ' ' + H, g); }
        function rexp(m) { return -Math.log(1 - Math.random()) * m; }

        var BL = '#3a6ea5', OR = '#d9822b', RD = '#d0564f', GN = '#4a9a5e', GY = '#9aa3ad', PU = '#8a5bb5', TL = '#2a9d8f', YL = '#c9a227';
        function info(root) { var p = el('div', 'margin-top:8px;padding:10px 12px;border-radius:8px;background:var(--accent-soft);line-height:1.7;font-size:0.93em'); root.appendChild(p); return p; }

        function presets(root, list, cb, k0) { var b = bar(root); list.forEach(function (o, i) { var x = btn(o, i); x.onclick = function () { mark(b, i); cb(i); }; b.appendChild(x); }); mark(b, k0 === undefined ? 0 : k0); return b; }
        function setS(root, k, v) { var s = root.querySelector('input[data-k="' + k + '"]'); if (s) s.value = v; }
        function rc(x, y, w, h, f, st, rx) { return '<rect x="' + n1(x) + '" y="' + n1(y) + '" width="' + n1(Math.max(w, 0)) + '" height="' + n1(Math.max(h, 0)) + '" rx="' + (rx === undefined ? 4 : rx) + '" fill="' + f + '"' + (st ? ' stroke="' + st + '"' : '') + '/>'; }
        function ci(x, y, r, f, st, sw) { return '<circle cx="' + n1(x) + '" cy="' + n1(y) + '" r="' + n1(r) + '" fill="' + f + '"' + (st ? ' stroke="' + st + '" stroke-width="' + (sw || 1.5) + '"' : '') + '/>'; }
        function pa(d, c, w, f, ex) { return '<path d="' + d + '" fill="' + (f || 'none') + '" stroke="' + c + '" stroke-width="' + (w || 1.5) + '" ' + (ex || '') + '/>'; }
        function poly(pts) { return pts.map(function (p, i) { return (i ? 'L' : 'M') + n1(p[0]) + ' ' + n1(p[1]); }).join(' '); }
        function tbl(h, rows) { var s = '<table style="border-collapse:collapse;width:100%;font-size:0.86em;margin-top:6px"><tr>' + h.map(function (x) { return '<th style="border:1px solid var(--border);padding:3px 5px;background:var(--accent-soft)">' + x + '</th>'; }).join('') + '</tr>';
          rows.forEach(function (r) { s += '<tr>' + r.map(function (c, j) { return '<td style="border:1px solid var(--border);padding:3px 5px;text-align:' + (j ? 'center' : 'left') + '">' + c + '</td>'; }).join('') + '</tr>'; }); return s + '</table>'; }
        function rng(seed) { var a = (seed || 1) >>> 0; return function () { a = (a + 0x6D2B79F5) >>> 0; var t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
        function gauss(r) { var u = Math.max(r(), 1e-9), v = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); }
        function pct(v) { return f1(v * 100) + '%'; }
        function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

        /* 1. 條件推論 */
        function initCond(root, cfg) { head(root, cfg.q); var F = [['肯定前件', 'P', 'Q', 1, '如果下雨，地就會濕。下雨了。所以，地是濕的。'], ['否定後件', '¬Q', '¬P', 1, '如果下雨，地就會濕。地不是濕的。所以，沒有下雨。'], ['肯定後件', 'Q', 'P', 0, '如果下雨，地就會濕。地是濕的。所以，下雨了。'], ['否定前件', '¬P', '¬Q', 0, '如果下雨，地就會濕。沒有下雨。所以，地不是濕的。']], P = { k: 2 }, view = el('div');
          presets(root, F.map(function (f) { return f[0]; }), function (i) { P.k = i; draw(); }, 2);
          root.appendChild(view); var inf = info(root);
          function ev(e, p, q) { return e === 'P' ? p : e === 'Q' ? q : e === '¬P' ? !p : !q; }
          function draw() { var f = F[P.k], rows = [], bad = null;
            [[1, 1], [1, 0], [0, 1], [0, 0]].forEach(function (r) { var p = !!r[0], q = !!r[1], imp = !p || q, prem = imp && ev(f[1], p, q), con = ev(f[2], p, q); if (prem && !con) bad = [p, q];
              var st = prem ? (con ? 'background:rgba(74,154,94,0.18)' : 'background:rgba(208,86,79,0.22)') : 'opacity:0.45';
              rows.push('<tr style="' + st + '"><td>' + (p ? '真' : '假') + '</td><td>' + (q ? '真' : '假') + '</td><td>' + (imp ? '真' : '假') + '</td><td>' + (ev(f[1], p, q) ? '真' : '假') + '</td><td>' + (con ? '真' : '假') + '</td><td>' + (prem ? (con ? '✓ 前提都真，結論也真' : '✗ 前提都真，結論卻假！') : '前提不全真，不用看') + '</td></tr>'); });
            view.innerHTML = '<div style="margin:6px 0;padding:8px 10px;border:1px solid var(--border);border-radius:8px">' + f[4] + '</div><table style="border-collapse:collapse;width:100%;font-size:0.88em;text-align:center"><tr style="background:var(--accent-soft)"><th>P（下雨）</th><th>Q（地濕）</th><th>如果 P 則 Q</th><th>前提 ' + f[1] + '</th><th>結論 ' + f[2] + '</th><th>檢查</th></tr>' + rows.join('') + '</table>';
            inf.innerHTML = f[3] ? '<b style="color:' + GN + '">有效的推論</b>：在所有「前提都為真」的情況中，結論都為真，找不到反例。' + (P.k === 1 ? '否定後件是科學檢驗假說的核心：如果理論正確就應該觀察到 Q，結果沒有觀察到 Q，理論就有問題。' : '') :
              '<b style="color:' + RD + '">無效的推論（謬誤）</b>：存在一種情況，前提都為真、結論卻是假的——' + (bad[0] ? '下雨' : '沒有下雨') + '、而且' + (bad[1] ? '地是濕的' : '地不是濕的') + '（例如有人在灑水）。' + (P.k === 2 ? '「肯定後件」是最常見的推理錯誤之一：「如果他有罪，他會緊張。他很緊張，所以他有罪。」' : '「否定前件」也很常見：「如果用功，就會考好。他沒用功，所以一定考不好。」') + small('推論是否有效，只看形式；不管 P、Q 換成什麼句子，結論都一樣成立或不成立。'); }
          draw();
        }

        /* 2. 三段論文氏圖 */
        function initSyl(root, cfg) { head(root, cfg.q); var T = ['所有 {x} 都是 {y}', '沒有 {x} 是 {y}', '有些 {x} 是 {y}', '有些 {x} 不是 {y}'], P = { a: 0, b: 0, c: 0, n: ['貓', '哺乳類', '動物'] }, view = el('div');
          var EX = [{ a: 0, b: 0, c: 0, n: ['貓', '哺乳類', '動物'] }, { a: 0, b: 4, c: 0, n: ['貓', '動物', '狗'] }, { a: 1, b: 4, c: 1, n: ['爬蟲類', '有毛的動物', '狗'] }, { a: 2, b: 2, c: 2, n: ['老師', '台北人', '球迷'] }];
          presets(root, ['所有 A 是 B，所有 B 是 C', '所有 A 是 B，所有 C 是 B', '沒有 A 是 B，所有 C 是 B', '有些 A 是 B，有些 B 是 C'], function (i) { var e = EX[i]; P.a = e.a; P.b = e.b; P.c = e.c; P.n = e.n; sync(); draw(); });
          var box = el('div', 'display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:6px;margin-top:6px'); root.appendChild(box);
          function mk(lab, key, opts) { var w = el('label', 'font-size:0.86em', lab + '<br>'), s = document.createElement('select'); s.style.cssText = 'width:100%;padding:4px;border-radius:6px;border:1px solid var(--border);background:var(--surface);color:var(--text);font:inherit'; opts.forEach(function (o, i) { var op = document.createElement('option'); op.value = i; op.textContent = o; s.appendChild(op); }); s.onchange = function () { P[key] = +s.value; draw(); }; w.appendChild(s); box.appendChild(w); return s; }
          var S1, S2, S3; function opts(x, y) { return T.map(function (t, i) { return t.replace('{x}', x).replace('{y}', y); }).concat(x === 'B' && y === 'C' ? ['所有 C 都是 B'] : []); }
          S1 = mk('前提一（A 與 B）', 'a', opts('A', 'B')); S2 = mk('前提二（B 與 C）', 'b', T.map(function (t) { return t.replace('{x}', 'B').replace('{y}', 'C'); }).concat(['所有 C 都是 B'])); S3 = mk('結論（A 與 C）', 'c', opts('A', 'C'));
          function sync() { S1.value = P.a; S2.value = P.b; S3.value = P.c; }
          root.appendChild(view); var inf = info(root);
          function holds(f, X, Y, M) { var r, ex = false; for (r = 1; r < 8; r++) if (M & (1 << r)) { var x = r & X, y = r & Y; if (f === 0 && x && !y) return false; if (f === 1 && x && y) return false; if ((f === 2 && x && y) || (f === 3 && x && !y)) ex = true; } return f < 2 ? true : ex; }
          function draw() { var A = 1, B = 2, C = 4, ok = true, models = 0, empt = 127, inh = 127, M;
            for (M = 0; M < 256; M += 2) { var p1 = holds(P.a, A, B, M), p2 = P.b === 4 ? holds(0, C, B, M) : holds(P.b, B, C, M); if (!(p1 && p2)) continue; models++; if (!holds(P.c, A, C, M)) ok = false; for (var r = 1; r < 8; r++) { if (M & (1 << r)) empt &= ~(1 << r); else inh &= ~(1 << r); } }
            var cx = [250, 330, 290], cy = [95, 95, 160], R = 62, o = '', pos = { 1: [222, 82], 2: [358, 82], 4: [290, 192], 3: [290, 70], 5: [252, 138], 6: [328, 138], 7: [290, 116] };
            o += '<defs><clipPath id="sA"><circle cx="250" cy="95" r="62"/></clipPath><clipPath id="sB"><circle cx="330" cy="95" r="62"/></clipPath><clipPath id="sC"><circle cx="290" cy="160" r="62"/></clipPath></defs>';
            for (var rg = 1; rg < 8; rg++) if (empt & (1 << rg)) { var g = '<rect x="150" y="20" width="280" height="220" fill="' + GY + '" fill-opacity="0.75"/>'; [1, 2, 4].forEach(function (bit, k) { if (rg & bit) g = '<g clip-path="url(#s' + 'ABC'[k] + ')">' + g + '</g>'; }); var mask = ''; [1, 2, 4].forEach(function (bit, k) { if (!(rg & bit)) mask += '<circle cx="' + cx[k] + '" cy="' + cy[k] + '" r="' + R + '" fill="black"/>'; }); o += '<mask id="m' + rg + '"><rect x="0" y="0" width="640" height="250" fill="white"/>' + mask + '</mask><g mask="url(#m' + rg + ')">' + g + '</g>'; }
            for (rg = 1; rg < 8; rg++) if (inh & (1 << rg)) o += tx(pos[rg][0], pos[rg][1] + 5, '✕', 16, RD);
            [[P.a, A, B], [P.b === 4 ? 0 : P.b, P.b === 4 ? C : B, P.b === 4 ? B : C]].forEach(function (q) { if (q[0] < 2) return; var cand = []; for (var r2 = 1; r2 < 8; r2++) { if (empt & (1 << r2)) continue; var x2 = r2 & q[1], y2 = r2 & q[2]; if (x2 && (q[0] === 2 ? y2 : !y2)) cand.push(r2); } if (cand.length === 2 && !(inh & (1 << cand[0])) && !(inh & (1 << cand[1]))) o += tx((pos[cand[0]][0] + pos[cand[1]][0]) / 2, (pos[cand[0]][1] + pos[cand[1]][1]) / 2 + 5, '✕', 16, OR); });
            ['A', 'B', 'C'].forEach(function (l, k) { o += ci(cx[k], cy[k], R, 'none', 'var(--text)', 2) + tx(cx[k] + [-70, 70, 0][k], cy[k] + [-50, -50, 82][k], l + '：' + P.n[k], 12, 'var(--text)'); });
            view.innerHTML = svgw('0 0 640 250', o);
            var fmt = function (f, x, y) { return f === 4 ? '所有 C 都是 B' : T[f].replace('{x}', x).replace('{y}', y); };
            inf.innerHTML = '前提：' + fmt(P.a, 'A', 'B') + '；' + fmt(P.b, 'B', 'C') + '。結論：' + fmt(P.c, 'A', 'C') + '。<br>' + (models === 0 ? '兩個前提互相矛盾。' : ok ? '<b style="color:' + GN + '">有效</b>：只要兩個前提為真，結論一定為真。' : '<b style="color:' + RD + '">無效</b>：兩個前提都為真時，結論仍可能為假。') +
              '<br>灰色區域是前提規定「<b>一定沒有東西</b>」的地方；紅色 ✕ 是前提規定「<b>一定有東西</b>」的地方；橘色 ✕ 畫在邊界上，表示「這兩區之中至少一區有東西，但不知道是哪一區」。檢查結論是不是已經被圖畫出來了。' + small('採用現代邏輯的解釋：「所有 A 都是 B」不保證 A 真的存在。'); }

        }

        /* 3. 誤導的圖表 */
        function initMis(root, cfg) { head(root, cfg.q); var P = { d: 0, h: 0 }, view = el('div');
          presets(root, ['兩家公司的營收', '某指標的長期趨勢（挑選區間）', '百分比變化'], function (i) { P.d = i; draw(); });
          presets(root, ['誤導的畫法', '誠實的畫法'], function (i) { P.h = i; draw(); });
          root.appendChild(view); var inf = info(root);
          function draw() { var o = '', msg = '';
            if (P.d === 0) { var v = [96, 100], y0 = P.h ? 0 : 94, y1 = 101, X0 = 120, H = 180, Y0 = 210;
              function Y(x) { return Y0 - (x - y0) / (y1 - y0) * H; }
              v.forEach(function (x, i) { o += rc(X0 + 60 + i * 200, Y(x), 120, Y0 - Y(x), i ? RD : BL, null, 3) + tx(X0 + 120 + i * 200, Y(x) - 8, x + ' 億', 13, 'var(--text)') + tx(X0 + 120 + i * 200, Y0 + 18, i ? '我們公司' : '競爭對手', 11, 'var(--text)'); });
              o += ln(X0, Y0, 600, Y0, '#999') + ln(X0, Y0, X0, 20, '#999') + tx(X0 - 6, Y0 + 4, y0, 10, 'var(--text-muted)', 'end') + tx(X0 - 6, Y(y1) + 4, y1, 10, 'var(--text-muted)', 'end');
              var vis = (Y0 - Y(100)) / (Y0 - Y(96)); msg = '實際差距只有 <b>' + pct(100 / 96 - 1) + '</b>，但長條的高度看起來差了 <b>' + f1(vis) + ' 倍</b>。' + (P.h ? '縱軸從 0 開始，長條的高度才和數值成比例。' : '把縱軸從 94 而不是 0 開始畫，微小的差距就被放大成巨大的差距——這是最常見的誤導手法。長條圖的縱軸一定要從 0 開始。'); }
            else if (P.d === 1) { var r = rng(11), d = [], t, val = 50; for (t = 0; t <= 120; t++) { val += (r() - 0.5) * 4 - (t > 100 && t < 112 ? -1.2 : 0); d.push([t, val]); } var sub = P.h ? d : d.filter(function (p) { return p[0] >= 100 && p[0] <= 112; });
              var mn = Math.min.apply(null, sub.map(function (p) { return p[1]; })), mxx = Math.max.apply(null, sub.map(function (p) { return p[1]; })); view.innerHTML = chart(640, 230, [{ d: sub, c: RD, n: P.h ? '完整的 10 年資料' : '只挑最近 1 年' }], P.h ? { y0: 0, y1: 100, xl: '月份', yl: '指標' } : { y0: mn - 0.5, y1: mxx + 0.5, xl: '月份', yl: '指標' }); inf.innerHTML = (P.h ? '看完整的十年資料：這個指標只是在一個範圍內隨機上下波動，最近的上升<b>只是波動的一部分</b>。' : '只挑最近一段時間，看起來像是「一年內大幅成長」！') + '<br><b>挑選區間</b>（只呈現對自己有利的時間範圍），再把縱軸放大，是很常見的誤導：股票廣告挑漲最多的一段、政策宣傳挑最好看的一年。看到趨勢圖時，問自己：更長的時間範圍看起來是什麼樣子？' + small('隨機產生的示意資料。'); return; }
            else { var a = [2, 3], X0b = 120; o += tx(320, 40, P.h ? '服用某藥物的人，每一萬人中得病的人數' : '研究發現：服用某藥物，得病風險增加 50%！', 15, P.h ? 'var(--text)' : RD);
              if (P.h) { var rr = rng(5); for (var g = 0; g < 2; g++) { var gx = X0b + g * 230, gy = 52; o += rc(gx, gy, 140, 140, 'var(--border)', null, 0); for (var k = 0; k < a[g]; k++) o += rc(gx + Math.floor(rr() * 98) * 1.4, gy + Math.floor(rr() * 98) * 1.4, 3, 3, RD, null, 0); o += tx(gx + 70, gy + 158, (g ? '服用者' : '未服用者') + '：一萬人中 ' + a[g] + ' 人', 12, 'var(--text)'); } o += tx(320, 229, '（每個方塊代表一萬人，紅點是得病的人；紅點畫得比一個人的大小還大，才看得見）', 10, 'var(--text-muted)'); }
              else o += rc(160, 80, 120, 60, BL, null, 3) + rc(360, 50, 120, 90, RD, null, 3) + tx(220, 160, '未服用', 12, 'var(--text)') + tx(420, 160, '服用', 12, 'var(--text)') + tx(420, 44, '+50%', 16, RD);
              msg = '相對風險增加 <b>50%</b>，聽起來很可怕；但絕對風險只是從每一萬人 2 人變成 3 人，增加了<b>萬分之一</b>。' + (P.h ? '要判斷一個風險值不值得擔心，一定要問：<b>原本的風險是多少</b>？' : '只報導「增加 50%」而不說原本的風險有多小，是新聞與廣告常見的手法（第 17 課）。'); }
            view.innerHTML = svgw('0 0 640 235', o); inf.innerHTML = msg + small('示意資料；切換「誤導」與「誠實」的畫法比較。'); }
          draw();
        }

        /* 4. 倖存者偏差 */
        function initSurv(root, cfg) { head(root, cfg.q); var P = { y: 5, seed: 7 }, view = el('div');
          var u1 = slider(root, '觀察的年數', 1, 10, 1, P.y, function (x) { return x + ' 年'; }, null, function (x) { P.y = x; draw(); });
          var b = bar(root), rb = btn('重新模擬'); rb.onclick = function () { P.seed += 13; draw(); }; b.appendChild(rb);
          root.appendChild(view); var inf = info(root);
          function draw() { var r = rng(P.seed), N = 1000, alive = 0, o = '', i, y;
            for (i = 0; i < N; i++) { var ok = true; for (y = 0; y < P.y; y++) if (r() >= 0.5) { ok = false; } if (ok) alive++; var x = 20 + (i % 50) * 12, yy = 14 + Math.floor(i / 50) * 11; o += rc(x, yy, 9, 8, ok ? GN : 'var(--border)', null, 2); }
            view.innerHTML = svgw('0 0 640 240', o);
            inf.innerHTML = '1,000 位基金經理人，<b>完全沒有選股的能力</b>，每年打敗大盤的機率都是 50%（像擲硬幣）。連續 ' + P.y + ' 年都打敗大盤的有 <b>' + alive + ' 位</b>（綠色，理論上約 ' + Math.round(N / Math.pow(2, P.y)) + ' 位）。<br>' +
              '這些「常勝軍」會出現在雜誌封面、被稱為投資天才，我們卻看不見那些被淘汰的人。只看<b>活下來的</b>樣本，就會誤以為成功來自能力或某種祕訣——這就是<b>倖存者偏差</b>。判斷一個人的績效，要問：一開始有多少人？如果純粹靠運氣，會有幾個人做到？' + small('模擬中每位經理人每年的結果獨立且機率相同。'); }
          u1();
        }

        /* 5. 謬誤測驗 */
        function initQuiz(root, cfg) { head(root, cfg.q); var Q = [
            ['「他自己都離婚兩次了，他對婚姻制度的看法怎麼可能是對的？」', 0], ['甲：「應該增加自行車道。」乙：「所以你要禁止所有的人開車？太荒謬了！」', 1], ['「這款保健食品有某某醫師推薦，一定有效。」（該醫師的專長與此無關，也沒有提出研究）', 2], ['「全台灣已經有一百萬人在用了，你還在等什麼？」', 3], ['「如果今天允許學生染頭髮，明天他們就會刺青，後天就會不來上課，最後學校就會失控。」', 4], ['「你不支持這個政策，就是不愛台灣。」', 5], ['「聖經是真理，因為聖經上這樣說。」', 6], ['「我阿公每天抽一包菸，活到九十幾歲，所以抽菸不會傷身體。」', 7], ['記者問市長捷運延宕的原因，市長回答：「前任市長做的事更糟。」', 8], ['「想想那些無辜的小孩！反對這個法案的人沒有良心！」（沒有提出法案如何保護小孩的證據）', 9]],
            N = ['人身攻擊', '稻草人', '不當的訴諸權威', '訴諸群眾', '滑坡謬誤', '假兩難', '循環論證', '以偏概全（軼事）', '轉移焦點（你也一樣）', '訴諸情感'], P = { k: 0, sc: 0, done: {} }, view = el('div');
          root.appendChild(view); var inf = info(root);
          function draw() { var q = Q[P.k]; view.innerHTML = ''; view.appendChild(el('div', 'margin:6px 0;padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-size:1.02em', '<b>第 ' + (P.k + 1) + ' / ' + Q.length + ' 題</b>　' + q[0]));
            var b = el('div', 'display:flex;flex-wrap:wrap;gap:4px'); N.forEach(function (n, i) { var x = btn(n); x.onclick = function () { var ok = i === q[1]; if (!P.done[P.k]) { P.done[P.k] = 1; if (ok) P.sc++; } inf.innerHTML = (ok ? '<b style="color:' + GN + '">答對了！</b>' : '<b style="color:' + RD + '">不對</b>，這是「' + N[q[1]] + '」。') + ' 目前得分 ' + P.sc + ' / ' + Object.keys(P.done).length + '。'; }; b.appendChild(x); }); view.appendChild(b);
            var nb = bar(view), pv = btn('← 上一題'), nx = btn('下一題 →'); pv.onclick = function () { P.k = (P.k + Q.length - 1) % Q.length; draw(); }; nx.onclick = function () { P.k = (P.k + 1) % Q.length; draw(); }; nb.appendChild(pv); nb.appendChild(nx); }
          draw(); inf.innerHTML = '讀完每一句話，選出它犯的是哪一種謬誤。';
        }

        function initAll() { document.querySelectorAll('.klg-w').forEach(function (w) { if (w.__d) return; w.__d = 1; var cfg = JSON.parse(w.getAttribute('data-cfg'));
          ({ cond: initCond, syl: initSyl, mis: initMis, surv: initSurv, quiz: initQuiz })[cfg.t](w, cfg); }); }
        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', initAll); else initAll();
      })();
