<title>量子電腦：原理、演算法與應用的誠實評估 ｜ 博雅書院</title>
<meta name="description" content="完整講解量子電腦的原理與應用，並提供判讀相關宣稱的方法。先破除三個最常見的誤解：它不是「同時嘗試所有答案」（測量只會得到一個隨機結果）、不是更快的一般電腦、也不會取代古典電腦；再建立必要的量子力學——疊加不是「同時是兩個值」也不是「我們不知道」、機率幅是複數因此相加會互相抵銷、測量只給一個位元且摧毀疊加、糾纏無法傳遞訊息。接著處理量子位元與布洛赫球、n 個位元佔 2^n 維空間這個希望與脆弱的共同來源、量子閘與電路圖的讀法；演算法部分從最小的例子出發，說明相位反衝這個核心技巧與「鋪開、標記、干涉、測量」的共同骨架，再完整拆解秀爾演算法（分解如何變成找週期、量子傅立葉轉換在做什麼、破 RSA 需要多大的機器）、格羅弗演算法的振幅放大與平方根上限、以及費曼的原始動機——量子模擬，並誠實評估化學、最佳化與量子機器學習的證據強度。硬體部分比較超導（其科學基礎是二〇二五年諾貝爾物理獎）、離子阱、光子、中性原子與拓樸五條路線，並完整處理退相干與量子錯誤更正的三個特殊困難與容錯門檻定理。最後說明對密碼學的衝擊、量子金鑰分發的真實限制、不可複製定理、隱形傳態與貝爾不等式，並附上判讀新聞的七個問題與遷移決策的優先順序。前置知識為複數，建議搭配本站的《複數到底在做什麼》。">
