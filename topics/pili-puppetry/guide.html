      <div class="nv-w content-figure" style="text-align:left;max-width:680px;margin-left:auto;margin-right:auto" data-cfg="{&quot;t&quot;: &quot;cards&quot;, &quot;q&quot;: &quot;霹靂經典角色速查（可篩選或搜尋）：&quot;, &quot;groups&quot;: [[&quot;p&quot;, &quot;三台柱&quot;, &quot;#d9822b&quot;], [&quot;s&quot;, &quot;三先天&quot;, &quot;#8a5cb8&quot;], [&quot;f&quot;, &quot;夥伴與配角&quot;, &quot;#4a9a5e&quot;], [&quot;v&quot;, &quot;反派與神魔&quot;, &quot;#d0564f&quot;]], &quot;cards&quot;: [{&quot;n&quot;: &quot;素還真&quot;, &quot;g&quot;: &quot;p&quot;, &quot;d&quot;: &quot;清香白蓮。1988 年《霹靂金光》第 13 集登場，霹靂首席主角；文武雙全、智計百出，亦正亦邪。&quot;}, {&quot;n&quot;: &quot;一頁書&quot;, &quot;g&quot;: &quot;p&quot;, &quot;d&quot;: &quot;佛門高僧，百世經綸；1990 年《霹靂異數》第 16 集登場，與素還真並列霹靂兩大支柱。&quot;}, {&quot;n&quot;: &quot;葉小釵&quot;, &quot;g&quot;: &quot;p&quot;, &quot;d&quot;: &quot;刀狂劍痴，刀劍雙修；在異數中從敵人變成素還真最交心的戰友。&quot;}, {&quot;n&quot;: &quot;劍子仙跡&quot;, &quot;g&quot;: &quot;s&quot;, &quot;d&quot;: &quot;三先天之一，道門代表；2004 年《霹靂九皇座》最後一集登場。&quot;}, {&quot;n&quot;: &quot;佛劍分說&quot;, &quot;g&quot;: &quot;s&quot;, &quot;d&quot;: &quot;三先天之一，佛門代表；為了天下蒼生負傷再出、重握佛牒。&quot;}, {&quot;n&quot;: &quot;疏樓龍宿&quot;, &quot;g&quot;: &quot;s&quot;, &quot;d&quot;: &quot;三先天之一，儒門天下龍首，華麗而深沉；有論文專門研究他的七首吟詩。&quot;}, {&quot;n&quot;: &quot;談無慾&quot;, &quot;g&quot;: &quot;f&quot;, &quot;d&quot;: &quot;素還真的師兄弟，長年亦敵亦友。&quot;}, {&quot;n&quot;: &quot;秦假仙&quot;, &quot;g&quot;: &quot;f&quot;, &quot;d&quot;: &quot;衰尾道人，本名秦玉安；從《雲州大儒俠》延續到霹靂的搞笑角色。&quot;}, {&quot;n&quot;: &quot;羅喉&quot;, &quot;g&quot;: &quot;v&quot;, &quot;d&quot;: &quot;上古梟雄，《刀龍傳說》第 4 集登場；斬殺魔神邪天御武、建立天都，最後被刀無后以影神刀所殺。&quot;}, {&quot;n&quot;: &quot;棄天帝&quot;, &quot;g&quot;: &quot;v&quot;, &quot;d&quot;: &quot;來自六天之界的毀滅之神，異度魔界創始者；《霹靂神州 III 之天罪》登場。&quot;}]}"></div>

      <h2>5. 角色關係圖（第 41 課）</h2>

      <div class="nv-w content-figure" style="text-align:left;max-width:680px;margin-left:auto;margin-right:auto" data-cfg="{&quot;t&quot;: &quot;graph&quot;, &quot;h&quot;: 360, &quot;q&quot;: &quot;經典角色關係（點選人物看說明）：&quot;, &quot;nodes&quot;: [{&quot;id&quot;: &quot;su&quot;, &quot;label&quot;: &quot;素還真&quot;, &quot;x&quot;: 320, &quot;y&quot;: 170, &quot;c&quot;: &quot;#d9822b&quot;, &quot;d&quot;: &quot;霹靂首席主角，許多正道行動的核心與布局者。&quot;}, {&quot;id&quot;: &quot;ys&quot;, &quot;label&quot;: &quot;一頁書&quot;, &quot;x&quot;: 120, &quot;y&quot;: 70, &quot;c&quot;: &quot;#d9822b&quot;, &quot;d&quot;: &quot;佛門高僧，與素還真並列兩大支柱，危急時刻的強大戰力。&quot;}, {&quot;id&quot;: &quot;yx&quot;, &quot;label&quot;: &quot;葉小釵&quot;, &quot;x&quot;: 520, &quot;y&quot;: 70, &quot;c&quot;: &quot;#d9822b&quot;, &quot;d&quot;: &quot;刀狂劍痴，素還真最信任的戰友之一。&quot;}, {&quot;id&quot;: &quot;tw&quot;, &quot;label&quot;: &quot;談無慾&quot;, &quot;x&quot;: 120, &quot;y&quot;: 280, &quot;c&quot;: &quot;#4a9a5e&quot;, &quot;d&quot;: &quot;素還真的師兄弟，亦敵亦友的宿命對手。&quot;}, {&quot;id&quot;: &quot;qj&quot;, &quot;label&quot;: &quot;秦假仙&quot;, &quot;x&quot;: 320, &quot;y&quot;: 310, &quot;c&quot;: &quot;#4a9a5e&quot;, &quot;d&quot;: &quot;搞笑又可靠的配角，常為正道跑腿、打探消息。&quot;}, {&quot;id&quot;: &quot;sx&quot;, &quot;label&quot;: &quot;三先天&quot;, &quot;x&quot;: 540, &quot;y&quot;: 280, &quot;c&quot;: &quot;#8a5cb8&quot;, &quot;d&quot;: &quot;劍子仙跡、佛劍分說、疏樓龍宿，三教頂峰。&quot;}, {&quot;id&quot;: &quot;lh&quot;, &quot;label&quot;: &quot;羅喉&quot;, &quot;x&quot;: 320, &quot;y&quot;: 40, &quot;c&quot;: &quot;#d0564f&quot;, &quot;d&quot;: &quot;上古梟雄，天都之主。&quot;}], &quot;edges&quot;: [[&quot;su&quot;, &quot;ys&quot;, &quot;兩大支柱&quot;, &quot;#d9822b&quot;], [&quot;su&quot;, &quot;yx&quot;, &quot;摯友&quot;, &quot;#d9822b&quot;], [&quot;su&quot;, &quot;tw&quot;, &quot;師兄弟／對手&quot;, &quot;#4a9a5e&quot;], [&quot;su&quot;, &quot;qj&quot;, &quot;夥伴&quot;, &quot;#4a9a5e&quot;], [&quot;su&quot;, &quot;sx&quot;, &quot;同道&quot;, &quot;#8a5cb8&quot;], [&quot;su&quot;, &quot;lh&quot;, &quot;敵對&quot;, &quot;#d0564f&quot;]]}"></div>

      <h2>6. 詩號卡（第 18、37 課）</h2>

      <div class="nv-w content-figure" style="text-align:left;max-width:680px;margin-left:auto;margin-right:auto" data-cfg="{&quot;t&quot;: &quot;cards&quot;, &quot;q&quot;: &quot;詩號卡（出場時吟誦的詩句；點卡片看說明）：&quot;, &quot;groups&quot;: [[&quot;m&quot;, &quot;三台柱&quot;, &quot;#d9822b&quot;], [&quot;s&quot;, &quot;三先天&quot;, &quot;#8a5cb8&quot;]], &quot;cards&quot;: [{&quot;n&quot;: &quot;素還真&quot;, &quot;g&quot;: &quot;m&quot;, &quot;d&quot;: &quot;「半神半聖亦半仙，全儒全道是全賢；腦中真書藏萬卷，掌握文武半邊天。」——文武雙全、智計過人的形象全在四句裡。&quot;}, {&quot;n&quot;: &quot;一頁書&quot;, &quot;g&quot;: &quot;m&quot;, &quot;d&quot;: &quot;「世事如棋，乾坤莫測，笑盡英雄啊！」——佛門高僧看盡世局的豪氣，常伴隨震撼全場的出場。&quot;}, {&quot;n&quot;: &quot;葉小釵&quot;, &quot;g&quot;: &quot;m&quot;, &quot;d&quot;: &quot;「愛落紅塵心已死，持刀抱劍了一生。」——官方資料中的詩號，道盡刀狂劍痴的孤絕。&quot;}, {&quot;n&quot;: &quot;疏樓龍宿&quot;, &quot;g&quot;: &quot;s&quot;, &quot;d&quot;: &quot;「華陽初上鴻門紅，疏樓更迭，龍麟不減風采；紫金簫，白玉琴，宮燈夜明曇華正盛，共飲逍遙一世悠然。」——華麗的儒門龍首，有學術論文專門分析他的七首吟詩。&quot;}]}"></div>

      <h2>7. 新手入門選劇（第 47 課）</h2>

      <div class="rts-w content-figure" style="text-align:left;max-width:720px;margin-left:auto;margin-right:auto" data-cfg="{&quot;t&quot;: &quot;tree&quot;, &quot;q&quot;: &quot;新手入門：你適合從哪裡開始看霹靂？&quot;, &quot;nodes&quot;: {&quot;start&quot;: {&quot;q&quot;: &quot;你比較喜歡哪一種追劇方式？&quot;, &quot;o&quot;: [[&quot;一季十幾集、看完就有結局&quot;, &quot;short&quot;], [&quot;想看經典、了解素還真&quot;, &quot;classic&quot;], [&quot;想跟上最新進度、和戲迷一起追&quot;, &quot;new&quot;]]}, &quot;short&quot;: {&quot;q&quot;: &quot;你習慣看日本動畫嗎？&quot;, &quot;o&quot;: [[&quot;習慣，喜歡日式劇本與聲優&quot;, &quot;thunder&quot;], [&quot;還好，想看台灣原汁原味&quot;, &quot;pfwod&quot;]]}, &quot;classic&quot;: {&quot;q&quot;: &quot;你在意畫質與節奏嗎？&quot;, &quot;o&quot;: [[&quot;在意，想要現代畫面&quot;, &quot;pfwod&quot;], [&quot;不在意，想看原版&quot;, &quot;old&quot;]]}, &quot;new&quot;: {&quot;q&quot;: &quot;你能接受一開始有些角色看不懂嗎？&quot;, &quot;o&quot;: [[&quot;可以，邊看邊查&quot;, &quot;latest&quot;], [&quot;不太行，想要乾淨的起點&quot;, &quot;pfwod&quot;]]}, &quot;thunder&quot;: {&quot;a&quot;: &quot;&lt;b&gt;《東離劍遊紀》&lt;/b&gt;：從 2016 年第一季開始看。日本聲優配音、一季十幾集、不需要任何前情，2025 年劇場版完結（第 43 課）。&quot;}, &quot;pfwod&quot;: {&quot;a&quot;: &quot;&lt;b&gt;《霹靂英雄戰紀之刀說異數》&lt;/b&gt;：重拍經典《霹靂異數》，畫面現代、有 Netflix 版本，素還真、一頁書、葉小釵三台柱一次認識（第 44 課）。之後可以接《刜伐世界》《塗附世界》。&quot;}, &quot;old&quot;: {&quot;a&quot;: &quot;&lt;b&gt;《霹靂金光》到《霹靂異數》&lt;/b&gt;：1988～1990 年的原版，看素還真登場與三台柱到齊；之後挑《霹靂九皇座》看三先天（第 21～25 課）。&quot;}, &quot;latest&quot;: {&quot;a&quot;: &quot;&lt;b&gt;最新劇集&lt;/b&gt;：2025 年 10 月開播的《霹靂兵濤》，或 2026 年 8 月起的《霹靂英雄戰紀之塗附世界》。搭配本課程的角色卡與年表，遇到不懂的角色就查（第 31 課）。&quot;}}}"></div>
