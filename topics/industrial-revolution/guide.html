      <script>
      (function () {
        if (window.__kirLib) return; window.__kirLib = 1;

        function btn(t, k) { var b = document.createElement('button'); b.type = 'button'; b.textContent = t; if (k !== undefined) b.setAttribute('data-k', k);
          b.style.cssText = 'padding:4px 10px;margin:4px 6px 0 0;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer;font:inherit;font-size:0.9em'; return b; }

        function head(root, q) { if (q) { var p = document.createElement('p'); p.style.margin = '0 0 8px'; p.innerHTML = q; root.appendChild(p); } }
        function el(tag, css, html) { var e = document.createElement(tag); if (css) e.style.cssText = css; if (html !== undefined) e.innerHTML = html; return e; }
        function n1(v) { return Math.round(v * 10) / 10; }
        function f1(v) { return (Math.round(v * 10) / 10).toString(); }
        function f2(v) { return (Math.round(v * 100) / 100).toString(); }
        function tx(x, y, s, sz, c, anc) { return '<text x="' + n1(x) + '" y="' + n1(y) + '" font-size="' + sz + '" fill="' + (c || 'currentColor') + '" text-anchor="' + (anc || 'middle') + '">' + s + '</text>'; }
        function ln(x1, y1, x2, y2, c, w, ex) { return '<line x1="' + n1(x1) + '" y1="' + n1(y1) + '" x2="' + n1(x2) + '" y2="' + n1(y2) + '" stroke="' + c + '" stroke-width="' + (w || 1) + '" ' + (ex || '') + '/>'; }
        function svgw(vb, inner) { return '<svg viewBox="' + vb + '" style="width:100%;display:block;color:var(--text)">' + inner + '</svg>'; }
        function slider(root, lab, min, max, step, val, fmt, k, cb) { var l = el('label', 'display:block;font-size:0.88em;margin-top:6px', lab + '：<b></b>'); var s = document.createElement('input');
          s.type = 'range'; s.min = min; s.max = max; s.step = step; s.value = val; s.style.cssText = 'width:100%;display:block'; if (k) s.setAttribute('data-k', k); l.appendChild(s); root.appendChild(l);
          function u() { l.querySelector('b').textContent = fmt(+s.value); cb(+s.value); } s.addEventListener('input', u); return u; }
        function nice(lo, hi, n) { var span = hi - lo || 1, st = Math.pow(10, Math.floor(Math.log10(span / n))), e = span / n / st; st *= e >= 5 ? 5 : e >= 2 ? 2 : 1; var t = [], v = Math.ceil(lo / st - 1e-9) * st; for (; v <= hi + 1e-9; v += st) t.push(Math.round(v / st) * st); return t; }
        function fmtT(v) { var a = Math.abs(v); return a >= 1e6 ? f1(v / 1e6) + 'M' : a >= 1e4 ? f1(v / 1e3) + 'k' : (Math.round(v * 100) / 100).toString(); }
        var CID = 0;
        function chart(W, H, S, o) { o = o || {}; var L = 48, R = 12, T = 22, B = 34, xs = [], ys = [];
          S.forEach(function (s) { s.d.forEach(function (p) { xs.push(p[0]); if (isFinite(p[1])) ys.push(p[1]); }); });
          var x0 = o.x0 !== undefined ? o.x0 : Math.min.apply(null, xs), x1 = o.x1 !== undefined ? o.x1 : Math.max.apply(null, xs);
          var y0 = o.y0 !== undefined ? o.y0 : Math.min(0, Math.min.apply(null, ys)), y1 = o.y1 !== undefined ? o.y1 : Math.max.apply(null, ys) * 1.08 || 1;
          function sx(v) { return L + (v - x0) / (x1 - x0 || 1) * (W - L - R); } function sy(v) { return H - B - (v - y0) / (y1 - y0 || 1) * (H - T - B); }
          var id = 'qc' + (++CID), g = '<clipPath id="' + id + '"><rect x="' + L + '" y="' + (T - 2) + '" width="' + (W - L - R) + '" height="' + (H - T - B + 4) + '"/></clipPath>';
          nice(y0, y1, 4).forEach(function (v) { g += ln(L, sy(v), W - R, sy(v), 'var(--border)', 0.6, 'stroke-dasharray="2 3"') + tx(L - 5, sy(v) + 3, fmtT(v), 9, 'var(--text-muted)', 'end'); });
          nice(x0, x1, 6).forEach(function (v) { g += tx(sx(v), H - B + 14, fmtT(v), 9, 'var(--text-muted)'); });
          g += ln(L, T - 4, L, H - B, '#999') + ln(L, H - B, W - R, H - B, '#999');
          if (o.xl) g += tx((L + W - R) / 2, H - 4, o.xl, 9.5, 'var(--text-muted)');
          if (o.yl) g += tx(L - 40, T - 8, o.yl, 9.5, 'var(--text-muted)', 'start');
          (o.hl || []).forEach(function (h) { g += ln(L, sy(h.y), W - R, sy(h.y), h.c, 1, 'stroke-dasharray="5 4"') + tx(W - R - 2, sy(h.y) - 4, h.n, 9, h.c, 'end'); });
          (o.vl || []).forEach(function (h) { g += ln(sx(h.x), T, sx(h.x), H - B, h.c, 1, 'stroke-dasharray="5 4"') + tx(sx(h.x) + 3, H - B - 6, h.n, 9, h.c, 'start'); });
          S.forEach(function (s) { var d = '', m = 'M'; s.d.forEach(function (p) { if (!isFinite(p[1])) { m = 'M'; return; } d += m + n1(sx(p[0])) + ' ' + n1(sy(Math.max(Math.min(p[1], y1 + (y1 - y0)), y0 - (y1 - y0)))); m = 'L'; });
            g += '<path clip-path="url(#' + id + ')" d="' + d + '" fill="none" stroke="' + s.c + '" stroke-width="' + (s.w || 2) + '"' + (s.dash ? ' stroke-dasharray="' + s.dash + '"' : '') + '/>'; });
          (o.pts || []).forEach(function (p) { g += '<circle cx="' + n1(sx(p.x)) + '" cy="' + n1(sy(Math.min(p.y, y1))) + '" r="5" fill="' + p.c + '"/>' + (p.n ? tx(sx(p.x) + 8, sy(Math.min(p.y, y1)) - 6, p.n, 10, p.c, 'start') : ''); });
          var lx = L + 8, ly = T + 2; S.forEach(function (s) { if (!s.n) return; g += ln(lx, ly, lx + 16, ly, s.c, 2.5, s.dash ? 'stroke-dasharray="' + s.dash + '"' : '') + tx(lx + 20, ly + 4, s.n, 9.5, 'currentColor', 'start'); lx += 34 + s.n.length * 10.5; if (lx > W - 120) { lx = L + 8; ly += 15; } });
          return svgw('0 0 ' + W + ' ' + H, g); }
        function rexp(m) { return -Math.log(1 - Math.random()) * m; }

        var BL = '#3a6ea5', OR = '#d9822b', RD = '#d0564f', GN = '#4a9a5e', GY = '#9aa3ad', PU = '#8a5bb5', TL = '#2a9d8f', YL = '#c9a227';
        function info(root) { var p = el('div', 'margin-top:8px;padding:10px 12px;border-radius:8px;background:var(--accent-soft);line-height:1.7;font-size:0.93em'); root.appendChild(p); return p; }

        function presets(root, list, cb, k0) { var b = bar(root); list.forEach(function (o, i) { var x = btn(o, i); x.onclick = function () { mark(b, i); cb(i); }; b.appendChild(x); }); mark(b, k0 === undefined ? 0 : k0); return b; }
        function setS(root, k, v) { var s = root.querySelector('input[data-k="' + k + '"]'); if (s) s.value = v; }

        function ci(x, y, r, f, st, sw) { return '<circle cx="' + n1(x) + '" cy="' + n1(y) + '" r="' + n1(r) + '" fill="' + f + '"' + (st ? ' stroke="' + st + '" stroke-width="' + (sw || 1.5) + '"' : '') + '/>'; }
        function pa(d, c, w, f, ex) { return '<path d="' + d + '" fill="' + (f || 'none') + '" stroke="' + c + '" stroke-width="' + (w || 1.5) + '" ' + (ex || '') + '/>'; }
        function poly(pts) { return pts.map(function (p, i) { return (i ? 'L' : 'M') + n1(p[0]) + ' ' + n1(p[1]); }).join(' '); }
        function tbl(h, rows) { var s = '<table style="border-collapse:collapse;width:100%;font-size:0.86em;margin-top:6px"><tr>' + h.map(function (x) { return '<th style="border:1px solid var(--border);padding:3px 5px;background:var(--accent-soft)">' + x + '</th>'; }).join('') + '</tr>';
          rows.forEach(function (r) { s += '<tr>' + r.map(function (c, j) { return '<td style="border:1px solid var(--border);padding:3px 5px;text-align:' + (j ? 'center' : 'left') + '">' + c + '</td>'; }).join('') + '</tr>'; }); return s + '</table>'; }
        function rng(seed) { var a = (seed || 1) >>> 0; return function () { a = (a + 0x6D2B79F5) >>> 0; var t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
        function gauss(r) { var u = Math.max(r(), 1e-9), v = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); }
        function pct(v) { return f1(v * 100) + '%'; }
        function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

        /* 1. 馬爾薩斯陷阱 */
        function initMal(root, cfg) { head(root, cfg.q); var P = { g: 0.05, dt: 0 }, view = el('div');
          presets(root, ['前工業時代（技術每年進步 0.05%）', '工業革命（1%）', '現代（2%）'], function (i) { P.g = [0.05, 1, 2][i]; setS(root, 'g', P.g); u1(); });
          var u1 = slider(root, '技術進步的速度（每年）', 0, 2.5, 0.05, P.g, function (x) { return f2(x) + '%'; }, 'g', function (x) { P.g = x; draw(); });
          presets(root, ['沒有人口轉型', '有人口轉型（變富後生育率下降）'], function (i) { P.dt = i; draw(); });
          root.appendChild(view); var inf = info(root);
          function draw() { var A = 1, L = 1, y, dy = [], dl = [], t, ys = 1;
            for (t = 0; t <= 300; t++) { y = A * Math.pow(L, -0.5); var gr = 0.03 * (y - ys); if (P.dt && y > 1.6) gr = Math.min(gr, Math.max(0, 0.015 - 0.01 * (y - 1.6))); L *= Math.exp(gr); A *= 1 + P.g / 100; dy.push([t, Math.log10(y)]); dl.push([t, Math.log10(L)]); }
            view.innerHTML = chart(640, 230, [{ d: dy, c: RD, n: '每人所得（log₁₀，起點為 0）' }, { d: dl, c: BL, n: '人口（log₁₀，起點為 0）' }], { x0: 0, x1: 300, xl: '年', yl: 'log₁₀' });
            var yEnd = Math.pow(10, dy[300][1]), lEnd = Math.pow(10, dl[300][1]), gEnd = Math.pow(10, dy[300][1] - dy[250][1]);
            inf.innerHTML = '300 年後：每人所得是起點的 <b>' + (yEnd < 100 ? f1(yEnd) : Math.round(yEnd)) + ' 倍</b>，人口是 <b>' + (lEnd < 100 ? f1(lEnd) : Math.round(lEnd)) + ' 倍</b>。<br>' +
              (gEnd > 1.15 ? '技術進步的成果不再全部被人口吃掉，<b>每人所得持續上升</b>，逃出了馬爾薩斯陷阱。關鍵是<b>人口轉型</b>：變富之後生育率下降，人口成長趨緩，技術進步才能轉化成每個人更好的生活。' :
               yEnd < 1.3 ? '技術雖然進步，但多出來的糧食都被增加的人口「吃掉」了：所得一升高，人口就增加；人口多了，每個人分到的土地與糧食又變少，所得被壓回只夠生存的水準。這就是<b>馬爾薩斯陷阱</b>——工業革命以前的數千年，大部分人的生活水準幾乎沒有長期的提升。' :
               '技術進步更快，所得升到比較高的水準，但人口也爆炸性地增加（' + (lEnd < 100 ? f1(lEnd) : Math.round(lEnd)) + ' 倍），所得停在一個<b>高原</b>上不再成長——只要人口跟著所得增加，就還沒有真正逃出陷阱。試試加上<b>人口轉型</b>。') + small('簡化的馬爾薩斯模型：產量隨人口邊際遞減（土地固定），人口成長率隨所得高於生存水準而增加。'); }
          u1();
        }

        /* 2. 紡紗工時 */
        function initSpin(root, cfg) { head(root, cfg.q); var D = [['印度的手紡車', '18 世紀', 50000], ['克朗普頓的走錠精紡機', '1780 年', 2000], ['100 錠的走錠精紡機', '1790 年左右', 1000], ['動力輔助的走錠精紡機', '1795 年左右', 300], ['羅伯茨的自動走錠精紡機', '1825 年左右', 135], ['現代最有效率的機器', '1990 年左右', 40]], P = { k: 4 }, view = el('div');
          var u1 = slider(root, '選擇年代', 0, 5, 1, P.k, function (x) { return D[x][1] + '：' + D[x][0]; }, null, function (x) { P.k = x; draw(); });
          root.appendChild(view); var inf = info(root);
          function draw() { var o = '', X0 = 210, W = 340, mx = Math.log10(60000);
            D.forEach(function (d, i) { var y = 14 + i * 36, w = Math.log10(d[2]) / mx * W, on = i <= P.k; o += tx(X0 - 8, y + 17, d[0], 11, on ? 'var(--text)' : 'var(--text-muted)', 'end') + rc(X0, y + 4, w, 22, i === P.k ? RD : on ? BL : 'var(--border)', null, 3) + tx(X0 + w + 6, y + 19, d[2].toLocaleString() + ' 小時', 11, on ? 'var(--text)' : 'var(--text-muted)', 'start'); });
            view.innerHTML = svgw('0 0 640 230', o);
            var d = D[P.k];
            inf.innerHTML = d[1] + '，用「' + d[0] + '」紡 100 磅的棉紗，大約需要 <b>' + d[2].toLocaleString() + ' 個工時</b>' + (P.k ? '，是印度手紡的 <b>' + Math.round(50000 / d[2]) + ' 分之一</b>' : '') + '。<br>' +
              '短短四五十年之間，紡紗的生產力提高了數百倍。棉布從奢侈品變成每個人都買得起的日用品，英國的棉紡織業成為工業革命的火車頭。生產力的飛躍，正是工業革命和過去所有時代最大的不同。' + small('依經濟史學者常引用的估計數字（長條以對數尺度顯示），不同來源略有差異。'); }
          u1();
        }

        /* 3. 蒸汽機效率 */
        function initSteam(root, cfg) { head(root, cfg.q); var D = [[1712, 0.7, '紐科門蒸汽機', '把蒸汽通入汽缸再噴冷水凝結，靠大氣壓力推動活塞，主要用來抽礦坑的水。每次都要把汽缸冷卻再加熱，浪費了大部分的熱。'], [1775, 2.7, '瓦特蒸汽機（分離式冷凝器）', '把蒸汽引到另一個冷凝器中凝結，汽缸可以一直保持熱，用煤量只有紐科門機的約四分之一。'], [1800, 4, '瓦特雙動式旋轉蒸汽機', '活塞兩側輪流推動，並用齒輪把往復變成旋轉，可以帶動工廠的機器。'], [1840, 9, '高壓蒸汽機（康瓦爾式）', '使用更高壓的蒸汽並讓它膨脹做功，效率大幅提高，也讓火車頭與輪船變得可行。'], [1870, 13, '複合式蒸汽機', '蒸汽依序在兩個汽缸中膨脹，減少浪費；遠洋輪船因此能載更多的貨、更少的煤。'], [1900, 18, '三段膨脹式蒸汽機與早期蒸汽渦輪', '帕森斯的蒸汽渦輪讓發電與船舶推進進入新時代。'], [1950, 32, '火力發電廠的蒸汽渦輪', '高溫高壓的朗肯循環，配合鍋爐的再熱與給水加熱。'], [2010, 45, '超超臨界燃煤電廠', '蒸汽的壓力與溫度超過水的臨界點，效率接近 45%。']], P = { k: 1 }, view = el('div');
          var u1 = slider(root, '選擇年代', 0, D.length - 1, 1, P.k, function (x) { return D[x][0] + ' 年：' + D[x][2]; }, null, function (x) { P.k = x; draw(); });
          root.appendChild(view); var inf = info(root);
          function draw() { var d = D.map(function (r) { return [r[0], r[1]]; }), c = D[P.k];
            view.innerHTML = chart(640, 220, [{ d: d, c: OR, n: '熱效率（%）' }], { x0: 1700, x1: 2020, y0: 0, y1: 50, xl: '年', yl: '%', pts: [{ x: c[0], y: c[1], c: RD, n: c[1] + '%' }] });
            inf.innerHTML = '<b>' + c[0] + ' 年：' + c[2] + '</b>，熱效率約 <b>' + c[1] + '%</b>——做同樣的功，用煤量約是紐科門機的 <b>' + (0.7 / c[1] * 100 < 10 ? f1(0.7 / c[1] * 100) : Math.round(0.7 / c[1] * 100)) + '%</b>。<br>' + c[3] + '<br>效率的提升，讓蒸汽動力從只能放在煤礦旁邊抽水的機器，變成能驅動工廠、火車、輪船的萬用動力。熱機效率的物理極限見〈熱力學與熱傳〉中的卡諾效率。' + small('熱效率為大致的數量級，不同機型與文獻的數字差異很大。'); }
          u1();
        }

        /* 4. 能源與二氧化碳 */
        function initCo2(root, cfg) { head(root, cfg.q); var Y = [1800, 1850, 1900, 1950, 1970, 2000, 2020], S = [['傳統生質能（木材等）', [20, 23, 22, 27, 30, 37, 40], '#8d6e4a'], ['煤', [0.5, 2, 23, 47, 63, 90, 155], '#555'], ['石油', [0, 0, 0.6, 20, 95, 150, 175], OR], ['天然氣', [0, 0, 0.3, 7, 35, 87, 140], BL], ['核能、水力與再生能源', [0, 0, 0.2, 2, 5, 25, 55], GN]], PPM = [283, 285, 296, 311, 325, 369, 413], P = { y: 2020 }, view = el('div');
          var u1 = slider(root, '年份', 1800, 2020, 10, P.y, function (x) { return x + ' 年'; }, null, function (x) { P.y = x; draw(); });
          root.appendChild(view); var inf = info(root);
          function itp(arr, y) { for (var i = 1; i < Y.length; i++) if (y <= Y[i]) { var a = (y - Y[i - 1]) / (Y[i] - Y[i - 1]); return arr[i - 1] + a * (arr[i] - arr[i - 1]); } return arr[arr.length - 1]; }
          function draw() { var X0 = 50, Y0 = 210, W = 540, H = 190, mx = 600, o = '', base = [], y, k, xs = [];
            function X(v) { return X0 + (v - 1800) / 220 * W; } function YY(v) { return Y0 - v / mx * H; }
            for (y = 1800; y <= 2020; y += 5) { xs.push(y); base.push(0); }
            S.forEach(function (s) { var top = xs.map(function (yy, i) { return base[i] + itp(s[1], yy); }), pts = xs.map(function (yy, i) { return [X(yy), YY(top[i])]; }).concat(xs.slice().reverse().map(function (yy, j) { var i = xs.length - 1 - j; return [X(yy), YY(base[i])]; }));
