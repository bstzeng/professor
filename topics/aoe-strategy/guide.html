      <div class="nv-w content-figure" style="text-align:left;max-width:680px;margin-left:auto;margin-right:auto" data-cfg="{&quot;t&quot;: &quot;timeline&quot;, &quot;q&quot;: &quot;世紀帝國系列與決定版（點一列看說明）：&quot;, &quot;yw&quot;: 66, &quot;groups&quot;: [[&quot;1&quot;, &quot;一代&quot;, &quot;#d9822b&quot;], [&quot;2&quot;, &quot;二代&quot;, &quot;#3a6ea5&quot;]], &quot;ev&quot;: [{&quot;y&quot;: &quot;1997&quot;, &quot;t&quot;: &quot;《世紀帝國》&quot;, &quot;d&quot;: &quot;石器、工具、銅器、鐵器四個時代；1998 年資料片《羅馬復興》。&quot;, &quot;g&quot;: &quot;1&quot;}, {&quot;y&quot;: &quot;1999&quot;, &quot;t&quot;: &quot;《世紀帝國 II：帝王世紀》&quot;, &quot;d&quot;: &quot;黑暗、封建、城堡、帝王四個時代；2000 年資料片《征服者》。&quot;, &quot;g&quot;: &quot;2&quot;}, {&quot;y&quot;: &quot;2018&quot;, &quot;t&quot;: &quot;《世紀帝國：決定版》&quot;, &quot;d&quot;: &quot;一代重製，16 個文明。&quot;, &quot;g&quot;: &quot;1&quot;}, {&quot;y&quot;: &quot;2019&quot;, &quot;t&quot;: &quot;《世紀帝國 II：決定版》&quot;, &quot;d&quot;: &quot;二代重製，之後持續推出新文明與更新。&quot;, &quot;g&quot;: &quot;2&quot;}, {&quot;y&quot;: &quot;2023&quot;, &quot;t&quot;: &quot;「羅馬再起」（Return of Rome）&quot;, &quot;d&quot;: &quot;把一代的 16 個文明加上新文明帶進二代的引擎，成為二代中的獨立模式；羅馬人也加入二代文明。&quot;, &quot;g&quot;: &quot;2&quot;}, {&quot;y&quot;: &quot;2025 年 5 月&quot;, &quot;t&quot;: &quot;「三國」資料片&quot;, &quot;d&quot;: &quot;新增蜀、魏、吳、女真、契丹五個文明。&quot;, &quot;g&quot;: &quot;2&quot;}, {&quot;y&quot;: &quot;2026 年 2 月&quot;, &quot;t&quot;: &quot;「最後的酋長」資料片&quot;, &quot;d&quot;: &quot;新增馬普切、穆伊斯卡、圖皮三個文明，皆可在天梯使用。&quot;, &quot;g&quot;: &quot;2&quot;}]}"></div>

      <h2>2. 經濟模擬器（第 4、8 課）</h2>

      <div class="rts-w content-figure" style="text-align:left;max-width:720px;margin-left:auto;margin-right:auto" data-cfg="{&quot;t&quot;: &quot;eco&quot;, &quot;q&quot;: &quot;運營模擬：城鎮中心閒置的代價（簡化：所有資源合併計算）&quot;, &quot;c&quot;: {&quot;P&quot;: 1, &quot;k&quot;: 999, &quot;r1&quot;: 22, &quot;r2&quot;: 0, &quot;m&quot;: 999, &quot;cost&quot;: 50, &quot;bt&quot;: 25, &quot;w0&quot;: 3, &quot;res0&quot;: 200, &quot;T&quot;: 600, &quot;wn&quot;: &quot;村民&quot;, &quot;unit&quot;: &quot;資源&quot;, &quot;base&quot;: &quot;城鎮中心&quot;, &quot;wmax&quot;: 40}, &quot;note&quot;: &quot;模型：每個村民平均每分鐘約 22 單位資源（伐木約 0.39／秒、採金約 0.38／秒、農田約 0.32／秒的平均）；村民 50 食物、25 秒。實際遊戲還要蓋房子、升時代，這裡只看「城鎮中心有沒有一直在生村民」。&quot;}"></div>

      <h2>3. 城鎮中心不閒置訓練（第 8、14 課）</h2>

      <div class="rts-w content-figure" style="text-align:left;max-width:720px;margin-left:auto;margin-right:auto" data-cfg="{&quot;t&quot;: &quot;macro&quot;, &quot;q&quot;: &quot;運營節奏訓練：城鎮中心不閒置、房子不卡（90 秒）&quot;, &quot;len&quot;: 90, &quot;tasks&quot;: [[&quot;城鎮中心：生村民&quot;, 25, 0], [&quot;蓋房子（+5 人口）&quot;, 50, 20], [&quot;分配新村民去工作&quot;, 25, 6]], &quot;note&quot;: &quot;世紀帝國有生產佇列，但高手仍會避免排太多（把食物鎖住），而是一個接一個地生。按鈕變紅就代表該做了。&quot;, &quot;tip&quot;: &quot;「城鎮中心閒置時間」是世紀帝國運營最重要的指標，職業選手的開局幾乎是 0。&quot;}"></div>

      <h2>4. 封建開局（第 7 課）</h2>

      <div class="rts-w content-figure" style="text-align:left;max-width:720px;margin-left:auto;margin-right:auto" data-cfg="{&quot;t&quot;: &quot;bo&quot;, &quot;q&quot;: &quot;常見的 22 人口封建開局（斥候或弓箭手的基礎版本）&quot;, &quot;mode&quot;: &quot;pop&quot;, &quot;steps&quot;: [[&quot;1–6&quot;, &quot;&quot;, &quot;前 6 個村民採羊（斥候把羊趕回城鎮中心）；第一批村民先蓋 2 間房子&quot;], [&quot;7–10&quot;, &quot;&quot;, &quot;4 個村民伐木，並蓋伐木場&quot;], [&quot;11&quot;, &quot;&quot;, &quot;引誘第一隻野豬到城鎮中心&quot;], [&quot;12–13&quot;, &quot;&quot;, &quot;採羊／野豬&quot;], [&quot;14&quot;, &quot;&quot;, &quot;蓋磨坊，採莓果（14～17 號）&quot;], [&quot;18–19&quot;, &quot;&quot;, &quot;引誘第二隻野豬，之後轉去伐木或蓋農田&quot;], [&quot;20–21&quot;, &quot;&quot;, &quot;伐木（為封建時代的建築與農田做準備）&quot;], [&quot;22&quot;, &quot;&quot;, &quot;研究紡織（選擇性）後點封建時代；升級期間派村民蓋兵營或其他封建所需的建築&quot;]], &quot;note&quot;: &quot;「人口」欄表示第幾個村民去做這件事。這是社群常見的基礎版本，細節依文明與戰術而不同（例如民兵開局會更早蓋兵營）。&quot;}"></div>

      <h2>5. 兵種相剋（第 15 課）</h2>

      <div class="rts-w content-figure" style="text-align:left;max-width:720px;margin-left:auto;margin-right:auto" data-cfg="{&quot;t&quot;: &quot;counter&quot;, &quot;q&quot;: &quot;世紀帝國二代兵種相剋（點選看相剋）：&quot;, &quot;groups&quot;: [[&quot;i&quot;, &quot;步兵&quot;], [&quot;a&quot;, &quot;弓箭&quot;], [&quot;c&quot;, &quot;騎兵&quot;], [&quot;s&quot;, &quot;攻城與其他&quot;]], &quot;units&quot;: [[&quot;民兵／劍士&quot;, &quot;i&quot;, &quot;建築、步兵、特殊單位&quot;, &quot;弓箭手、手砲兵&quot;, &quot;需要黃金&quot;], [&quot;長槍兵／長戟兵&quot;, &quot;i&quot;, &quot;騎兵、戰象、駱駝&quot;, &quot;弓箭手、劍士、散兵&quot;, &quot;無金&quot;], [&quot;散兵&quot;, &quot;a&quot;, &quot;弓箭手&quot;, &quot;騎兵、劍士、攻城&quot;, &quot;無金&quot;], [&quot;弓箭手／弩手&quot;, &quot;a&quot;, &quot;步兵、長槍兵&quot;, &quot;散兵、騎兵、攻城武器&quot;, &quot;遠程主力&quot;], [&quot;騎射手&quot;, &quot;a&quot;, &quot;步兵、慢速單位&quot;, &quot;散兵、長槍兵、駱駝&quot;, &quot;機動遠程&quot;], [&quot;斥候／輕騎兵&quot;, &quot;c&quot;, &quot;僧侶、攻城武器、散兵、騷擾村民&quot;, &quot;長槍兵、駱駝&quot;, &quot;便宜快速&quot;], [&quot;騎士&quot;, &quot;c&quot;, &quot;弓箭手、步兵、攻城武器&quot;, &quot;長槍兵、駱駝、僧侶&quot;, &quot;城堡時代主力&quot;], [&quot;駱駝&quot;, &quot;c&quot;, &quot;騎兵&quot;, &quot;步兵、弓箭手&quot;, &quot;反騎兵&quot;], [&quot;僧侶&quot;, &quot;s&quot;, &quot;騎士、戰象等昂貴單位（轉化）&quot;, &quot;輕騎兵、斥候、弓箭手&quot;, &quot;轉化與治療&quot;], [&quot;衝車&quot;, &quot;s&quot;, &quot;建築&quot;, &quot;近戰單位&quot;, &quot;攻城&quot;], [&quot;芒果車／投石機&quot;, &quot;s&quot;, &quot;建築、成群單位&quot;, &quot;騎兵近身&quot;, &quot;遠程攻城&quot;]]}"></div>

      <h2>6. 文明速查（第 23、29 課）</h2>

      <div class="nv-w content-figure" style="text-align:left;max-width:680px;margin-left:auto;margin-right:auto" data-cfg="{&quot;t&quot;: &quot;cards&quot;, &quot;q&quot;: &quot;常見文明速查（可篩選或搜尋；加成以遊戲內說明為準）：&quot;, &quot;groups&quot;: [[&quot;c&quot;, &quot;騎兵&quot;, &quot;#d9822b&quot;], [&quot;a&quot;, &quot;弓箭&quot;, &quot;#4a9a5e&quot;], [&quot;i&quot;, &quot;步兵&quot;, &quot;#d0564f&quot;], [&quot;m&quot;, &quot;綜合&quot;, &quot;#3a6ea5&quot;], [&quot;n&quot;, &quot;新文明&quot;, &quot;#8a5cb8&quot;]], &quot;cards&quot;: [{&quot;n&quot;: &quot;不列顛（Britons）&quot;, &quot;g&quot;: &quot;a&quot;, &quot;d&quot;: &quot;特殊單位長弓兵；步行弓兵在城堡、帝王時代各 +1 射程；牧羊更快。弓箭手文明的代表。&quot;}, {&quot;n&quot;: &quot;法蘭克（Franks）&quot;, &quot;g&quot;: &quot;c&quot;, &quot;d&quot;: &quot;特殊單位投斧兵；騎兵生命值較高；農田科技免費。騎士快攻的代表。&quot;}, {&quot;n&quot;: &quot;蒙古（Mongols）&quot;, &quot;g&quot;: &quot;c&quot;, &quot;d&quot;: &quot;特殊單位蒙古騎射手（Mangudai）；狩獵更快；騎射手射速較快、輕騎兵更耐打。&quot;}, {&quot;n&quot;: &quot;匈奴（Huns）&quot;, &quot;g&quot;: &quot;c&quot;, &quot;d&quot;: &quot;特殊單位塔爾坎騎兵；不需要房子；騎射手較便宜、馬廄生產較快。&quot;}, {&quot;n&quot;: &quot;拜占庭（Byzantines）&quot;, &quot;g&quot;: &quot;m&quot;, &quot;d&quot;: &quot;特殊單位鐵甲騎兵；反制兵種（長槍兵、散兵、駱駝）較便宜；建築更耐打；升帝王較便宜。&quot;}, {&quot;n&quot;: &quot;中國（Chinese）&quot;, &quot;g&quot;: &quot;m&quot;, &quot;d&quot;: &quot;特殊單位諸葛弩；開局多 3 個村民但食物、木材較少；科技較便宜。開局較難但彈性大。&quot;}, {&quot;n&quot;: &quot;阿茲特克（Aztecs）&quot;, &quot;g&quot;: &quot;i&quot;, &quot;d&quot;: &quot;特殊單位美洲豹戰士；沒有騎兵；村民搬運量較多、軍隊生產較快；僧侶很強。&quot;}, {&quot;n&quot;: &quot;瑪雅（Mayans）&quot;, &quot;g&quot;: &quot;a&quot;, &quot;d&quot;: &quot;特殊單位羽毛弓箭手；沒有騎兵；開局多 1 個村民；資源可以採更久；射箭場單位較便宜。&quot;}, {&quot;n&quot;: &quot;蜀、魏、吳（三國）&quot;, &quot;g&quot;: &quot;n&quot;, &quot;d&quot;: &quot;2025 年「三國」資料片新增；各有獨特的單位與加成。&quot;}, {&quot;n&quot;: &quot;女真、契丹&quot;, &quot;g&quot;: &quot;n&quot;, &quot;d&quot;: &quot;同樣來自 2025 年「三國」資料片，代表中國北方的勢力。&quot;}, {&quot;n&quot;: &quot;馬普切、穆伊斯卡、圖皮&quot;, &quot;g&quot;: &quot;n&quot;, &quot;d&quot;: &quot;2026 年「最後的酋長」資料片新增，皆可在天梯使用；例如馬普切的博拉斯騎手、圖皮的黑木弓箭手。&quot;}]}"></div>

      <h2>7. 一代開局的思路（第 32 課）</h2>

      <div class="rts-w content-figure" style="text-align:left;max-width:720px;margin-left:auto;margin-right:auto" data-cfg="{&quot;t&quot;: &quot;bo&quot;, &quot;q&quot;: &quot;一代開局的思路（示意）&quot;, &quot;mode&quot;: &quot;pop&quot;, &quot;steps&quot;: [[&quot;開局&quot;, &quot;&quot;, &quot;村民採集附近的獵物、果樹或魚，蓋房子&quot;], [&quot;早期&quot;, &quot;&quot;, &quot;持續生產村民；蓋穀倉（食物）與倉庫（木材、黃金、石頭）&quot;], [&quot;工具時代&quot;, &quot;&quot;, &quot;需要兩棟石器時代的建築；500 食物&quot;], [&quot;工具時代後&quot;, &quot;&quot;, &quot;選擇快攻（斧兵、投石兵、弓兵、塔快攻）或繼續發展&quot;], [&quot;銅器時代&quot;, &quot;&quot;, &quot;800 食物；騎兵、戰車、祭司等&quot;], [&quot;鐵器時代&quot;, &quot;&quot;, &quot;1,000 食物、800 黃金；最強的兵種與科技&quot;]], &quot;note&quot;: &quot;一代的開局細節依文明與地圖差異很大，這裡只呈現共通的節奏。&quot;}"></div>
