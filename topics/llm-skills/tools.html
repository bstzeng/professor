    <article class="lesson-content">

      <script>
      (function () {
        if (window.__sklLib) return; window.__sklLib = 1;

        function btn(t, k) { var b = document.createElement('button'); b.type = 'button'; b.textContent = t; if (k !== undefined) b.setAttribute('data-k', k);
          b.style.cssText = 'padding:4px 10px;margin:4px 6px 0 0;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer;font:inherit;font-size:0.9em'; return b; }
        function mark(bar, k) { bar.querySelectorAll('button').forEach(function (b) { var on = b.getAttribute('data-k') === String(k); b.style.background = on ? 'var(--accent-soft)' : 'var(--surface)'; b.style.fontWeight = on ? 'bold' : 'normal'; }); }
        function head(root, q) { if (q) { var p = document.createElement('p'); p.style.margin = '0 0 8px'; p.innerHTML = q; root.appendChild(p); } }
        function el(tag, css, html) { var e = document.createElement(tag); if (css) e.style.cssText = css; if (html !== undefined) e.innerHTML = html; return e; }
        function n1(v) { return Math.round(v * 10) / 10; }
        function f1(v) { return (Math.round(v * 10) / 10).toString(); }
        function f2(v) { return (Math.round(v * 100) / 100).toString(); }
        function tx(x, y, s, sz, c, anc) { return '<text x="' + n1(x) + '" y="' + n1(y) + '" font-size="' + sz + '" fill="' + (c || 'currentColor') + '" text-anchor="' + (anc || 'middle') + '">' + s + '</text>'; }
        function ln(x1, y1, x2, y2, c, w, ex) { return '<line x1="' + n1(x1) + '" y1="' + n1(y1) + '" x2="' + n1(x2) + '" y2="' + n1(y2) + '" stroke="' + c + '" stroke-width="' + (w || 1) + '" ' + (ex || '') + '/>'; }
        function svgw(vb, inner) { return '<svg viewBox="' + vb + '" style="width:100%;display:block;color:var(--text)">' + inner + '</svg>'; }
        function slider(root, lab, min, max, step, val, fmt, k, cb) { var l = el('label', 'display:block;font-size:0.88em;margin-top:6px', lab + '：<b></b>'); var s = document.createElement('input');
          s.type = 'range'; s.min = min; s.max = max; s.step = step; s.value = val; s.style.cssText = 'width:100%;display:block'; if (k) s.setAttribute('data-k', k); l.appendChild(s); root.appendChild(l);
          function u() { l.querySelector('b').textContent = fmt(+s.value); cb(+s.value); } s.addEventListener('input', u); return u; }
        function nice(lo, hi, n) { var span = hi - lo || 1, st = Math.pow(10, Math.floor(Math.log10(span / n))), e = span / n / st; st *= e >= 5 ? 5 : e >= 2 ? 2 : 1; var t = [], v = Math.ceil(lo / st - 1e-9) * st; for (; v <= hi + 1e-9; v += st) t.push(Math.round(v / st) * st); return t; }
        function fmtT(v) { var a = Math.abs(v); return a >= 1e6 ? f1(v / 1e6) + 'M' : a >= 1e4 ? f1(v / 1e3) + 'k' : (Math.round(v * 100) / 100).toString(); }
        var CID = 0;
        function chart(W, H, S, o) { o = o || {}; var L = 48, R = 12, T = 22, B = 34, xs = [], ys = [];
          S.forEach(function (s) { s.d.forEach(function (p) { xs.push(p[0]); if (isFinite(p[1])) ys.push(p[1]); }); });
          var x0 = o.x0 !== undefined ? o.x0 : Math.min.apply(null, xs), x1 = o.x1 !== undefined ? o.x1 : Math.max.apply(null, xs);
          var y0 = o.y0 !== undefined ? o.y0 : Math.min(0, Math.min.apply(null, ys)), y1 = o.y1 !== undefined ? o.y1 : Math.max.apply(null, ys) * 1.08 || 1;
          function sx(v) { return L + (v - x0) / (x1 - x0 || 1) * (W - L - R); } function sy(v) { return H - B - (v - y0) / (y1 - y0 || 1) * (H - T - B); }
          var id = 'qc' + (++CID), g = '<clipPath id="' + id + '"><rect x="' + L + '" y="' + (T - 2) + '" width="' + (W - L - R) + '" height="' + (H - T - B + 4) + '"/></clipPath>';
          nice(y0, y1, 4).forEach(function (v) { g += ln(L, sy(v), W - R, sy(v), 'var(--border)', 0.6, 'stroke-dasharray="2 3"') + tx(L - 5, sy(v) + 3, fmtT(v), 9, 'var(--text-muted)', 'end'); });
          nice(x0, x1, 6).forEach(function (v) { g += tx(sx(v), H - B + 14, fmtT(v), 9, 'var(--text-muted)'); });
          g += ln(L, T - 4, L, H - B, '#999') + ln(L, H - B, W - R, H - B, '#999');
          if (o.xl) g += tx((L + W - R) / 2, H - 4, o.xl, 9.5, 'var(--text-muted)');
          if (o.yl) g += tx(L - 40, T - 8, o.yl, 9.5, 'var(--text-muted)', 'start');
          (o.hl || []).forEach(function (h) { g += ln(L, sy(h.y), W - R, sy(h.y), h.c, 1, 'stroke-dasharray="5 4"') + tx(W - R - 2, sy(h.y) - 4, h.n, 9, h.c, 'end'); });
          (o.vl || []).forEach(function (h) { g += ln(sx(h.x), T, sx(h.x), H - B, h.c, 1, 'stroke-dasharray="5 4"') + tx(sx(h.x) + 3, H - B - 6, h.n, 9, h.c, 'start'); });
          S.forEach(function (s) { var d = '', m = 'M'; s.d.forEach(function (p) { if (!isFinite(p[1])) { m = 'M'; return; } d += m + n1(sx(p[0])) + ' ' + n1(sy(Math.max(Math.min(p[1], y1 + (y1 - y0)), y0 - (y1 - y0)))); m = 'L'; });
            g += '<path clip-path="url(#' + id + ')" d="' + d + '" fill="none" stroke="' + s.c + '" stroke-width="' + (s.w || 2) + '"' + (s.dash ? ' stroke-dasharray="' + s.dash + '"' : '') + '/>'; });
          (o.pts || []).forEach(function (p) { g += '<circle cx="' + n1(sx(p.x)) + '" cy="' + n1(sy(Math.min(p.y, y1))) + '" r="5" fill="' + p.c + '"/>' + (p.n ? tx(sx(p.x) + 8, sy(Math.min(p.y, y1)) - 6, p.n, 10, p.c, 'start') : ''); });
          var lx = L + 8, ly = T + 2; S.forEach(function (s) { if (!s.n) return; g += ln(lx, ly, lx + 16, ly, s.c, 2.5, s.dash ? 'stroke-dasharray="' + s.dash + '"' : '') + tx(lx + 20, ly + 4, s.n, 9.5, 'currentColor', 'start'); lx += 34 + s.n.length * 10.5; if (lx > W - 120) { lx = L + 8; ly += 15; } });
          return svgw('0 0 ' + W + ' ' + H, g); }
        function rexp(m) { return -Math.log(1 - Math.random()) * m; }

        var _sl = slider; slider = function (root, lab, min, max, step, val, fmt, k, cb) { var u = _sl(root, lab, min, max, step, val, fmt, k, cb); var b = root.lastChild && root.lastChild.querySelector('b'); if (b) b.textContent = fmt(val); return u; };
        var BL = '#3a6ea5', OR = '#e07a2f', GR = '#2e9e5b', RD = '#e0505a', PU = '#8e5bd1', GY = '#7a8590', TL = '#2a9d8f';
        function info(root) { var p = el('div', 'margin-top:8px;padding:10px 12px;border-radius:8px;background:var(--accent-soft);line-height:1.7;font-size:0.93em'); root.appendChild(p); return p; }
        function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
        function fx(v, d) { d = d === undefined ? 1 : d; return (Math.round(v * Math.pow(10, d)) / Math.pow(10, d)).toFixed(d); }
        function copyText(t, b) { function ok() { var o = b.textContent; b.textContent = '✓ 已複製'; setTimeout(function () { b.textContent = o; }, 1500); }
          if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(ok, fb); else fb();
          function fb() { var ta = document.createElement('textarea'); ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); ok(); } catch (e) {} document.body.removeChild(ta); } }
        function pre(txt) { return '<pre style="white-space:pre-wrap;word-break:break-word;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-size:0.82em;line-height:1.5;max-height:420px;overflow:auto;margin:6px 0">' + esc(txt) + '</pre>'; }
        var RC = { read: GR, write: OR, ext: RD }, SRC = { self: ['自製範本', BL], official: ['官方', PU], community: ['社群', TL] };
        function badge(t, c) { return '<span style="display:inline-block;font-size:0.78em;padding:1px 8px;border-radius:10px;margin:2px 4px 2px 0;background:' + c + ';color:#fff">' + t + '</span>'; }
        function lk(n) { return n ? ' <a hr' + 'ef="lesson-' + (n < 10 ? '0' : '') + n + '.html">第 ' + n + ' 課</a>' : ''; }

        /* ---------- 收藏庫 ---------- */
        function initGallery(root, cfg) {
          head(root, cfg.q); var items = cfg.items, CN = {}, cat = 'all', src = 'all', rk = 'all', qs = '', sel = cfg.single ? items[0].id : null, grid, det;
          cfg.cats.forEach(function (c) { CN[c[0]] = c[1]; });
          if (!cfg.single) {
            var b1 = el('div'); root.appendChild(b1); [['全部', 'all']].concat(cfg.cats).forEach(function (c) { var x = btn(c[1], c[0]); x.onclick = function () { cat = c[0]; mark(b1, cat); draw(); }; b1.appendChild(x); }); mark(b1, cat);
            var b2 = el('div'); root.appendChild(b2); [['全部來源', 'all'], ['自製範本', 'self'], ['官方', 'official'], ['社群', 'community']].forEach(function (c) { var x = btn(c[0], c[1]); x.onclick = function () { src = c[1]; mark(b2, src); draw(); }; b2.appendChild(x); }); mark(b2, src);
            var b3 = el('div'); root.appendChild(b3); [['全部風險', 'all'], ['唯讀', 'read'], ['會修改檔案', 'write'], ['會對外操作', 'ext']].forEach(function (c) { var x = btn(c[0], c[1]); x.onclick = function () { rk = c[1]; mark(b3, rk); draw(); }; b3.appendChild(x); }); mark(b3, rk);
            var inp = document.createElement('input'); inp.type = 'search'; inp.placeholder = '搜尋名稱或說明…'; inp.style.cssText = 'width:100%;box-sizing:border-box;margin:8px 0;padding:6px 10px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);font:inherit';
            inp.addEventListener('input', function () { qs = inp.value.trim().toLowerCase(); draw(); }); root.appendChild(inp);
          }
          grid = el('div', 'display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;margin-top:6px'); det = el('div', 'margin-top:10px');
          if (!cfg.single || items.length > 1) root.appendChild(grid); root.appendChild(det);
          function vis(s) { return (cat === 'all' || s.cat === cat) && (src === 'all' || s.src === src) && (rk === 'all' || s.risk === rk) && (!qs || (s.id + s.title + s.desc).toLowerCase().indexOf(qs) >= 0); }
          function draw() { grid.innerHTML = ''; var n = 0;
            items.forEach(function (s) { if (!vis(s)) return; n++; var c = el('div', 'cursor:pointer;border:1px solid ' + (sel === s.id ? 'var(--accent)' : 'var(--border)') + ';border-radius:10px;padding:8px 10px;background:var(--surface);' + (sel === s.id ? 'box-shadow:0 0 0 2px var(--accent-soft)' : ''));
              c.innerHTML = '<div style="font-weight:bold">' + esc(s.title) + '</div><div style="font-family:ui-monospace,monospace;font-size:0.8em;color:var(--text-muted)">' + esc(s.id) + '</div>' + badge(CN[s.cat], GY) + badge(cfg.risk[s.risk], RC[s.risk]) + badge(SRC[s.src][0], SRC[s.src][1]);
              c.onclick = function () { sel = s.id; draw(); det.scrollIntoView && det.scrollIntoView({ block: 'nearest' }); }; grid.appendChild(c); });
            if (!cfg.single) grid.insertAdjacentHTML('afterbegin', '<div style="grid-column:1/-1;font-size:0.88em;color:var(--text-muted)">共 ' + n + ' 個（點卡片看內容）</div>');
            var s = items.filter(function (x) { return x.id === sel; })[0]; det.innerHTML = ''; if (!s) return;
            var h = '<div style="border:1px solid var(--border);border-radius:10px;padding:10px 12px"><div style="font-size:1.05em;font-weight:bold">' + esc(s.title) + '　<code>' + esc(s.id) + '</code></div>' + badge(CN[s.cat], GY) + badge(cfg.risk[s.risk], RC[s.risk]) + badge(SRC[s.src][0], SRC[s.src][1]) +
              '<p style="margin:6px 0">' + esc(s.desc) + lk(s.lesson) + '</p>';
            if (s.md) { h += '<div style="font-size:0.85em;color:var(--text-muted)">放置位置：Claude Code <code>.claude/skills/' + s.id + '/SKILL.md</code>（專案）或 <code>~/.claude/skills/' + s.id + '/SKILL.md</code>（個人）；Codex <code>.agents/skills/' + s.id + '/SKILL.md</code>（專案）或 <code>~/.agents/skills/' + s.id + '/SKILL.md</code>（個人）。</div>'; }
            else { h += '<div style="font-size:0.9em">來源：' + esc(s.who) + '　<a hr' + 'ef="' + esc(s.url) + '" target="_blank" rel="noopener">' + esc(s.url) + '</a><br>安裝：<code>' + esc(s.install) + '</code><br><span style="color:var(--text-muted)">外部 Skill 只附說明與連結，請到原始碼庫閱讀完整內容，安裝前先做第 40 課的安全審核。</span></div>'; }
            h += '</div>'; det.innerHTML = h;
            if (s.md) { var bx = det.firstChild, cb = btn('📋 複製 SKILL.md'); cb.onclick = function () { copyText(s.md, cb); }; bx.appendChild(cb); bx.insertAdjacentHTML('beforeend', pre(s.md)); } }
          draw();
        }

        /* ---------- Skill 產生器 ---------- */
        function initGen(root, cfg) {
          head(root, cfg.q); var F = {}, out = el('div'), inf;
          function field(k, lab, ph, area, val) { var l = el('label', 'display:block;margin:6px 0 2px;font-size:0.9em', lab); root.appendChild(l); var e = document.createElement(area ? 'textarea' : 'input'); if (area) e.rows = area; e.placeholder = ph; e.value = val || '';
            e.style.cssText = 'width:100%;box-sizing:border-box;padding:6px 8px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);font:inherit;font-size:0.9em'; e.addEventListener('input', draw); root.appendChild(e); F[k] = e; }
          field('name', '名稱（英文小寫、數字、連字號）', 'weekly-report', 0, 'weekly-report');
          field('what', '做什麼（一句話）', 'Write the weekly status report from merged PRs and closed issues', 0, 'Write the weekly status report from merged pull requests and closed issues');
          field('when', '什麼時候使用', 'the user asks for a weekly report or status update', 0, 'the user asks for a weekly report, status update, or "what did we ship"');
          field('not', '什麼時候不要用（選填）', 'a single PR summary', 0, 'summarizing a single pull request');
          field('steps', '步驟（每行一步）', '', 4, 'List pull requests merged in the last 7 days\nList issues closed in the last 7 days\nGroup items by project area\nWrite highlights, risks, and next week plans');
          field('done', '完成的條件（每行一項）', '', 2, 'Every merged PR appears in exactly one group\nNo item is invented; each links to its source');
          field('never', '絕對不要做（每行一項）', '', 2, 'Post the report anywhere without approval');
          var plat = 'both', manual = false, fork = false;
          var pb = el('div'); root.appendChild(pb); [['通用（Claude Code 與 Codex）', 'both'], ['只給 Claude Code', 'cc']].forEach(function (p) { var x = btn(p[0], p[1]); x.onclick = function () { plat = p[1]; mark(pb, plat); draw(); }; pb.appendChild(x); }); mark(pb, plat);
          var ob = el('div', 'font-size:0.9em;margin-top:4px'); root.appendChild(ob);
          function chk(lab, cb) { var l = el('label', 'margin-right:14px;cursor:pointer'); var c = document.createElement('input'); c.type = 'checkbox'; c.onchange = function () { cb(c.checked); draw(); }; l.appendChild(c); l.appendChild(document.createTextNode(' ' + lab)); ob.appendChild(l); }
          chk('只允許手動呼叫（disable-model-invocation）', function (v) { manual = v; }); chk('在子代理中執行（context: fork）', function (v) { fork = v; });
          root.appendChild(out); inf = info(root);
          function lines(e) { return e.value.split('\n').map(function (s) { return s.trim(); }).filter(function (s) { return s; }); }
          function draw() { var nm = F.name.value.trim(), d = F.what.value.trim().replace(/\.$/, '') + '. Use when ' + F.when.value.trim().replace(/\.$/, '') + '.' + (F.not.value.trim() ? ' Do not use for ' + F.not.value.trim().replace(/\.$/, '') + '.' : '');
            var fm = '---\nname: ' + nm + '\ndescription: ' + d + '\n'; if (plat === 'cc') { if (manual) fm += 'disable-model-invocation: true\n'; if (fork) fm += 'context: fork\n'; } fm += '---\n';
            var title = nm.split('-').map(function (w) { return w ? w[0].toUpperCase() + w.slice(1) : w; }).join(' ');
            var md = fm + '\n# ' + title + '\n\n## Steps\n' + lines(F.steps).map(function (s, i) { return (i + 1) + '. ' + s; }).join('\n') + '\n';
            if (lines(F.done).length) md += '\n## Done when\n' + lines(F.done).map(function (s) { return '- ' + s; }).join('\n') + '\n';
            if (lines(F.never).length) md += '\n## Never\n' + lines(F.never).map(function (s) { return '- ' + s; }).join('\n') + '\n';
            out.innerHTML = ''; var cb = btn('📋 複製 SKILL.md'); cb.onclick = function () { copyText(md, cb); }; out.appendChild(cb); out.insertAdjacentHTML('beforeend', pre(md));
            var w = []; if (!/^[a-z0-9]+(-[a-z0-9]+)*$/.test(nm)) w.push('名稱只能用小寫英文字母、數字與單一連字號，且不能以連字號開頭或結尾。'); if (nm.length > 64) w.push('名稱超過 64 個字元。');
            if (d.length > 1024) w.push('描述超過 1,024 個字元（開放規格的上限）。'); if (F.when.value.trim().length < 15) w.push('「什麼時候使用」太短，模型可能不知道何時該載入。'); if (!lines(F.done).length) w.push('沒有寫完成條件，代理很容易「說做完了其實沒做完」（第 30 課）。');
            inf.innerHTML = '放置位置：' + (plat === 'cc' ? 'Claude Code <code>.claude/skills/' + nm + '/SKILL.md</code>' : 'Claude Code <code>.claude/skills/' + nm + '/SKILL.md</code>；Codex <code>.agents/skills/' + nm + '/SKILL.md</code>') + '。描述長度 ' + d.length + ' 字元。<br>' +
              (w.length ? '⚠️ ' + w.join('<br>⚠️ ') : '✅ 格式檢查通過。') + (plat === 'cc' && (manual || fork) ? '<br><span style="color:var(--text-muted)">disable-model-invocation 與 context 是 Claude Code 的擴充欄位；上傳到 Claude 網頁版或 API 時不允許這些欄位（第 11 課）。</span>' : ''); }
          draw();
        }

        /* ---------- 觸發模擬 ---------- */
        function initTrigger(root, cfg) {
          head(root, cfg.q); var inp = document.createElement('input'); inp.type = 'text'; inp.value = cfg.ex[0];
          inp.style.cssText = 'width:100%;box-sizing:border-box;padding:6px 10px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);font:inherit;margin:4px 0'; root.appendChild(inp);
          var eb = el('div'); root.appendChild(eb); cfg.ex.forEach(function (e) { var b = btn(e.length > 16 ? e.slice(0, 16) + '…' : e); b.onclick = function () { inp.value = e; draw(); }; eb.appendChild(b); });
          var v = el('div'), inf; root.appendChild(v); inf = info(root); inp.addEventListener('input', draw);
          function grams(s) { s = s.toLowerCase(); var g = {}, i, w = s.match(/[a-z0-9]+/g) || []; w.forEach(function (x) { if (x.length > 2) g[x] = 1; }); var c = s.replace(/[a-z0-9\s，。、；：！？「」（）,.;:!?()]/g, ''); for (i = 0; i < c.length - 1; i++) g[c.substr(i, 2)] = 1; return g; }
          function draw() { var q = grams(inp.value), sc = cfg.items.map(function (it) { var pos = grams(it[1]), neg = grams(it[2] || ''), s = 0, n = 0, k; for (k in q) { n++; if (pos[k]) s += 1; if (neg[k]) s -= 1.5; } return [n ? s / Math.sqrt(n) : 0, it]; }).sort(function (a, b) { return b[0] - a[0]; });
            var mx = Math.max(0.01, sc[0][0]), h = '';
            sc.forEach(function (x, i) { var w = Math.max(0, x[0]) / mx * 100, on = i === 0 && x[0] > 0.35; h += '<div style="margin:4px 0"><div style="font-size:0.88em"><code>' + x[1][0] + '</code>' + (on ? ' ← 最可能被載入' : '') + '</div><div style="height:10px;border-radius:5px;background:var(--border)"><div style="height:10px;border-radius:5px;width:' + fx(w, 0) + '%;background:' + (on ? GR : BL) + '"></div></div></div>'; });
            v.innerHTML = h;
            inf.innerHTML = (sc[0][0] > 0.35 ? '最相符的是 <b>' + sc[0][1][0] + '</b>：「' + sc[0][1][1] + '」' : '沒有任何描述明顯相符：模型可能不會自動載入任何 Skill。') +
              '<br><span style="color:var(--text-muted)">這是用「共同字詞」做的簡化示範；真正的模型是讀懂語意後判斷，但道理相同：描述裡要寫出使用者實際會說的話，也要寫清楚「不要用於」的情況（第 5 課）。</span>'; }
          draw();
        }

        /* ---------- 依序 vs 平行 ---------- */
        function initOrch(root, cfg) {
          head(root, cfg.q); var n = 8, t = 6, k = 4, dep = 0, ctx = 30, task = 15, price = 5, seed = 3, v = el('div'), inf;
          slider(root, '子任務數量', 1, 24, 1, n, function (x) { return x + ' 個'; }, 'n', function (x) { n = x; draw(); });
          slider(root, '每個子任務平均時間（分鐘）', 1, 30, 1, t, function (x) { return x + ' 分'; }, 't', function (x) { t = x; draw(); });
          slider(root, '同時執行的代理數', 1, 10, 1, k, function (x) { return x + ' 個'; }, 'k', function (x) { k = x; draw(); });
          slider(root, '必須依序做的子任務比例', 0, 100, 5, dep, function (x) { return x + '%'; }, 'd', function (x) { dep = x; draw(); });
          slider(root, '每個代理開工前要讀的共同背景（千 token）', 1, 150, 1, ctx, function (x) { return x + 'k'; }, 'c', function (x) { ctx = x; draw(); });
          slider(root, '每個子任務本身的工作量（千 token）', 1, 100, 1, task, function (x) { return x + 'k'; }, 'w', function (x) { task = x; draw(); });
          root.appendChild(v); inf = info(root);
          function rng(s) { return function () { s = (s * 16807) % 2147483647; return s / 2147483647; }; }
          function draw() { var r = rng(seed * 97 + n), d = [], i; for (i = 0; i < n; i++) d.push(t * (0.5 + r())); var nd = Math.round(n * dep / 100), ind = n - nd;
            var seqT = d.reduce(function (a, b) { return a + b; }, 0), lanes = []; for (i = 0; i < k; i++) lanes.push(0); var blocks = [], cur = 0;
            for (i = 0; i < nd; i++) { blocks.push([0, cur, d[i], i]); cur += d[i]; } var st = cur; for (i = 0; i < k; i++) lanes[i] = st;
            for (i = nd; i < n; i++) { var j = lanes.indexOf(Math.min.apply(null, lanes)); blocks.push([j, lanes[j], d[i], i]); lanes[j] += d[i]; }
            var merge = ind > 1 ? 1 + 0.15 * Math.min(k, ind) * t / 6 : 0, parT = Math.max.apply(null, lanes) + merge, used = Math.min(k, Math.max(1, ind));
            var seqTok = ctx + n * task, parTok = ctx + (ind > 1 ? used * ctx : 0) + n * task + (ind > 1 ? ind * 2 : 0);
            var W = 680, L = 70, sx = (W - L - 10) / Math.max(seqT, parT), g = '', cols = [BL, OR, PU, TL, GR, RD, '#c9a227', '#d6457a', GY, '#5b6ea8'];
            g += tx(L - 6, 24, '依序（1 個）', 10, 'currentColor', 'end'); var x = L; d.forEach(function (dd, i) { g += '<rect x="' + n1(x) + '" y="14" width="' + n1(dd * sx - 1) + '" height="16" fill="' + cols[i % 10] + '" fill-opacity="0.75"/>'; x += dd * sx; });
            for (i = 0; i < Math.max(1, used); i++) g += tx(L - 6, 58 + i * 20, '代理 ' + (i + 1), 10, 'currentColor', 'end');
            blocks.forEach(function (b) { g += '<rect x="' + n1(L + b[1] * sx) + '" y="' + (48 + b[0] * 20) + '" width="' + n1(b[2] * sx - 1) + '" height="16" fill="' + cols[b[3] % 10] + '" fill-opacity="0.75"/>'; });
            if (merge) g += '<rect x="' + n1(L + (parT - merge) * sx) + '" y="48" width="' + n1(merge * sx) + '" height="' + (used * 20 - 4) + '" fill="' + GY + '" fill-opacity="0.35"/>' + tx(L + (parT - merge / 2) * sx, 44, '彙整', 9, GY);
            var H = 56 + Math.max(1, used) * 20; g += tx(L, H + 10, '0', 9, 'var(--text-muted)', 'start') + tx(W - 10, H + 10, fx(Math.max(seqT, parT), 0) + ' 分', 9, 'var(--text-muted)', 'end');
            v.innerHTML = svgw('0 0 ' + W + ' ' + (H + 16), g);
            inf.innerHTML = '依序：約 <b>' + fx(seqT, 0) + ' 分鐘</b>、' + fx(seqTok, 0) + 'k token；平行（' + k + ' 個代理）：約 <b>' + fx(parT, 0) + ' 分鐘</b>、' + fx(parTok, 0) + 'k token。<br>' +
              '時間縮短為 <b>' + fx(parT / seqT * 100, 0) + '%</b>，token 用量變成 <b>' + fx(parTok / seqTok, 2) + ' 倍</b>：每個子代理都要重新讀一次共同背景，最後還要花時間彙整。' +
              (dep >= 50 ? '<br>大部分任務必須依序做時，平行幾乎沒有好處。' : '') + (ctx > task * 2 ? '<br>共同背景比子任務本身大很多：平行的「重讀成本」偏高，可以考慮縮短交給子代理的背景，只給它需要的部分（第 23 課）。' : ''); }
          draw();
        }

        /* ---------- 自主迴圈 ---------- */
        function initLoop(root, cfg) {
          head(root, cfg.q); var p = 40, fp = 20, mx = 5, ver = 1, v = el('div'), inf;
          var vb = el('div'); root.appendChild(vb); [['每次嘗試後驗證', 1], ['不驗證，做一次就宣布完成', 0]].forEach(function (s) { var b = btn(s[0], s[1]); b.onclick = function () { ver = s[1]; mark(vb, ver); draw(); }; vb.appendChild(b); }); mark(vb, ver);
          slider(root, '每次嘗試真正成功的機率', 5, 95, 5, p, function (x) { return x + '%'; }, 'p', function (x) { p = x; draw(); });
          slider(root, '驗證「放水」的機率（失敗卻判定通過）', 0, 60, 5, fp, function (x) { return x + '%'; }, 'f', function (x) { fp = x; draw(); });
          slider(root, '最多嘗試幾次就停下來找人', 1, 15, 1, mx, function (x) { return x + ' 次'; }, 'm', function (x) { mx = x; draw(); });
          root.appendChild(v); inf = info(root);
          function draw() { var N = 2000, ok = 0, bad = 0, esc = 0, tries = 0, s = 12345; function r() { s = (s * 16807) % 2147483647; return s / 2147483647; }
            for (var i = 0; i < N; i++) { var a = 0, fin = false; while (a < (ver ? mx : 1)) { a++; var succ = r() < p / 100; if (!ver) { if (succ) ok++; else bad++; fin = true; break; } if (succ) { ok++; fin = true; break; } if (r() < fp / 100) { bad++; fin = true; break; } } if (!fin) esc++; tries += a; }
            var W = 680, g = '', x = 10, segs = [[ok, GR, '真的完成'], [bad, RD, '宣布完成但其實是錯的'], [esc, OR, '達到上限，停下來找人']];
            segs.forEach(function (sg) { var w = sg[0] / N * (W - 20); if (w > 0) g += '<rect x="' + n1(x) + '" y="10" width="' + n1(w) + '" height="34" fill="' + sg[1] + '"/>' + (w > 60 ? tx(x + w / 2, 32, fx(sg[0] / N * 100, 0) + '%', 12, '#fff') : ''); x += w; });
            var lx = 10; segs.forEach(function (sg) { g += '<rect x="' + lx + '" y="54" width="12" height="12" fill="' + sg[1] + '"/>' + tx(lx + 16, 64, sg[2], 10.5, 'currentColor', 'start'); lx += 210; });
            v.innerHTML = svgw('0 0 ' + W + ' 74', g);
            inf.innerHTML = '模擬 2,000 個任務：真的完成 <b>' + fx(ok / N * 100, 1) + '%</b>、<span style="color:' + RD + '">宣布完成卻是錯的 <b>' + fx(bad / N * 100, 1) + '%</b></span>、停下來找人 ' + fx(esc / N * 100, 1) + '%；平均嘗試 ' + fx(tries / N, 1) + ' 次。<br>' +
              '最危險的是紅色：使用者以為做完了。驗證越嚴格（放水機率越低），紅色越少；重試上限讓做不到的任務及時交回給人，而不是無限迴圈（第 30、31 課）。'; }
          draw();
        }

        /* ---------- 漸進式載入 ---------- */
        function initDisc(root, cfg) {
          head(root, cfg.q); var ns = 40, dt = 80, bt = 3000, use = 2, win = 200, v = el('div'), inf;
          slider(root, '安裝的 Skill 數量', 1, 200, 1, ns, function (x) { return x + ' 個'; }, 'n', function (x) { ns = x; draw(); });
          slider(root, '每個描述平均長度（token）', 20, 400, 10, dt, function (x) { return x; }, 'd', function (x) { dt = x; draw(); });
          slider(root, '每個 SKILL.md 全文平均長度（token）', 300, 8000, 100, bt, function (x) { return x; }, 'b', function (x) { bt = x; draw(); });
          slider(root, '這次任務實際用到幾個 Skill', 0, 6, 1, use, function (x) { return x + ' 個'; }, 'u', function (x) { use = x; draw(); });
          slider(root, '上下文視窗大小（千 token）', 32, 1000, 8, win, function (x) { return x + 'k'; }, 'w', function (x) { win = x; draw(); });
          root.appendChild(v); inf = info(root);
          function draw() { var prog = ns * dt + use * bt, all = ns * (dt + bt), W = 680, g = '', cap = win * 1000, mxv = Math.max(all, cap);
            function bar(y, val, c, lab) { var w = Math.min(val, mxv) / mxv * (W - 300); return tx(10, y + 15, lab, 11, 'currentColor', 'start') + '<rect x="180" y="' + y + '" width="' + n1(w) + '" height="20" fill="' + c + '" fill-opacity="0.8"/>' + tx(186 + w, y + 15, Math.round(val / 1000) + 'k（' + fx(val / cap * 100, 0) + '%）', 10, 'currentColor', 'start'); }
            g += bar(10, prog, GR, '漸進式載入') + bar(40, all, RD, '全部一次載入') + bar(70, cap, GY, '上下文視窗');
            v.innerHTML = svgw('0 0 ' + W + ' 100', g);
            inf.innerHTML = '漸進式載入：平時只放 ' + ns + ' 個描述（約 ' + Math.round(ns * dt / 1000) + 'k token），用到時才讀 ' + use + ' 份全文。若把全文一次全部載入，需要約 ' + Math.round(all / 1000) + 'k token' + (all > cap ? '，<b>已經超過上下文視窗</b>' : '') + '。<br>' +
              '<span style="color:var(--text-muted)">描述本身也會占空間：裝了上百個 Skill 時，描述就可能吃掉上下文的一大塊，這也是要定期整理、停用少用 Skill 的原因（第 3、42 課）。</span>'; }
          draw();
        }

        var INIT = { gallery: initGallery, gen: initGen, trigger: initTrigger, orch: initOrch, loop: initLoop, disc: initDisc };
        function boot() { document.querySelectorAll('.skl-w').forEach(function (root) { if (root.__done) return; root.__done = 1;
          var cfg = JSON.parse(root.getAttribute('data-cfg')); var fn = INIT[cfg.t]; if (fn) fn(root, cfg); }); }
        if (document.readyState === 'complete') boot(); else window.addEventListener('load', boot);
      })();
      </script>

      <div class="skl-w content-figure" style="text-align:left;max-width:680px;margin-left:auto;margin-right:auto" data-cfg="{&quot;ex&quot;: [&quot;幫我研究一下電動車電池技術的發展&quot;, &quot;把這 200 個檔案的日期格式都改掉&quot;, &quot;這個測試一直失敗，幫我找原因&quot;, &quot;幫我寫這次的 commit 訊息&quot;, &quot;幫我寫一封生日卡片&quot;], &quot;items&quot;: [[&quot;parallel-research&quot;, &quot;把大範圍的研究問題拆成子問題平行調查，整合成附來源的報告。使用時機：需要深入研究、比較、調查、整理發展現況&quot;, &quot;單一事實查詢&quot;], [&quot;batch-process&quot;, &quot;把同一個修改套用到大量檔案，分批平行處理再檢查一致性。使用時機：上百個檔案都要改、格式轉換、大量重新命名&quot;, &quot;只改少數檔案&quot;], [&quot;systematic-debug&quot;, &quot;系統化找出錯誤的根本原因：重現、假設、逐一驗證、修正並加測試。使用時機：程式失敗、測試失敗、當掉、輸出錯誤、找原因&quot;, &quot;&quot;], [&quot;commit-message&quot;, &quot;根據已暫存的變更寫 commit 訊息，遵循專案慣例。使用時機：要寫提交訊息、準備 commit&quot;, &quot;&quot;], [&quot;pr-babysitter&quot;, &quot;讓 PR 走到可以合併：修 CI 失敗、處理審查意見。使用時機：看守 PR、讓 PR 通過、CI 失敗&quot;, &quot;自動合併&quot;], [&quot;meeting-notes&quot;, &quot;把會議逐字稿整理成決議、待辦與未決問題。使用時機：整理會議紀錄、逐字稿&quot;, &quot;&quot;]], &quot;t&quot;: &quot;trigger&quot;, &quot;q&quot;: &quot;輸入一句需求（或點下面的例子），看看哪個 Skill 的描述最相符：&quot;}"></div>
