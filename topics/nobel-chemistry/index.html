<title>諾貝爾化學獎：一百二十五年的完整地圖 ｜ 博雅書院</title>
<meta name="description" content="從一九〇一年到最新年度的諾貝爾化學獎完整整理，與物理獎課程採用相同結構，設計成每年十月可自行擴充。先講清楚規則，以及化學獎獨有的邊界爭議——為什麼越來越多化學獎的得主是生物學家，並建立「做出新東西、看見舊東西、看懂機制」這個貫穿全課的分類法。一九〇一至二〇〇五年以四張大表呈現，每張表後附一課分析：早期如何把化學從配方變成規律、一九一八年哈伯獎的倫理難題、大分子觀念二十年的爭論如何被超離心機終結、化學如何從描述走向預測、以及生物化學與計算化學的接手。二〇〇六年之後每年獨立一課，固定六段格式：得獎者與官方獎項理由、白話解釋、在此之前卡在哪裡、從發現到獲獎的時間差、今天的影響（誠實評估，包含還沒做到的部分）、站上延伸連結。涵蓋螢光蛋白、核糖體、交叉偶聯、準晶、多尺度模型、超解析顯微術、DNA 修復、分子機器、低溫電子顯微術、定向演化、鋰離子電池、基因編輯、有機催化、點擊化學、量子點、蛋白質結構預測與設計、金屬有機骨架。最後橫向分析三種類型各自的典型時間差、領域邊界爭議的雙方論點、遺珠與女性得主的實際數字、科學貢獻與專利發明權的差別，並附上公布當天的判讀流程與新增年度的步驟。">
