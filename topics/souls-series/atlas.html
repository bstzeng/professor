      <script>
      (function () {
        if (window.__nvLib) return; window.__nvLib = 1;

        function btn(t, k) { var b = document.createElement('button'); b.type = 'button'; b.textContent = t; if (k !== undefined) b.setAttribute('data-k', k);
          b.style.cssText = 'padding:4px 10px;margin:4px 6px 0 0;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer;font:inherit;font-size:0.9em'; return b; }
        function mark(bar, k) { bar.querySelectorAll('button').forEach(function (b) { var on = b.getAttribute('data-k') === String(k); b.style.background = on ? 'var(--accent-soft)' : 'var(--surface)'; b.style.fontWeight = on ? 'bold' : 'normal'; }); }
        function head(root, q) { if (q) { var p = document.createElement('p'); p.style.margin = '0 0 8px'; p.innerHTML = q; root.appendChild(p); } }
        function el(tag, css, html) { var e = document.createElement(tag); if (css) e.style.cssText = css; if (html !== undefined) e.innerHTML = html; return e; }
        function n1(v) { return Math.round(v * 10) / 10; }
        function f1(v) { return (Math.round(v * 10) / 10).toString(); }
        function f2(v) { return (Math.round(v * 100) / 100).toString(); }
        function tx(x, y, s, sz, c, anc) { return '<text x="' + n1(x) + '" y="' + n1(y) + '" font-size="' + sz + '" fill="' + (c || 'currentColor') + '" text-anchor="' + (anc || 'middle') + '">' + s + '</text>'; }
        function ln(x1, y1, x2, y2, c, w, ex) { return '<line x1="' + n1(x1) + '" y1="' + n1(y1) + '" x2="' + n1(x2) + '" y2="' + n1(y2) + '" stroke="' + c + '" stroke-width="' + (w || 1) + '" ' + (ex || '') + '/>'; }
        function svgw(vb, inner) { return '<svg viewBox="' + vb + '" style="width:100%;display:block;color:var(--text)">' + inner + '</svg>'; }
        function slider(root, lab, min, max, step, val, fmt, k, cb) { var l = el('label', 'display:block;font-size:0.88em;margin-top:6px', lab + '：<b></b>'); var s = document.createElement('input');
          s.type = 'range'; s.min = min; s.max = max; s.step = step; s.value = val; s.style.cssText = 'width:100%;display:block'; if (k) s.setAttribute('data-k', k); l.appendChild(s); root.appendChild(l);
          function u() { l.querySelector('b').textContent = fmt(+s.value); cb(+s.value); } s.addEventListener('input', u); return u; }
        function nice(lo, hi, n) { var span = hi - lo || 1, st = Math.pow(10, Math.floor(Math.log10(span / n))), e = span / n / st; st *= e >= 5 ? 5 : e >= 2 ? 2 : 1; var t = [], v = Math.ceil(lo / st - 1e-9) * st; for (; v <= hi + 1e-9; v += st) t.push(Math.round(v / st) * st); return t; }
        function fmtT(v) { var a = Math.abs(v); return a >= 1e6 ? f1(v / 1e6) + 'M' : a >= 1e4 ? f1(v / 1e3) + 'k' : (Math.round(v * 100) / 100).toString(); }
        var CID = 0;
        function chart(W, H, S, o) { o = o || {}; var L = 48, R = 12, T = 22, B = 34, xs = [], ys = [];
          S.forEach(function (s) { s.d.forEach(function (p) { xs.push(p[0]); if (isFinite(p[1])) ys.push(p[1]); }); });
          var x0 = o.x0 !== undefined ? o.x0 : Math.min.apply(null, xs), x1 = o.x1 !== undefined ? o.x1 : Math.max.apply(null, xs);
          var y0 = o.y0 !== undefined ? o.y0 : Math.min(0, Math.min.apply(null, ys)), y1 = o.y1 !== undefined ? o.y1 : Math.max.apply(null, ys) * 1.08 || 1;
          function sx(v) { return L + (v - x0) / (x1 - x0 || 1) * (W - L - R); } function sy(v) { return H - B - (v - y0) / (y1 - y0 || 1) * (H - T - B); }
          var id = 'qc' + (++CID), g = '<clipPath id="' + id + '"><rect x="' + L + '" y="' + (T - 2) + '" width="' + (W - L - R) + '" height="' + (H - T - B + 4) + '"/></clipPath>';
          nice(y0, y1, 4).forEach(function (v) { g += ln(L, sy(v), W - R, sy(v), 'var(--border)', 0.6, 'stroke-dasharray="2 3"') + tx(L - 5, sy(v) + 3, fmtT(v), 9, 'var(--text-muted)', 'end'); });
          nice(x0, x1, 6).forEach(function (v) { g += tx(sx(v), H - B + 14, fmtT(v), 9, 'var(--text-muted)'); });
          g += ln(L, T - 4, L, H - B, '#999') + ln(L, H - B, W - R, H - B, '#999');
          if (o.xl) g += tx((L + W - R) / 2, H - 4, o.xl, 9.5, 'var(--text-muted)');
          if (o.yl) g += tx(L - 40, T - 8, o.yl, 9.5, 'var(--text-muted)', 'start');
          (o.hl || []).forEach(function (h) { g += ln(L, sy(h.y), W - R, sy(h.y), h.c, 1, 'stroke-dasharray="5 4"') + tx(W - R - 2, sy(h.y) - 4, h.n, 9, h.c, 'end'); });
          (o.vl || []).forEach(function (h) { g += ln(sx(h.x), T, sx(h.x), H - B, h.c, 1, 'stroke-dasharray="5 4"') + tx(sx(h.x) + 3, H - B - 6, h.n, 9, h.c, 'start'); });
          S.forEach(function (s) { var d = '', m = 'M'; s.d.forEach(function (p) { if (!isFinite(p[1])) { m = 'M'; return; } d += m + n1(sx(p[0])) + ' ' + n1(sy(Math.max(Math.min(p[1], y1 + (y1 - y0)), y0 - (y1 - y0)))); m = 'L'; });
            g += '<path clip-path="url(#' + id + ')" d="' + d + '" fill="none" stroke="' + s.c + '" stroke-width="' + (s.w || 2) + '"' + (s.dash ? ' stroke-dasharray="' + s.dash + '"' : '') + '/>'; });
          (o.pts || []).forEach(function (p) { g += '<circle cx="' + n1(sx(p.x)) + '" cy="' + n1(sy(Math.min(p.y, y1))) + '" r="5" fill="' + p.c + '"/>' + (p.n ? tx(sx(p.x) + 8, sy(Math.min(p.y, y1)) - 6, p.n, 10, p.c, 'start') : ''); });
          var lx = L + 8, ly = T + 2; S.forEach(function (s) { if (!s.n) return; g += ln(lx, ly, lx + 16, ly, s.c, 2.5, s.dash ? 'stroke-dasharray="' + s.dash + '"' : '') + tx(lx + 20, ly + 4, s.n, 9.5, 'currentColor', 'start'); lx += 34 + s.n.length * 10.5; if (lx > W - 120) { lx = L + 8; ly += 15; } });
          return svgw('0 0 ' + W + ' ' + H, g); }
        function rexp(m) { return -Math.log(1 - Math.random()) * m; }

        function esc(s) { return String(s); }
        function wrapText(s, max) { var out = [], cur = ''; for (var i = 0; i < s.length; i++) { cur += s[i]; if (cur.length >= max) { out.push(cur); cur = ''; } } if (cur) out.push(cur); return out; }
        function infoBox() { return el('div', 'margin-top:8px;padding:10px 12px;border-radius:8px;background:var(--accent-soft);min-height:2.6em;line-height:1.6'); }

        /* ---------- 關係圖 ---------- */
        function initGraph(root, cfg) {
          head(root, cfg.q); var H = cfg.h || 360, view = el('div'), info = infoBox(), sel = null; root.appendChild(view); root.appendChild(info);
          var N = {}; cfg.nodes.forEach(function (n) { N[n.id] = n; });
          function draw() { var o = '';
            cfg.edges.forEach(function (e) { var a = N[e[0]], b = N[e[1]], on = sel && (e[0] === sel || e[1] === sel), dim = sel && !on;
              o += ln(a.x, a.y, b.x, b.y, e[3] || '#999', on ? 2.6 : 1.4, (e[4] ? 'stroke-dasharray="5 4" ' : '') + 'opacity="' + (dim ? 0.15 : 0.85) + '"');
              if (e[2] && !dim) { var mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2; o += '<rect x="' + n1(mx - e[2].length * 5.2 - 3) + '" y="' + n1(my - 8) + '" width="' + n1(e[2].length * 10.4 + 6) + '" height="15" rx="3" fill="var(--surface)" opacity="0.92"/>' + tx(mx, my + 3.5, e[2], 9.5, e[3] || 'var(--text-muted)'); } });
            cfg.nodes.forEach(function (n) { var w = Math.max(54, n.label.length * 13 + 16), dim = sel && sel !== n.id && !cfg.edges.some(function (e) { return (e[0] === sel && e[1] === n.id) || (e[1] === sel && e[0] === n.id); });
              o += '<g data-id="' + n.id + '" style="cursor:pointer" opacity="' + (dim ? 0.3 : 1) + '"><rect x="' + n1(n.x - w / 2) + '" y="' + n1(n.y - 14) + '" width="' + n1(w) + '" height="28" rx="14" fill="' + (sel === n.id ? n.c : 'var(--surface)') + '" stroke="' + n.c + '" stroke-width="2"/>' +
                tx(n.x, n.y + 4.5, n.label, 12.5, sel === n.id ? '#fff' : n.c) + '</g>'; });
            view.innerHTML = svgw('0 0 640 ' + H, o);
            view.querySelectorAll('g[data-id]').forEach(function (g) { g.addEventListener('click', function () { var id = g.getAttribute('data-id'); sel = sel === id ? null : id; draw(); show(); }); }); }
          function show() { if (!sel) { info.innerHTML = cfg.hint || '點選任一節點，查看說明並突顯它的關係。'; return; } var n = N[sel], rel = [];
            cfg.edges.forEach(function (e) { if (e[0] === sel && e[2]) rel.push(N[e[1]].label + '（' + e[2] + '）'); else if (e[1] === sel && e[2]) rel.push(N[e[0]].label + '（' + e[2] + '）'); });
            info.innerHTML = '<b style="color:' + n.c + '">' + n.label + (n.en ? ' <span style="font-weight:normal;color:var(--text-muted);font-size:0.9em">' + n.en + '</span>' : '') + '</b>：' + n.d + (rel.length ? '<br><span style="font-size:0.9em;color:var(--text-muted)">關係：' + rel.join('、') + '</span>' : ''); }
          draw(); show();
        }

        /* ---------- 時間軸 ---------- */
        function initTimeline(root, cfg) {
          head(root, cfg.q); var bar = el('div'), list = el('div', 'margin-top:6px;max-height:' + (cfg.mh || 460) + 'px;overflow-y:auto;border:1px solid var(--border);border-radius:8px'), g = 'all'; root.appendChild(bar); root.appendChild(list);
          var groups = cfg.groups || [];
          if (groups.length) { var b0 = btn('全部', 'all'); b0.addEventListener('click', function () { g = 'all'; mark(bar, g); draw(); }); bar.appendChild(b0);
            groups.forEach(function (q) { var b = btn(q[1], q[0]); b.addEventListener('click', function () { g = q[0]; mark(bar, g); draw(); }); bar.appendChild(b); }); mark(bar, 'all'); }
          function col(k) { for (var i = 0; i < groups.length; i++) if (groups[i][0] === k) return groups[i][2]; return '#3a6ea5'; }
          function draw() { list.innerHTML = ''; cfg.ev.forEach(function (e) { if (g !== 'all' && e.g !== g) return; var r = el('div', 'display:flex;gap:10px;padding:8px 10px;border-bottom:1px solid var(--border);cursor:pointer'),
              y = el('div', 'flex:0 0 ' + (cfg.yw || 84) + 'px;font-weight:bold;color:' + col(e.g) + ';font-size:0.9em', e.y), body = el('div', 'flex:1'), t = el('div', '', e.t), d = el('div', 'display:none;margin-top:4px;font-size:0.92em;color:var(--text-muted);line-height:1.6', e.d);
              body.appendChild(t); body.appendChild(d); r.appendChild(y); r.appendChild(body); list.appendChild(r);
              r.addEventListener('click', function () { d.style.display = d.style.display === 'none' ? 'block' : 'none'; }); }); }
          draw(); var p = el('p', 'margin:6px 0 0;font-size:0.85em;color:var(--text-muted)', '點一下任一列可展開說明。'); root.appendChild(p);
        }

        /* ---------- 閱讀順序 ---------- */
        function initOrder(root, cfg) {
          head(root, cfg.q); var bar = el('div'), list = el('div', 'margin-top:8px'), info = el('p', 'margin:6px 0 0;font-size:0.92em'), keys = Object.keys(cfg.orders); root.appendChild(bar); root.appendChild(list); root.appendChild(info);
          keys.forEach(function (k, i) { var b = btn(k, i); b.addEventListener('click', function () { mark(bar, i); draw(k); }); bar.appendChild(b); });
          function draw(k) { list.innerHTML = ''; cfg.orders[k].forEach(function (t, i) { var b = cfg.books[t] || {}, r = el('div', 'display:flex;gap:10px;align-items:flex-start;padding:7px 10px;margin:4px 0;border-radius:8px;border:1px solid var(--border);border-left:5px solid ' + (b.c || '#3a6ea5'));
              r.appendChild(el('div', 'flex:0 0 26px;font-weight:bold;font-size:1.1em;color:' + (b.c || '#3a6ea5'), String(i + 1)));
              r.appendChild(el('div', 'flex:1', '<b>' + t + '</b>' + (b.y ? ' <span style="color:var(--text-muted);font-size:0.88em">（' + b.y + '）</span>' : '') + (b.d ? '<div style="font-size:0.9em;color:var(--text-muted);margin-top:2px">' + b.d + '</div>' : '')));
              list.appendChild(r); }); info.innerHTML = (cfg.notes || {})[k] || ''; }
          mark(bar, 0); draw(keys[0]);
        }

        /* ---------- 角色卡 ---------- */
        function initCards(root, cfg) {
          head(root, cfg.q); var bar = el('div'), search = el('input', 'width:100%;box-sizing:border-box;margin-top:6px;padding:6px 10px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);font:inherit'),
            grid = el('div', 'display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px;margin-top:8px'), g = 'all', groups = cfg.groups || [];
          search.placeholder = '搜尋名字或關鍵字…'; root.appendChild(bar); root.appendChild(search); root.appendChild(grid);
          var b0 = btn('全部', 'all'); b0.addEventListener('click', function () { g = 'all'; mark(bar, g); draw(); }); bar.appendChild(b0);
          groups.forEach(function (q) { var b = btn(q[1], q[0]); b.addEventListener('click', function () { g = q[0]; mark(bar, g); draw(); }); bar.appendChild(b); }); mark(bar, 'all');
          search.addEventListener('input', draw);
          function col(k) { for (var i = 0; i < groups.length; i++) if (groups[i][0] === k) return groups[i][2]; return '#3a6ea5'; }
          function draw() { var s = search.value.trim(); grid.innerHTML = ''; var n = 0; cfg.cards.forEach(function (c) { if (g !== 'all' && c.g !== g) return; if (s && (c.n + (c.en || '') + c.d).indexOf(s) < 0) return; n++;
              grid.appendChild(el('div', 'padding:8px 10px;border-radius:8px;border:1px solid var(--border);border-top:4px solid ' + col(c.g) + ';font-size:0.9em;line-height:1.55',
                '<b style="font-size:1.05em">' + c.n + '</b>' + (c.en ? '<div style="color:var(--text-muted);font-size:0.85em">' + c.en + '</div>' : '') + '<div style="margin-top:4px">' + c.d + '</div>')); });
            if (!n) grid.appendChild(el('div', 'color:var(--text-muted)', '找不到符合的角色。')); }
          draw();
        }

        /* ---------- 地圖 ---------- */
        function initMap(root, cfg) {
          head(root, cfg.q); var H = cfg.h || 400, view = el('div'), info = infoBox(), sel = -1; root.appendChild(view); root.appendChild(info);
          function draw() { var o = cfg.bg || ''; cfg.pts.forEach(function (p, i) { var on = i === sel;
              o += '<g data-i="' + i + '" style="cursor:pointer"><circle cx="' + p.x + '" cy="' + p.y + '" r="' + (on ? 8 : 6) + '" fill="' + (p.c || '#e0605a') + '" stroke="#fff" stroke-width="1.5"/>' +
                tx(p.x + (p.a === 'end' ? -10 : p.a === 'middle' ? 0 : 10), p.y + (p.a === 'middle' ? -11 : 4), p.n, on ? 12 : 11, on ? (p.c || '#e0605a') : 'var(--text)', p.a || 'start') + '</g>'; });
            view.innerHTML = svgw('0 0 640 ' + H, o);

          draw(); info.innerHTML = cfg.hint || '點選地圖上的地點查看說明。（示意圖，非精確比例）';
        }


        /* ---------- 心理史學：人越多越好預測 ---------- */
        function initCrowd(root, cfg) {
          head(root, cfg.q); var N = 10, view = el('div'), bar = el('div'), info = el('p', 'margin:6px 0 0'); root.appendChild(view); root.appendChild(bar);
          var b = btn('🎲 重跑 12 個平行宇宙', 'go'); b.addEventListener('click', draw); bar.appendChild(b);
          var u = slider(root, '人口數', 0, 6, 1, 1, function (v) { return Math.round(Math.pow(10, v)).toLocaleString() + ' 人'; }, 'N', function (v) { N = Math.round(Math.pow(10, v)); draw(); }); root.appendChild(info);
          function draw() { var S = [], ends = [], T = 50; for (var r = 0; r < 12; r++) { var d = [], p = 0.5;

            S.push({ d: [[0, 30], [T, 70]], c: '#d0564f', n: '心理史學的預測', w: 2.2, dash: '6 4' });

            var mn = Math.min.apply(null, ends), mx = Math.max.apply(null, ends);

              (N < 100 ? '人太少，每個宇宙的走向都不一樣，無法預測。' : N < 100000 ? '人越多，曲線越貼近紅線。' : '幾乎完全重合——個人無法預測，群體卻像物理定律一樣精確。這正是謝頓的心理史學想法，也是統計物理的核心。'); }

      })();

ot;s&quot;}, {&quot;y&quot;: &quot;2020&quot;, &quot;t&quot;: &quot;惡魔靈魂（重製版）&quot;, &quot;d&quot;: &quot;由 Bluepoint Games 為 PS5 重製。&lt;a href=\&quot;lesson-07.html\&quot;&gt;第 7 課&lt;/a&gt;&quot;, &quot;g&quot;: &quot;s&quot;}, {&quot;y&quot;: &quot;2022&quot;, &quot;t&quot;: &quot;艾爾登法環&quot;, &quot;d&quot;: &quot;開放世界的魂系，與喬治・R・R・馬汀合作世界觀，獲得 The Game Awards 年度遊戲。&lt;a href=\&quot;lesson-28.html\&quot;&gt;第 28 課&lt;/a&gt;&quot;, &quot;g&quot;: &quot;s&quot;}, {&quot;y&quot;: &quot;2023&quot;, &quot;t&quot;: &quot;機戰傭兵 VI：境界天火&quot;, &quot;d&quot;: &quot;機戰傭兵系列的新作，吸收了魂系的頭目戰設計。&quot;, &quot;g&quot;: &quot;o&quot;}, {&quot;y&quot;: &quot;2024&quot;, &quot;t&quot;: &quot;艾爾登法環：黃金樹幽影&quot;, &quot;d&quot;: &quot;大型擴充內容。&lt;a href=\&quot;lesson-35.html\&quot;&gt;第 35 課&lt;/a&gt;&quot;, &quot;g&quot;: &quot;s&quot;}, {&quot;y&quot;: &quot;2025&quot;, &quot;t&quot;: &quot;艾爾登法環：黑夜君臨&quot;, &quot;d&quot;: &quot;以多人合作為核心的衍生作品。&lt;a href=\&quot;lesson-36.html\&quot;&gt;第 36 課&lt;/a&gt;&quot;, &quot;g&quot;: &quot;s&quot;}]}"></div>

      <h2>2. 黑暗靈魂：王魂與世界蛇（<a href="lesson-08.html">第 8 課</a>）</h2>

      <div class="nv-w content-figure" style="text-align:left;max-width:680px;margin-left:auto;margin-right:auto" data-cfg="{&quot;t&quot;: &quot;graph&quot;, &quot;h&quot;: 360, &quot;q&quot;: &quot;黑暗靈魂 1 的世界：找到「王魂」的四位，以及兩條世界蛇（點選查看）：&quot;, &quot;nodes&quot;: [{&quot;id&quot;: &quot;fire&quot;, &quot;label&quot;: &quot;初火&quot;, &quot;x&quot;: 320, &quot;y&quot;: 40, &quot;c&quot;: &quot;#e67e22&quot;, &quot;d&quot;: &quot;在灰色的古龍時代中出現的火，帶來了光與暗、生與死、冷與熱的差異。&quot;, &quot;en&quot;: &quot;First Flame&quot;}, {&quot;id&quot;: &quot;gwyn&quot;, &quot;label&quot;: &quot;太陽王葛溫&quot;, &quot;x&quot;: 120, &quot;y&quot;: 150, &quot;c&quot;: &quot;#d4ac0d&quot;, &quot;d&quot;: &quot;王魂之一。以雷電擊敗古龍，建立了火的時代。火焰衰微時，他以自己為薪柴「傳火」，成為最初的薪王。&quot;, &quot;en&quot;: &quot;Gwyn&quot;}, {&quot;id&quot;: &quot;nito&quot;, &quot;label&quot;: &quot;最初的死者尼特&quot;, &quot;x&quot;: 260, &quot;y&quot;: 150, &quot;c&quot;: &quot;#566573&quot;, &quot;d&quot;: &quot;王魂之一。掌管死亡，沉睡在巨人墓地的深處。&quot;, &quot;en&quot;: &quot;Nito&quot;}, {&quot;id&quot;: &quot;witch&quot;, &quot;label&quot;: &quot;伊札里斯的魔女&quot;, &quot;x&quot;: 400, &quot;y&quot;: 150, &quot;c&quot;: &quot;#c0392b&quot;, &quot;d&quot;: &quot;王魂之一。火的魔術之母；她試圖以王魂創造新的初火，卻失敗，誕生了「混沌溫床」與惡魔們。&quot;, &quot;en&quot;: &quot;Witch of Izalith&quot;}, {&quot;id&quot;: &quot;pygmy&quot;, &quot;label&quot;: &quot;不起眼的侏儒&quot;, &quot;x&quot;: 540, &quot;y&quot;: 150, &quot;c&quot;: &quot;#1c2833&quot;, &quot;d&quot;: &quot;找到了「黑暗之魂」——一般認為是人類的祖先。遊戲中幾乎沒有直接的描寫。&quot;, &quot;en&quot;: &quot;Furtive Pygmy&quot;}, {&quot;id&quot;: &quot;seath&quot;, &quot;label&quot;: &quot;無鱗的希斯&quot;, &quot;x&quot;: 120, &quot;y&quot;: 270, &quot;c&quot;: &quot;#85c1e9&quot;, &quot;d&quot;: &quot;背叛古龍、投向葛溫的白龍，得到了王魂的一部分，執著於研究不死。&quot;, &quot;en&quot;: &quot;Seath&quot;}, {&quot;id&quot;: &quot;frampt&quot;, &quot;label&quot;: &quot;世界蛇弗拉姆特&quot;, &quot;x&quot;: 330, &quot;y&quot;: 280, &quot;c&quot;: &quot;#a9cce3&quot;, &quot;d&quot;: &quot;引導玩家繼承葛溫、傳火的世界蛇。&quot;, &quot;en&quot;: &quot;Frampt&quot;}, {&quot;id&quot;: &quot;kaathe&quot;, &quot;label&quot;: &quot;世界蛇凱斯&quot;, &quot;x&quot;: 510, &quot;y&quot;: 280, &quot;c&quot;: &quot;#5b2c6f&quot;, &quot;d&quot;: &quot;告訴玩家另一個說法：葛溫害怕黑暗，延長了火的時代；人類應當迎來黑暗的時代。&quot;, &quot;en&quot;: &quot;Kaathe&quot;}], &quot;edges&quot;: [[&quot;fire&quot;, &quot;gwyn&quot;, &quot;&quot;, &quot;#e67e22&quot;, false], [&quot;fire&quot;, &quot;nito&quot;, &quot;&quot;, &quot;#e67e22&quot;, false], [&quot;fire&quot;, &quot;witch&quot;, &quot;&quot;, &quot;#e67e22&quot;, false], [&quot;fire&quot;, &quot;pygmy&quot;, &quot;&quot;, &quot;#e67e22&quot;, false], [&quot;gwyn&quot;, &quot;seath&quot;, &quot;分享王魂&quot;, &quot;#d4ac0d&quot;, false], [&quot;frampt&quot;, &quot;gwyn&quot;, &quot;支持傳火&quot;, &quot;#a9cce3&quot;, true], [&quot;kaathe&quot;, &quot;pygmy&quot;, &quot;支持黑暗&quot;, &quot;#5b2c6f&quot;, true]], &quot;hint&quot;: &quot;點選任一節點查看說明。兩條世界蛇給出相反的建議——你要相信誰？&quot;}"></div>

      <h2>3. 艾爾登法環：黃金王朝（<a href="lesson-28.html">第 28 課</a>）</h2>

      <div class="nv-w content-figure" style="text-align:left;max-width:680px;margin-left:auto;margin-right:auto" data-cfg="{&quot;t&quot;: &quot;graph&quot;, &quot;h&quot;: 420, &quot;q&quot;: &quot;交界地的黃金王朝：女王瑪莉卡與她的子女（點選查看；含劇透）：&quot;, &quot;nodes&quot;: [{&quot;id&quot;: &quot;marika&quot;, &quot;label&quot;: &quot;永遠的女王瑪莉卡&quot;, &quot;x&quot;: 320, &quot;y&quot;: 40, &quot;c&quot;: &quot;#d4ac0d&quot;, &quot;d&quot;: &quot;艾爾登法環的持有者、黃金樹的神。在「黑夜之刃」事件後擊碎了法環。&quot;, &quot;en&quot;: &quot;Marika&quot;}, {&quot;id&quot;: &quot;godfrey&quot;, &quot;label&quot;: &quot;初代艾爾登之王葛孚雷&quot;, &quot;x&quot;: 130, &quot;y&quot;: 110, &quot;c&quot;: &quot;#a04000&quot;, &quot;d&quot;: &quot;瑪莉卡的第一位伴侶，征戰交界地的戰王；後來失去賜福，被放逐。&quot;, &quot;en&quot;: &quot;Godfrey&quot;}, {&quot;id&quot;: &quot;radagon&quot;, &quot;label&quot;: &quot;拉達岡&quot;, &quot;x&quot;: 470, &quot;y&quot;: 110, &quot;c&quot;: &quot;#c0392b&quot;, &quot;d&quot;: &quot;瑪莉卡的第二位伴侶——後來揭露，他與瑪莉卡其實是同一個存在。&quot;, &quot;en&quot;: &quot;Radagon&quot;}, {&quot;id&quot;: &quot;rennala&quot;, &quot;label&quot;: &quot;滿月女王蕾娜菈&quot;, &quot;x&quot;: 560, &quot;y&quot;: 200, &quot;c&quot;: &quot;#5dade2&quot;, &quot;d&quot;: &quot;魔法學院的女王，拉達岡的前妻。拉達岡離開後陷入沉淪。&quot;, &quot;en&quot;: &quot;Rennala&quot;}, {&quot;id&quot;: &quot;godwyn&quot;, &quot;label&quot;: &quot;黃金葛德文&quot;, &quot;x&quot;: 90, &quot;y&quot;: 200, &quot;c&quot;: &quot;#ca6f1e&quot;, &quot;d&quot;: &quot;第一位死去的半神：靈魂被殺，身體卻沒有死去，導致「死根」的出現。&quot;, &quot;en&quot;: &quot;Godwyn&quot;}, {&quot;id&quot;: &quot;morgott&quot;, &quot;label&quot;: &quot;忌王蒙葛特&quot;, &quot;x&quot;: 170, &quot;y&quot;: 290, &quot;c&quot;: &quot;#7d6608&quot;, &quot;d&quot;: &quot;生來帶有「忌子」特徵的王子，被關在地下，卻成為守護王都的王。&quot;, &quot;en&quot;: &quot;Morgott&quot;}, {&quot;id&quot;: &quot;mohg&quot;, &quot;label&quot;: &quot;鮮血君王蒙格&quot;, &quot;x&quot;: 230, &quot;y&quot;: 370, &quot;c&quot;: &quot;#922b21&quot;, &quot;d&quot;: &quot;蒙葛特的雙胞胎兄弟，信奉鮮血與「無形之母」，奪走了米凱拉的繭。&quot;, &quot;en&quot;: &quot;Mohg&quot;}, {&quot;id&quot;: &quot;malenia&quot;, &quot;label&quot;: &quot;米凱拉之刃瑪蓮妮亞&quot;, &quot;x&quot;: 340, &quot;y&quot;: 230, &quot;c&quot;: &quot;#e74c3c&quot;, &quot;d&quot;: &quot;身懷「猩紅腐敗」的劍士，與拉塔恩的決戰讓蓋利德腐敗。&quot;, &quot;en&quot;: &quot;Malenia&quot;}, {&quot;id&quot;: &quot;miquella&quot;, &quot;label&quot;: &quot;米凱拉&quot;, &quot;x&quot;: 420, &quot;y&quot;: 300, &quot;c&quot;: &quot;#b7950b&quot;, &quot;d&quot;: &quot;永遠的孩童，擁有強大的魅惑之力；試圖創造新的黃金樹。&quot;, &quot;en&quot;: &quot;Miquella&quot;}, {&quot;id&quot;: &quot;radahn&quot;, &quot;label&quot;: &quot;碎星拉塔恩&quot;, &quot;x&quot;: 470, &quot;y&quot;: 380, &quot;c&quot;: &quot;#a93226&quot;, &quot;d&quot;: &quot;以重力魔法「定住群星」的將軍，在蓋利德陷入瘋狂。&quot;, &quot;en&quot;: &quot;Radahn&quot;}, {&quot;id&quot;: &quot;rykard&quot;, &quot;label&quot;: &quot;法務官拉卡德&quot;, &quot;x&quot;: 560, &quot;y&quot;: 300, &quot;c&quot;: &quot;#6e2c00&quot;, &quot;d&quot;: &quot;讓自己被「噬神巨蛇」吞噬，意圖吞噬神明。&quot;, &quot;en&quot;: &quot;Rykard&quot;}, {&quot;id&quot;: &quot;ranni&quot;, &quot;label&quot;: &quot;魔女菈妮&quot;, &quot;x&quot;: 570, &quot;y&quot;: 380, &quot;c&quot;: &quot;#5b2c6f&quot;, &quot;d&quot;: &quot;捨棄肉身、反抗命運的公主；她的計畫通往「星之世紀」。&quot;, &quot;en&quot;: &quot;Ranni&quot;}], &quot;edges&quot;: [[&quot;marika&quot;, &quot;godfrey&quot;, &quot;伴侶&quot;, &quot;#a04000&quot;, false], [&quot;marika&quot;, &quot;radagon&quot;, &quot;同一存在&quot;, &quot;#c0392b&quot;, true], [&quot;radagon&quot;, &quot;rennala&quot;, &quot;前妻&quot;, &quot;#5dade2&quot;, false], [&quot;godfrey&quot;, &quot;godwyn&quot;, &quot;&quot;, &quot;#a04000&quot;, false], [&quot;godfrey&quot;, &quot;morgott&quot;, &quot;&quot;, &quot;#a04000&quot;, false], [&quot;godfrey&quot;, &quot;mohg&quot;, &quot;&quot;, &quot;#a04000&quot;, false], [&quot;radagon&quot;, &quot;malenia&quot;, &quot;&quot;, &quot;#c0392b&quot;, false], [&quot;radagon&quot;, &quot;miquella&quot;, &quot;&quot;, &quot;#c0392b&quot;, false], [&quot;malenia&quot;, &quot;miquella&quot;, &quot;雙胞胎&quot;, &quot;#e74c3c&quot;, false], [&quot;rennala&quot;, &quot;radahn&quot;, &quot;&quot;, &quot;#5dade2&quot;, false], [&quot;rennala&quot;, &quot;rykard&quot;, &quot;&quot;, &quot;#5dade2&quot;, false], [&quot;rennala&quot;, &quot;ranni&quot;, &quot;&quot;, &quot;#5dade2&quot;, false], [&quot;morgott&quot;, &quot;mohg&quot;, &quot;雙胞胎&quot;, &quot;#7d6608&quot;, false]], &quot;hint&quot;: &quot;點選任一人物查看說明。葛德文、蒙葛特、蒙格是瑪莉卡與葛孚雷的子女；瑪蓮妮亞與米凱拉是瑪莉卡與拉達岡的子女；拉塔恩、拉卡德、菈妮是拉達岡與蕾娜菈的子女。另一位子女梅瑟莫在《黃金樹幽影》中登場（第 35 課）。&quot;}"></div>
