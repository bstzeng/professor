      <h2>1. 認樹檢索表（第 49 課）</h2>

      <div class="kd-w content-figure" style="text-align:left;max-width:720px;margin-left:auto;margin-right:auto" data-cfg="{&quot;t&quot;: &quot;tree&quot;, &quot;q&quot;: &quot;認樹檢索表：依序回答問題，一步步找出可能的樹種（收錄本課程的常見樹種）&quot;, &quot;nodes&quot;: {&quot;start&quot;: {&quot;q&quot;: &quot;葉子是什麼樣子？&quot;, &quot;o&quot;: [[&quot;像針或鱗片（松、柏、杉類）&quot;, &quot;con&quot;], [&quot;巨大的扇形或羽毛形，長在樹幹頂端（椰子、棕櫚）&quot;, &quot;palm&quot;], [&quot;一般的葉片&quot;, &quot;leaf&quot;]]}, &quot;con&quot;: {&quot;q&quot;: &quot;葉的形狀？&quot;, &quot;o&quot;: [[&quot;細長的針，兩根一束&quot;, &quot;pine2&quot;], [&quot;細長、分節的綠色小枝（不是真正的針葉），像松但長在海邊&quot;, &quot;mumahuang&quot;], [&quot;扁平的鱗片狀小葉，像柏&quot;, &quot;kuai&quot;], [&quot;短而硬、略彎的鑽形葉&quot;, &quot;taiwanshan&quot;]]}, &quot;pine2&quot;: {&quot;a&quot;: &quot;&lt;b&gt;可能是：台灣二葉松（山上）或琉球松（平地造林）&lt;/b&gt;（第 42 課）&lt;br&gt;松樹靠「一束幾根針」來分：二葉松兩根一束，五葉松、華山松五根一束。&quot;}, &quot;mumahuang&quot;: {&quot;a&quot;: &quot;&lt;b&gt;可能是：木麻黃&lt;/b&gt;（第 31 課）&lt;br&gt;綠色的細枝其實是枝條，真正的葉退化成小鱗片，拉開會看到一節一節的。&quot;}, &quot;kuai&quot;: {&quot;a&quot;: &quot;&lt;b&gt;可能是：紅檜、台灣扁柏或台灣肖楠&lt;/b&gt;（第 38 課）&lt;br&gt;檜木的鱗葉排成扁平的枝片；肖楠的鱗葉較長、枝片也扁平，需要看毬果細節分辨（第 40 課）。&quot;}, &quot;taiwanshan&quot;: {&quot;a&quot;: &quot;&lt;b&gt;可能是：台灣杉&lt;/b&gt;（第 39 課）&lt;br&gt;葉為鑽形、略彎而堅硬，樹幹通直高大。&quot;}, &quot;palm&quot;: {&quot;q&quot;: &quot;葉的形狀？&quot;, &quot;o&quot;: [[&quot;扇形（像一把扇子）&quot;, &quot;pukui&quot;], [&quot;羽毛形，樹幹灰白光滑、中段膨大&quot;, &quot;dawang&quot;]]}, &quot;pukui&quot;: {&quot;a&quot;: &quot;&lt;b&gt;可能是：蒲葵&lt;/b&gt;（第 33 課）&lt;br&gt;葉大如扇，從前常用來做扇子（蒲扇）。&quot;}, &quot;dawang&quot;: {&quot;a&quot;: &quot;&lt;b&gt;可能是：大王椰子&lt;/b&gt;（第 33 課）&lt;br&gt;樹幹灰白、像水泥柱，中段常略為膨大；台大椰林大道就是牠。&quot;}, &quot;leaf&quot;: {&quot;q&quot;: &quot;是單葉還是複葉？（複葉：一根葉柄上長著好幾片小葉）&quot;, &quot;o&quot;: [[&quot;單葉&quot;, &quot;s&quot;], [&quot;複葉&quot;, &quot;c&quot;]]}, &quot;c&quot;: {&quot;q&quot;: &quot;複葉的形式？&quot;, &quot;o&quot;: [[&quot;三片小葉（三出複葉）&quot;, &quot;jiadong&quot;], [&quot;小葉像手掌般從同一點長出（掌狀複葉）&quot;, &quot;palmate&quot;], [&quot;小葉排成兩列（羽狀複葉）&quot;, &quot;pinnate&quot;]]}, &quot;jiadong&quot;: {&quot;a&quot;: &quot;&lt;b&gt;可能是：茄苳&lt;/b&gt;（第 9 課）&lt;br&gt;三出複葉、葉緣有鈍鋸齒，樹皮紅褐色、會片狀剝落。&quot;}, &quot;palmate&quot;: {&quot;q&quot;: &quot;樹幹的特徵？&quot;, &quot;o&quot;: [[&quot;粗壯，枝條水平展開，早春先開大紅花再長葉&quot;, &quot;mumian&quot;], [&quot;樹幹綠色、有瘤狀的刺，秋天開粉紅花&quot;, &quot;meiren&quot;], [&quot;花有臭味，果實紅色像船&quot;, &quot;pingpo&quot;]]}, &quot;mumian&quot;: {&quot;a&quot;: &quot;&lt;b&gt;可能是：木棉&lt;/b&gt;（第 20 課）&lt;br&gt;二、三月開橙紅色大花，五月棉絮飄落。&quot;}, &quot;meiren&quot;: {&quot;a&quot;: &quot;&lt;b&gt;可能是：美人樹&lt;/b&gt;（第 27 課）&lt;br&gt;樹幹綠色、有刺，常呈酒瓶狀；秋冬開粉紅色花。&quot;}, &quot;pingpo&quot;: {&quot;a&quot;: &quot;&lt;b&gt;可能是：掌葉蘋婆&lt;/b&gt;（第 29 課）&lt;br&gt;學名 foetida 就是「有臭味」的意思。&quot;}, &quot;pinnate&quot;: {&quot;q&quot;: &quot;葉是怎麼排在枝上的？&quot;, &quot;o&quot;: [[&quot;對生（左右兩兩相對）&quot;, &quot;guangla&quot;], [&quot;互生&quot;, &quot;pin2&quot;]]}, &quot;guangla&quot;: {&quot;a&quot;: &quot;&lt;b&gt;可能是：光蠟樹&lt;/b&gt;（第 15 課）&lt;br&gt;奇數羽狀複葉、對生；樹皮光滑、有白色斑塊，夏天常有獨角仙吸食樹液。&quot;}, &quot;pin2&quot;: {&quot;q&quot;: &quot;小葉是否還再分成小羽片（二回以上的羽狀複葉）？&quot;, &quot;o&quot;: [[&quot;是，葉很細碎&quot;, &quot;pin3&quot;], [&quot;否，一回羽狀&quot;, &quot;pin4&quot;]]}, &quot;pin3&quot;: {&quot;q&quot;: &quot;花的顏色？&quot;, &quot;o&quot;: [[&quot;淡紫色小花，春天開；冬天掛黃色小果&quot;, &quot;kulian&quot;], [&quot;秋天開黃花，接著結紅褐色像燈籠的果實&quot;, &quot;luan&quot;], [&quot;夏天開火紅色大花&quot;, &quot;fenghuang&quot;], [&quot;小白花球，到處都有、豆莢很多&quot;, &quot;yinhehuan&quot;]]}, &quot;kulian&quot;: {&quot;a&quot;: &quot;&lt;b&gt;可能是：苦楝&lt;/b&gt;（第 17 課）&lt;br&gt;二至三回羽狀複葉，小葉有鋸齒；台語叫「苦苓」。&quot;}, &quot;luan&quot;: {&quot;a&quot;: &quot;&lt;b&gt;可能是：台灣欒樹&lt;/b&gt;（第 10 課）&lt;br&gt;二回羽狀複葉，秋天依序出現黃花、紅褐色蒴果。&quot;}, &quot;fenghuang&quot;: {&quot;a&quot;: &quot;&lt;b&gt;可能是：鳳凰木&lt;/b&gt;（第 25 課）&lt;br&gt;二回羽狀複葉，小葉非常細小；長長的扁莢果。&quot;}, &quot;yinhehuan&quot;: {&quot;a&quot;: &quot;&lt;b&gt;可能是：銀合歡&lt;/b&gt;（第 46 課）&lt;br&gt;外來入侵種，二回羽狀複葉，白色球狀花，豆莢成串。&quot;}, &quot;pin4&quot;: {&quot;q&quot;: &quot;花或果的特徵？&quot;, &quot;o&quot;: [[&quot;夏天長串的黃花垂下，果實像長棍子&quot;, &quot;abole&quot;], [&quot;春天滿樹小黃花，果實圓盤狀有翅&quot;, &quot;zitan&quot;], [&quot;粉紫或白色的蝶形花，豆莢扁平，常見於海邊&quot;, &quot;shuihuang&quot;]]}, &quot;abole&quot;: {&quot;a&quot;: &quot;&lt;b&gt;可能是：阿勃勒&lt;/b&gt;（第 24 課）&lt;br&gt;一回偶數羽狀複葉，花序下垂如黃金雨，莢果圓筒狀可長達數十公分。&quot;}, &quot;zitan&quot;: {&quot;a&quot;: &quot;&lt;b&gt;可能是：印度紫檀&lt;/b&gt;（第 13 課）&lt;br&gt;奇數羽狀複葉，小葉互生；春天一次開滿黃花，很快就謝。&quot;}, &quot;shuihuang&quot;: {&quot;a&quot;: &quot;&lt;b&gt;可能是：水黃皮&lt;/b&gt;（第 13 課）&lt;br&gt;奇數羽狀複葉，小葉對生、較大；耐鹽，常見於海邊與公園。&quot;}, &quot;s&quot;: {&quot;q&quot;: &quot;葉是怎麼排在枝上的？&quot;, &quot;o&quot;: [[&quot;互生&quot;, &quot;sa&quot;], [&quot;對生&quot;, &quot;so&quot;], [&quot;輪生（一個節上有三片以上）&quot;, &quot;heiban&quot;]]}, &quot;heiban&quot;: {&quot;a&quot;: &quot;&lt;b&gt;可能是：黑板樹&lt;/b&gt;（第 11 課）&lt;br&gt;四到七片葉輪生，樹形層層分明；秋冬開花時氣味濃烈。&quot;}, &quot;so&quot;: {&quot;q&quot;: &quot;其他特徵？&quot;, &quot;o&quot;: [[&quot;葉厚而亮，樹形整齊，常種成防風綠籬&quot;, &quot;fumu&quot;], [&quot;四月開滿白色細長的花，像下雪&quot;, &quot;liusu&quot;], [&quot;樹皮非常光滑、斑駁，夏天開白花或紫花&quot;, &quot;jiuqiong&quot;]]}, &quot;fumu&quot;: {&quot;a&quot;: &quot;&lt;b&gt;可能是：福木&lt;/b&gt;（第 32 課）&lt;br&gt;葉厚革質、對生，枝葉茂密，是很好的防風樹。&quot;}, &quot;liusu&quot;: {&quot;a&quot;: &quot;&lt;b&gt;可能是：流蘇&lt;/b&gt;（第 22 課）&lt;br&gt;單葉對生，四月開白花，有「四月雪」之稱。&quot;}, &quot;jiuqiong&quot;: {&quot;a&quot;: &quot;&lt;b&gt;可能是：九芎或大花紫薇&lt;/b&gt;（第 26 課）&lt;br&gt;九芎樹皮光滑，被稱為「猴不爬」；大花紫薇夏天開紫色大花。&quot;}, &quot;sa&quot;: {&quot;q&quot;: &quot;葉的形狀或特徵？&quot;, &quot;o&quot;: [[&quot;心形，葉尖拉成長尾巴&quot;, &quot;puti&quot;], [&quot;心形或圓形，葉柄長在葉片中間（盾狀）&quot;, &quot;xuetong&quot;], [&quot;心形，海邊常見，開黃花&quot;, &quot;huangjin&quot;], [&quot;掌狀裂（像手掌），秋冬變紅&quot;, &quot;fengxiang&quot;], [&quot;葉像兩片合在一起，前端裂開成羊蹄狀&quot;, &quot;zijing&quot;], [&quot;其他形狀&quot;, &quot;sa2&quot;]]}, &quot;puti&quot;: {&quot;a&quot;: &quot;&lt;b&gt;可能是：菩提樹&lt;/b&gt;（第 14 課）&lt;br&gt;葉尖延長成「滴水葉尖」，是最好認的特徵之一。&quot;}, &quot;xuetong&quot;: {&quot;a&quot;: &quot;&lt;b&gt;可能是：血桐&lt;/b&gt;（第 35 課）&lt;br&gt;盾狀葉；折斷枝條流出的汁液接觸空氣後變成紅色。&quot;}, &quot;huangjin&quot;: {&quot;a&quot;: &quot;&lt;b&gt;可能是：黃槿&lt;/b&gt;（第 28 課）&lt;br&gt;心形葉，花黃色、中心暗紅，一朵花只開一天；葉可墊粿。&quot;}, &quot;fengxiang&quot;: {&quot;a&quot;: &quot;&lt;b&gt;可能是：楓香&lt;/b&gt;（第 16 課）&lt;br&gt;掌狀三裂葉、互生；槭樹（真正的「楓」）則是對生。&quot;}, &quot;zijing&quot;: {&quot;a&quot;: &quot;&lt;b&gt;可能是：羊蹄甲類（洋紫荊、艷紫荊、羊蹄甲）&lt;/b&gt;（第 21 課）&lt;br&gt;葉先端二裂、形似羊蹄；看花期與是否結果來分。&quot;}, &quot;sa2&quot;: {&quot;q&quot;: &quot;有沒有氣生根，或摘下葉子有白色乳汁？&quot;, &quot;o&quot;: [[&quot;有氣生根、有乳汁&quot;, &quot;fig&quot;], [&quot;沒有&quot;, &quot;sa3&quot;]]}, &quot;fig&quot;: {&quot;q&quot;: &quot;葉的特徵？&quot;, &quot;o&quot;: [[&quot;葉較小、厚，倒卵形，終年常綠&quot;, &quot;rong&quot;], [&quot;葉較大、薄，一年會換好幾次葉，新芽包在紅色苞片中&quot;, &quot;querong&quot;]]}, &quot;rong&quot;: {&quot;a&quot;: &quot;&lt;b&gt;可能是：榕樹&lt;/b&gt;（第 7 課）&lt;br&gt;台灣最常見的行道樹與老樹之一。&quot;}, &quot;querong&quot;: {&quot;a&quot;: &quot;&lt;b&gt;可能是：雀榕&lt;/b&gt;（第 18 課）&lt;br&gt;新芽像紅色的筍，換葉時常整棵光禿。&quot;}, &quot;sa3&quot;: {&quot;q&quot;: &quot;揉碎葉子聞聞看？&quot;, &quot;o&quot;: [[&quot;有濃濃的樟腦味；葉有三條明顯的主脈&quot;, &quot;zhang&quot;], [&quot;沒有特別氣味&quot;, &quot;sa4&quot;]]}, &quot;zhang&quot;: {&quot;a&quot;: &quot;&lt;b&gt;可能是：樟樹&lt;/b&gt;（第 8 課）&lt;br&gt;離基三出脈，脈腋常有小小的腺點。&quot;}, &quot;sa4&quot;: {&quot;q&quot;: &quot;葉片大小與枝條形態？&quot;, &quot;o&quot;: [[&quot;大葉（可達 30 公分），枝條一層層水平展開，冬天葉轉紅&quot;, &quot;dalan&quot;], [&quot;小葉、匙形，枝條水平輪生成一層層的傘&quot;, &quot;xiaolan&quot;], [&quot;葉其實是鐮刀形的「假葉」，春天開黃色毛球花&quot;, &quot;xiangsi&quot;], [&quot;葉形多變（有的有裂），夏天結紅色毛球狀果實&quot;, &quot;goushu&quot;], [&quot;樹皮白色、一層層像海綿&quot;, &quot;baiqian&quot;]]}, &quot;dalan&quot;: {&quot;a&quot;: &quot;&lt;b&gt;可能是：大葉欖仁&lt;/b&gt;（第 12 課）&lt;br&gt;葉大、倒卵形，冬天變紅後落葉。&quot;}, &quot;xiaolan&quot;: {&quot;a&quot;: &quot;&lt;b&gt;可能是：小葉欖仁&lt;/b&gt;（第 12 課）&lt;br&gt;枝條水平輪生，樹形像一層層的寶塔。&quot;}, &quot;xiangsi&quot;: {&quot;a&quot;: &quot;&lt;b&gt;可能是：相思樹&lt;/b&gt;（第 34 課）&lt;br&gt;「葉」其實是扁平的葉柄（假葉），真正的羽狀複葉只在幼苗時出現。&quot;}, &quot;goushu&quot;: {&quot;a&quot;: &quot;&lt;b&gt;可能是：構樹&lt;/b&gt;（第 35 課）&lt;br&gt;葉形多變，有毛；雌株夏天結紅色的聚合果。&quot;}, &quot;baiqian&quot;: {&quot;a&quot;: &quot;&lt;b&gt;可能是：白千層&lt;/b&gt;（第 46 課）&lt;br&gt;樹皮白色、多層而鬆軟，可以一片片剝下。&quot;}}}"></div>
