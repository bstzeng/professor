      <script>
      (function () {
        if (window.__lyLib) return; window.__lyLib = 1;

        function btn(t, k) { var b = document.createElement('button'); b.type = 'button'; b.textContent = t; if (k !== undefined) b.setAttribute('data-k', k);
          b.style.cssText = 'padding:4px 10px;margin:4px 6px 0 0;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer;font:inherit;font-size:0.9em'; return b; }
        function mark(bar, k) { bar.querySelectorAll('button').forEach(function (b) { var on = b.getAttribute('data-k') === String(k); b.style.background = on ? 'var(--accent-soft)' : 'var(--surface)'; b.style.fontWeight = on ? 'bold' : 'normal'; }); }
        function head(root, q) { if (q) { var p = document.createElement('p'); p.style.margin = '0 0 8px'; p.innerHTML = q; root.appendChild(p); } }
        function el(tag, css, html) { var e = document.createElement(tag); if (css) e.style.cssText = css; if (html !== undefined) e.innerHTML = html; return e; }
        function n1(v) { return Math.round(v * 10) / 10; }
        function f1(v) { return (Math.round(v * 10) / 10).toString(); }
        function f2(v) { return (Math.round(v * 100) / 100).toString(); }
        function tx(x, y, s, sz, c, anc) { return '<text x="' + n1(x) + '" y="' + n1(y) + '" font-size="' + sz + '" fill="' + (c || 'currentColor') + '" text-anchor="' + (anc || 'middle') + '">' + s + '</text>'; }
        function ln(x1, y1, x2, y2, c, w, ex) { return '<line x1="' + n1(x1) + '" y1="' + n1(y1) + '" x2="' + n1(x2) + '" y2="' + n1(y2) + '" stroke="' + c + '" stroke-width="' + (w || 1) + '" ' + (ex || '') + '/>'; }
        function svgw(vb, inner) { return '<svg viewBox="' + vb + '" style="width:100%;display:block;color:var(--text)">' + inner + '</svg>'; }
        function slider(root, lab, min, max, step, val, fmt, k, cb) { var l = el('label', 'display:block;font-size:0.88em;margin-top:6px', lab + '：<b></b>'); var s = document.createElement('input');
          s.type = 'range'; s.min = min; s.max = max; s.step = step; s.value = val; s.style.cssText = 'width:100%;display:block'; if (k) s.setAttribute('data-k', k); l.appendChild(s); root.appendChild(l);
          function u() { l.querySelector('b').textContent = fmt(+s.value); cb(+s.value); } s.addEventListener('input', u); return u; }
        function nice(lo, hi, n) { var span = hi - lo || 1, st = Math.pow(10, Math.floor(Math.log10(span / n))), e = span / n / st; st *= e >= 5 ? 5 : e >= 2 ? 2 : 1; var t = [], v = Math.ceil(lo / st - 1e-9) * st; for (; v <= hi + 1e-9; v += st) t.push(Math.round(v / st) * st); return t; }
        function fmtT(v) { var a = Math.abs(v); return a >= 1e6 ? f1(v / 1e6) + 'M' : a >= 1e4 ? f1(v / 1e3) + 'k' : (Math.round(v * 100) / 100).toString(); }
        var CID = 0;
        function chart(W, H, S, o) { o = o || {}; var L = 48, R = 12, T = 22, B = 34, xs = [], ys = [];
          S.forEach(function (s) { s.d.forEach(function (p) { xs.push(p[0]); if (isFinite(p[1])) ys.push(p[1]); }); });
          var x0 = o.x0 !== undefined ? o.x0 : Math.min.apply(null, xs), x1 = o.x1 !== undefined ? o.x1 : Math.max.apply(null, xs);
          var y0 = o.y0 !== undefined ? o.y0 : Math.min(0, Math.min.apply(null, ys)), y1 = o.y1 !== undefined ? o.y1 : Math.max.apply(null, ys) * 1.08 || 1;
          function sx(v) { return L + (v - x0) / (x1 - x0 || 1) * (W - L - R); } function sy(v) { return H - B - (v - y0) / (y1 - y0 || 1) * (H - T - B); }
          var id = 'qc' + (++CID), g = '<clipPath id="' + id + '"><rect x="' + L + '" y="' + (T - 2) + '" width="' + (W - L - R) + '" height="' + (H - T - B + 4) + '"/></clipPath>';
          nice(y0, y1, 4).forEach(function (v) { g += ln(L, sy(v), W - R, sy(v), 'var(--border)', 0.6, 'stroke-dasharray="2 3"') + tx(L - 5, sy(v) + 3, fmtT(v), 9, 'var(--text-muted)', 'end'); });
          nice(x0, x1, 6).forEach(function (v) { g += tx(sx(v), H - B + 14, fmtT(v), 9, 'var(--text-muted)'); });
          g += ln(L, T - 4, L, H - B, '#999') + ln(L, H - B, W - R, H - B, '#999');
          if (o.xl) g += tx((L + W - R) / 2, H - 4, o.xl, 9.5, 'var(--text-muted)');
          if (o.yl) g += tx(L - 40, T - 8, o.yl, 9.5, 'var(--text-muted)', 'start');
          (o.hl || []).forEach(function (h) { g += ln(L, sy(h.y), W - R, sy(h.y), h.c, 1, 'stroke-dasharray="5 4"') + tx(W - R - 2, sy(h.y) - 4, h.n, 9, h.c, 'end'); });
          (o.vl || []).forEach(function (h) { g += ln(sx(h.x), T, sx(h.x), H - B, h.c, 1, 'stroke-dasharray="5 4"') + tx(sx(h.x) + 3, H - B - 6, h.n, 9, h.c, 'start'); });
          S.forEach(function (s) { var d = '', m = 'M'; s.d.forEach(function (p) { if (!isFinite(p[1])) { m = 'M'; return; } d += m + n1(sx(p[0])) + ' ' + n1(sy(Math.max(Math.min(p[1], y1 + (y1 - y0)), y0 - (y1 - y0)))); m = 'L'; });
            g += '<path clip-path="url(#' + id + ')" d="' + d + '" fill="none" stroke="' + s.c + '" stroke-width="' + (s.w || 2) + '"' + (s.dash ? ' stroke-dasharray="' + s.dash + '"' : '') + '/>'; });
          (o.pts || []).forEach(function (p) { g += '<circle cx="' + n1(sx(p.x)) + '" cy="' + n1(sy(Math.min(p.y, y1))) + '" r="5" fill="' + p.c + '"/>' + (p.n ? tx(sx(p.x) + 8, sy(Math.min(p.y, y1)) - 6, p.n, 10, p.c, 'start') : ''); });
          var lx = L + 8, ly = T + 2; S.forEach(function (s) { if (!s.n) return; g += ln(lx, ly, lx + 16, ly, s.c, 2.5, s.dash ? 'stroke-dasharray="' + s.dash + '"' : '') + tx(lx + 20, ly + 4, s.n, 9.5, 'currentColor', 'start'); lx += 34 + s.n.length * 10.5; if (lx > W - 120) { lx = L + 8; ly += 15; } });
          return svgw('0 0 ' + W + ' ' + H, g); }
        function rexp(m) { return -Math.log(1 - Math.random()) * m; }

        function info(root) { var p = el('div', 'margin-top:8px;padding:10px 12px;border-radius:8px;background:var(--accent-soft);line-height:1.7'); root.appendChild(p); return p; }
        function bar(root) { var b = el('div'); root.appendChild(b); return b; }
        function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;'); }

        function initTog(root, cfg) { var bb = bar(root), on = true;
          var b1 = btn('原文＋白話', 'a'), b2 = btn('只看原文（自己先試著讀懂）', 'b');
          function set(v) { on = v; mark(bb, v ? 'a' : 'b'); document.querySelectorAll('.ly-bh').forEach(function (e) { e.style.display = v ? '' : 'none'; }); }
          b1.addEventListener('click', function () { set(true); }); b2.addEventListener('click', function () { set(false); }); bb.appendChild(b1); bb.appendChild(b2); set(true); }

        function initPian(root, cfg) { head(root, cfg.q); var P = cfg.p, cur = 0, bb = bar(root), out = el('div', 'margin-top:8px');
          P.forEach(function (x, i) { var b = btn((i + 1) + '.' + x[0], 'p' + i); b.addEventListener('click', function () { cur = i; mark(bb, 'p' + i); draw(); }); bb.appendChild(b); });
          root.appendChild(out);
          function draw() { var x = P[cur]; out.innerHTML = '<div style="padding:10px 12px;border-radius:8px;background:var(--accent-soft);line-height:1.8"><b style="font-size:1.1em">第 ' + (cur + 1) + ' 篇〈' + x[0] + '〉</b>　<span style="color:var(--text-muted);font-size:0.9em">' + x[1] + '</span><br>' + x[2] +
            '<ul style="margin:6px 0 0;padding-left:20px">' + x[3].map(function (q) { return '<li>' + q + '</li>'; }).join('') + '</ul></div>'; }
          mark(bb, 'p0'); draw(); }

        function initViews(root, cfg) { head(root, cfg.q); var V = cfg.v, cur = 0, top = el('div', 'font-size:1.15em;line-height:1.9;padding:8px 12px;border-left:4px solid #b8862b;margin:6px 0', cfg.text), bb, p;
          root.appendChild(top); bb = bar(root); p = info(root);
          V.forEach(function (v, i) { var b = btn(v[0], 'v' + i); b.addEventListener('click', function () { cur = i; mark(bb, 'v' + i); draw(); }); bb.appendChild(b); });
          function draw() { var v = V[cur]; p.innerHTML = '<b>' + v[0] + '</b><br>讀法：' + v[1] + '<br><span style="color:var(--text-muted)">' + v[2] + '</span>'; }
          mark(bb, 'v0'); draw(); }

        function initQuiz(root, cfg) { head(root, cfg.q); var Q = cfg.items, i = 0, score = 0, done = false, box = el('div', 'margin-top:6px'), p;
          root.appendChild(box); p = info(root);
          function draw() { var q0 = Q[i], ord = q0[1].map(function (_, k) { return k; }); done = false;
            for (var s = ord.length - 1; s > 0; s--) { var r = Math.floor(Math.random() * (s + 1)), t = ord[s]; ord[s] = ord[r]; ord[r] = t; }
            var q = [q0[0], ord.map(function (k) { return q0[1][k]; }), ord.indexOf(q0[2]), q0[3]];
            box.innerHTML = '<div style="font-size:0.85em;color:var(--text-muted)">第 ' + (i + 1) + ' / ' + Q.length + ' 題　答對 ' + score + ' 題</div><div style="font-weight:bold;margin:6px 0">' + q[0] + '</div>';
            q[1].forEach(function (o, k) { var b = btn(o, 'o' + k); b.style.display = 'block'; b.style.width = '100%'; b.style.textAlign = 'left';
              b.addEventListener('click', function () { if (done) return; done = true; var ok = k === q[2]; if (ok) score++;
                box.querySelectorAll('button').forEach(function (x, j) { if (j === q[2]) x.style.background = '#cfe8d0'; else if (j === k) x.style.background = '#f4cccc'; });
                p.innerHTML = (ok ? '✅ 答對了！' : '❌ 正確答案是：' + esc(q[1][q[2]])) + '<br>' + q[3];
                var n = btn(i + 1 < Q.length ? '下一題 →' : '重新開始', 'n'); n.addEventListener('click', function () { if (i + 1 < Q.length) i++; else { i = 0; score = 0; } p.innerHTML = '選一個答案。'; draw(); }); p.appendChild(el('div', 'margin-top:6px')).appendChild(n); });
              box.appendChild(b); }); }
          p.innerHTML = '選一個答案。'; draw(); }

        function initSearch(root, cfg) { head(root, cfg.q); var A = cfg.a, inp = document.createElement('input'), out = el('div', 'margin-top:8px;max-height:520px;overflow-y:auto');
          inp.type = 'search'; inp.placeholder = '輸入關鍵字，例如：學、仁、君子、朋友、孝'; inp.style.cssText = 'width:100%;box-sizing:border-box;padding:8px 10px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);font:inherit';
          root.appendChild(inp); root.appendChild(out);
          function draw() { var k = inp.value.trim(), r = A.filter(function (a) { return !k || a[1].indexOf(k) >= 0 || a[2].indexOf(k) >= 0 || a[0].indexOf(k) >= 0; });
            out.innerHTML = '<div style="font-size:0.85em;color:var(--text-muted)">共 ' + r.length + ' 則' + (k ? '（關鍵字「' + esc(k) + '」）' : '') + '</div>' + r.slice(0, 120).map(function (a) {
              var t = esc(a[1]); if (k) t = t.split(esc(k)).join('<mark>' + esc(k) + '</mark>');
              return '<div style="border-bottom:1px solid var(--border);padding:6px 2px;line-height:1.7">' + t + '<div style="font-size:0.82em;color:var(--text-muted)">〈' + a[0] + '〉　<a href="lesson-' + (a[3] < 10 ? '0' : '') + a[3] + '.html">第 ' + a[3] + ' 課</a></div></div>'; }).join('') + (r.length > 120 ? '<div style="color:var(--text-muted)">……只顯示前 120 則，請再縮小關鍵字</div>' : ''); }
          inp.addEventListener('input', draw); draw(); }

        function initAll() { document.querySelectorAll('.ly-w').forEach(function (w) { if (w.__d) return; w.__d = 1; var cfg = JSON.parse(w.getAttribute('data-cfg'));
          ({ tog: initTog, pian: initPian, views: initViews, quiz: initQuiz, search: initSearch })[cfg.t](w, cfg); }); }
        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', initAll); else initAll();
      })();
      </script>

      <div class="ly-w content-figure" style="text-align:left;max-width:720px;margin-left:auto;margin-right:auto" data-cfg="{&quot;t&quot;: &quot;search&quot;, &quot;q&quot;: &quot;名句搜尋&quot;, &quot;a&quot;: [[&quot;子罕&quot;, &quot;大宰問於子貢曰：「夫子聖者與？何其多能也？」子貢曰：「固天縱之將聖，又多能也。」子聞之，曰：「大宰知我乎！吾少也賤，故多能鄙事。君子多乎哉？不多也。」&quot;, &quot;太宰問子貢：「孔老師是聖人嗎？為什麼會這麼多技能？」子貢說：「這本是上天讓他成為聖人，又讓他多才多藝。」孔子聽了說：「太宰了解我嗎？我小時候窮困卑微，所以學會了許多粗活。君子需要會這麼多嗎？不需要的。」&quot;, 2], [&quot;先進&quot;, &quot;德行：顏淵、閔子騫、冉伯牛、仲弓。言語：宰我、子貢。政事：冉有、季路。文學：子游、子夏。&quot;, &quot;在德行方面突出的有顏淵、閔子騫、冉伯牛、仲弓；在言語（外交辭令）方面有宰我、子貢；在政事方面有冉有、季路（子路）；在文學（古代文獻）方面有子游、子夏。&quot;, 3], [&quot;公冶長&quot;, &quot;顏淵、季路侍。子曰：「盍各言爾志？」子路曰：「願車馬、衣輕裘，與朋友共，敝之而無憾。」顏淵曰：「願無伐善，無施勞。」子路曰：「願聞子之志。」子曰：「老者安之，朋友信之，少者懷之。」&quot;, &quot;顏淵、子路陪在孔子身邊。孔子說：「何不各自說說你們的志向？」子路說：「我願意把車馬、衣服、皮袍和朋友共用，用壞了也不遺憾。」顏淵說：「我希望不誇耀自己的長處，不張揚自己的功勞。」子路說：「想聽聽老師的志向。」孔子說：「讓老人安適，讓朋友信任，讓年輕人得到關懷。」&quot;, 3], [&quot;學而&quot;, &quot;子曰：「學而時習之，不亦說乎？有朋自遠方來，不亦樂乎？人不知而不慍，不亦君子乎？」&quot;, &quot;孔子說：「學了之後按時溫習、實踐，不是很愉快嗎？有志同道合的朋友從遠方來，不是很快樂嗎？別人不了解我，我也不生氣，不也是君子嗎？」&quot;, 5], [&quot;為政&quot;, &quot;子曰：「溫故而知新，可以為師矣。」&quot;, &quot;孔子說：「溫習舊的知識，能從中得到新的體會，就可以當老師了。」&quot;, 6], [&quot;為政&quot;, &quot;子曰：「學而不思則罔，思而不學則殆。」&quot;, &quot;孔子說：「只學習而不思考，就會迷惘而沒有收穫；只思考而不學習，就會陷入危險（或疑惑不安）。」&quot;, 6], [&quot;衛靈公&quot;, &quot;子曰：「吾嘗終日不食，終夜不寢，以思，無益，不如學也。」&quot;, &quot;孔子說：「我曾經整天不吃飯、整夜不睡覺地思考，結果沒有什麼益處，不如去學習。」&quot;, 6], [&quot;憲問&quot;, &quot;子曰：「古之學者為己，今之學者為人。」&quot;, &quot;孔子說：「古代的學者學習是為了充實自己，現在的學者學習是為了給別人看。」&quot;, 6], [&quot;子張&quot;, &quot;子夏曰：「日知其所亡，月無忘其所能，可謂好學也已矣。」&quot;, &quot;子夏說：「每天知道一些自己原本不懂的，每個月不忘記已經學會的，這可以說是好學了。」&quot;, 6], [&quot;為政&quot;, &quot;子曰：「由！誨女知之乎？知之為知之，不知為不知，是知也。」&quot;, &quot;孔子說：「仲由（子路）！我教你什麼是知道吧？知道就說知道，不知道就說不知道，這才是真正的知道。」&quot;, 7], [&quot;述而&quot;, &quot;子曰：「三人行，必有我師焉。擇其善者而從之，其不善者而改之。」&quot;, &quot;孔子說：「幾個人一起走，其中一定有可以當我老師的人。選擇他們的優點來學習，看到他們的缺點就反省自己有沒有，有就改正。」&quot;, 7], [&quot;公冶長&quot;, &quot;子貢問曰：「孔文子何以謂之文也？」子曰：「敏而好學，不恥下問，是以謂之文也。」&quot;, &quot;子貢問：「孔文子為什麼死後被諡為『文』？」孔子說：「他聰敏又好學，不以向地位或學問比自己低的人請教為恥，所以諡為『文』。」&quot;, 7], [&quot;八佾&quot;, &quot;子入太廟，每事問。或曰：「孰謂鄹人之子知禮乎？入太廟，每事問。」子聞之，曰：「是禮也。」&quot;, &quot;孔子進入太廟，每件事都要問。有人說：「誰說鄹邑那個人的兒子懂禮呢？進了太廟，每件事都要問。」孔子聽了說：「這正是禮啊。」&quot;, 7], [&quot;述而&quot;, &quot;子曰：「我非生而知之者，好古，敏以求之者也。」&quot;, &quot;孔子說：「我不是生下來就懂得道理的人，而是愛好古代文化，勤奮敏捷地去求取知識的人。」&quot;, 7], [&quot;雍也&quot;, &quot;哀公問：「弟子孰為好學？」孔子對曰：「有顏回者好學，不遷怒，不貳過。不幸短命死矣！今也則亡，未聞好學者也。」&quot;, &quot;魯哀公問：「你的學生中誰最好學？」孔子回答：「有個叫顏回的好學，他不把怒氣發洩到別人身上，同樣的錯誤不犯第二次。不幸短命死了！現在就沒有這樣的人了，沒聽說還有好學的人。」&quot;, 8], [&quot;雍也&quot;, &quot;子曰：「賢哉，回也！一簞食，一瓢飲，在陋巷，人不堪其憂，回也不改其樂。賢哉，回也！」&quot;, &quot;孔子說：「顏回真是賢德啊！一竹筐飯、一瓢水，住在簡陋的巷子裡，別人都受不了那種憂苦，顏回卻不改變他的快樂。顏回真是賢德啊！」&quot;, 8], [&quot;為政&quot;, &quot;子曰：「吾與回言終日，不違，如愚。退而省其私，亦足以發，回也不愚。」&quot;, &quot;孔子說：「我和顏回談了一整天，他從不提出反對意見，好像很笨。等他回去後，我觀察他私下的言行，發現他能夠發揮我所講的道理。顏回並不笨啊。」&quot;, 8], [&quot;子罕&quot;, &quot;子曰：「語之而不惰者，其回也與！」&quot;, &quot;孔子說：「聽我講道理而始終不懈怠的，大概只有顏回吧！」&quot;, 8], [&quot;學而&quot;, &quot;子曰：「君子食無求飽，居無求安，敏於事而慎於言，就有道而正焉，可謂好學也已。」&quot;, &quot;孔子說：「君子吃飯不求飽足，居住不求安逸，做事勤快而說話謹慎，親近有道德的人來匡正自己，這就可以說是好學了。」&quot;, 8], [&quot;先進&quot;, &quot;子路問：「聞斯行諸？」子曰：「有父兄在，如之何其聞斯行之？」冉有問：「聞斯行諸？」子曰：「聞斯行之。」公西華曰：「由也問聞斯行諸，子曰『有父兄在』；求也問聞斯行諸，子曰『聞斯行之』。赤也惑，敢問。」子曰：「求也退，故進之；由也兼人，故退之。」&quot;, &quot;子路問：「聽到該做的事就馬上去做嗎？」孔子說：「有父親兄長在，怎麼能聽到就去做呢？」冉有問同樣的問題，孔子說：「聽到就去做。」公西華說：「子路問，老師說要先問父兄；冉有問，老師說聽到就做。我糊塗了，請問為什麼？」孔子說：「冉求做事退縮，所以鼓勵他向前；仲由勇氣過人，所以讓他收斂一點。」&quot;, 9], [&quot;述而&quot;, &quot;子曰：「不憤不啟，不悱不發。舉一隅不以三隅反，則不復也。」&quot;, &quot;孔子說：「不到他努力想弄懂而弄不懂的時候，不去開導他；不到他想說卻說不出來的時候，不去啟發他。教給他一個方角，他不能推知其他三個方角，就不再重複教了。」&quot;, 9], [&quot;雍也&quot;, &quot;子曰：「中人以上，可以語上也；中人以下，不可以語上也。」&quot;, &quot;孔子說：「中等程度以上的人，可以和他談高深的學問；中等程度以下的人，不可以和他談高深的學問。」&quot;, 9], [&quot;衛靈公&quot;, &quot;子曰：「有教無類。」&quot;, &quot;孔子說：「教育不分類別。」（不論貴賤、貧富、地域，人人都可以受教育。）&quot;, 10], [&quot;述而&quot;, &quot;子曰：「自行束脩以上，吾未嘗無誨焉。」&quot;, &quot;孔子說：「只要主動帶著一束乾肉來作為見面禮的，我從來沒有不教的。」&quot;, 10], [&quot;陽貨&quot;, &quot;子曰：「性相近也，習相遠也。」&quot;, &quot;孔子說：「人的本性原本相近，因為後天的習染不同，才相差越來越遠。」&quot;, 10], [&quot;述而&quot;, &quot;子以四教：文、行、忠、信。&quot;, &quot;孔子用四方面教導學生：文獻典籍、德行實踐、對人盡心、與人守信。&quot;, 10], [&quot;述而&quot;, &quot;子曰：「志於道，據於德，依於仁，游於藝。」&quot;, &quot;孔子說：「立志追求道，以德為根據，以仁為依靠，在六藝中涵養遊習。」&quot;, 10], [&quot;述而&quot;, &quot;子曰：「默而識之，學而不厭，誨人不倦，何有於我哉？」&quot;, &quot;孔子說：「默默記住所學的，學習從不滿足，教導別人從不厭倦，這些事對我來說有什麼困難呢？」&quot;, 10], [&quot;公冶長&quot;, &quot;宰予晝寢。子曰：「朽木不可雕也，糞土之牆不可杇也；於予與何誅？」子曰：「始吾於人也，聽其言而信其行；今吾於人也，聽其言而觀其行。於予與改是。」&quot;, &quot;宰予白天睡覺。孔子說：「腐爛的木頭無法雕刻，糞土堆成的牆無法粉刷；對宰予這個人，我還責備他什麼呢？」孔子又說：「以前我對人，聽了他說的話就相信他的行為；現在我對人，聽了他說的話還要觀察他的行為。是宰予讓我改變了這種態度。」&quot;, 11], [&quot;公冶長&quot;, &quot;子謂子貢曰：「女與回也孰愈？」對曰：「賜也何敢望回？回也聞一以知十，賜也聞一以知二。」子曰：「弗如也！吾與女弗如也。」&quot;, &quot;孔子問子貢：「你和顏回誰比較強？」子貢回答：「我怎麼敢和顏回比？顏回聽到一件事能推知十件，我聽到一件只能推知兩件。」孔子說：「是比不上他。我和你都比不上他。」&quot;, 11], [&quot;先進&quot;, &quot;子貢問：「師與商也孰賢？」子曰：「師也過，商也不及。」曰：「然則師愈與？」子曰：「過猶不及。」&quot;, &quot;子貢問：「子張和子夏誰比較好？」孔子說：「子張做得太過頭，子夏做得不夠。」子貢說：「那麼子張比較好嗎？」孔子說：「做過頭和做不夠，是一樣的。」&quot;, 11], [&quot;雍也&quot;, &quot;冉求曰：「非不說子之道，力不足也。」子曰：「力不足者，中道而廢。今女畫。」&quot;, &quot;冉求說：「不是我不喜歡老師的道理，而是我能力不夠。」孔子說：「能力不夠的人，是走到半路才停下來；現在你是自己畫地自限。」&quot;, 11], [&quot;顏淵&quot;, &quot;樊遲問仁。子曰：「愛人。」問知。子曰：「知人。」&quot;, &quot;樊遲問什麼是仁。孔子說：「愛人。」又問什麼是智。孔子說：「了解人。」&quot;, 12], [&quot;顏淵&quot;, &quot;司馬牛問仁。子曰：「仁者，其言也訒。」&quot;, &quot;司馬牛問什麼是仁。孔子說：「仁者說話很謹慎，不輕易出口。」&quot;, 12], [&quot;子路&quot;, &quot;樊遲問仁。子曰：「居處恭，執事敬，與人忠。雖之夷狄，不可棄也。」&quot;, &quot;樊遲問仁。孔子說：「平日待人處事要恭敬，做事要認真謹慎，對人要盡心。即使到了邊遠的外族地區，也不能放棄這些原則。」&quot;, 12], [&quot;雍也&quot;, &quot;「夫仁者，己欲立而立人，己欲達而達人。能近取譬，可謂仁之方也已。」&quot;, &quot;「所謂仁，就是自己想要站得住，也幫助別人站得住；自己想要通達，也幫助別人通達。能從身邊的事推己及人，就可以說是實踐仁的方法了。」&quot;, 12], [&quot;述而&quot;, &quot;子曰：「仁遠乎哉？我欲仁，斯仁至矣。」&quot;, &quot;孔子說：「仁離我們很遠嗎？只要我想要仁，仁就來了。」&quot;, 12], [&quot;衛靈公&quot;, &quot;子貢問曰：「有一言而可以終身行之者乎？」子曰：「其恕乎！己所不欲，勿施於人。」&quot;, &quot;子貢問：「有沒有一句話可以終身奉行的？」孔子說：「大概就是『恕』吧！自己不想要的，不要加在別人身上。」&quot;, 13], [&quot;顏淵&quot;, &quot;仲弓問仁。子曰：「出門如見大賓，使民如承大祭。己所不欲，勿施於人。在邦無怨，在家無怨。」&quot;, &quot;仲弓問仁。孔子說：「出門待人，要像接待貴賓一樣恭敬；役使百姓，要像承辦重大祭典一樣慎重。自己不想要的，不要加在別人身上。這樣在國家做事沒有人怨恨，在家裡也沒有人怨恨。」&quot;, 13], [&quot;公冶長&quot;, &quot;子貢曰：「我不欲人之加諸我也，吾亦欲無加諸人。」子曰：「賜也，非爾所及也。」&quot;, &quot;子貢說：「我不希望別人把不合理的事加在我身上，我也不想把不合理的事加在別人身上。」孔子說：「賜啊，這不是你目前做得到的。」&quot;, 13], [&quot;顏淵&quot;, &quot;顏淵問仁。子曰：「克己復禮為仁。一日克己復禮，天下歸仁焉。為仁由己，而由人乎哉？」顏淵曰：「請問其目。」子曰：「非禮勿視，非禮勿聽，非禮勿言，非禮勿動。」顏淵曰：「回雖不敏，請事斯語矣。」&quot;, &quot;顏淵問仁。孔子說：「克制自己，使言行回到禮的規範，就是仁。一旦能做到克己復禮，天下人都會稱許你是仁人。實踐仁全靠自己，難道靠別人嗎？」顏淵說：「請問具體的條目。」孔子說：「不合禮的不看，不合禮的不聽，不合禮的不說，不合禮的不做。」顏淵說：「我雖然不聰明，也要照這些話去做。」&quot;, 14], [&quot;八佾&quot;, &quot;子曰：「人而不仁，如禮何？人而不仁，如樂何？」&quot;, &quot;孔子說：「一個人如果沒有仁心，要禮做什麼？一個人如果沒有仁心，要音樂做什麼？」&quot;, 14], [&quot;學而&quot;, &quot;子曰：「巧言令色，鮮矣仁！」&quot;, &quot;孔子說：「說話花言巧語、臉色裝得和善討好的人，很少有仁德。」&quot;, 15], [&quot;子路&quot;, &quot;子曰：「剛、毅、木、訥近仁。」&quot;, &quot;孔子說：「剛強、果決、質樸、說話謹慎，這四種品質接近仁。」&quot;, 15], [&quot;衛靈公&quot;, &quot;子曰：「巧言亂德。小不忍，則亂大謀。」&quot;, &quot;孔子說：「花言巧語會擾亂道德。小事情不能忍耐，就會壞了大計畫。」&quot;, 15], [&quot;憲問&quot;, &quot;子曰：「有德者必有言，有言者不必有德。仁者必有勇，勇者不必有仁。」&quot;, &quot;孔子說：「有道德的人一定有好的言論，有好言論的人不一定有道德。仁者一定勇敢，勇敢的人不一定有仁德。」&quot;, 15], [&quot;陽貨&quot;, &quot;子曰：「鄉原，德之賊也。」&quot;, &quot;孔子說：「看起來四面討好、人人都說他好的老好人，是敗壞道德的人。」&quot;, 15], [&quot;里仁&quot;, &quot;子曰：「參乎！吾道一以貫之。」曾子曰：「唯。」子出，門人問曰：「何謂也？」曾子曰：「夫子之道，忠恕而已矣。」&quot;, &quot;孔子說：「參啊！我的學說有一個根本的道理貫穿其中。」曾子說：「是的。」孔子出去後，其他學生問：「這是什麼意思？」曾子說：「老師的學說，就是忠和恕罷了。」&quot;, 16], [&quot;學而&quot;, &quot;曾子曰：「吾日三省吾身：為人謀而不忠乎？與朋友交而不信乎？傳不習乎？」&quot;, &quot;曾子說：「我每天多次反省自己：替人辦事有沒有盡心？和朋友交往有沒有不守信？老師傳授的有沒有溫習？」&quot;, 16], [&quot;泰伯&quot;, &quot;曾子曰：「士不可以不弘毅，任重而道遠。仁以為己任，不亦重乎？死而後已，不亦遠乎？」&quot;, &quot;曾子說：「讀書人不可以不胸懷寬廣、意志堅強，因為責任重大而道路遙遠。把實現仁當作自己的責任，不是很重大嗎？到死才停止，不是很遙遠嗎？」&quot;, 16], [&quot;衛靈公&quot;, &quot;子曰：「志士仁人，無求生以害仁，有殺身以成仁。」&quot;, &quot;孔子說：「有志之士與仁德之人，不會為了求生而損害仁，只會犧牲生命來成全仁。」&quot;, 17], [&quot;里仁&quot;, &quot;子曰：「朝聞道，夕死可矣。」&quot;, &quot;孔子說：「早上明白了真理，晚上死去也甘心。」&quot;, 17], [&quot;里仁&quot;, &quot;子曰：「富與貴，是人之所欲也；不以其道得之，不處也。貧與賤，是人之所惡也；不以其道得之，不去也。君子去仁，惡乎成名？君子無終食之間違仁，造次必於是，顛沛必於是。」&quot;, &quot;孔子說：「富與貴是人人想要的，不用正當方法得到，君子不接受。貧與賤是人人厭惡的，不用正當方法擺脫，君子不擺脫。君子離開了仁，怎麼成就名聲？君子連吃一頓飯的時間都不違背仁，匆忙時一定如此，顛沛流離時也一定如此。」&quot;, 17], [&quot;述而&quot;, &quot;子曰：「飯疏食飲水，曲肱而枕之，樂亦在其中矣。不義而富且貴，於我如浮雲。」&quot;, &quot;孔子說：「吃粗飯、喝冷水，彎起手臂當枕頭，快樂也就在其中了。用不正當手段得來的富貴，對我來說就像天上的浮雲。」&quot;, 17], [&quot;子罕&quot;, &quot;子曰：「三軍可奪帥也，匹夫不可奪志也。」&quot;, &quot;孔子說：「三軍的主帥可以被奪走，一個平凡人的志向卻不能被奪走。」&quot;, 17], [&quot;子罕&quot;, &quot;子曰：「歲寒，然後知松柏之後彫也。」&quot;, &quot;孔子說：「到了一年中最寒冷的時候，才知道松柏是最後凋謝的。」&quot;, 17], [&quot;為政&quot;, &quot;子曰：「君子不器。」&quot;, &quot;孔子說：「君子不像器具那樣只有一種用途。」&quot;, 18], [&quot;述而&quot;, &quot;子曰：「君子坦蕩蕩，小人長戚戚。」&quot;, &quot;孔子說：「君子心胸寬廣、坦然自在，小人常常憂慮不安。」&quot;, 18], [&quot;子罕&quot;, &quot;子曰：「知者不惑，仁者不憂，勇者不懼。」&quot;, &quot;孔子說：「有智慧的人不迷惑，有仁德的人不憂愁，有勇氣的人不畏懼。」&quot;, 18], [&quot;為政&quot;, &quot;子貢問君子。子曰：「先行其言而後從之。」&quot;, &quot;子貢問怎樣才是君子。孔子說：「先把要說的事做到了，再把它說出來。」&quot;, 18], [&quot;述而&quot;, &quot;子溫而厲，威而不猛，恭而安。&quot;, &quot;孔子溫和而嚴肅，有威儀而不兇猛，恭敬而安詳。&quot;, 18], [&quot;堯曰&quot;, &quot;子曰：「不知命，無以為君子也；不知禮，無以立也；不知言，無以知人也。」&quot;, &quot;孔子說：「不懂得天命，就無法成為君子；不懂得禮，就無法立身處世；不懂得分辨言語，就無法了解別人。」&quot;, 18], [&quot;里仁&quot;, &quot;子曰：「君子喻於義，小人喻於利。」&quot;, &quot;孔子說：「君子懂得的是道義，小人懂得的是利益。」&quot;, 19], [&quot;里仁&quot;, &quot;子曰：「君子懷德，小人懷土；君子懷刑，小人懷惠。」&quot;, &quot;孔子說：「君子心中想的是道德，小人想的是鄉土與安居；君子想的是法度，小人想的是好處。」&quot;, 19], [&quot;衛靈公&quot;, &quot;子曰：「君子求諸己，小人求諸人。」&quot;, &quot;孔子說：「君子要求自己，小人要求別人。」&quot;, 19], [&quot;衛靈公&quot;, &quot;在陳絕糧，從者病，莫能興。子路慍見曰：「君子亦有窮乎？」子曰：「君子固窮，小人窮斯濫矣。」&quot;, &quot;孔子一行在陳國斷了糧食，跟隨的人都餓病了，爬不起來。子路生氣地來見孔子說：「君子也會有窮困的時候嗎？」孔子說：「君子在窮困時仍能堅守原則，小人一窮困就胡作非為了。」&quot;, 19], [&quot;憲問&quot;, &quot;子曰：「貧而無怨難，富而無驕易。」&quot;, &quot;孔子說：「貧窮而不怨恨很難，富有而不驕傲比較容易。」&quot;, 19], [&quot;學而&quot;, &quot;子貢曰：「貧而無諂，富而無驕，何如？」子曰：「可也。未若貧而樂，富而好禮者也。」&quot;, &quot;子貢說：「貧窮而不諂媚，富有而不驕傲，怎麼樣？」孔子說：「還可以。但比不上貧窮而快樂、富有而愛好禮的人。」&quot;, 19], [&quot;子路&quot;, &quot;子曰：「君子和而不同，小人同而不和。」&quot;, &quot;孔子說：「君子能與人和諧相處，但不盲目附和；小人盲目附和，卻不能真正和諧。」&quot;, 20], [&quot;為政&quot;, &quot;子曰：「君子周而不比，小人比而不周。」&quot;, &quot;孔子說：「君子普遍團結人，而不結黨營私；小人結黨營私，而不普遍團結人。」&quot;, 20], [&quot;衛靈公&quot;, &quot;子曰：「君子矜而不爭，群而不黨。」&quot;, &quot;孔子說：「君子莊重自持而不與人爭奪，合群而不結黨。」&quot;, 20], [&quot;子路&quot;, &quot;子曰：「君子泰而不驕，小人驕而不泰。」&quot;, &quot;孔子說：「君子安詳舒泰而不驕傲，小人驕傲而不安詳舒泰。」&quot;, 20], [&quot;八佾&quot;, &quot;子曰：「君子無所爭。必也射乎！揖讓而升，下而飲。其爭也君子。」&quot;, &quot;孔子說：「君子沒有什麼可爭的。如果一定要爭，大概就是射箭比賽吧！比賽前互相作揖謙讓再上場，比完下來一起喝酒。這種競爭也是君子之爭。」&quot;, 20], [&quot;季氏&quot;, &quot;孔子曰：「君子有三戒：少之時，血氣未定，戒之在色；及其壯也，血氣方剛，戒之在鬥；及其老也，血氣既衰，戒之在得。」&quot;, &quot;孔子說：「君子有三件事要戒備：年輕時血氣還沒穩定，要戒女色；到了壯年，血氣正旺盛，要戒爭強好鬥；到了老年，血氣已經衰弱，要戒貪得無厭。」&quot;, 21], [&quot;季氏&quot;, &quot;孔子曰：「君子有三畏：畏天命，畏大人，畏聖人之言。小人不知天命而不畏也，狎大人，侮聖人之言。」&quot;, &quot;孔子說：「君子有三種敬畏：敬畏天命，敬畏地位崇高的人，敬畏聖人的話。小人不知道天命所以不敬畏，輕慢地位崇高的人，侮辱聖人的話。」&quot;, 21], [&quot;季氏&quot;, &quot;孔子曰：「君子有九思：視思明，聽思聰，色思溫，貌思恭，言思忠，事思敬，疑思問，忿思難，見得思義。」&quot;, &quot;孔子說：「君子有九件事要用心想：看要想是否看清楚，聽要想是否聽明白，臉色要想是否溫和，容貌要想是否恭敬，說話要想是否忠誠，做事要想是否認真，有疑問要想到請教，發怒時要想到後果與禍患，看到利益要想是否合乎道義。」&quot;, 21], [&quot;雍也&quot;, &quot;子曰：「質勝文則野，文勝質則史。文質彬彬，然後君子。」&quot;, &quot;孔子說：「質樸多於文采，就顯得粗野；文采多於質樸，就顯得虛浮。文采和質樸搭配得當，才是君子。」&quot;, 22], [&quot;顏淵&quot;, &quot;棘子成曰：「君子質而已矣，何以文為？」子貢曰：「惜乎，夫子之說君子也！駟不及舌。文猶質也，質猶文也。虎豹之鞟，猶犬羊之鞟。」&quot;, &quot;棘子成說：「君子只要有好的本質就夠了，要那些文采做什麼？」子貢說：「可惜啊，您這樣談論君子！話一說出口，四匹馬也追不回來。文采和本質同樣重要。如果把虎豹和犬羊的毛都拔掉，剩下的皮就分不出差別了。」&quot;, 22], [&quot;八佾&quot;, &quot;林放問禮之本。子曰：「大哉問！禮，與其奢也，寧儉；喪，與其易也，寧戚。」&quot;, &quot;林放問禮的根本。孔子說：「這個問題問得真好！一般的禮，與其奢侈，寧可節儉；喪禮，與其儀式周到，寧可內心真正悲傷。」&quot;, 22], [&quot;里仁&quot;, &quot;子曰：「見賢思齊焉，見不賢而內自省也。」&quot;, &quot;孔子說：「看到賢能的人，就想著向他看齊；看到不賢的人，就反省自己有沒有同樣的缺點。」&quot;, 23], [&quot;學而&quot;, &quot;子曰：「君子不重則不威，學則不固。主忠信，無友不如己者，過則勿憚改。」&quot;, &quot;孔子說：「君子不莊重就沒有威嚴，學習也不會牢固。要以忠誠守信為主，不要和不如自己的人交朋友，有了過錯不要怕改正。」&quot;, 23], [&quot;衛靈公&quot;, &quot;子曰：「過而不改，是謂過矣。」&quot;, &quot;孔子說：「有了過錯而不改正，這才真正叫做過錯。」&quot;, 23], [&quot;子張&quot;, &quot;子貢曰：「君子之過也，如日月之食焉：過也，人皆見之；更也，人皆仰之。」&quot;, &quot;子貢說：「君子的過錯，就像日蝕月蝕一樣：犯錯時，人人都看得見；改正後，人人都仰望他。」&quot;, 23], [&quot;子張&quot;, &quot;子夏曰：「小人之過也必文。」&quot;, &quot;子夏說：「小人犯了過錯，一定會掩飾。」&quot;, 23], [&quot;衛靈公&quot;, &quot;子曰：「躬自厚而薄責於人，則遠怨矣。」&quot;, &quot;孔子說：「多責備自己，少責備別人，就可以遠離怨恨了。」&quot;, 23], [&quot;為政&quot;, &quot;子游問孝。子曰：「今之孝者，是謂能養。至於犬馬，皆能有養；不敬，何以別乎？」&quot;, &quot;子游問什麼是孝。孔子說：「現在所謂的孝，只是說能供養父母。但就連狗和馬，人也都能養活牠們；如果對父母不尊敬，那和養狗養馬有什麼區別呢？」&quot;, 24], [&quot;為政&quot;, &quot;子夏問孝。子曰：「色難。有事，弟子服其勞；有酒食，先生饌，曾是以為孝乎？」&quot;, &quot;子夏問什麼是孝。孔子說：「難的是對父母保持和悅的臉色。有事情時年輕人去做，有酒飯時讓長輩先吃，難道這樣就算是孝了嗎？」&quot;, 24], [&quot;為政&quot;, &quot;孟武伯問孝。子曰：「父母唯其疾之憂。」&quot;, &quot;孟武伯問什麼是孝。孔子說：「讓父母只需要擔心子女的疾病（其他事都不用操心）。」&quot;, 24], [&quot;為政&quot;, &quot;孟懿子問孝。子曰：「無違。」……子曰：「生，事之以禮；死，葬之以禮，祭之以禮。」&quot;, &quot;孟懿子問什麼是孝。孔子說：「不要違背。」（後來孔子向樊遲解釋）「父母活著時，依禮侍奉他們；死了，依禮安葬、依禮祭祀。」&quot;, 24], [&quot;里仁&quot;, &quot;子曰：「父母在，不遠遊，遊必有方。」&quot;, &quot;孔子說：「父母在世時，不出遠門；如果一定要出遠門，必須告訴父母去處。」&quot;, 25], [&quot;里仁&quot;, &quot;子曰：「父母之年，不可不知也。一則以喜，一則以懼。」&quot;, &quot;孔子說：「父母的年紀不能不記在心裡。一方面因為他們長壽而歡喜，一方面因為他們衰老而憂懼。」&quot;, 25], [&quot;里仁&quot;, &quot;子曰：「事父母幾諫，見志不從，又敬不違，勞而不怨。」&quot;, &quot;孔子說：「侍奉父母，發現他們有過錯，要委婉地勸諫。看到父母不接受，仍然保持恭敬、不冒犯，雖然憂心勞苦，也不怨恨。」&quot;, 25], [&quot;學而&quot;, &quot;曾子曰：「慎終追遠，民德歸厚矣。」&quot;, &quot;曾子說：「謹慎地辦理父母的喪事，誠心地追念祖先，百姓的道德風氣就會歸於淳厚了。」&quot;, 25], [&quot;學而&quot;, &quot;子曰：「弟子入則孝，出則弟，謹而信，汎愛眾，而親仁。行有餘力，則以學文。」&quot;, &quot;孔子說：「年輕人在家要孝順父母，出外要敬愛兄長，言行謹慎而守信，廣泛地愛護眾人，親近有仁德的人。做到這些還有餘力，就去學習文獻知識。」&quot;, 25], [&quot;陽貨&quot;, &quot;宰我問：「三年之喪，期已久矣。君子三年不為禮，禮必壞；三年不為樂，樂必崩。舊穀既沒，新穀既升，鑽燧改火，期可已矣。」子曰：「食夫稻，衣夫錦，於女安乎？」曰：「安。」「女安，則為之！夫君子之居喪，食旨不甘，聞樂不樂，居處不安，故不為也。今女安，則為之！」宰我出。子曰：「予之不仁也！子生三年，然後免於父母之懷。夫三年之喪，天下之通喪也，予也有三年之愛於其父母乎？」&quot;, &quot;宰我問：「為父母守喪三年，時間太長了。君子三年不習禮，禮一定會荒廢；三年不奏樂，樂一定會失傳。舊穀吃完了，新穀也收成了，鑽木取火的木頭也換了一輪，守喪一年就可以了。」孔子說：「（守喪不到三年）就吃白米飯、穿錦緞衣，你心安嗎？」宰我說：「心安。」孔子說：「你心安，就去做吧！君子守喪時，吃美食不覺得香甜，聽音樂不覺得快樂，住在家裡不覺得安適，所以不這樣做。現在你既然心安，就去做吧！」宰我出去後，孔子說：「宰予真是不仁啊！孩子生下來三年，才能離開父母的懷抱。守喪三年，是天下通行的喪禮。宰予難道沒有從父母那裡得到三年的愛嗎？」&quot;, 26], [&quot;子路&quot;, &quot;葉公語孔子曰：「吾黨有直躬者，其父攘羊，而子證之。」孔子曰：「吾黨之直者異於是：父為子隱，子為父隱，直在其中矣。」&quot;, &quot;葉公告訴孔子：「我們那裡有個正直的人，他的父親偷了羊，他就出面作證。」孔子說：「我們那裡正直的人不是這樣的：父親替兒子隱瞞，兒子替父親隱瞞，正直就在這裡面了。」&quot;, 27], [&quot;季氏&quot;, &quot;孔子曰：「益者三友，損者三友。友直，友諒，友多聞，益矣。友便辟，友善柔，友便佞，損矣。」&quot;, &quot;孔子說：「有益的朋友有三種，有害的朋友有三種。和正直的人、誠信的人、見聞廣博的人交朋友，是有益的。和逢迎諂媚的人、表面和善而內心奸詐的人、花言巧語的人交朋友，是有害的。」&quot;, 29], [&quot;顏淵&quot;, &quot;曾子曰：「君子以文會友，以友輔仁。」&quot;, &quot;曾子說：「君子用學問來結交朋友，用朋友來幫助自己培養仁德。」&quot;, 29], [&quot;衛靈公&quot;, &quot;子貢問為仁。子曰：「工欲善其事，必先利其器。居是邦也，事其大夫之賢者，友其士之仁者。」&quot;, &quot;子貢問怎樣培養仁德。孔子說：「工匠要把工作做好，一定要先把工具磨利。住在一個國家，就要事奉那裡賢能的大夫，結交那裡有仁德的士人。」&quot;, 29], [&quot;衛靈公&quot;, &quot;子曰：「道不同 uot;, &quot;子曰：「若聖與仁，則吾豈敢？抑為之不厭，誨人不倦，則可謂云爾已矣。」&quot;, &quot;孔子說：「說到聖與仁，我怎麼敢當？只不過是努力去做而不厭倦，教導別人而不疲倦，可以這麼說罷了。」&quot;, 40], [&quot;雍也&quot;, &quot;子見南子，子路不說。夫子矢之曰：「予所否者，天厭之！天厭之！」&quot;, &quot;孔子去見衛靈公的夫人南子，子路不高興。孔子發誓說：「如果我做了不對的事，讓老天厭棄我！讓老天厭棄我！」&quot;, 41], [&quot;鄉黨&quot;, &quot;寢不尸，居不容。&quot;, &quot;睡覺時不像死屍一樣直挺挺地躺著，平日在家不像做客或祭祀時那樣拘謹。&quot;, 42], [&quot;鄉黨&quot;, &quot;不撤薑食，不多食。&quot;, &quot;每餐都有薑，但不多吃。&quot;, 42], [&quot;述而&quot;, &quot;子之燕居，申申如也，夭夭如也。&quot;, &quot;孔子在家閒居時，衣冠整齊而舒展，神情和悅。&quot;, 42], [&quot;述而&quot;, &quot;子釣而不綱，弋不射宿。&quot;, &quot;孔子釣魚，但不用大網捕魚；用帶繩的箭射鳥，但不射歸巢棲息的鳥。&quot;, 42], [&quot;泰伯&quot;, &quot;子曰：「師摯之始，關雎之亂，洋洋乎盈耳哉！」&quot;, &quot;孔子說：「從太師摯開始演奏，到最後〈關雎〉的合樂，美妙的音樂充滿了耳朵啊！」&quot;, 43], [&quot;為政&quot;, &quot;子曰：「詩三百，一言以蔽之，曰：『思無邪』。」&quot;, &quot;孔子說：「《詩經》三百多篇，用一句話來概括，就是『思想純正』。」&quot;, 43], [&quot;衛靈公&quot;, &quot;衛靈公問陳於孔子。孔子對曰：「俎豆之事，則嘗聞之矣；軍旅之事，未之學也。」明日遂行。&quot;, &quot;衛靈公向孔子請教排兵布陣。孔子回答：「祭祀禮儀的事，我曾經聽過；用兵打仗的事，我沒有學過。」第二天孔子就離開了衛國。&quot;, 44], [&quot;微子&quot;, &quot;齊人歸女樂，季桓子受之，三日不朝，孔子行。&quot;, &quot;齊國送來一批歌舞女子，季桓子接受了，三天不上朝，孔子就離開了魯國。&quot;, 44], [&quot;先進&quot;, &quot;子畏於匡，顏淵後。子曰：「吾以女為死矣。」曰：「子在，回何敢死？」&quot;, &quot;孔子在匡地被圍困，顏淵最後才趕到。孔子說：「我以為你已經死了。」顏淵說：「老師還在，我怎麼敢死？」&quot;, 45], [&quot;子張&quot;, &quot;叔孫武叔毀仲尼。子貢曰：「無以為也！仲尼不可毀也。他人之賢者，丘陵也，猶可踰也；仲尼，日月也，無得而踰焉。人雖欲自絕，其何傷於日月乎？多見其不知量也。」&quot;, &quot;叔孫武叔毀謗孔子。子貢說：「不要這樣做！孔子是毀謗不了的。別人的賢能像丘陵，還可以越過；孔子像日月，是無法越過的。一個人雖然想要和日月斷絕，對日月又有什麼損害呢？只顯出他不自量力罷了。」&quot;, 46], [&quot;子張&quot;, &quot;叔孫武叔語大夫於朝曰：「子貢賢於仲尼。」子服景伯以告子貢。子貢曰：「譬之宮牆，賜之牆也及肩，窺見室家之好。夫子之牆數仞，不得其門而入，不見宗廟之美，百官之富。得其門者或寡矣。夫子之云，不亦宜乎！」&quot;, &quot;叔孫武叔在朝廷上對大夫們說：「子貢比孔子賢能。」子服景伯把這話告訴子貢。子貢說：「拿圍牆來比喻吧：我的圍牆只有肩膀高，別人可以看到屋裡的美好；老師的圍牆有好幾丈高，找不到門進去，就看不到宗廟的壯美、房屋的豐富。能找到門的人或許很少。叔孫先生這樣說，不也很自然嗎！」&quot;, 46], [&quot;為政&quot;, &quot;子曰：「攻乎異端，斯害也已。」&quot;, &quot;孔子說：「（一解）攻擊不同的學說，這是有害的。（另一解）專門鑽研不正統的學說，這是有害的。（又一解）攻擊錯誤的言論，禍害就可以停止了。」&quot;, 48], [&quot;為政&quot;, &quot;子曰：「非其鬼而祭之，諂也。見義不為，無勇也。」&quot;, &quot;孔子說：「不是自己應該祭祀的鬼神卻去祭祀，是諂媚。看到合乎道義的事卻不去做，是沒有勇氣。」&quot;, 49], [&quot;雍也&quot;, &quot;樊遲問知。子曰：「務民之義，敬鬼神而遠之，可謂知矣。」&quot       <h2>二十篇索引</h2>
