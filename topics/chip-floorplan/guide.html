    <article class="lesson-content">

      <script>
      (function () {
        if (window.__cfLib) return; window.__cfLib = 1;

        function btn(t, k) { var b = document.createElement('button'); b.type = 'button'; b.textContent = t; if (k !== undefined) b.setAttribute('data-k', k);
          b.style.cssText = 'padding:4px 10px;margin:4px 6px 0 0;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer;font:inherit;font-size:0.9em'; return b; }
        function mark(bar, k) { bar.querySelectorAll('button').forEach(function (b) { var on = b.getAttribute('data-k') === String(k); b.style.background = on ? 'var(--accent-soft)' : 'var(--surface)'; b.style.fontWeight = on ? 'bold' : 'normal'; }); }
        function head(root, q) { if (q) { var p = document.createElement('p'); p.style.margin = '0 0 8px'; p.innerHTML = q; root.appendChild(p); } }
        function el(tag, css, html) { var e = document.createElement(tag); if (css) e.style.cssText = css; if (html !== undefined) e.innerHTML = html; return e; }
        function n1(v) { return Math.round(v * 10) / 10; }
        function f1(v) { return (Math.round(v * 10) / 10).toString(); }
        function f2(v) { return (Math.round(v * 100) / 100).toString(); }
        function tx(x, y, s, sz, c, anc) { return '<text x="' + n1(x) + '" y="' + n1(y) + '" font-size="' + sz + '" fill="' + (c || 'currentColor') + '" text-anchor="' + (anc || 'middle') + '">' + s + '</text>'; }
        function ln(x1, y1, x2, y2, c, w, ex) { return '<line x1="' + n1(x1) + '" y1="' + n1(y1) + '" x2="' + n1(x2) + '" y2="' + n1(y2) + '" stroke="' + c + '" stroke-width="' + (w || 1) + '" ' + (ex || '') + '/>'; }
        function svgw(vb, inner) { return '<svg viewBox="' + vb + '" style="width:100%;display:block;color:var(--text)">' + inner + '</svg>'; }
        function slider(root, lab, min, max, step, val, fmt, k, cb) { var l = el('label', 'display:block;font-size:0.88em;margin-top:6px', lab + '：<b></b>'); var s = document.createElement('input');
          s.type = 'range'; s.min = min; s.max = max; s.step = step; s.value = val; s.style.cssText = 'width:100%;display:block'; if (k) s.setAttribute('data-k', k); l.appendChild(s); root.appendChild(l);
          function u() { l.querySelector('b').textContent = fmt(+s.value); cb(+s.value); } s.addEventListener('input', u); return u; }
        function nice(lo, hi, n) { var span = hi - lo || 1, st = Math.pow(10, Math.floor(Math.log10(span / n))), e = span / n / st; st *= e >= 5 ? 5 : e >= 2 ? 2 : 1; var t = [], v = Math.ceil(lo / st - 1e-9) * st; for (; v <= hi + 1e-9; v += st) t.push(Math.round(v / st) * st); return t; }
        function fmtT(v) { var a = Math.abs(v); return a >= 1e6 ? f1(v / 1e6) + 'M' : a >= 1e4 ? f1(v / 1e3) + 'k' : (Math.round(v * 100) / 100).toString(); }
        var CID = 0;
        function chart(W, H, S, o) { o = o || {}; var L = 48, R = 12, T = 22, B = 34, xs = [], ys = [];
          S.forEach(function (s) { s.d.forEach(function (p) { xs.push(p[0]); if (isFinite(p[1])) ys.push(p[1]); }); });
          var x0 = o.x0 !== undefined ? o.x0 : Math.min.apply(null, xs), x1 = o.x1 !== undefined ? o.x1 : Math.max.apply(null, xs);
          var y0 = o.y0 !== undefined ? o.y0 : Math.min(0, Math.min.apply(null, ys)), y1 = o.y1 !== undefined ? o.y1 : Math.max.apply(null, ys) * 1.08 || 1;
          function sx(v) { return L + (v - x0) / (x1 - x0 || 1) * (W - L - R); } function sy(v) { return H - B - (v - y0) / (y1 - y0 || 1) * (H - T - B); }
          var id = 'qc' + (++CID), g = '<clipPath id="' + id + '"><rect x="' + L + '" y="' + (T - 2) + '" width="' + (W - L - R) + '" height="' + (H - T - B + 4) + '"/></clipPath>';
          nice(y0, y1, 4).forEach(function (v) { g += ln(L, sy(v), W - R, sy(v), 'var(--border)', 0.6, 'stroke-dasharray="2 3"') + tx(L - 5, sy(v) + 3, fmtT(v), 9, 'var(--text-muted)', 'end'); });
          nice(x0, x1, 6).forEach(function (v) { g += tx(sx(v), H - B + 14, fmtT(v), 9, 'var(--text-muted)'); });
          g += ln(L, T - 4, L, H - B, '#999') + ln(L, H - B, W - R, H - B, '#999');
          if (o.xl) g += tx((L + W - R) / 2, H - 4, o.xl, 9.5, 'var(--text-muted)');
          if (o.yl) g += tx(L - 40, T - 8, o.yl, 9.5, 'var(--text-muted)', 'start');
          (o.hl || []).forEach(function (h) { g += ln(L, sy(h.y), W - R, sy(h.y), h.c, 1, 'stroke-dasharray="5 4"') + tx(W - R - 2, sy(h.y) - 4, h.n, 9, h.c, 'end'); });
          (o.vl || []).forEach(function (h) { g += ln(sx(h.x), T, sx(h.x), H - B, h.c, 1, 'stroke-dasharray="5 4"') + tx(sx(h.x) + 3, H - B - 6, h.n, 9, h.c, 'start'); });
          S.forEach(function (s) { var d = '', m = 'M'; s.d.forEach(function (p) { if (!isFinite(p[1])) { m = 'M'; return; } d += m + n1(sx(p[0])) + ' ' + n1(sy(Math.max(Math.min(p[1], y1 + (y1 - y0)), y0 - (y1 - y0)))); m = 'L'; });
            g += '<path clip-path="url(#' + id + ')" d="' + d + '" fill="none" stroke="' + s.c + '" stroke-width="' + (s.w || 2) + '"' + (s.dash ? ' stroke-dasharray="' + s.dash + '"' : '') + '/>'; });
          (o.pts || []).forEach(function (p) { g += '<circle cx="' + n1(sx(p.x)) + '" cy="' + n1(sy(Math.min(p.y, y1))) + '" r="5" fill="' + p.c + '"/>' + (p.n ? tx(sx(p.x) + 8, sy(Math.min(p.y, y1)) - 6, p.n, 10, p.c, 'start') : ''); });
          var lx = L + 8, ly = T + 2; S.forEach(function (s) { if (!s.n) return; g += ln(lx, ly, lx + 16, ly, s.c, 2.5, s.dash ? 'stroke-dasharray="' + s.dash + '"' : '') + tx(lx + 20, ly + 4, s.n, 9.5, 'currentColor', 'start'); lx += 34 + s.n.length * 10.5; if (lx > W - 120) { lx = L + 8; ly += 15; } });
          return svgw('0 0 ' + W + ' ' + H, g); }
        function rexp(m) { return -Math.log(1 - Math.random()) * m; }

        var _sl = slider; slider = function (root, lab, min, max, step, val, fmt, k, cb) { var u = _sl(root, lab, min, max, step, val, fmt, k, cb); var b = root.lastChild && root.lastChild.querySelector('b'); if (b) b.textContent = fmt(val); return u; };
        var BL = '#3a6ea5', OR = '#e07a2f', GR = '#4caf50', RD = '#e0605a', PU = '#8e5bd1', GY = '#7a8590', GD = '#c9a227', TL = '#2a9d8f';
        function info(root) { var p = el('div', 'margin-top:8px;padding:10px 12px;border-radius:8px;background:var(--accent-soft);line-height:1.7'); root.appendChild(p); return p; }
        function sci(v, d) { if (!isFinite(v)) return '—'; if (v === 0) return '0'; var e = Math.floor(Math.log10(Math.abs(v))), m = v / Math.pow(10, e);
          if (e >= -2 && e <= 5) return (Math.round(v * 1000) / 1000).toLocaleString(); return m.toFixed(d === undefined ? 2 : d) + ' × 10<sup>' + e + '</sup>'; }
        function ns(t) { return t >= 1e-9 ? f2(t * 1e9) + ' ns' : f1(t * 1e12) + ' ps'; }
        function table(rows, headr) { var h = '<table style="width:100%;border-collapse:collapse;margin-top:8px;font-size:0.9em">';
          if (headr) h += '<tr>' + headr.map(function (c) { return '<th style="text-align:left;padding:3px 6px;border-bottom:1px solid var(--border)">' + c + '</th>'; }).join('') + '</tr>';
          rows.forEach(function (r) { h += '<tr>' + r.map(function (c, i) { return '<td style="padding:3px 6px;border-bottom:1px solid var(--border);' + (i ? 'text-align:right;font-family:ui-monospace,monospace' : '') + '">' + c + '</td>'; }).join('') + '</tr>'; });
          return h + '</table>'; }

        /* ---------- floorplan 拼圖 ---------- */
        var DIE = [10, 8];
        var BLOCKS = [
          ['cpu', 'CPU 叢集', 3.0, 2.2, OR, 'hot'], ['gpu', 'GPU', 3.4, 2.6, RD, 'hot'], ['npu', 'NPU', 2.4, 2.0, PU, 'hot'],
          ['slc', '系統快取 SLC', 2.2, 2.0, BL, ''], ['ddr0', 'DDR PHY', 2.6, 0.8, TL, 'edge'], ['ddr1', 'DDR PHY', 2.6, 0.8, TL, 'edge'],
          ['pcie', 'PCIe/USB PHY', 2.0, 0.7, TL, 'edge'], ['isp', 'ISP', 1.8, 1.4, GD, ''], ['vid', '影音編解碼', 1.6, 1.2, GD, ''], ['ana', 'PLL／類比', 1.2, 1.0, GR, 'quiet']];
        var NETS = [['cpu', 'slc', 10], ['gpu', 'slc', 8], ['npu', 'slc', 6], ['slc', 'ddr0', 5], ['slc', 'ddr1', 5], ['isp', 'slc', 3], ['vid', 'slc', 2],
          ['isp', 'npu', 2], ['pcie', 'slc', 2], ['ana', 'cpu', 1], ['ana', 'gpu', 1]];
        var DEMO = { cpu: [0.3, 0.3], gpu: [6.3, 0.3], npu: [0.3, 2.9], slc: [3.9, 2.9], ddr0: [3.7, 7.2], ddr1: [0.6, 7.2], pcie: [7.6, 7.3], isp: [6.4, 3.2], vid: [6.4, 4.8], ana: [0.3, 5.6] };
        var START = { cpu: [0.4, 0.4], gpu: [3.7, 0.4], npu: [7.2, 0.4], slc: [0.4, 3.4], ddr0: [3.1, 3.4], ddr1: [3.1, 4.5], pcie: [6.0, 3.4], isp: [6.2, 4.4], vid: [8.2, 4.4], ana: [0.6, 6.3] };
        function initFloor(root, cfg) {
          head(root, cfg.q); var pos = {}, v = el('div', 'touch-action:none'), inf = info(root), bar = el('div'); root.insertBefore(bar, inf); root.insertBefore(v, bar);
          function load(p) { BLOCKS.forEach(function (b) { pos[b[0]] = p[b[0]].slice(); }); draw(); }
          var b1 = btn('重新開始'), b2 = btn('看一個示範解'); b1.onclick = function () { load(START); }; b2.onclick = function () { load(DEMO); }; bar.appendChild(b1); bar.appendChild(b2);
          var S = 58, O = 20, drag = null;
          function rectOf(k) { var b = BLOCKS.filter(function (x) { return x[0] === k; })[0]; return [pos[k][0], pos[k][1], b[2], b[3]]; }
          function cen(k) { var r = rectOf(k); return [r[0] + r[2] / 2, r[1] + r[3] / 2]; }
          function metrics() { var wl = 0, ov = 0, out = 0, edge = [], quiet = [], hot = [];
            NETS.forEach(function (n) { var a = cen(n[0]), b = cen(n[1]); wl += n[2] * (Math.abs(a[0] - b[0]) + Math.abs(a[1] - b[1])); });
            for (var i = 0; i < BLOCKS.length; i++) { var r = rectOf(BLOCKS[i][0]);
              if (r[0] < -1e-6 || r[1] < -1e-6 || r[0] + r[2] > DIE[0] + 1e-6 || r[1] + r[3] > DIE[1] + 1e-6) out++;
              if (BLOCKS[i][5] === 'edge') { var d = Math.min(r[0], r[1], DIE[0] - r[0] - r[2], DIE[1] - r[1] - r[3]); if (d > 0.35) edge.push(BLOCKS[i][1]); }
              for (var j = i + 1; j < BLOCKS.length; j++) { var s = rectOf(BLOCKS[j][0]); var w = Math.min(r[0] + r[2], s[0] + s[2]) - Math.max(r[0], s[0]), h = Math.min(r[1] + r[3], s[1] + s[3]) - Math.max(r[1], s[1]);
                if (w > 0.01 && h > 0.01) ov += w * h;
                var hi = BLOCKS[i][5], hj = BLOCKS[j][5], g = Math.max(Math.max(r[0], s[0]) - Math.min(r[0] + r[2], s[0] + s[2]), Math.max(r[1], s[1]) - Math.min(r[1] + r[3], s[1] + s[3]));
                if (hi === 'hot' && hj === 'hot' && g < 0.25) hot.push(BLOCKS[i][1] + '＋' + BLOCKS[j][1]);
                if ((hi === 'quiet' && hj === 'hot') || (hj === 'quiet' && hi === 'hot')) { if (g < 0.6) quiet.push(hi === 'quiet' ? BLOCKS[j][1] : BLOCKS[i][1]); } } }
            return { wl: wl, ov: ov, out: out, edge: edge, quiet: quiet, hot: hot }; }
          function draw() { var g = '<rect x="' + O + '" y="' + O + '" width="' + DIE[0] * S + '" height="' + DIE[1] * S + '" fill="var(--surface)" stroke="#999" stroke-width="2" stroke-dasharray="6 4"/>';
            NETS.forEach(function (n) { var a = cen(n[0]), b = cen(n[1]); g += '<line x1="' + n1(O + a[0] * S) + '" y1="' + n1(O + a[1] * S) + '" x2="' + n1(O + b[0] * S) + '" y2="' + n1(O + b[1] * S) + '" stroke="#999" stroke-opacity="0.55" stroke-width="' + (0.6 + n[2] * 0.35) + '"/>'; });
            BLOCKS.forEach(function (b) { var r = rectOf(b[0]); g += '<g data-k="' + b[0] + '" style="cursor:move"><rect x="' + n1(O + r[0] * S) + '" y="' + n1(O + r[1] * S) + '" width="' + n1(r[2] * S) + '" height="' + n1(r[3] * S) + '" rx="4" fill="' + b[4] + '" fill-opacity="0.28" stroke="' + b[4] + '" stroke-width="2"/>' +
              tx(O + (r[0] + r[2] / 2) * S, O + (r[1] + r[3] / 2) * S + 4, b[1], 11, 'currentColor') + '</g>'; });
            g += tx(O + DIE[0] * S / 2, O + DIE[1] * S + 16, '晶片 10 mm × 8 mm（拖曳區塊移動；線的粗細代表頻寬需求）', 10, 'var(--text-muted)');
            v.innerHTML = '<div style="overflow-x:auto"><div style="min-width:480px">' + svgw('0 0 ' + (DIE[0] * S + 2 * O) + ' ' + (DIE[1] * S + 2 * O + 6), g) + '</div></div>';
            var svg = v.querySelector('svg');
            v.querySelectorAll('g[data-k]').forEach(function (e) { e.addEventListener('pointerdown', function (ev) { var p = pt(ev); drag = [e.getAttribute('data-k'), p[0], p[1], pos[e.getAttribute('data-k')].slice()]; svg.setPointerCapture(ev.pointerId); ev.preventDefault(); }); });
            svg.addEventListener('pointermove', function (ev) { if (!drag) return; var p = pt(ev), k = drag[0], r = rectOf(k);
              var x = Math.round((drag[3][0] + (p[0] - drag[1]) / S) * 10) / 10, y = Math.round((drag[3][1] + (p[1] - drag[2]) / S) * 10) / 10;
              pos[k] = [Math.max(0, Math.min(DIE[0] - r[2], x)), Math.max(0, Math.min(DIE[1] - r[3], y))]; draw(); drag[0] = k; });
            svg.addEventListener('pointerup', function () { drag = null; });
            function pt(ev) { var m = svg.getScreenCTM(); return [(ev.clientX - m.e) / m.a, (ev.clientY - m.f) / m.d]; }
            var m = metrics(), msgs = [];
            if (m.ov > 0.01) msgs.push('<span style="color:' + RD + '">區塊重疊 ' + f2(m.ov) + ' mm²</span>');
            if (m.edge.length) msgs.push('<span style="color:' + RD + '">PHY 沒有靠晶片邊緣：' + m.edge.join('、') + '（高速 I/O 要連到封裝的凸塊與走線）</span>');
            if (m.quiet.length) msgs.push('<span style="color:' + OR + '">PLL／類比太靠近 ' + m.quiet.join('、') + '：數位切換雜訊會干擾</span>');
            if (m.hot.length) msgs.push('<span style="color:' + OR + '">高功耗區塊相鄰：' + m.hot.join('、') + '，可能形成熱點</span>');
            inf.innerHTML = '加權連線長度 Σ 頻寬 × 曼哈頓距離 = <b>' + f1(m.wl) + '</b>（愈小愈好；示範解約 ' + f1(demoWl()) + '）。<br>' + (msgs.length ? msgs.join('<br>') : '<span style="color:' + GR + '">沒有重疊，PHY 都靠邊，類比區遠離熱源，高功耗區分散。</span>'); }
          function demoWl() { var s = 0; NETS.forEach(function (n) { var A = DEMO[n[0]], B = DEMO[n[1]], a = BLOCKS.filter(function (x) { return x[0] === n[0]; })[0], b = BLOCKS.filter(function (x) { return x[0] === n[1]; })[0];
            s += n[2] * (Math.abs(A[0] + a[2] / 2 - B[0] - b[2] / 2) + Math.abs(A[1] + a[3] / 2 - B[1] - b[3] / 2)); }); return s; }
          load(START); }

        /* ---------- 互連拓樸 ---------- */
        function topo(t, N) { var k = Math.sqrt(N);
          if (t === 'bus') return [1, 1, N, 1, '所有節點共用一條，頻寬平分'];
          if (t === 'ring') return [N * N / (4 * (N - 1)), Math.floor(N / 2), N, 2, '每個路由器 2 個鄰居'];
          if (t === 'mesh') return [2 * (k * k - 1) / (3 * k) * N / (N - 1), 2 * (k - 1), 2 * k * (k - 1), k, '每個路由器最多 4 個鄰居'];
          if (t === 'torus') return [2 * (k / 4) * N / (N - 1), 2 * Math.floor(k / 2), 2 * N, 2 * k, '網格加上環繞連線'];
          return [1, 1, N * N, N / 2, '任兩點直連；交叉點數 ∝ N²']; }
        function initNoc(root, cfg) {
          head(root, cfg.q); var N = 16, v = el('div'), inf = info(root); root.insertBefore(v, inf);
          slider(root, '節點數 N（完全平方數）', 2, 10, 1, 4, function (k) { return (k * k) + ' 個（' + k + ' × ' + k + '）'; }, 'n', function (k) { N = k * k; draw(); });
          var T = [['bus', '共用匯流排'], ['ring', '環狀'], ['mesh', '二維網格'], ['torus', '二維環面'], ['xbar', '交叉開關']];
          function draw() { var rows = T.map(function (t) { var r = topo(t[0], N); return [t[1], f2(r[0]), r[1], r[2], f1(r[3]), r[4]]; });
            var series = [['ring', OR, '環狀'], ['mesh', BL, '網格'], ['torus', GR, '環面']].map(function (s) { var d = []; for (var k = 2; k <= 10; k++) d.push([k * k, topo(s[0], k * k)[0]]); return { d: d, c: s[1], n: s[2] }; });
            v.innerHTML = table(rows, ['拓樸', '平均跳數', '直徑', '連線數', '二分連線數', '特色']) + chart(640, 200, series, { y0: 0, xl: '節點數 N', yl: '平均跳數' });
            inf.innerHTML = N + ' 個節點時：網格平均約 <b>' + f2(topo('mesh', N)[0]) + '</b> 跳、環狀約 <b>' + f2(topo('ring', N)[0]) + '</b> 跳。環狀的跳數隨 N 線性增加，網格只隨 √N 增加；' +
              '交叉開關只要 1 跳，但連線數 ∝ N²，大到一定規模就放不下。二分連線數愈多，整體頻寬愈大（第 25 課推導）。'; }
          draw(); }

        /* ---------- 長線延遲 ---------- */
        function initWire(root, cfg) {
          head(root, cfg.q); var L = 5, lr = 3.3, c = 0.2, t0 = 4, v = el('div'), inf = info(root); root.insertBefore(v, inf);
          slider(root, '線長 L（mm）', 0.1, 20, 0.1, L, function (x) { return x + ' mm'; }, 'l', function (x) { L = x; draw(); });
          slider(root, '線電阻 r（Ω/mm，對數）', 1, 5, 0.05, lr, function (x) { return Math.round(Math.pow(10, x)).toLocaleString() + ' Ω/mm'; }, 'r', function (x) { lr = x; draw(); });
          slider(root, '線電容 c（pF/mm）', 0.1, 0.4, 0.01, c, function (x) { return x + ' pF/mm'; }, 'c', function (x) { c = x; draw(); });
          slider(root, '中繼器本質延遲 R₀C₀（ps）', 1, 20, 0.5, t0, function (x) { return x + ' ps'; }, 't', function (x) { t0 = x; draw(); });
          function draw() { var r = Math.pow(10, lr), cc = c * 1e-12, RC = t0 * 1e-12, rc = r * cc, d1 = [], d2 = [];
            function un(l) { return 0.5 * rc * l * l + RC; } function rep(l) { return Math.max(RC, (Math.SQRT2 + 2) * Math.sqrt(RC * rc) * l); }
            for (var l = 0; l <= 20.0001; l += 0.2) { d1.push([l, un(l) * 1e9]); d2.push([l, rep(l) * 1e9]); }
            var k = L * Math.sqrt(rc / (2 * RC)), cross = 2 * (Math.SQRT2 + 2) * Math.sqrt(RC / rc);
            v.innerHTML = chart(640, 220, [{ d: d1, c: RD, n: '不加中繼器 ≈ ½rcL²' }, { d: d2, c: BL, n: '最佳中繼器 ≈ 3.41 L√(R₀C₀rc)' }], { y0: 0, y1: Math.max(0.2, rep(20) * 1e9 * 1.3), xl: '線長（mm）', yl: '延遲（ns）', vl: [{ x: L, c: GY, n: L + ' mm' }] });
            inf.innerHTML = 'L = ' + L + ' mm：不加中繼器 <b>' + ns(un(L)) + '</b>，最佳中繼器 <b>' + ns(rep(L)) + '</b>（約 ' + Math.max(1, Math.round(k)) + ' 個中繼器，每段約 ' + f2(L / Math.max(1, k)) + ' mm）。' +
              '<br>未加中繼器的延遲隨 L² 增加，加上中繼器後只隨 L 線性增加；兩者約在 <b>' + f2(cross) + ' mm</b> 交叉。換到電阻小的上層粗金屬（r 小），同樣距離快得多。'; }
          draw(); }

        /* ---------- IR drop ---------- */
        function initIr(root, cfg) {
          head(root, cfg.q); var mode = 'bump', pitch = 8, J = 1.0, Rs = 1.0, v = el('div'), inf = info(root), bar = el('div'); root.insertBefore(bar, inf); root.insertBefore(v, inf);
          [['周邊焊墊（打線）', 'pad'], ['面陣列凸塊（覆晶）', 'bump']].forEach(function (s) { var b = btn(s[0], s[1]); b.onclick = function () { mode = s[1]; mark(bar, mode); draw(); }; bar.appendChild(b); }); mark(bar, mode);
          slider(root, '凸塊間距（格）', 4, 20, 2, pitch, function (x) { return x + ' 格'; }, 'p', function (x) { pitch = x; draw(); });
          slider(root, '每格電流（相對值）', 0.2, 2, 0.1, J, f1, 'j', function (x) { J = x; draw(); });
          slider(root, '每段網格電阻（相對值）', 0.2, 3, 0.1, Rs, f1, 'r', function (x) { Rs = x; draw(); });
          var Nn = 40;
          function draw() { var src = [], V = [], i, j;
            for (i = 0; i < Nn; i++) { src.push([]); V.push([]); for (j = 0; j < Nn; j++) { var s = mode === 'pad' ? (i === 0 || j === 0 || i === Nn - 1 || j === Nn - 1) : ((i % pitch) === Math.floor(pitch / 2) && (j % pitch) === Math.floor(pitch / 2)); src[i].push(s); V[i].push(0); } }
            var q = J * Rs * 0.25, w = 1.85;
            for (var it = 0; it < 900; it++) for (i = 0; i < Nn; i++) for (j = 0; j < Nn; j++) { if (src[i][j]) { V[i][j] = 0; continue; }
              var s2 = 0, n = 0; if (i > 0) { s2 += V[i - 1][j]; n++; } if (i < Nn - 1) { s2 += V[i + 1][j]; n++; } if (j > 0) { s2 += V[i][j - 1]; n++; } if (j < Nn - 1) { s2 += V[i][j + 1]; n++; }
              var nv = (s2 + J * Rs) / n; V[i][j] += w * (nv - V[i][j]); }
            var mx = 0; for (i = 0; i < Nn; i++) for (j = 0; j < Nn; j++) mx = Math.max(mx, V[i][j]);
            var cs = 9, g = '';
            for (i = 0; i < Nn; i++) for (j = 0; j < Nn; j++) { var t = mx ? V[i][j] / mx : 0, col = src[i][j] ? '#111' : 'hsl(' + Math.round(220 - 220 * t) + ',75%,' + Math.round(55 - 10 * t) + '%)'; g += '<rect x="' + (j * cs) + '" y="' + (i * cs) + '" width="' + cs + '" height="' + cs + '" fill="' + col + '"/>'; }
            v.innerHTML = '<div style="max-width:380px;margin:auto">' + svgw('0 0 ' + Nn * cs + ' ' + Nn * cs, g) + '</div><div style="font-size:0.8em;text-align:center;color:var(--text-muted)">黑點 = 電源接點；藍 → 紅 = 壓降小 → 大</div>';
            var mv = mx * 10;
            inf.innerHTML = '最大壓降（相對單位）約 <b>' + f1(mv) + '</b>' + (mode === 'pad' ? '：只從四周供電，中心離電源最遠，壓降最大。壓降約隨晶片邊長的平方增加（第 32 課）。' : '：每個凸塊只要供應附近一小塊區域，壓降約隨凸塊間距的平方增加——間距減半，壓降約剩四分之一。') +
              '<br>電流或網格電阻加倍，壓降也加倍（線性）。實務上壓降通常要控制在供電電壓的 5～10% 以內。'; }
          draw(); }

        /* ---------- 良率與成本 ---------- */
        function initYield(root, cfg) {
          head(root, cfg.q); var A = 600, D0 = 0.1, cost = 17000, n = 4, ov = 10, model = 'murphy', v = el('div'), inf = info(root), bar = el('div'); root.insertBefore(bar, inf); root.insertBefore(v, inf);
          [['Poisson 模型', 'poisson'], ['Murphy 模型', 'murphy']].forEach(function (s) { var b = btn(s[0], s[1]); b.onclick = function () { model = s[1]; mark(bar, model); draw(); }; bar.appendChild(b); }); mark(bar, model);
          slider(root, '總邏輯面積 A（mm²）', 20, 800, 10, A, function (x) { return x + ' mm²'; }, 'a', function (x) { A = x; draw(); });
          slider(root, '缺陷密度 D₀（個/cm²）', 0.02, 0.5, 0.01, D0, f2, 'd', function (x) { D0 = x; draw(); });
          slider(root, '每片晶圓成本（美元）', 3000, 30000, 500, cost, function (x) { return '$' + x.toLocaleString(); }, 'c', function (x) { cost = x; draw(); });
          slider(root, '拆成幾顆 chiplet', 1, 8, 1, n, function (x) { return x + ' 顆'; }, 'n', function (x) { n = x; draw(); });
          slider(root, '每顆 chiplet 的介面額外面積（%）', 0, 30, 1, ov, function (x) { return x + '%'; }, 'o', function (x) { ov = x; draw(); });
          function dpw(a) { var d = 300; return Math.max(0, Math.floor(Math.PI * d * d / 4 / a - Math.PI * d / Math.sqrt(2 * a))); }
          function Y(a) { var x = a / 100 * D0; return model === 'poisson' ? Math.exp(-x) : (x < 1e-9 ? 1 : Math.pow((1 - Math.exp(-x)) / x, 2)); }
          function draw() { var m1 = dpw(A), y1 = Y(A), c1 = cost / (m1 * y1), a2 = A / n * (1 + (n > 1 ? ov / 100 : 0)), m2 = dpw(a2), y2 = Y(a2), c2 = cost / (m2 * y2) * n;
            v.innerHTML = table([['單一晶片', f1(A), m1, f1(y1 * 100) + '%', '$' + Math.round(c1)], [n + ' 顆 chiplet（每顆）', f1(a2), m2, f1(y2 * 100) + '%', '$' + Math.round(c2) + '（' + n + ' 顆合計）']],
              ['方案', '每顆面積 mm²', '每片晶圓顆數', '良率', '每套好晶片的矽成本']);
            inf.innerHTML = '300 mm 晶圓。' + (n > 1 ? 'Chiplet 的矽成本是單一晶片的 <b>' + f2(c2 / c1) + ' 倍</b>' + (c2 < c1 ? '：小晶片良率高，抵銷了介面面積的額外成本。' : '：缺陷密度低或晶片不大時，介面額外面積反而讓 chiplet 較貴。') + '（還沒加上先進封裝與測試的成本，第 41 課）' : '把 chiplet 數量調大，比較兩種方案。') +
              '<br>面積加倍，良率不只減半：Poisson 模型 Y = e<sup>−AD₀</sup>，大晶片的良率下降得特別快（第 38 課）。'; }
          draw(); }

        var INIT = { floor: initFloor, noc: initNoc, wire: initWire, ir: initIr, yield: initYield };
        function boot() { document.querySelectorAll('.cf-w').forEach(function (root) { if (root.__done) return; root.__done = 1;
          var cfg = JSON.parse(root.getAttribute('data-cfg')); var fn = INIT[cfg.t]; if (fn) fn(root, cfg); }); }
        if (document.readyState === 'complete') boot(); else window.addEventListener('load', boot);
      })();
      </script>
