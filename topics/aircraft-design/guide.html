    <article class="lesson-content">

      <script>
      (function () {
        if (window.__kacLib) return; window.__kacLib = 1;

        function btn(t, k) { var b = document.createElement('button'); b.type = 'button'; b.textContent = t; if (k !== undefined) b.setAttribute('data-k', k);
          b.style.cssText = 'padding:4px 10px;margin:4px 6px 0 0;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer;font:inherit;font-size:0.9em'; return b; }
        function mark(bar, k) { bar.querySelectorAll('button').forEach(function (b) { var on = b.getAttribute('data-k') === String(k); b.style.background = on ? 'var(--accent-soft)' : 'var(--surface)'; b.style.fontWeight = on ? 'bold' : 'normal'; }); }
        function head(root, q) { if (q) { var p = document.createElement('p'); p.style.margin = '0 0 8px'; p.innerHTML = q; root.appendChild(p); } }
        function el(tag, css, html) { var e = document.createElement(tag); if (css) e.style.cssText = css; if (html !== undefined) e.innerHTML = html; return e; }
        function n1(v) { return Math.round(v * 10) / 10; }
        function f1(v) { return (Math.round(v * 10) / 10).toString(); }
        function f2(v) { return (Math.round(v * 100) / 100).toString(); }
        function tx(x, y, s, sz, c, anc) { return '<text x="' + n1(x) + '" y="' + n1(y) + '" font-size="' + sz + '" fill="' + (c || 'currentColor') + '" text-anchor="' + (anc || 'middle') + '">' + s + '</text>'; }
        function ln(x1, y1, x2, y2, c, w, ex) { return '<line x1="' + n1(x1) + '" y1="' + n1(y1) + '" x2="' + n1(x2) + '" y2="' + n1(y2) + '" stroke="' + c + '" stroke-width="' + (w || 1) + '" ' + (ex || '') + '/>'; }
        function svgw(vb, inner) { return '<svg viewBox="' + vb + '" style="width:100%;display:block;color:var(--text)">' + inner + '</svg>'; }
        function slider(root, lab, min, max, step, val, fmt, k, cb) { var l = el('label', 'display:block;font-size:0.88em;margin-top:6px', lab + '：<b></b>'); var s = document.createElement('input');
          s.type = 'range'; s.min = min; s.max = max; s.step = step; s.value = val; s.style.cssText = 'width:100%;display:block'; if (k) s.setAttribute('data-k', k); l.appendChild(s); root.appendChild(l);
          function u() { l.querySelector('b').textContent = fmt(+s.value); cb(+s.value); } s.addEventListener('input', u); return u; }
        function nice(lo, hi, n) { var span = hi - lo || 1, st = Math.pow(10, Math.floor(Math.log10(span / n))), e = span / n / st; st *= e >= 5 ? 5 : e >= 2 ? 2 : 1; var t = [], v = Math.ceil(lo / st - 1e-9) * st; for (; v <= hi + 1e-9; v += st) t.push(Math.round(v / st) * st); return t; }
        function fmtT(v) { var a = Math.abs(v); return a >= 1e6 ? f1(v / 1e6) + 'M' : a >= 1e4 ? f1(v / 1e3) + 'k' : (Math.round(v * 100) / 100).toString(); }
        var CID = 0;
        function chart(W, H, S, o) { o = o || {}; var L = 48, R = 12, T = 22, B = 34, xs = [], ys = [];
          S.forEach(function (s) { s.d.forEach(function (p) { xs.push(p[0]); if (isFinite(p[1])) ys.push(p[1]); }); });
          var x0 = o.x0 !== undefined ? o.x0 : Math.min.apply(null, xs), x1 = o.x1 !== undefined ? o.x1 : Math.max.apply(null, xs);
          var y0 = o.y0 !== undefined ? o.y0 : Math.min(0, Math.min.apply(null, ys)), y1 = o.y1 !== undefined ? o.y1 : Math.max.apply(null, ys) * 1.08 || 1;
          function sx(v) { return L + (v - x0) / (x1 - x0 || 1) * (W - L - R); } function sy(v) { return H - B - (v - y0) / (y1 - y0 || 1) * (H - T - B); }
          var id = 'qc' + (++CID), g = '<clipPath id="' + id + '"><rect x="' + L + '" y="' + (T - 2) + '" width="' + (W - L - R) + '" height="' + (H - T - B + 4) + '"/></clipPath>';
          nice(y0, y1, 4).forEach(function (v) { g += ln(L, sy(v), W - R, sy(v), 'var(--border)', 0.6, 'stroke-dasharray="2 3"') + tx(L - 5, sy(v) + 3, fmtT(v), 9, 'var(--text-muted)', 'end'); });
          nice(x0, x1, 6).forEach(function (v) { g += tx(sx(v), H - B + 14, fmtT(v), 9, 'var(--text-muted)'); });
          g += ln(L, T - 4, L, H - B, '#999') + ln(L, H - B, W - R, H - B, '#999');
          if (o.xl) g += tx((L + W - R) / 2, H - 4, o.xl, 9.5, 'var(--text-muted)');
          if (o.yl) g += tx(L - 40, T - 8, o.yl, 9.5, 'var(--text-muted)', 'start');
          (o.hl || []).forEach(function (h) { g += ln(L, sy(h.y), W - R, sy(h.y), h.c, 1, 'stroke-dasharray="5 4"') + tx(W - R - 2, sy(h.y) - 4, h.n, 9, h.c, 'end'); });
          (o.vl || []).forEach(function (h) { g += ln(sx(h.x), T, sx(h.x), H - B, h.c, 1, 'stroke-dasharray="5 4"') + tx(sx(h.x) + 3, H - B - 6, h.n, 9, h.c, 'start'); });
          S.forEach(function (s) { var d = '', m = 'M'; s.d.forEach(function (p) { if (!isFinite(p[1])) { m = 'M'; return; } d += m + n1(sx(p[0])) + ' ' + n1(sy(Math.max(Math.min(p[1], y1 + (y1 - y0)), y0 - (y1 - y0)))); m = 'L'; });
            g += '<path clip-path="url(#' + id + ')" d="' + d + '" fill="none" stroke="' + s.c + '" stroke-width="' + (s.w || 2) + '"' + (s.dash ? ' stroke-dasharray="' + s.dash + '"' : '') + '/>'; });
          (o.pts || []).forEach(function (p) { g += '<circle cx="' + n1(sx(p.x)) + '" cy="' + n1(sy(Math.min(p.y, y1))) + '" r="5" fill="' + p.c + '"/>' + (p.n ? tx(sx(p.x) + 8, sy(Math.min(p.y, y1)) - 6, p.n, 10, p.c, 'start') : ''); });
          var lx = L + 8, ly = T + 2; S.forEach(function (s) { if (!s.n) return; g += ln(lx, ly, lx + 16, ly, s.c, 2.5, s.dash ? 'stroke-dasharray="' + s.dash + '"' : '') + tx(lx + 20, ly + 4, s.n, 9.5, 'currentColor', 'start'); lx += 34 + s.n.length * 10.5; if (lx > W - 120) { lx = L + 8; ly += 15; } });
          return svgw('0 0 ' + W + ' ' + H, g); }
        function rexp(m) { return -Math.log(1 - Math.random()) * m; }

        var BL = '#3a6ea5', OR = '#d9822b', RD = '#d0564f', GN = '#4a9a5e', GY = '#9aa3ad', PU = '#8a5bb5', TL = '#2a9d8f', YL = '#c9a227';
        function info(root) { var p = el('div', 'margin-top:8px;padding:10px 12px;border-radius:8px;background:var(--accent-soft);line-height:1.7;font-size:0.93em'); root.appendChild(p); return p; }
        function bar(root) { var b = el('div', 'margin:4px 0'); root.appendChild(b); return b; }
        function small(s) { return '<br><span style="font-size:0.88em;color:var(--text-muted)">' + s + '</span>'; }
        function presets(root, list, cb, k0) { var b = bar(root); list.forEach(function (o, i) { var x = btn(o, i); x.onclick = function () { mark(b, i); cb(i); }; b.appendChild(x); }); mark(b, k0 === undefined ? 0 : k0); return b; }
        function setS(root, k, v) { var s = root.querySelector('input[data-k="' + k + '"]'); if (s) s.value = v; }
        function rc(x, y, w, h, f, st, rx) { return '<rect x="' + n1(x) + '" y="' + n1(y) + '" width="' + n1(Math.max(w, 0)) + '" height="' + n1(Math.max(h, 0)) + '" rx="' + (rx === undefined ? 4 : rx) + '" fill="' + f + '"' + (st ? ' stroke="' + st + '"' : '') + '/>'; }
        function ci(x, y, r, f, st, sw) { return '<circle cx="' + n1(x) + '" cy="' + n1(y) + '" r="' + n1(r) + '" fill="' + f + '"' + (st ? ' stroke="' + st + '" stroke-width="' + (sw || 1.5) + '"' : '') + '/>'; }
        function pa(d, c, w, f, ex) { return '<path d="' + d + '" fill="' + (f || 'none') + '" stroke="' + c + '" stroke-width="' + (w || 1.5) + '" ' + (ex || '') + '/>'; }
        function poly(pts) { return pts.map(function (p, i) { return (i ? 'L' : 'M') + n1(p[0]) + ' ' + n1(p[1]); }).join(' '); }
        function tbl(h, rows) { var s = '<table style="border-collapse:collapse;width:100%;font-size:0.86em;margin-top:6px"><tr>' + h.map(function (x) { return '<th style="border:1px solid var(--border);padding:3px 5px;background:var(--accent-soft)">' + x + '</th>'; }).join('') + '</tr>';
          rows.forEach(function (r) { s += '<tr>' + r.map(function (c, j) { return '<td style="border:1px solid var(--border);padding:3px 5px;text-align:' + (j ? 'center' : 'left') + '">' + c + '</td>'; }).join('') + '</tr>'; }); return s + '</table>'; }
        function rng(seed) { var a = (seed || 1) >>> 0; return function () { a = (a + 0x6D2B79F5) >>> 0; var t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
        function gauss(r) { var u = Math.max(r(), 1e-9), v = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); }
        function pct(v) { return f1(v * 100) + '%'; }
        function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

        function rhoAt(h) { var T = 288.15 - 0.0065 * Math.min(h, 11000); var p = 101325 * Math.pow(T / 288.15, 5.2559); if (h > 11000) { p *= Math.exp(-9.80665 * (h - 11000) / (287.05 * 216.65)); T = 216.65; } return p / (287.05 * T); }
        function clOf(a) { var a0 = -2, s = 15; if (a <= s) return 0.105 * (a - a0) * 0.93; return Math.max(0.6, 0.105 * (s - a0) * 0.93 - 0.09 * (a - s) * (a - s) * 0.35 - 0.06 * (a - s)); }
        function naca(m, p, t) { var up = [], lo = []; for (var i = 0; i <= 40; i++) { var x = (1 - Math.cos(Math.PI * i / 40)) / 2, yt = 5 * t * (0.2969 * Math.sqrt(x) - 0.126 * x - 0.3516 * x * x + 0.2843 * x * x * x - 0.1036 * x * x * x * x), yc = x < p ? m / (p * p) * (2 * p * x - x * x) : m / ((1 - p) * (1 - p)) * (1 - 2 * p + 2 * p * x - x * x); up.push([x, yc + yt]); lo.push([x, yc - yt]); } return up.concat(lo.reverse()); }

        /* 1. 升力 */
        function initLift(root, cfg) { head(root, cfg.q); var P = { a: 4, v: 180, h: 0 }, M = 1100, S = 16.2, view = el('div');
          var g = el('div', 'display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:0 12px'); root.appendChild(g);
          var us = [slider(g, '攻角 α', -4, 22, 0.5, P.a, function (v) { return f1(v) + '°'; }, 'a', function (v) { P.a = v; draw(); }), slider(g, '空速', 60, 280, 5, P.v, function (v) { return v + ' km/h'; }, 'v', function (v) { P.v = v; draw(); }), slider(g, '高度', 0, 5000, 100, P.h, function (v) { return v + ' m'; }, 'h', function (v) { P.h = v; draw(); })];
          root.appendChild(view); var inf = info(root);
          function draw() { var rho = rhoAt(P.h), V = P.v / 3.6, cl = clOf(P.a), L = 0.5 * rho * V * V * S * cl, Wt = M * 9.81, ratio = L / Wt, o = '', pts = naca(0.02, 0.4, 0.12), ang = P.a * Math.PI / 180, cx = 150, cy = 130, sc = 210;
            var d = ''; pts.forEach(function (p, i) { var x = (p[0] - 0.3) * sc, y = -p[1] * sc, xr = x * Math.cos(ang) - y * Math.sin(ang), yr = x * Math.sin(ang) + y * Math.cos(ang); d += (i ? 'L' : 'M') + n1(cx + xr) + ' ' + n1(cy + yr); });
            for (var k = -2; k <= 2; k++) o += ln(10, cy + k * 28, 50, cy + k * 28, 'var(--text-muted)', 1) + tx(54, cy + k * 28 + 4, '›', 12, 'var(--text-muted)', 'start');
            o += pa(d + 'Z', 'var(--text)', 1.5, P.a > 15 ? 'rgba(220,70,70,0.35)' : 'rgba(52,120,200,0.35)');
            if (P.a > 15) for (var j = 0; j < 5; j++) o += pa('M' + (cx + 20 + j * 18) + ' ' + (cy - 20 - j * 2) + ' q 8 -12 16 0 q 8 12 16 0', RD, 1.2);
            var la = Math.min(110, Math.max(0, ratio * 70)); o += ln(cx, cy, cx, cy - la, GN, 4) + pa('M' + (cx - 7) + ' ' + (cy - la + 8) + ' L' + cx + ' ' + (cy - la - 4) + ' L' + (cx + 7) + ' ' + (cy - la + 8) + ' Z', GN, 1, GN) + tx(cx + 10, cy - la, '升力', 11, GN, 'start');
            o += ln(cx, cy, cx, cy + 70, RD, 4) + tx(cx + 10, cy + 70, '重量', 11, RD, 'start');
            var c = []; for (var a = -4; a <= 22; a += 0.25) c.push([a, clOf(a)]);
            var ch = chart(320, 240, [{ d: c, c: BL, n: '升力係數 CL', w: 2.2 }], { x0: -4, x1: 22, y0: -0.4, y1: 1.8, xl: '攻角（度）', yl: 'CL', vl: [{ x: 15, c: RD, n: '失速' }], pts: [{ x: P.a, y: cl, c: OR }] });
            view.innerHTML = '<div style="display:flex;flex-wrap:wrap;gap:6px;align-items:center"><div style="flex:1 1 260px;max-width:320px">' + svgw('0 0 300 230', o) + '</div><div style="flex:1 1 280px">' + ch + '</div></div>';
            inf.innerHTML = '升力 L = ½ ρ V² S C<sub>L</sub> = ½ × ' + f2(rho) + ' × ' + f1(V) + '² × ' + S + ' × ' + f2(cl) + ' ≈ <b>' + Math.round(L / 9.81) + ' 公斤力</b>；飛機重 ' + M + ' 公斤 → 升力是重量的 <b>' + Math.round(ratio * 100) + '%</b>' + (ratio > 1.05 ? '，會<b>爬升</b>。' : ratio < 0.95 ? '，會<b>下降</b>。' : '，大致<b>平飛</b>。') + '<br>' +
              (P.a > 15 ? '<span style="color:' + RD + '"><b>失速！</b></span>攻角太大，氣流從機翼上表面分離，升力突然下降——失速和速度無關，是攻角超過了臨界值（第 9 課）。' : '攻角越大、升力係數越大（大約每度增加 0.1）；速度加倍，升力變成 4 倍；高度越高空氣越稀薄，需要更快的速度才能產生同樣的升力。') +
              '<br><b>試試看</b>：把速度降低，看看要用多大的攻角才能維持平飛——慢速時必須「抬頭」，直到接近失速。' + small('以小型單引擎飛機（約 1,100 公斤、翼面積 16.2 m²）與 NACA 2412 翼型的簡化升力曲線計算；標準大氣的空氣密度。'); }
          us.forEach(function (u) { u(); });
        }

        /* 2. 阻力與滑翔比 */
        function initPolar(root, cfg) { head(root, cfg.q); var P = { cd0: 0.02, ar: 9.5 }, view = el('div'), us;
          presets(root, ['高性能滑翔機', '噴射客機', '戰鬥機', '小型螺旋槳機'], function (i) { var c = [[0.011, 25], [0.018, 9.5], [0.022, 3.5], [0.028, 7.5]][i]; P.cd0 = c[0]; P.ar = c[1]; setS(root, 'cd0', P.cd0); setS(root, 'ar', P.ar); us.forEach(function (u) { u(); }); }, -1);
          var g = el('div', 'display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0 12px'); root.appendChild(g);
          us = [slider(g, '零升力阻力係數 CD0（流線程度）', 0.008, 0.05, 0.001, P.cd0, function (v) { return v.toFixed(3); }, 'cd0', function (v) { P.cd0 = v; draw(); }), slider(g, '展弦比 AR（機翼細長程度）', 3, 35, 0.5, P.ar, f1, 'ar', function (v) { P.ar = v; draw(); })];
          root.appendChild(view); var inf = info(root);
          function draw() { var e = 0.82, k = 1 / (Math.PI * e * P.ar), W = 60000, S = 30, rho = 1.0, dp = [], di = [], dt = [], best = 1e9, vb = 0;
            for (var V = 25; V <= 160; V += 1) { var q = 0.5 * rho * V * V, a = q * S * P.cd0, b = k * W * W / (q * S); dp.push([V * 3.6, a / 1000]); di.push([V * 3.6, b / 1000]); dt.push([V * 3.6, (a + b) / 1000]); if (a + b < best) { best = a + b; vb = V; } }
            var ld = 0.5 * Math.sqrt(Math.PI * e * P.ar / P.cd0);
            view.innerHTML = chart(640, 250, [{ d: dp, c: OR, n: '寄生阻力（∝ V²）', w: 1.8 }, { d: di, c: PU, n: '誘導阻力（∝ 1/V²）', w: 1.8 }, { d: dt, c: BL, n: '總阻力', w: 2.6 }], { x0: 90, x1: 576, y0: 0, y1: 15, xl: '空速（km/h）', yl: '阻力（kN）', pts: [{ x: vb * 3.6, y: best / 1000, c: RD, n: '最小阻力' }] });
            inf.innerHTML = '最大升阻比 L/D ≈ <b>' + f1(ld) + '</b>：從 1,000 公尺的高度無動力滑翔，大約可以滑行 <b>' + f1(ld) + ' 公里</b>。最小阻力發生在約 <b>' + Math.round(vb * 3.6) + ' km/h</b>（此時寄生阻力 = 誘導阻力）。<br>' +
              '<b>寄生阻力</b>（摩擦、形狀）隨速度平方增加；<b>誘導阻力</b>（產生升力的代價）在低速時最大，因為慢速時需要大攻角。<b>細長的機翼</b>（展弦比大）誘導阻力小——所以滑翔機的翅膀又長又窄，信天翁也是。' + small('簡化的拋物線阻力極曲線 CD = CD0 + CL²/(π e AR)，e = 0.82；阻力曲線以一架 6 公噸、翼面積 30 m² 的飛機示意。'); }
          us.forEach(function (u) { u(); });
        }

        /* 3. Breguet 航程 */
        function initRange(root, cfg) { head(root, cfg.q); var P = { ld: 18, c: 0.55, ff: 40, v: 900 }, view = el('div'), us;
          presets(root, ['新一代廣體客機', '1960 年代噴射客機', '區域客機'], function (i) { var c = [[19, 0.52, 42, 905], [15, 0.85, 40, 880], [16, 0.62, 25, 780]][i]; P.ld = c[0]; P.c = c[1]; P.ff = c[2]; P.v = c[3]; ['ld', 'c', 'ff', 'v'].forEach(function (k) { setS(root, k, P[k]); }); us.forEach(function (u) { u(); }); }, -1);
          var g = el('div', 'display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0 12px'); root.appendChild(g);
          us = [slider(g, '升阻比 L/D（空氣動力）', 8, 25, 0.5, P.ld, f1, 'ld', function (v) { P.ld = v; draw(); }), slider(g, '發動機耗油率 TSFC', 0.45, 1.0, 0.01, P.c, function (v) { return f2(v) + ' /小時'; }, 'c', function (v) { P.c = v; draw(); }), slider(g, '燃油占起飛重量', 5, 50, 1, P.ff, function (v) { return v + '%'; }, 'ff', function (v) { P.ff = v; draw(); }), slider(g, '巡航速度', 600, 950, 5, P.v, function (v) { return v + ' km/h'; }, 'v', function (v) { P.v = v; draw(); })];
          root.appendChild(view); var inf = info(root);
          function draw() { var K = P.v / P.c * P.ld, R = K * Math.log(1 / (1 - P.ff / 100)), d = [], lin = [];
            for (var f = 0; f <= 60; f += 1) { d.push([f, K * Math.log(1 / (1 - f / 100)) / 1000]); lin.push([f, K * f / 100 / 1000]); }
            view.innerHTML = chart(640, 230, [{ d: d, c: BL, n: 'Breguet 航程', w: 2.4 }, { d: lin, c: GY, n: '如果燃油「不會越燒越輕」', w: 1.2, dash: '4 3' }], { x0: 0, x1: 60, y0: 0, y1: Math.max(10, d[d.length - 1][1] * 1.05), xl: '燃油占起飛重量（%）', yl: '航程（千公里）', pts: [{ x: P.ff, y: R / 1000, c: OR }] });
            inf.innerHTML = '航程 R = (V ÷ TSFC) × (L/D) × ln(起飛重量 ÷ 降落重量) ≈ <b>' + Math.round(R).toLocaleString() + ' 公里</b>' + (R > 12000 ? '（足以從台北直飛美國東岸）' : R > 8000 ? '（台北飛美國西岸或歐洲）' : R > 3000 ? '（台北飛東南亞或日本）' : '') + '。<br>' +
              '三個因素相乘：<b>速度</b>、<b>空氣動力效率</b>（L/D）、<b>發動機效率</b>（TSFC 越低越好）。新一代客機的航程與省油，來自更高的 L/D（複合材料、細長的機翼、翼尖小翼）與高旁通比的發動機。<br>對數讓燃油的效益<b>遞減</b>：多帶的燃油本身也很重，要燒掉更多的油來載它——這是長程飛行的根本限制。' + small('Breguet 航程公式（噴射機、定速巡航、L/D 與 TSFC 固定）；未計爬升、下降與備用油，實際航程較短。'); }
          us.forEach(function (u) { u(); });
        }

        /* 4. 起飛距離與失速速度 */
        function initTo(root, cfg) { head(root, cfg.q); var P = { ws: 600, tw: 0.3, cl: 2.4, h: 0 }, view = el('div'), us;
          presets(root, ['小型螺旋槳機', '窄體客機', '戰鬥機', '短場起降機'], function (i) { var c = [[70, 0.2, 1.6], [600, 0.3, 2.6], [400, 1.0, 1.6], [120, 0.35, 3.0]][i]; P.ws = c[0]; P.tw = c[1]; P.cl = c[2]; ['ws', 'tw', 'cl'].forEach(function (k) { setS(root, k, P[k]); }); us.forEach(function (u) { u(); }); }, -1);
          var g = el('div', 'display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0 12px'); root.appendChild(g);
          us = [slider(g, '翼負載 W/S', 40, 750, 5, P.ws, function (v) { return v + ' kg/m²'; }, 'ws', function (v) { P.ws = v; draw(); }), slider(g, '推重比 T/W', 0.1, 1.2, 0.01, P.tw, f2, 'tw', function (v) { P.tw = v; draw(); }), slider(g, '最大升力係數（含襟翼）', 1.2, 3.2, 0.05, P.cl, f2, 'cl', function (v) { P.cl = v; draw(); }), slider(g, '機場高度', 0, 3000, 100, P.h, function (v) { return v + ' m'; }, 'h', function (v) { P.h = v; draw(); })];
          root.appendChild(view); var inf = info(root);
          function draw() { var rho = rhoAt(P.h), wsN = P.ws * 9.81, vs = Math.sqrt(2 * wsN / (rho * P.cl)), sg = 1.44 * wsN / (9.81 * rho * P.cl * P.tw), tw2 = P.tw * Math.sqrt(rho / 1.225), sg2 = 1.44 * wsN / (9.81 * rho * P.cl * tw2), o = '';
            var mx = Math.max(3500, sg2 * 1.1); o += rc(20, 60, 600, 30, '#555', null, 2) + ln(20, 75, 620, 75, '#fff', 1.5, 'stroke-dasharray="14 10"') + tx(20, 50, '跑道（以 3,500 公尺為參考）', 10, 'var(--text-muted)', 'start');
            var x = 20 + Math.min(1, sg2 / mx) * 600; o += rc(20, 100, x - 20, 14, sg2 > 3000 ? RD : sg2 > 1800 ? OR : GN, null, 3) + tx(Math.min(x + 6, 560), 112, Math.round(sg2) + ' m', 11, 'var(--text)', 'start') + tx(20, 132, '地面滾行距離（約）', 10, 'var(--text-muted)', 'start') + tx(x - 6, 92, '✈', 16, 'var(--text)', 'end');
            view.innerHTML = svgw('0 0 640 140', o);
            inf.innerHTML = '失速速度 V<sub>s</sub> = √(2 (W/S) ÷ (ρ C<sub>Lmax</sub>)) ≈ <b>' + Math.round(vs * 3.6) + ' km/h</b>；起飛速度約 1.2 V<sub>s</sub> ≈ ' + Math.round(vs * 3.6 * 1.2) + ' km/h。地面滾行約 <b>' + Math.round(sg2) + ' 公尺</b>' + (P.h > 500 ? '（高海拔空氣稀薄：升力與推力都下降，比海平面長 ' + Math.round((sg2 / (1.44 * wsN / (9.81 * 1.225 * P.cl * P.tw)) - 1) * 100) + '%）' : '') + '。<br>' +
              '<b>翼負載</b>大（每平方公尺機翼承載的重量多）：巡航效率好、在亂流中比較平穩，但起降需要更快的速度、更長的跑道。<b>推重比</b>大：加速快、起飛短、爬升快。<b>襟翼</b>提高最大升力係數，讓大型客機能以較低的速度起降（第 9 課）。' + small('地面滾行近似公式 s ≈ 1.44 (W/S) ÷ (g ρ CLmax T/W)；未計空中段、摩擦、風與安全裕度，實際的起飛場長更長。'); }
          us.forEach(function (u) { u(); });
        }

        function initAll() { document.querySelectorAll('.kac-w').forEach(function (w) { if (w.__d) return; w.__d = 1; var cfg = JSON.parse(w.getAttribute('data-cfg'));
          ({ lift: initLift, polar: initPolar, range: initRange, to: initTo })[cfg.t](w, cfg); }); }
        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', initAll); else initAll();
      })();
      </script>
