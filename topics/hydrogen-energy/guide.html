    <article class="lesson-content">

      <script>
      (function () {
        if (window.__ph3Lib) return; window.__ph3Lib = 1;

        function btn(t, k) { var b = document.createElement('button'); b.type = 'button'; b.textContent = t; if (k !== undefined) b.setAttribute('data-k', k);
          b.style.cssText = 'padding:4px 10px;margin:4px 6px 0 0;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer;font:inherit;font-size:0.9em'; return b; }
        function mark(bar, k) { bar.querySelectorAll('button').forEach(function (b) { var on = b.getAttribute('data-k') === String(k); b.style.background = on ? 'var(--accent-soft)' : 'var(--surface)'; b.style.fontWeight = on ? 'bold' : 'normal'; }); }
        function head(root, q) { if (q) { var p = document.createElement('p'); p.style.margin = '0 0 8px'; p.innerHTML = q; root.appendChild(p); } }
        function el(tag, css, html) { var e = document.createElement(tag); if (css) e.style.cssText = css; if (html !== undefined) e.innerHTML = html; return e; }
        function n1(v) { return Math.round(v * 10) / 10; }
        function f1(v) { return (Math.round(v * 10) / 10).toString(); }
        function f2(v) { return (Math.round(v * 100) / 100).toString(); }
        function tx(x, y, s, sz, c, anc) { return '<text x="' + n1(x) + '" y="' + n1(y) + '" font-size="' + sz + '" fill="' + (c || 'currentColor') + '" text-anchor="' + (anc || 'middle') + '">' + s + '</text>'; }
        function ln(x1, y1, x2, y2, c, w, ex) { return '<line x1="' + n1(x1) + '" y1="' + n1(y1) + '" x2="' + n1(x2) + '" y2="' + n1(y2) + '" stroke="' + c + '" stroke-width="' + (w || 1) + '" ' + (ex || '') + '/>'; }
        function svgw(vb, inner) { return '<svg viewBox="' + vb + '" style="width:100%;display:block;color:var(--text)">' + inner + '</svg>'; }
        function slider(root, lab, min, max, step, val, fmt, k, cb) { var l = el('label', 'display:block;font-size:0.88em;margin-top:6px', lab + '：<b></b>'); var s = document.createElement('input');
          s.type = 'range'; s.min = min; s.max = max; s.step = step; s.value = val; s.style.cssText = 'width:100%;display:block'; if (k) s.setAttribute('data-k', k); l.appendChild(s); root.appendChild(l);
          function u() { l.querySelector('b').textContent = fmt(+s.value); cb(+s.value); } s.addEventListener('input', u); return u; }
        function nice(lo, hi, n) { var span = hi - lo || 1, st = Math.pow(10, Math.floor(Math.log10(span / n))), e = span / n / st; st *= e >= 5 ? 5 : e >= 2 ? 2 : 1; var t = [], v = Math.ceil(lo / st - 1e-9) * st; for (; v <= hi + 1e-9; v += st) t.push(Math.round(v / st) * st); return t; }
        function fmtT(v) { var a = Math.abs(v); return a >= 1e6 ? f1(v / 1e6) + 'M' : a >= 1e4 ? f1(v / 1e3) + 'k' : (Math.round(v * 100) / 100).toString(); }
        var CID = 0;
        function chart(W, H, S, o) { o = o || {}; var L = 48, R = 12, T = 22, B = 34, xs = [], ys = [];
          S.forEach(function (s) { s.d.forEach(function (p) { xs.push(p[0]); if (isFinite(p[1])) ys.push(p[1]); }); });
          var x0 = o.x0 !== undefined ? o.x0 : Math.min.apply(null, xs), x1 = o.x1 !== undefined ? o.x1 : Math.max.apply(null, xs);
          var y0 = o.y0 !== undefined ? o.y0 : Math.min(0, Math.min.apply(null, ys)), y1 = o.y1 !== undefined ? o.y1 : Math.max.apply(null, ys) * 1.08 || 1;
          function sx(v) { return L + (v - x0) / (x1 - x0 || 1) * (W - L - R); } function sy(v) { return H - B - (v - y0) / (y1 - y0 || 1) * (H - T - B); }
          var id = 'qc' + (++CID), g = '<clipPath id="' + id + '"><rect x="' + L + '" y="' + (T - 2) + '" width="' + (W - L - R) + '" height="' + (H - T - B + 4) + '"/></clipPath>';
          nice(y0, y1, 4).forEach(function (v) { g += ln(L, sy(v), W - R, sy(v), 'var(--border)', 0.6, 'stroke-dasharray="2 3"') + tx(L - 5, sy(v) + 3, fmtT(v), 9, 'var(--text-muted)', 'end'); });
          nice(x0, x1, 6).forEach(function (v) { g += tx(sx(v), H - B + 14, fmtT(v), 9, 'var(--text-muted)'); });
          g += ln(L, T - 4, L, H - B, '#999') + ln(L, H - B, W - R, H - B, '#999');
          if (o.xl) g += tx((L + W - R) / 2, H - 4, o.xl, 9.5, 'var(--text-muted)');
          if (o.yl) g += tx(L - 40, T - 8, o.yl, 9.5, 'var(--text-muted)', 'start');
          (o.hl || []).forEach(function (h) { g += ln(L, sy(h.y), W - R, sy(h.y), h.c, 1, 'stroke-dasharray="5 4"') + tx(W - R - 2, sy(h.y) - 4, h.n, 9, h.c, 'end'); });
          (o.vl || []).forEach(function (h) { g += ln(sx(h.x), T, sx(h.x), H - B, h.c, 1, 'stroke-dasharray="5 4"') + tx(sx(h.x) + 3, H - B - 6, h.n, 9, h.c, 'start'); });
          S.forEach(function (s) { var d = '', m = 'M'; s.d.forEach(function (p) { if (!isFinite(p[1])) { m = 'M'; return; } d += m + n1(sx(p[0])) + ' ' + n1(sy(Math.max(Math.min(p[1], y1 + (y1 - y0)), y0 - (y1 - y0)))); m = 'L'; });
            g += '<path clip-path="url(#' + id + ')" d="' + d + '" fill="none" stroke="' + s.c + '" stroke-width="' + (s.w || 2) + '"' + (s.dash ? ' stroke-dasharray="' + s.dash + '"' : '') + '/>'; });
          (o.pts || []).forEach(function (p) { g += '<circle cx="' + n1(sx(p.x)) + '" cy="' + n1(sy(Math.min(p.y, y1))) + '" r="5" fill="' + p.c + '"/>' + (p.n ? tx(sx(p.x) + 8, sy(Math.min(p.y, y1)) - 6, p.n, 10, p.c, 'start') : ''); });
          var lx = L + 8, ly = T + 2; S.forEach(function (s) { if (!s.n) return; g += ln(lx, ly, lx + 16, ly, s.c, 2.5, s.dash ? 'stroke-dasharray="' + s.dash + '"' : '') + tx(lx + 20, ly + 4, s.n, 9.5, 'currentColor', 'start'); lx += 34 + s.n.length * 10.5; if (lx > W - 120) { lx = L + 8; ly += 15; } });
          return svgw('0 0 ' + W + ' ' + H, g); }
        function rexp(m) { return -Math.log(1 - Math.random()) * m; }

        var BL = '#3a6ea5', OR = '#d9822b', RD = '#d0564f', GN = '#4a9a5e', GY = '#9aa3ad', PU = '#8a5bb5', TL = '#2a9d8f';
        function info(root) { var p = el('div', 'margin-top:8px;padding:10px 12px;border-radius:8px;background:var(--accent-soft);line-height:1.7;font-size:0.93em'); root.appendChild(p); return p; }
        function bar(root) { var b = el('div', 'margin:4px 0'); root.appendChild(b); return b; }
        function small(s) { return '<br><span style="font-size:0.88em;color:var(--text-muted)">' + s + '</span>'; }
        function presets(root, list, cb, k0) { var b = bar(root); list.forEach(function (o, i) { var x = btn(o[0], i); x.onclick = function () { mark(b, i); cb(o, i); }; b.appendChild(x); }); mark(b, k0 === undefined ? 0 : k0); return b; }
        function toggle(root, list, cb, k0) { var b = bar(root); list.forEach(function (o) { var x = btn(o[0], o[1]); x.onclick = function () { mark(b, o[1]); cb(o[1]); }; b.appendChild(x); }); mark(b, k0); return b; }
        function setS(root, k, v) { var s = root.querySelector('input[data-k="' + k + '"]'); if (s) s.value = v; }
        function rect(x, y, w, h, f, ex) { return '<rect x="' + n1(x) + '" y="' + n1(y) + '" width="' + n1(Math.max(w, 0)) + '" height="' + n1(Math.max(h, 0)) + '" fill="' + f + '" ' + (ex || '') + '/>'; }
        function circ(x, y, r, f, ex) { return '<circle cx="' + n1(x) + '" cy="' + n1(y) + '" r="' + n1(r) + '" fill="' + f + '" ' + (ex || '') + '/>'; }
        function path(d, c, w, ex) { return '<path d="' + d + '" fill="none" stroke="' + c + '" stroke-width="' + (w || 2) + '" ' + (ex || '') + '/>'; }
        function hbars(rows, W) { var o = ''; W = W || 300; var mx = Math.max.apply(null, rows.map(function (r) { return r[1]; })) || 1; rows.forEach(function (r, i) { var y = 8 + i * 30, w = r[1] / mx * W; o += tx(10, y + 14, r[0], 10.5, 'var(--text)', 'start') + rect(200, y, w, 20, r[2]) + tx(206 + w, y + 14, r[3], 10, 'var(--text)', 'start'); }); return svgw('0 0 640 ' + (14 + rows.length * 30), o); }

        /* ================= 麻醉 ================= */
        var AG = [['氧化亞氮（笑氣）', 0.47, 104, GY], ['地氟烷', 0.45, 6.0, TL], ['七氟烷', 0.65, 2.0, BL], ['異氟烷', 1.4, 1.15, PU], ['氟烷', 2.4, 0.75, OR], ['乙醚', 12, 1.9, RD]];
        function initInh(root, cfg) { head(root, cfg.q); var on = [0, 1, 1, 1, 1, 1], view = el('div'), b = bar(root);
          AG.forEach(function (g, i) { var x = btn(g[0], i); function st() { x.style.background = on[i] ? 'var(--accent-soft)' : 'var(--surface)'; x.style.fontWeight = on[i] ? 'bold' : 'normal'; } x.onclick = function () { on[i] = 1 - on[i]; st(); draw(); }; st(); b.appendChild(x); });
          root.appendChild(view); var inf = info(root);
          function draw() { var S = []; AG.forEach(function (g, i) { if (!on[i]) return; var p = 1 / (1 + 0.42 * g[1]), d = [], t; for (t = 0; t <= 30; t += 0.25) d.push([t, p * (1 - Math.exp(-t / 0.6)) + (1 - p) * (1 - Math.exp(-t / (25 + 4 * g[1])))]); S.push({ d: d, c: g[3], n: g[0] }); });
            view.innerHTML = S.length ? chart(640, 240, S, { x0: 0, x1: 30, y0: 0, y1: 1.05, xl: '時間（分鐘）', yl: '肺泡濃度 ／ 吸入濃度' }) : '';
            inf.innerHTML = '曲線越快接近 1，麻醉藥在肺泡（以及大腦）中的濃度越快趕上吸入的濃度——<b>誘導越快</b>，停藥後也<b>醒得越快</b>。<br>關鍵是藥物在<b>血液中的溶解度</b>（血氣分配係數）：' + AG.filter(function (g, i) { return on[i]; }).map(function (g) { return g[0] + ' ' + g[1]; }).join('、') + '。越不溶於血液，血液越快「飽和」，濃度越快上升——這有點反直覺。乙醚極易溶於血液，所以誘導要很久；地氟烷、七氟烷幾乎不溶，所以來得快、去得也快。' + small('示意的上升曲線（以血氣分配係數決定）；實際還受通氣量、心輸出量與組織攝取影響。各藥物的 MAC（約，成人）：笑氣 104%、地氟烷 6%、七氟烷 2%、異氟烷 1.15%。'); }
          draw();
        }

        var CS = [['瑞芬太尼', RD, function (h) { return 3.5; }], ['異丙酚', BL, function (h) { return 8 + 4 * h; }], ['咪達唑侖', PU, function (h) { return Math.min(85, 15 + 18 * h); }], ['吩坦尼', OR, function (h) { return Math.min(280, h <= 1 ? 20 * h + 5 : h <= 4 ? 25 + 42 * (h - 1) : 151 + 32 * (h - 4)); }]];
        function initCsht(root, cfg) { head(root, cfg.q); var P = { h: 3 }, view = el('div');
          var u = slider(root, '持續輸注的時間', 0.5, 8, 0.5, P.h, function (x) { return x + ' 小時'; }, null, function (x) { P.h = x; draw(); });
          root.appendChild(view); var inf = info(root);
          function draw() { var rows = CS.map(function (c) { var v = c[2](P.h); return [c[0], v, c[1], Math.round(v) + ' 分鐘']; });
            view.innerHTML = hbars(rows, 320);
            inf.innerHTML = '這是<b>情境敏感半衰期</b>：持續輸注 ' + P.h + ' 小時後停藥，血中濃度降到一半所需的時間。<br>藥物會慢慢「囤積」在脂肪等組織中，停藥後再緩緩釋放回血液——輸注越久，囤積越多，醒得越慢。<b>吩坦尼</b>在長時間輸注後特別明顯；<b>瑞芬太尼</b>會被血液與組織中的酵素迅速分解，不論輸注多久都只要幾分鐘；<b>異丙酚</b>則介於中間，這也是它成為最常用靜脈麻醉藥的原因之一。' + small('依文獻的大致數值繪製的示意；實際依病人的年齡、體型與肝腎功能而異。'); }
          u();
        }

        var CAP = [['正常', 'n'], ['換氣不足（呼吸太淺太慢）', 'hypo'], ['過度換氣', 'hyper'], ['支氣管痙攣（鯊魚鰭）', 'bron'], ['重複吸入二氧化碳', 'rebr'], ['管子插到食道', 'eso'], ['心肺復甦中', 'cpr']];
        function initCapno(root, cfg) { head(root, cfg.q); var P = { k: 'n' }, view = el('div');
          var b = bar(root); CAP.forEach(function (c) { var x = btn(c[0], c[1]); x.onclick = function () { P.k = c[1]; mark(b, c[1]); draw(); }; b.appendChild(x); }); mark(b, 'n');
          root.appendChild(view); var inf = info(root);
          function wave(t, k, br) { var per = { n: 4, hypo: 7, hyper: 2.6, bron: 4, rebr: 4, eso: 4, cpr: 0.6 }[k], ph = (t % per) / per, top = { n: 38, hypo: 55, hyper: 25, bron: 40, rebr: 42, eso: 20, cpr: 15 }[k], base = k === 'rebr' ? 8 : 0;
            if (k === 'eso') { var dec = Math.max(0, 1 - t / 8); top = 20 * dec; if (top < 1) return 0; }
            if (ph < 0.08) return base; if (ph < 0.18) return base + (top - base) * (ph - 0.08) / 0.1 * (k === 'bron' ? 0.4 : 0.92);
            if (ph < 0.55) { if (k === 'bron') return base + (top - base) * (0.4 + 0.6 * (ph - 0.18) / 0.37); return base + (top - base) * (0.92 + 0.08 * (ph - 0.18) / 0.37); }
            if (ph < 0.62) return base + (top - base) * (1 - (ph - 0.55) / 0.07); return base; }
          function draw() { var d = [], t; for (t = 0; t <= 16; t += 0.02) d.push([t, wave(t, P.k)]); var mx = 0; d.forEach(function (p) { mx = Math.max(mx, p[1]); });
            view.innerHTML = chart(640, 210, [{ d: d, c: OR, n: '呼出的二氧化碳（mmHg）' }], { x0: 0, x1: 16, y0: 0, y1: 60, xl: '時間（秒）', yl: 'mmHg', hl: [{ y: 35, c: GY, n: '正常約 35～45' }] });
            var tx2 = { n: '每次吐氣，二氧化碳先快速上升、形成一段平台，最高點就是<b>呼氣末二氧化碳</b>（約 35～45 mmHg）——反映肺部的換氣與身體的代謝。', hypo: '呼吸太淺、太慢：二氧化碳排不出去，數值升高。常見於麻醉藥或鴉片類藥物抑制了呼吸。', hyper: '呼吸太快、太深：二氧化碳被過度排出，數值降低。', bron: '支氣管收縮時，各區域的肺排空速度不一，上升段變得斜斜的，像<b>鯊魚鰭</b>——氣喘發作的特徵。', rebr: '吸氣時二氧化碳也不歸零：病人吸回了自己呼出的氣體，可能是吸收二氧化碳的鈉石灰用完了，或呼吸迴路的閥門故障。', eso: '管子如果誤插到<b>食道</b>，只會測到胃裡少量的氣體，幾次之後就<b>歸零</b>。持續有正常的二氧化碳波形，是確認氣管內管位置正確最可靠的方法之一。', cpr: '心跳停止時，血液不再把二氧化碳帶到肺部，數值極低；有效的胸部按壓會讓它上升，自發循環恢復時常會突然跳高——是急救時重要的指標。' }[P.k];
            inf.innerHTML = tx2 + small('示意的波形與數值。'); }
          draw();
        }

        var PT = [['健康成人', 3.0, 0.25], ['肥胖成人', 1.5, 0.32], ['孕婦（足月）', 1.8, 0.33], ['幼兒', 0.4, 0.1]];
        function initApnea(root, cfg) { head(root, cfg.q); var P = { k: 0, o: 1 }, view = el('div');
          presets(root, PT, function (o, i) { P.k = i; draw(); });
          toggle(root, [['先吸 100% 氧氣（預先給氧）', 1], ['呼吸室內空氣', 0]], function (k) { P.o = k; draw(); }, 1);
          root.appendChild(view); var inf = info(root);
          function draw() { var p = PT[P.k], fa = P.o ? 0.87 : 0.14, t90 = p[1] * (fa - 0.10) / p[2] + 0.3, top = P.o ? 100 : 97, d = [], t;
            for (t = 0; t <= 10; t += 0.05) { var s; if (t < t90 - 0.8) s = top; else if (t <= t90) s = top - (top - 90) * Math.pow((t - (t90 - 0.8)) / 0.8, 2); else s = Math.max(40, 90 - 28 * (t - t90)); d.push([t, s]); }
            view.innerHTML = chart(640, 220, [{ d: d, c: PU, n: '血氧飽和度（%）' }], { x0: 0, x1: 10, y0: 40, y1: 101, xl: '停止呼吸後的時間（分鐘）', yl: '%', hl: [{ y: 90, c: RD, n: '90%' }] });
            inf.innerHTML = '<b>' + p[0] + '</b>' + (P.o ? '，預先吸 100% 氧氣' : '，呼吸室內空氣') + '：停止呼吸後約 <b>' + (t90 > 10 ? '10 分鐘以上' : f1(t90) + ' 分鐘') + '</b>血氧降到 90%。<br>麻醉誘導後到插好管之間，病人沒有呼吸。肺裡剩下的氣體（功能肺餘量）就是氧氣的<b>儲存槽</b>。預先吸純氧，把肺裡的氮氣換成氧氣，儲存量變成好幾倍——為插管爭取寶貴的時間。肥胖、懷孕、幼兒的儲存槽較小、耗氧較快，時間短得多。血氧一旦開始下降，會<b>急轉直下</b>（氧合血紅素解離曲線的特性）。' + small('以「功能肺餘量 × 可用的氧氣比例 ÷ 耗氧量」做的粗略示意，數值不能用於臨床判斷。'); }
          draw();
        }

        var LA = [['利多卡因', 4.5], ['利多卡因（含腎上腺素）', 7], ['布比卡因', 2.5], ['羅哌卡因', 3]];
        function initLa(root, cfg) { head(root, cfg.q); var P = { k: 0, w: 60, c: 1 }, view = el('div');
          presets(root, LA, function (o, i) { P.k = i; draw(); });
          var u1 = slider(root, '體重', 10, 100, 1, P.w, function (x) { return x + ' 公斤'; }, null, function (x) { P.w = x; draw(); });
          var u2 = slider(root, '藥物濃度', 0.25, 2, 0.25, P.c, function (x) { return x + '%'; }, null, function (x) { P.c = x; draw(); });
          root.appendChild(view); var inf = info(root);
          function draw() { var mg = LA[P.k][1] * P.w, mgml = P.c * 10, ml = mg / mgml;
            view.innerHTML = hbars([['最大劑量', mg, RD, Math.round(mg) + ' 毫克'], ['相當於幾毫升', ml, BL, f1(ml) + ' 毫升']], 300);
