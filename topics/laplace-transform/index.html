<meta name="description" content="完整講解拉普拉斯轉換是什麼、為什麼長那樣、以及實際怎麼用。本課程刻意不從定義式出發，而是先講傅立葉——把訊號拆成頻率、正交性為何讓係數公式成立、頻域與卷積定理，再指出傅立葉的致命限制：因為 e^(-iωt) 的大小恆為一，它處理不了會發散的訊號，也沒有納入初始條件的機制；接著只改一個地方——先乘上 e^(-σt) 把訊號壓下來再做傅立葉，合併兩個指數令 s = σ + iω，拉普拉斯轉換就自己長出來了，多出來的負擔只有收斂區域。然後建立完整工具：以微分性質為引擎（微分變成乘 s，且初始條件在第一步就自動納入）、常用轉換表與只記三條就能推出其餘的方法、部分分式法處理相異實根、重根與複數根；再以五個模組走完應用——五步驟解常微分方程並走完 RC 與二階系統的完整例題、轉移函數與極點零點、由極點位置直接判斷穩定性與反應速度、迴旋積分與脈衝階躍響應、含初始儲能的電路分析、以及開閉迴路、PID 與根軌跡波德圖的控制入門；最後對照傅立葉與 Z 轉換（z = e^(sT) 把左半平面彎成單位圓內），釐清「s 不是頻率」等常見混淆與方法的非線性邊界，並附上轉換表、性質表與四類問題的解題流程。前置知識為複數，建議搭配本站的《複數到底在做什麼》。">
