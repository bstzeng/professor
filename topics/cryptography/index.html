<meta name="description" content="完整講解密碼學的原理與歷史，以恩尼格瑪為核心案例。先建立三個目標（保密、驗證、完整）與柯克霍夫原則，再從古典密碼與頻率分析講起；接著以四個模組、十七課完整拆解恩尼格瑪——六個部件的功能、電流經過接線板兩次與轉子組兩次的完整訊號路徑、凹口與雙重步進這個機械怪癖、轉子順序與環設定與起始位置三種金鑰的分工；親手算出約 1.59×10^20 的金鑰空間（含接線板十條線的組合數推導），並指出反射器造成的兩個結構缺陷：任何字母都不會被加密成自己，以及互反性讓可能的替換表少了十二個數量級；再說明它實際上怎麼被破——波蘭雷耶夫斯基以置換的循環結構繞過接線板、循環儀與密碼炸彈機、一九三九年華沙的移交、圖靈以已知明文與矛盾排除的炸彈機、韋爾奇曼的對角板，以及德軍那些反而降低安全性的規定。後半進入現代：夏農的完美保密與一次性密碼本、維諾那計畫、AES 與加密模式、模運算與費馬尤拉定理等數論工具、迪菲—赫爾曼、RSA 完整推導與可手算的實例、橢圓曲線、雜湊與密碼儲存、數位簽章與憑證信任鏈、隨機性與它造成的真實災難、以及秀爾演算法的威脅與二〇二四年定案的後量子標準。全課程的主線是：密碼系統的失敗幾乎從不發生在數學上。">
