      <p>
        搭配<a href="lesson-46.html">第46課：AI音樂生成Prompt工程</a>使用。

<script>

const pbSelected = {};
PB_CATEGORIES.forEach(function (cat) { pbSelected[cat.key] = []; });

function pbRenderSections() {
  const container = document.getElementById("pb-sections");
  container.innerHTML = PB_CATEGORIES.map(function (cat) {
    const buttons = cat.items.map(function (item) {
      return '<button type="button" class="descriptor-btn" data-cat="' + cat.key +
        '" data-value="' + item[1].replace(/"/g, "&quot;") + '">' + item[0] + '</button>';
    }).join("");
    return '<section class="descriptor-section' + (cat.negative ? " negative" : "") + '">' +
      '<h2>' + cat.title + ' <span class="count-badge">' + cat.items.length + ' 個</span></h2>' +
      '<div class="descriptor-grid">' + buttons + '</div>' +
      '</section>';
  }).join("");

  container.querySelectorAll(".descriptor-btn").forEach(function (btn) {
    btn.addEventListener("click", function () {
      const cat = btn.getAttribute("data-cat");
      const value = btn.getAttribute("data-value");
      const idx = pbSelected[cat].indexOf(value);
      if (idx === -1) {
        pbSelected[cat].push(value);
        btn.classList.add("selected");
      } else {
        pbSelected[cat].splice(idx, 1);
        btn.classList.remove("selected");
      }
      pbUpdateOutput();
    });
  });
}

function pbUpdateOutput() {
  const positiveOrder = ["genre", "mood", "instrumentation", "vocal", "era", "structure", "tempo"];
  const positiveParts = [];
  positiveOrder.forEach(function (key) {
    if (pbSelected[key] && pbSelected[key].length > 0) {
      positiveParts.push(pbSelected[key].join(", "));
    }
  });

  let output = positiveParts.join(", ");

  if (pbSelected.negative && pbSelected.negative.length > 0) {
    const negativeText = pbSelected.negative.join(", ");
    output = output.length > 0 ? output + " — avoid: " + negativeText : "avoid: " + negativeText;
  }

  document.getElementById("pb-output").value = output;
}

document.getElementById("pb-copy").addEventListener("click", function () {
  const textarea = document.getElementById("pb-output");
  const note = document.getElementById("pb-copy-note");
  if (!textarea.value) return;

  function showNote() {
    note.classList.add("show");
    setTimeout(function () { note.classList.remove("show"); }, 1800);
  }

  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(textarea.value).then(showNote).catch(function () {
      textarea.select();
      document.execCommand("copy");
      showNote();
    });
  } else {
    textarea.select();
    document.execCommand("copy");
    showNote();
  }
});

document.getElementById("pb-clear").addEventListener("click", function () {
  PB_CATEGORIES.forEach(function (cat) { pbSelected[cat.key] = []; });
  document.querySelectorAll(".descriptor-btn.selected").forEach(function (btn) {
    btn.classList.remove("selected");
  });
  pbUpdateOutput();
});

pbRenderSections();
</script>
