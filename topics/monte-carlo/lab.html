    <article class="lesson-content">

      <script>
      (function () {
        if (window.__mcLib) return; window.__mcLib = 1;

        function btn(t, k) { var b = document.createElement('button'); b.type = 'button'; b.textContent = t; if (k !== undefined) b.setAttribute('data-k', k);
          b.style.cssText = 'padding:4px 10px;margin:4px 6px 0 0;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer;font:inherit;font-size:0.9em'; return b; }
        function mark(bar, k) { bar.querySelectorAll('button').forEach(function (b) { var on = b.getAttribute('data-k') === String(k); b.style.background = on ? 'var(--accent-soft)' : 'var(--surface)'; b.style.fontWeight = on ? 'bold' : 'normal'; }); }
        function head(root, q) { if (q) { var p = document.createElement('p'); p.style.margin = '0 0 8px'; p.innerHTML = q; root.appendChild(p); } }
        function el(tag, css, html) { var e = document.createElement(tag); if (css) e.style.cssText = css; if (html !== undefined) e.innerHTML = html; return e; }
        function n1(v) { return Math.round(v * 10) / 10; }
        function f1(v) { return (Math.round(v * 10) / 10).toString(); }
        function f2(v) { return (Math.round(v * 100) / 100).toString(); }
        function tx(x, y, s, sz, c, anc) { return '<text x="' + n1(x) + '" y="' + n1(y) + '" font-size="' + sz + '" fill="' + (c || 'currentColor') + '" text-anchor="' + (anc || 'middle') + '">' + s + '</text>'; }
        function ln(x1, y1, x2, y2, c, w, ex) { return '<line x1="' + n1(x1) + '" y1="' + n1(y1) + '" x2="' + n1(x2) + '" y2="' + n1(y2) + '" stroke="' + c + '" stroke-width="' + (w || 1) + '" ' + (ex || '') + '/>'; }
        function svgw(vb, inner) { return '<svg viewBox="' + vb + '" style="width:100%;display:block;color:var(--text)">' + inner + '</svg>'; }
        function slider(root, lab, min, max, step, val, fmt, k, cb) { var l = el('label', 'display:block;font-size:0.88em;margin-top:6px', lab + '：<b></b>'); var s = document.createElement('input');
          s.type = 'range'; s.min = min; s.max = max; s.step = step; s.value = val; s.style.cssText = 'width:100%;display:block'; if (k) s.setAttribute('data-k', k); l.appendChild(s); root.appendChild(l);
          function u() { l.querySelector('b').textContent = fmt(+s.value); cb(+s.value); } s.addEventListener('input', u); return u; }
        function nice(lo, hi, n) { var span = hi - lo || 1, st = Math.pow(10, Math.floor(Math.log10(span / n))), e = span / n / st; st *= e >= 5 ? 5 : e >= 2 ? 2 : 1; var t = [], v = Math.ceil(lo / st - 1e-9) * st; for (; v <= hi + 1e-9; v += st) t.push(Math.round(v / st) * st); return t; }
        function fmtT(v) { var a = Math.abs(v); return a >= 1e6 ? f1(v / 1e6) + 'M' : a >= 1e4 ? f1(v / 1e3) + 'k' : (Math.round(v * 100) / 100).toString(); }
        var CID = 0;
        function chart(W, H, S, o) { o = o || {}; var L = 48, R = 12, T = 22, B = 34, xs = [], ys = [];
          S.forEach(function (s) { s.d.forEach(function (p) { xs.push(p[0]); if (isFinite(p[1])) ys.push(p[1]); }); });
          var x0 = o.x0 !== undefined ? o.x0 : Math.min.apply(null, xs), x1 = o.x1 !== undefined ? o.x1 : Math.max.apply(null, xs);
          var y0 = o.y0 !== undefined ? o.y0 : Math.min(0, Math.min.apply(null, ys)), y1 = o.y1 !== undefined ? o.y1 : Math.max.apply(null, ys) * 1.08 || 1;
          function sx(v) { return L + (v - x0) / (x1 - x0 || 1) * (W - L - R); } function sy(v) { return H - B - (v - y0) / (y1 - y0 || 1) * (H - T - B); }
          var id = 'qc' + (++CID), g = '<clipPath id="' + id + '"><rect x="' + L + '" y="' + (T - 2) + '" width="' + (W - L - R) + '" height="' + (H - T - B + 4) + '"/></clipPath>';
          nice(y0, y1, 4).forEach(function (v) { g += ln(L, sy(v), W - R, sy(v), 'var(--border)', 0.6, 'stroke-dasharray="2 3"') + tx(L - 5, sy(v) + 3, fmtT(v), 9, 'var(--text-muted)', 'end'); });
          nice(x0, x1, 6).forEach(function (v) { g += tx(sx(v), H - B + 14, fmtT(v), 9, 'var(--text-muted)'); });
          g += ln(L, T - 4, L, H - B, '#999') + ln(L, H - B, W - R, H - B, '#999');
          if (o.xl) g += tx((L + W - R) / 2, H - 4, o.xl, 9.5, 'var(--text-muted)');
          if (o.yl) g += tx(L - 40, T - 8, o.yl, 9.5, 'var(--text-muted)', 'start');
          (o.hl || []).forEach(function (h) { g += ln(L, sy(h.y), W - R, sy(h.y), h.c, 1, 'stroke-dasharray="5 4"') + tx(W - R - 2, sy(h.y) - 4, h.n, 9, h.c, 'end'); });
          (o.vl || []).forEach(function (h) { g += ln(sx(h.x), T, sx(h.x), H - B, h.c, 1, 'stroke-dasharray="5 4"') + tx(sx(h.x) + 3, H - B - 6, h.n, 9, h.c, 'start'); });
          S.forEach(function (s) { var d = '', m = 'M'; s.d.forEach(function (p) { if (!isFinite(p[1])) { m = 'M'; return; } d += m + n1(sx(p[0])) + ' ' + n1(sy(Math.max(Math.min(p[1], y1 + (y1 - y0)), y0 - (y1 - y0)))); m = 'L'; });
            g += '<path clip-path="url(#' + id + ')" d="' + d + '" fill="none" stroke="' + s.c + '" stroke-width="' + (s.w || 2) + '"' + (s.dash ? ' stroke-dasharray="' + s.dash + '"' : '') + '/>'; });
          (o.pts || []).forEach(function (p) { g += '<circle cx="' + n1(sx(p.x)) + '" cy="' + n1(sy(Math.min(p.y, y1))) + '" r="5" fill="' + p.c + '"/>' + (p.n ? tx(sx(p.x) + 8, sy(Math.min(p.y, y1)) - 6, p.n, 10, p.c, 'start') : ''); });
          var lx = L + 8, ly = T + 2; S.forEach(function (s) { if (!s.n) return; g += ln(lx, ly, lx + 16, ly, s.c, 2.5, s.dash ? 'stroke-dasharray="' + s.dash + '"' : '') + tx(lx + 20, ly + 4, s.n, 9.5, 'currentColor', 'start'); lx += 34 + s.n.length * 10.5; if (lx > W - 120) { lx = L + 8; ly += 15; } });
          return svgw('0 0 ' + W + ' ' + H, g); }
        function rexp(m) { return -Math.log(1 - Math.random()) * m; }

        function randn() { var u = 1 - Math.random(), v = Math.random(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); }
        function cv(root, w, h, bg) { var c = document.createElement('canvas'); c.width = w; c.height = h; c.style.cssText = 'width:100%;max-width:' + w + 'px;display:block;margin:0 auto;border-radius:8px;border:1px solid var(--border);background:' + (bg || 'var(--surface)'); root.appendChild(c); return c; }
        function halton(i, b) { var f = 1, r = 0; while (i > 0) { f /= b; r += f * (i % b); i = Math.floor(i / b); } return r; }
        function Ncdf(x) { var t = 1 / (1 + 0.2316419 * Math.abs(x)), d = 0.3989423 * Math.exp(-x * x / 2), p = d * t * (0.3193815 + t * (-0.3565638 + t * (1.781478 + t * (-1.821256 + t * 1.330274)))); return x > 0 ? 1 - p : p; }

        /* ---------- 蒲豐投針 ---------- */
        function initBuffon(root, cfg) {
          head(root, cfg.q); var c = cv(root, 640, 260), bar = el('div'), info = el('p', 'margin:6px 0 0'), N = 0, X = 0, nd = []; root.appendChild(bar); root.appendChild(info);
          [10, 100, 1000].forEach(function (k) { var b = btn('丟 ' + k + ' 根', 'n' + k); b.addEventListener('click', function () { drop(k); }); bar.appendChild(b); });
          var br = btn('↺ 重來', 'r'); br.addEventListener('click', function () { N = 0; X = 0; nd = []; draw(); }); bar.appendChild(br);
          var D = 40;
          function drop(k) { for (var i = 0; i < k; i++) { var x = Math.random() * 640, y = Math.random() * 260, th = Math.random() * Math.PI, dx = D / 2 * Math.cos(th), dy = D / 2 * Math.sin(th);
              var hit = Math.floor((y - dy) / D) !== Math.floor((y + dy) / D); N++; if (hit) X++; nd.push([x - dx, y - dy, x + dx, y + dy, hit]); if (nd.length > 600) nd.shift(); } draw(); }
          function draw() { var g = c.getContext('2d'); g.clearRect(0, 0, 640, 260); g.strokeStyle = '#999'; for (var y = 0; y <= 260; y += D) { g.beginPath(); g.moveTo(0, y); g.lineTo(640, y); g.stroke(); }
            nd.forEach(function (n) { g.strokeStyle = n[4] ? '#e0605a' : '#3a6ea5'; g.lineWidth = 1.5; g.beginPath(); g.moveTo(n[0], n[1]); g.lineTo(n[2], n[3]); g.stroke(); });
            info.innerHTML = '針長等於線距。丟了 <b>' + N + '</b> 根，壓到線（紅）的有 <b>' + X + '</b> 根。理論上壓線機率是 2/π，所以 π ≈ 2N / 壓線數 = <b>' + (X ? (2 * N / X).toFixed(4) : '—') + '</b>' + (X ? '（誤差 ' + Math.abs(2 * N / X - Math.PI).toFixed(4) + '）' : '') + '。蒲豐在 1777 年提出這個問題——這是最早的「用隨機實驗計算數學常數」。'; }
          draw();
        }

        /* ---------- 丟點估 π ---------- */
        function initPi(root, cfg) {
          head(root, cfg.q); var c = cv(root, 300, 300), bar = el('div'), view = el('div'), info = el('p', 'margin:6px 0 0'), N = 0, In = 0, hist = []; c.style.maxWidth = '300px'; root.appendChild(bar); root.appendChild(view); root.appendChild(info);
          [100, 1000, 10000].forEach(function (k) { var b = btn('+' + k + ' 點', 'n' + k); b.addEventListener('click', function () { add(k); }); bar.appendChild(b); });
          var br = btn('↺ 重來', 'r'); br.addEventListener('click', function () { N = 0; In = 0; hist = []; c.getContext('2d').clearRect(0, 0, 300, 300); draw(); }); bar.appendChild(br);
          function add(k) { var g = c.getContext('2d'); for (var i = 0; i < k; i++) { var x = Math.random(), y = Math.random(), ins = x * x + y * y <= 1; N++; if (ins) In++; if (N < 20000) { g.fillStyle = ins ? 'rgba(58,110,165,0.7)' : 'rgba(224,96,90,0.7)'; g.fillRect(x * 300, 300 - y * 300, 2, 2); }
              if (N % Math.max(1, Math.floor(N / 40)) === 0) hist.push([Math.log10(N), 4 * In / N]); } draw(); }
          function draw() { var g = c.getContext('2d'); g.strokeStyle = '#333'; g.beginPath(); g.arc(0, 300, 300, -Math.PI / 2, 0); g.stroke();
            view.innerHTML = N ? chart(640, 180, [{ d: hist, c: '#3a6ea5', n: '4 × 圓內比例' }], { x0: 2, x1: Math.max(3, Math.log10(N)), y0: 2.8, y1: 3.5, xl: 'log₁₀ 點數', hl: [{ y: Math.PI, c: '#e0605a', n: 'π' }] }) : '';
            var est = N ? 4 * In / N : 0, se = N ? 4 * Math.sqrt((In / N) * (1 - In / N) / N) : 0;
            info.innerHTML = N ? '共 <b>' + N + '</b> 點，落在四分之一圓內 ' + In + ' 點。π ≈ 4 × ' + In + '/' + N + ' = <b>' + est.toFixed(4) + '</b>，標準誤約 ±' + se.toFixed(4) + '。要多一位精確的數字，需要 100 倍的點。' : '在正方形內隨機丟點，數落在四分之一圓內的比例（面積比 = π/4）。'; }
          draw();
        }

        /* ---------- 接受—拒絕法 ---------- */
        function initReject(root, cfg) {
          head(root, cfg.q); var c = cv(root, 640, 240), bar = el('div'), info = el('p', 'margin:6px 0 0'), pts = [], acc = []; root.appendChild(bar); root.appendChild(info);
          [200, 2000].forEach(function (k) { var b = btn('抽 ' + k + ' 個候選點', 'n' + k); b.addEventListener('click', function () { add(k); }); bar.appendChild(b); });
          var br = btn('↺ 重來', 'r'); br.addEventListener('click', function () { pts = []; acc = []; draw(); }); bar.appendChild(br);
          function f(x) { return 0.6 * Math.exp(-(x + 1) * (x + 1) / 0.5) / Math.sqrt(0.5 * Math.PI) + 0.4 * Math.exp(-(x - 1.5) * (x - 1.5) / 0.98) / Math.sqrt(0.98 * Math.PI); }
          var A = -4, B = 5, Mx = 0.55;
          function add(k) { for (var i = 0; i < k; i++) { var x = A + Math.random() * (B - A), u = Math.random() * Mx, ok = u <= f(x); pts.push([x, u, ok]); if (ok) acc.push(x); } if (pts.length > 4000) pts = pts.slice(-4000); draw(); }
          function sx(x) { return 20 + (x - A) / (B - A) * 600; } function sy(y) { return 220 - y / Mx * 190; }
          function draw() { var g = c.getContext('2d'); g.clearRect(0, 0, 640, 240); g.strokeStyle = '#999'; g.strokeRect(sx(A), sy(Mx), 600, 190);
            pts.forEach(function (p) { g.fillStyle = p[2] ? 'rgba(90,164,105,0.6)' : 'rgba(224,96,90,0.35)'; g.fillRect(sx(p[0]), sy(p[1]), 2, 2); });
            if (acc.length) { var bins = new Array(36).fill(0); acc.forEach(function (x) { bins[Math.min(35, Math.floor((x - A) / (B - A) * 36))]++; }); var w = (B - A) / 36;
              g.fillStyle = 'rgba(58,110,165,0.25)'; bins.forEach(function (n, i) { var h = Math.min(Mx, n / acc.length / w); g.fillRect(sx(A + i * w), sy(h), 600 / 36 - 1, 220 - sy(h)); }); }
            g.strokeStyle = '#3a6ea5'; g.lineWidth = 2; g.beginPath(); for (var x = A; x <= B; x += 0.02) { x === A ? g.moveTo(sx(x), sy(f(x))) : g.lineTo(sx(x), sy(f(x))); } g.stroke();
            var rate = pts.length ? acc.length / pts.length : 0;
            info.innerHTML = '想從藍色曲線這個奇怪的分布抽樣。做法：在外框內均勻撒點，<b>落在曲線下方的接受（綠）、上方的拒絕（紅）</b>。被接受的點的 x 座標，分布剛好就是藍色曲線（淺藍直方圖）。接受率 <b>' + Math.round(rate * 100) + '%</b>（理論上等於曲線下面積 ÷ 外框面積 ≈ 20%）。外框越貼近曲線，浪費越少。'; }
          draw();
        }

        /* ---------- 誤差收斂 ---------- */
        function initConv(root, cfg) {
          head(root, cfg.q); var view = el('div'), bar = el('div'), info = el('p', 'margin:6px 0 0'); root.appendChild(view); root.appendChild(bar);
          var b = btn('🎲 重新做 20 次實驗', 'go'); b.addEventListener('click', draw); bar.appendChild(b); root.appendChild(info);
          function draw() { var S = [], Ns = []; for (var e = 1; e <= 5.01; e += 0.25) Ns.push(Math.round(Math.pow(10, e)));
            for (var r = 0; r < 20; r++) { var d = [], s = 0, n = 0; Ns.forEach(function (N) { while (n < N) { var x = Math.random(); s += 4 * Math.sqrt(1 - x * x); n++; } d.push([Math.log10(N), Math.log10(Math.abs(s / n - Math.PI) + 1e-7)]); }); S.push({ d: d, c: 'rgba(58,110,165,0.35)', w: 1 }); }
            S.push({ d: Ns.map(function (N) { return [Math.log10(N), Math.log10(0.9 / Math.sqrt(N))]; }), c: '#e0605a', n: '∝ 1/√N', w: 2.5, dash: '6 4' });
            view.innerHTML = chart(640, 260, S, { x0: 1, x1: 5, y0: -5, y1: 0.5, xl: 'log₁₀ 樣本數 N', yl: 'log₁₀ |誤差|' });
            info.innerHTML = '用 ∫₀¹ 4√(1−x²) dx = π 做 20 次獨立的蒙地卡羅積分（藍線）。在對數座標上，誤差沿著斜率 −½ 的直線下降：<b>誤差 ∝ 1/√N</b>。樣本數增加 100 倍，誤差才縮小 10 倍——這是蒙地卡羅的弱點；但這個速度<b>和維度無關</b>，是它的強項（第 15 課）。'; }
          draw();
        }

        /* ---------- 低差異序列 ---------- */
        function initQMC(root, cfg) {
          head(root, cfg.q); var N = 256, view = el('div'), info = el('p', 'margin:6px 0 0'); root.appendChild(view);
          var u = slider(root, '點數', 16, 2048, 16, N, function (v) { return v; }, 'N', function (v) { N = v; draw(); }); root.appendChild(info);
          function panel(P, lab, col) { var o = '<rect x="0" y="0" width="200" height="200" fill="var(--surface)" stroke="#999"/>'; P.forEach(function (p) { o += '<circle cx="' + n1(p[0] * 200) + '" cy="' + n1(200 - p[1] * 200) + '" r="' + (N > 600 ? 1.2 : 2) + '" fill="' + col + '"/>'; });
            return '<div style="text-align:center;flex:0 0 220px">' + svgw('0 0 200 200', o) + '<div style="font-size:0.85em">' + lab + '</div></div>'; }
          function draw() { var R = [], H = []; for (var i = 0; i < N; i++) { R.push([Math.random(), Math.random()]); H.push([halton(i + 1, 2), halton(i + 1, 3)]); }
            var A = [], Bq = []; for (var e = 1; e <= 4.01; e += 0.2) { var n = Math.round(Math.pow(10, e)), cr = 0, ch = 0; for (var j = 0; j < n; j++) { var x = Math.random(), y = Math.random(); if (x * x + y * y <= 1) cr++; var hx = halton(j + 1, 2), hy = halton(j + 1, 3); if (hx * hx + hy * hy <= 1) ch++; }
              A.push([e, Math.log10(Math.abs(4 * cr / n - Math.PI) + 1e-6)]); Bq.push([e, Math.log10(Math.abs(4 * ch / n - Math.PI) + 1e-6)]); }
            view.innerHTML = '<div style="display:flex;flex-wrap:wrap;gap:10px;justify-content:center">' + panel(R, '偽隨機：有團塊、有空洞', '#e0605a') + panel(H, '霍爾頓序列：均勻鋪滿', '#3a6ea5') + '</div>' +
              chart(640, 200, [{ d: A, c: '#e0605a', n: '隨機點的誤差' }, { d: Bq, c: '#3a6ea5', n: '霍爾頓序列的誤差' }], { x0: 1, x1: 4, y0: -5, y1: 0, xl: 'log₁₀ 點數', yl: 'log₁₀ |估計 π 的誤差|' });
            info.innerHTML = '真正的隨機點會「撞在一起」也會留下空洞。<b>低差異序列</b>（這裡用霍爾頓序列，以 2 進位與 3 進位的反轉數字產生）刻意把點均勻分散。在低維度的積分中，誤差可以接近 1/N 而不是 1/√N。這叫<b>準蒙地卡羅</b>，廣泛用於金融計算與電腦繪圖。'; }
          u();
        }

        /* ---------- 梅特羅波利斯 ---------- */
        function initMetro(root, cfg) {
          head(root, cfg.q); var sig = 0.5, c = cv(root, 320, 320), view = el('div'), bar = el('div'), info = el('p', 'margin:6px 0 0'), ch, acc, tot, run = true; c.style.maxWidth = '320px'; root.appendChild(view); root.appendChild(bar);
          var bp = btn('⏸ 暫停', 'p'); bp.addEventListener('click', function () { run = !run; bp.textContent = run ? '⏸ 暫停' : '▶ 繼續'; }); bar.appendChild(bp);
          var br = btn('↺ 重新開始', 'r'); br.addEventListener('click', reset); bar.appendChild(br);
          var u = slider(root, '提議步長 σ', 0.05, 4, 0.05, sig, f2, 'sig', function (v) { sig = v; reset(); }); root.appendChild(info);
          function p(x, y) { return Math.exp(-((x + 1.5) * (x + 1.5) + (y - 1) * (y - 1)) / 0.6) + 0.8 * Math.exp(-((x - 1.5) * (x - 1.5) + (y + 1) * (y + 1)) / 0.9); }
          var bg = document.createElement('canvas'); bg.width = 320; bg.height = 320; (function () { var g = bg.getContext('2d'), im = g.createImageData(320, 320); for (var j = 0; j < 320; j++) for (var i = 0; i < 320; i++) { var v = p(i / 320 * 8 - 4, 4 - j / 320 * 8), a = Math.min(1, v); im.data[(j * 320 + i) * 4] = 255 - a * 140; im.data[(j * 320 + i) * 4 + 1] = 255 - a * 90; im.data[(j * 320 + i) * 4 + 2] = 255 - a * 30; im.data[(j * 320 + i) * 4 + 3] = 255; } g.putImageData(im, 0, 0); })();
