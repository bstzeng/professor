      <script>
      (function () {
        if (window.__korLib) return; window.__korLib = 1;

        function btn(t, k) { var b = document.createElement('button'); b.type = 'button'; b.textContent = t; if (k !== undefined) b.setAttribute('data-k', k);
          b.style.cssText = 'padding:4px 10px;margin:4px 6px 0 0;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer;font:inherit;font-size:0.9em'; return b; }
        function mark(bar, k) { bar.querySelectorAll('button').forEach(function (b) { var on = b.getAttribute('data-k') === String(k); b.style.background = on ? 'var(--accent-soft)' : 'var(--surface)'; b.style.fontWeight = on ? 'bold' : 'normal'; }); }
        function head(root, q) { if (q) { var p = document.createElement('p'); p.style.margin = '0 0 8px'; p.innerHTML = q; root.appendChild(p); } }
        function el(tag, css, html) { var e = document.createElement(tag); if (css) e.style.cssText = css; if (html !== undefined) e.innerHTML = html; return e; }
        function n1(v) { return Math.round(v * 10) / 10; }
        function f1(v) { return (Math.round(v * 10) / 10).toString(); }
        function f2(v) { return (Math.round(v * 100) / 100).toString(); }
        function tx(x, y, s, sz, c, anc) { return '<text x="' + n1(x) + '" y="' + n1(y) + '" font-size="' + sz + '" fill="' + (c || 'currentColor') + '" text-anchor="' + (anc || 'middle') + '">' + s + '</text>'; }
        function ln(x1, y1, x2, y2, c, w, ex) { return '<line x1="' + n1(x1) + '" y1="' + n1(y1) + '" x2="' + n1(x2) + '" y2="' + n1(y2) + '" stroke="' + c + '" stroke-width="' + (w || 1) + '" ' + (ex || '') + '/>'; }
        function svgw(vb, inner) { return '<svg viewBox="' + vb + '" style="width:100%;display:block;color:var(--text)">' + inner + '</svg>'; }
        function slider(root, lab, min, max, step, val, fmt, k, cb) { var l = el('label', 'display:block;font-size:0.88em;margin-top:6px', lab + '：<b></b>'); var s = document.createElement('input');
          s.type = 'range'; s.min = min; s.max = max; s.step = step; s.value = val; s.style.cssText = 'width:100%;display:block'; if (k) s.setAttribute('data-k', k); l.appendChild(s); root.appendChild(l);
          function u() { l.querySelector('b').textContent = fmt(+s.value); cb(+s.value); } s.addEventListener('input', u); return u; }
        function nice(lo, hi, n) { var span = hi - lo || 1, st = Math.pow(10, Math.floor(Math.log10(span / n))), e = span / n / st; st *= e >= 5 ? 5 : e >= 2 ? 2 : 1; var t = [], v = Math.ceil(lo / st - 1e-9) * st; for (; v <= hi + 1e-9; v += st) t.push(Math.round(v / st) * st); return t; }
        function fmtT(v) { var a = Math.abs(v); return a >= 1e6 ? f1(v / 1e6) + 'M' : a >= 1e4 ? f1(v / 1e3) + 'k' : (Math.round(v * 100) / 100).toString(); }
        var CID = 0;
        function chart(W, H, S, o) { o = o || {}; var L = 48, R = 12, T = 22, B = 34, xs = [], ys = [];
          S.forEach(function (s) { s.d.forEach(function (p) { xs.push(p[0]); if (isFinite(p[1])) ys.push(p[1]); }); });
          var x0 = o.x0 !== undefined ? o.x0 : Math.min.apply(null, xs), x1 = o.x1 !== undefined ? o.x1 : Math.max.apply(null, xs);
          var y0 = o.y0 !== undefined ? o.y0 : Math.min(0, Math.min.apply(null, ys)), y1 = o.y1 !== undefined ? o.y1 : Math.max.apply(null, ys) * 1.08 || 1;
          function sx(v) { return L + (v - x0) / (x1 - x0 || 1) * (W - L - R); } function sy(v) { return H - B - (v - y0) / (y1 - y0 || 1) * (H - T - B); }
          var id = 'qc' + (++CID), g = '<clipPath id="' + id + '"><rect x="' + L + '" y="' + (T - 2) + '" width="' + (W - L - R) + '" height="' + (H - T - B + 4) + '"/></clipPath>';
          nice(y0, y1, 4).forEach(function (v) { g += ln(L, sy(v), W - R, sy(v), 'var(--border)', 0.6, 'stroke-dasharray="2 3"') + tx(L - 5, sy(v) + 3, fmtT(v), 9, 'var(--text-muted)', 'end'); });
          nice(x0, x1, 6).forEach(function (v) { g += tx(sx(v), H - B + 14, fmtT(v), 9, 'var(--text-muted)'); });
          g += ln(L, T - 4, L, H - B, '#999') + ln(L, H - B, W - R, H - B, '#999');
          if (o.xl) g += tx((L + W - R) / 2, H - 4, o.xl, 9.5, 'var(--text-muted)');
          if (o.yl) g += tx(L - 40, T - 8, o.yl, 9.5, 'var(--text-muted)', 'start');
          (o.hl || []).forEach(function (h) { g += ln(L, sy(h.y), W - R, sy(h.y), h.c, 1, 'stroke-dasharray="5 4"') + tx(W - R - 2, sy(h.y) - 4, h.n, 9, h.c, 'end'); });
          (o.vl || []).forEach(function (h) { g += ln(sx(h.x), T, sx(h.x), H - B, h.c, 1, 'stroke-dasharray="5 4"') + tx(sx(h.x) + 3, H - B - 6, h.n, 9, h.c, 'start'); });
          S.forEach(function (s) { var d = '', m = 'M'; s.d.forEach(function (p) { if (!isFinite(p[1])) { m = 'M'; return; } d += m + n1(sx(p[0])) + ' ' + n1(sy(Math.max(Math.min(p[1], y1 + (y1 - y0)), y0 - (y1 - y0)))); m = 'L'; });
            g += '<path clip-path="url(#' + id + ')" d="' + d + '" fill="none" stroke="' + s.c + '" stroke-width="' + (s.w || 2) + '"' + (s.dash ? ' stroke-dasharray="' + s.dash + '"' : '') + '/>'; });
          (o.pts || []).forEach(function (p) { g += '<circle cx="' + n1(sx(p.x)) + '" cy="' + n1(sy(Math.min(p.y, y1))) + '" r="5" fill="' + p.c + '"/>' + (p.n ? tx(sx(p.x) + 8, sy(Math.min(p.y, y1)) - 6, p.n, 10, p.c, 'start') : ''); });
          var lx = L + 8, ly = T + 2; S.forEach(function (s) { if (!s.n) return; g += ln(lx, ly, lx + 16, ly, s.c, 2.5, s.dash ? 'stroke-dasharray="' + s.dash + '"' : '') + tx(lx + 20, ly + 4, s.n, 9.5, 'currentColor', 'start'); lx += 34 + s.n.length * 10.5; if (lx > W - 120) { lx = L + 8; ly += 15; } });
          return svgw('0 0 ' + W + ' ' + H, g); }
        function rexp(m) { return -Math.log(1 - Math.random()) * m; }

        var BL = '#3a6ea5', OR = '#d9822b', RD = '#d0564f', GN = '#4a9a5e', GY = '#9aa3ad', PU = '#8a5bb5', TL = '#2a9d8f', YL = '#c9a227';
        function info(root) { var p = el('div', 'margin-top:8px;padding:10px 12px;border-radius:8px;background:var(--accent-soft);line-height:1.7;font-size:0.93em'); root.appendChild(p); return p; }
        function bar(root) { var b = el('div', 'margin:4px 0'); root.appendChild(b); return b; }
        function small(s) { return '<br><span style="font-size:0.88em;color:var(--text-muted)">' + s + '</span>'; }
        function presets(root, list, cb, k0) { var b = bar(root); list.forEach(function (o, i) { var x = btn(o, i); x.onclick = function () { mark(b, i); cb(i); }; b.appendChild(x); }); mark(b, k0 === undefined ? 0 : k0); return b; }
        function setS(root, k, v) { var s = root.querySelector('input[data-k="' + k + '"]'); if (s) s.value = v; }
        function rc(x, y, w, h, f, st, rx) { return '<rect x="' + n1(x) + '" y="' + n1(y) + '" width="' + n1(Math.max(w, 0)) + '" height="' + n1(Math.max(h, 0)) + '" rx="' + (rx === undefined ? 4 : rx) + '" fill="' + f + '"' + (st ? ' stroke="' + st + '"' : '') + '/>'; }
        function ci(x, y, r, f, st, sw) { return '<circle cx="' + n1(x) + '" cy="' + n1(y) + '" r="' + n1(r) + '" fill="' + f + '"' + (st ? ' stroke="' + st + '" stroke-width="' + (sw || 1.5) + '"' : '') + '/>'; }
        function pa(d, c, w, f, ex) { return '<path d="' + d + '" fill="' + (f || 'none') + '" stroke="' + c + '" stroke-width="' + (w || 1.5) + '" ' + (ex || '') + '/>'; }
        function poly(pts) { return pts.map(function (p, i) { return (i ? 'L' : 'M') + n1(p[0]) + ' ' + n1(p[1]); }).join(' '); }
        function tbl(h, rows) { var s = '<table style="border-collapse:collapse;width:100%;font-size:0.86em;margin-top:6px"><tr>' + h.map(function (x) { return '<th style="border:1px solid var(--border);padding:3px 5px;background:var(--accent-soft)">' + x + '</th>'; }).join('') + '</tr>';
          rows.forEach(function (r) { s += '<tr>' + r.map(function (c, j) { return '<td style="border:1px solid var(--border);padding:3px 5px;text-align:' + (j ? 'center' : 'left') + '">' + c + '</td>'; }).join('') + '</tr>'; }); return s + '</table>'; }
        function rng(seed) { var a = (seed || 1) >>> 0; return function () { a = (a + 0x6D2B79F5) >>> 0; var t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
        function gauss(r) { var u = Math.max(r(), 1e-9), v = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); }
        function pct(v) { return f1(v * 100) + '%'; }
        function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

        /* 1. 官能基測驗 */
        function initFg(root, cfg) { head(root, cfg.q);
          var G = ['烷類', '烯類', '炔類', '芳香族', '醇', '醚', '醛', '酮', '羧酸', '酯', '胺', '醯胺', '鹵化物'];
          var Q = [['CH<sub>3</sub>CH<sub>2</sub><b style="color:#d0564f">OH</b>', '乙醇（酒精）', 4, '羥基 −OH 接在飽和碳上。能形成氫鍵，所以沸點（78 °C）比分子量相近的丙烷（−42 °C）高得多。'], ['CH<sub>3</sub><b style="color:#d0564f">COOH</b>', '乙酸（醋酸）', 8, '羧基 −COOH：H 可以解離，是弱酸（pKa 4.76）。食用醋約含 4%～5% 的乙酸。'], ['CH<sub>3</sub><b style="color:#d0564f">CO</b>CH<sub>3</sub>', '丙酮', 7, '羰基 C=O 夾在兩個碳之間是酮。去光水的主要成分，也是重要的溶劑。'], ['H<b style="color:#d0564f">CHO</b>', '甲醛', 6, '羰基至少接一個 H 是醛。甲醛水溶液就是福馬林，可以固定生物標本；室內裝潢的甲醛逸散對健康有害。'], ['CH<sub>3</sub><b style="color:#d0564f">COO</b>CH<sub>2</sub>CH<sub>3</sub>', '乙酸乙酯', 9, '酯基 −COO−：酸與醇脫水而成，多半有水果香。去光水、油漆溶劑常見這個味道。'], ['CH<sub>3</sub>CH<sub>2</sub><b style="color:#d0564f">NH<sub>2</sub></b>', '乙胺', 10, '胺基 −NH<sub>2</sub>：氮上有孤對電子，是弱鹼。許多胺有魚腥味——魚腥味來自三甲胺，擠檸檬汁（酸）可以中和。'], ['CH<sub>3</sub><b style="color:#d0564f">CONH<sub>2</sub></b>', '乙醯胺', 11, '醯胺基 −CONH−：羧酸與胺結合而成。蛋白質的胜肽鍵、尼龍的主鏈都是醯胺鍵。'], ['CH<sub>2</sub><b style="color:#d0564f">=</b>CH<sub>2</sub>', '乙烯', 1, '碳碳雙鍵 C=C。最重要的工業原料之一，聚合成聚乙烯（塑膠袋）；也是植物催熟水果的激素。'], ['HC<b style="color:#d0564f">≡</b>CH', '乙炔', 2, '碳碳三鍵 C≡C。燃燒溫度可達約 3,000 °C，用於氧乙炔焊接與切割。'], ['C<sub>6</sub>H<sub>5</sub>−CH<sub>3</sub>（<b style="color:#d0564f">苯環</b>）', '甲苯', 3, '含苯環的化合物是芳香族。甲苯是常見的溶劑與油漆稀釋劑，也是製造 TNT 的原料。'], ['CH<sub>3</sub>CH<sub>2</sub><b style="color:#d0564f">O</b>CH<sub>2</sub>CH<sub>3</sub>', '乙醚', 5, '氧夾在兩個碳之間是醚。1846 年在波士頓公開示範的乙醚麻醉，開啟了現代外科手術。'], ['CH<sub>3</sub>CH<sub>2</sub>CH<sub>3</sub>', '丙烷', 0, '只有 C−C 單鍵與 C−H：烷類，化學性質穩定。桶裝瓦斯的主要成分是丙烷與丁烷。'], ['CH<b style="color:#d0564f">Cl</b><sub>3</sub>', '三氯甲烷（氯仿）', 12, '碳接鹵素（F、Cl、Br、I）是鹵化物。氯仿早期用於麻醉，後來因為毒性被淘汰；氟氯碳化物（CFC）會破壞臭氧層。'], ['C<sub>6</sub>H<sub>5</sub>−<b style="color:#d0564f">OH</b>', '苯酚（石炭酸）', 3, '羥基直接接在苯環上叫做「酚」——它屬於芳香族，性質也和醇不同：酸性強得多（pKa 約 10）。李斯特在 1867 年用它做手術消毒。（答「醇」也算說得通，但化學家會把酚獨立出來。）']];
          var P = { i: 0, ok: 0, n: 0, done: false }, r = rng(7), order = Q.map(function (_, i) { return i; });
          for (var i = order.length - 1; i > 0; i--) { var j = Math.floor(r() * (i + 1)), t = order[i]; order[i] = order[j]; order[j] = t; }
          var card = el('div', 'text-align:center;padding:14px 8px;margin:4px 0 8px;border:1px solid var(--border);border-radius:10px'); root.appendChild(card);
          var b = bar(root); G.forEach(function (g, k) { var x = btn(g, k); x.onclick = function () { pick(k); }; b.appendChild(x); });
          var nb = bar(root), nx = btn('下一題 →'); nx.onclick = function () { P.i = (P.i + 1) % order.length; P.done = false; draw(); }; nb.appendChild(nx);
          var inf = info(root);
          function cur() { return Q[order[P.i]]; }
          function draw() { var q = cur(); card.innerHTML = '<div style="font-size:1.7em;letter-spacing:1px">' + q[0] + '</div><div style="color:var(--text-muted);margin-top:4px">' + (P.done ? q[1] : '這是哪一類化合物？') + '</div>';
            inf.innerHTML = P.done ? inf.innerHTML : '第 ' + (P.i + 1) + ' / ' + order.length + ' 題。紅色的部分是官能基——分子中決定化學性質的原子團。' + (P.n ? '目前答對 ' + P.ok + ' / ' + P.n + ' 題。' : ''); }
          function pick(k) { var q = cur(); if (P.done) return; var ok = k === q[2] || (order[P.i] === 13 && k === 4); P.done = true; P.n++; if (ok) P.ok++;
            inf.innerHTML = (ok ? '<b style="color:' + GN + '">答對了！</b>' : '<b style="color:' + RD + '">再想想。</b>答案是「' + G[q[2]] + '」。') + '<br><b>' + q[1] + '</b>：' + q[3] + small('目前答對 ' + P.ok + ' / ' + P.n + ' 題。按「下一題」繼續。'); draw(); }
          draw();
        }

        /* 2. 掌性分子 */
        function initChiral(root, cfg) { head(root, cfg.q);
          var M = [['溴氯氟甲烷 CHBrClF', [['Br', '#8b3a2b', 1], ['Cl', GN, 2], ['F', TL, 3], ['H', GY, 4]], '四個不同的基團接在同一個碳上：<b>掌性中心</b>。'], ['丙胺酸（胺基酸）', [['NH₂', BL, 1], ['COOH', RD, 2], ['CH₃', '#555', 3], ['H', GY, 4]], '生物體的蛋白質幾乎只用 <b>L 型</b>胺基酸（丙胺酸的 L 型就是 S 構型）。'], ['二氯甲烷 CH₂Cl₂', [['H', GY, 4], ['Cl', GN, 1], ['Cl', GN, 1], ['H', GY, 4]], '有兩對相同的基團：分子本身有對稱面，<b>不是</b>掌性分子。']];
          var V = [[0, 0.943, -0.333], [0.816, -0.471, -0.333], [-0.816, -0.471, -0.333], [0, 0, 1]];
          var P = { k: 0, ry: 0, rx: 0, sw: false }, view = el('div'), us;
          presets(root, M.map(function (m) { return m[0]; }), function (i) { P.k = i; P.sw = false; draw(); });
          var g = el('div', 'display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:0 12px'); root.appendChild(g);
          us = [slider(g, '轉動右邊（繞直軸）', -180, 180, 5, P.ry, function (v) { return v + '°'; }, 'ry', function (v) { P.ry = v; draw(); }), slider(g, '轉動右邊（繞橫軸）', -180, 180, 5, P.rx, function (v) { return v + '°'; }, 'rx', function (v) { P.rx = v; draw(); })];
          var b2 = bar(root), sb = btn('右邊：交換 H 和另一個基團'); sb.onclick = function () { P.sw = !P.sw; draw(); }; b2.appendChild(sb);
          root.appendChild(view); var inf = info(root);
          function rot(p, ay, ax) { var c = Math.cos(ay), s = Math.sin(ay), x = c * p[0] + s * p[2], z = -s * p[0] + c * p[2], y = p[1]; var c2 = Math.cos(ax), s2 = Math.sin(ax); return [x, c2 * y - s2 * z, s2 * y + c2 * z]; }
          function det(a, b, c) { return a[0] * (b[1] * c[2] - b[2] * c[1]) - a[1] * (b[0] * c[2] - b[2] * c[0]) + a[2] * (b[0] * c[1] - b[1] * c[0]); }
          function conf(G, pos) { for (var a = 0; a < 4; a++) for (var b2 = a + 1; b2 < 4; b2++) if (G[a][2] === G[b2][2]) return ''; var by = []; G.forEach(function (gg, i) { by[gg[2]] = pos[i]; }); return det(by[1], by[2], by[3]) < 0 ? 'R' : 'S'; }
          function mol(cx, G, pos0, lab) { var pos = pos0.map(function (p) { return rot(p, 0.5, -0.45); }), o = '', idx = [0, 1, 2, 3].sort(function (a, b) { return pos[a][2] - pos[b][2]; }), S = 70;
            idx.forEach(function (i) { var p = pos[i], x = cx + p[0] * S, y = 125 - p[1] * S, r = 15 + p[2] * 4; o += ln(cx, 125, x, y, 'var(--text-muted)', 3 + p[2]); o += ci(x, y, r, G[i][1], 'var(--bg)', 1.5) + tx(x, y + 4, G[i][0], G[i][0].length > 2 ? 8.5 : 11, '#fff'); if (i === idx[1]) o += ci(cx, 125, 9, '#333'); });
            return o + tx(cx, 228, lab, 12, 'var(--text)'); }
          function draw() { var m = M[P.k], G = m[1], L = V.map(function (p) { return p; });
            var Rg = G.slice(); if (P.sw) { var t = Rg[3]; Rg[3] = Rg[0]; Rg[0] = t; }
            var mir = V.map(function (p) { return [-p[0], p[1], p[2]]; }), R = mir.map(function (p) { return rot(p, P.ry * Math.PI / 180, P.rx * Math.PI / 180); });
            var cL = conf(G, L), cR = conf(Rg, R);
            var match = true; for (var i = 0; i < 4; i++) { var ok = false; for (var j = 0; j < 4; j++) if (G[j][2] === Rg[i][2] && Math.hypot(L[j][0] - R[i][0], L[j][1] - R[i][1], L[j][2] - R[i][2]) < 0.25) ok = true; if (!ok) match = false; }
            var o = mol(150, G, L, '原本的分子' + (cL ? '（' + cL + '）' : '')) + ln(320, 20, 320, 210, 'var(--border)', 2, 'stroke-dasharray="6 4"') + tx(320, 14, '鏡面', 10, 'var(--text-muted)') + mol(490, Rg, R, (P.sw ? '交換後' : '鏡像') + (cR ? '（' + cR + '）' : ''));
            view.innerHTML = svgw('0 0 640 240', o);
            var chiral = !!cL;
            inf.innerHTML = m[2] + '<br>' + (match ? '<b style="color:' + GN + '">兩個分子現在完全重疊！</b>' + (chiral ? '交換兩個基團等於把鏡像「翻回來」：交換一次就改變構型（R ↔ S）。' : '非掌性分子的鏡像就是它自己，轉一轉就能重疊。') : chiral ? '轉動右邊的分子，試著讓它和左邊<b>完全重疊</b>（每個顏色的球都在同樣的位置）——你會發現怎麼轉都做不到：它們像左手和右手，是一對<b>鏡像異構物</b>。' + (P.sw ? '交換之後再轉轉看（提示：繞直軸 180°、繞橫軸約 70°）。' : '再按「交換」試試看。') : '把兩個滑桿都轉回 0°，兩者就會重疊。') + (chiral ? small('構型 R/S 依卡恩－英戈爾德－普雷洛格（CIP）規則：把優先順序最低的基團（H）朝向後方，其餘三個依優先順序 1→2→3 順時針為 R、逆時針為 S。立體投影為示意。') : ''); }
          us.forEach(function (u) { u(); });
        }

        /* 3. SN1 vs SN2 */
        function initSn(root, cfg) { head(root, cfg.q);
          var SUB = [['甲基 CH₃−X', 30, 1, 'methyl'], ['一級 RCH₂−X', 1, 1, 'p'], ['二級 R₂CH−X', 0.03, 12, 's'], ['三級 R₃C−X', 0, 1.2e6, 't']];
          var P = { s: 1, nu: 1, sol: 0, lg: 2, c: 1 }, view = el('div'), us;
          var b1 = presets(root, SUB.map(function (s) { return s[0]; }), function (i) { P.s = i; draw(); }, 1);
          var b2 = presets(root, ['強親核基（如 CN⁻、I⁻、OH⁻）', '弱親核基（如 H₂O、CH₃OH）'], function (i) { P.nu = i ? 0 : 1; draw(); }, 0);
          var b3 = presets(root, ['極性質子溶劑（水、醇）', '極性非質子溶劑（丙酮、DMSO）'], function (i) { P.sol = i; draw(); }, 0);
          var g = el('div', 'display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:0 12px'); root.appendChild(g);
          var LG = ['F', 'Cl', 'Br', 'I'], LGF = [1e-6, 0.02, 1, 3];
          us = [slider(g, '離去基 X', 0, 3, 1, P.lg, function (v) { return LG[Math.round(v)]; }, 'lg', function (v) { P.lg = Math.round(v); draw(); }), slider(g, '親核基濃度 [Nu]', 0.25, 4, 0.25, P.c, function (v) { return f2(v) + ' M'; }, 'c', function (v) { P.c = v; draw(); })];
          root.appendChild(view); var inf = info(root);
          function draw() { var s = SUB[P.s], lf = LGF[P.lg];
            var k2 = s[1] * (P.nu ? 1 : 1e-3) * (P.sol ? 500 : 1) * lf * P.c, k1 = s[2] * (P.sol ? 1e-3 : 1) * lf * 1e-3;
            var lo = -9, hi = 3, o = '', X0 = 120, W = 480;
            function bx(v) { var L = v <= 0 ? lo : Math.max(lo, Math.min(hi, Math.log10(v))); return (L - lo) / (hi - lo) * W; }
            for (var e = lo; e <= hi; e += 3) { var x = X0 + (e - lo) / (hi - lo) * W; o += ln(x, 14, x, 110, 'var(--border)', 1) + tx(x, 124, '10' + '<tspan dy="-5" font-size="8">' + e + '</tspan>', 10, 'var(--text-muted)'); }
            o += tx(X0 - 8, 44, 'SN2 速率', 12, BL, 'end') + rc(X0, 30, bx(k2), 22, BL) + tx(X0 - 8, 88, 'SN1 速率', 12, OR, 'end') + rc(X0, 74, bx(k1), 22, OR) + tx(X0 + W / 2, 140, '相對速率（對數刻度）', 10, 'var(--text-muted)');
            view.innerHTML = svgw('0 0 640 150', o);
            var win = k2 > k1 * 3 ? 'SN2' : k1 > k2 * 3 ? 'SN1' : '兩者競爭';
            var why = P.s === 3 ? '三級碳太擁擠，親核基無法從背面進攻，<b>SN2 幾乎不發生</b>；但三級碳陽離子最穩定，SN1 很快。' : P.s === 0 ? '甲基碳最不擁擠，<b>SN2 最快</b>；甲基碳陽離子極不穩定，SN1 幾乎不可能。' : P.s === 1 ? '一級碳不太擁擠，傾向 <b>SN2</b>；一級碳陽離子不穩定。' : '二級碳是「灰色地帶」，條件決定一切：強親核基與非質子溶劑有利 SN2，弱親核基與質子溶劑有利 SN1。';
            inf.innerHTML = '主要機構：<b>' + win + '</b>。' + why + '<br>' +
              '<b>速率定律</b>：SN2 = k[RX][Nu]（一步完成，兩者都參與）；SN1 = k[RX]（決定速率的步驟是離去基自己離開）。把 [Nu] 加倍，SN2 的速率加倍，SN1 不變——這正是化學家區分兩種機構的實驗方法。<br>' +
              '<b>立體化學</b>：SN2 從背面進攻，構型<b>反轉</b>（像雨傘被風吹翻，華爾頓反轉）；SN1 經過平面的碳陽離子，從兩面進攻機會相近，產物大致<b>消旋</b>。' + (P.lg === 0 ? '<br>F⁻ 是極差的離去基（C−F 鍵非常強），兩種反應都很慢。' : '') + (P.s === 3 && P.nu ? '<br>注意：強鹼遇上三級鹵化物，實際上常以<b>脫去反應</b>（E2）為主（第 20 課）。' : '') + small('相對速率為教科書典型值的數量級示意，溶劑與離去基的效應以固定倍數近似。'); }
          us.forEach(function (u) { u(); });
        }

        /* 4. pKa */
        function initPka(root, cfg) { head(root, cfg.q);
          var C = [['乙酸 CH₃COOH', 4.76, '羧酸', '乙酸根'], ['苯酚 C₆H₅OH', 10.0, '苯酚', '苯氧離子'], ['乙醇 C₂H₅OH', 16, '乙醇', '乙氧離子'], ['乙銨 C₂H₅NH₃⁺', 10.7, '乙銨離子（帶正電）', '乙胺（中性）'], ['阿斯匹靈', 3.5, '中性分子', '陰離子'], ['三氟乙酸 CF₃COOH', 0.5, '三氟乙酸', '三氟乙酸根']];
          var LAD = [['HCl', -7], ['H₃O⁺', -1.7], ['CF₃COOH', 0.5], ['CH₃COOH', 4.76], ['H₂CO₃', 6.4], ['NH₄⁺', 9.2], ['苯酚', 10], ['H₂O', 15.7], ['乙醇', 16], ['丙酮', 19], ['乙炔', 25], ['NH₃', 38], ['乙烷', 50]];
          var P = { k: 0, pH: 7 }, view = el('div');
          presets(root, C.map(function (c) { return c[0]; }), function (i) { P.k = i; draw(); });
          var u1 = slider(root, '環境的 pH', 0, 14, 0.1, P.pH, f1, 'pH', function (v) { P.pH = v; draw(); });
          root.appendChild(view); var inf = info(root);
          function draw() { var c = C[P.k], pk = c[1], d = [];
            for (var ph = 0; ph <= 14.0001; ph += 0.1) d.push([ph, 100 / (1 + Math.pow(10, pk - ph))]);
            var fr = 1 / (1 + Math.pow(10, pk - P.pH));
            var c1 = chart(420, 240, [{ d: d, c: PU, n: '去質子化（' + c[3] + '）的比例 %', w: 2.4 }], { x0: 0, x1: 14, y0: 0, y1: 100, xl: 'pH', yl: '%', vl: pk <= 14 ? [{ x: pk, c: GY, n: 'pKa' }] : [], pts: [{ x: P.pH, y: fr * 100, c: RD }] });
            var o = '', T = 12, H = 230; function Y(v) { return T + (v + 8) / 60 * H; }
            o += ln(95, T, 95, T + H, 'var(--text-muted)', 2) + tx(95, T - 2, '強酸', 9, RD) + tx(95, T + H + 12, '極弱的酸', 9, BL);
            LAD.forEach(function (a, i) { var y = Y(a[1]), hl = Math.abs(a[1] - pk) < 0.3; o += ln(89, y, 101, y, hl ? RD : 'var(--text-muted)', hl ? 2.5 : 1) + tx(i % 2 ? 107 : 83, y + 3, a[0] + ' ' + a[1], 8.5, hl ? RD : 'var(--text)', i % 2 ? 'start' : 'end'); });
            var c2 = svgw('0 0 190 260', o);
            view.innerHTML = '<div style="display:flex;flex-wrap:wrap;gap:6px;align-items:flex-start"><div style="flex:3 1 300px">' + c1 + '</div><div style="flex:1 1 130px;max-width:240px;margin:0 auto">' + c2 + '</div></div>';
            inf.innerHTML = c[0] + ' 的 pKa ≈ ' + pk + '。在 pH ' + f1(P.pH) + ' 時，<b>' + pct(fr) + '</b> 以「' + c[3] + '」存在，' + pct(1 - fr) + ' 以「' + c[2] + '」存在。<br>' +
              '<b>規則</b>：pH = pKa 時剛好各半；pH 每比 pKa 高 1，去質子化的形式就多 10 倍（韓德森－哈塞爾巴赫方程式）。' + (P.k === 4 ? '<br>阿斯匹靈在胃（pH 約 1.5～3）中大部分是<b>中性分子</b>，容易穿過細胞膜被吸收；在血液（pH 7.4）中幾乎全部是陰離子。藥物的 pKa 深刻影響它在哪裡被吸收（見藥理學）。' : P.k === 3 ? '<br>胺是鹼：在生理 pH 7.4 下，乙胺幾乎都以帶正電的銨離子存在。許多藥物分子含胺基，常做成鹽酸鹽以增加水溶性。' : P.k === 2 ? '<br>乙醇的酸性比水還弱一點：在任何水溶液的 pH 下，幾乎都不解離。要拔掉它的 H，需要比氫氧根更強的鹼（例如金屬鈉）。' : '') + small('右側為常見化合物的 pKa 階梯（近似值）：pKa 越小酸性越強。酸鹼反應的平衡偏向生成「較弱的酸」。'); }
          u1();
        }

        function initAll() { document.querySelectorAll('.kor-w').forEach(function (w) { if (w.__d) return; w.__d = 1; var cfg = JSON.parse(w.getAttribute('data-cfg'));
          ({ fg: initFg, chiral: initChiral, sn: initSn, pka: initPka })[cfg.t](w, cfg); }); }
        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', initAll); else initAll();
      })();
      </script>
