      <div class="nv-w content-figure" style="text-align:left;max-width:680px;margin-left:auto;margin-right:auto" data-cfg="{&quot;t&quot;: &quot;timeline&quot;, &quot;q&quot;: &quot;史蒂芬・金的人生大事：&quot;, &quot;yw&quot;: 70, &quot;groups&quot;: [[&quot;life&quot;, &quot;人生&quot;, &quot;#3a6ea5&quot;], [&quot;work&quot;, &quot;作品&quot;, &quot;#d0564f&quot;], [&quot;hon&quot;, &quot;榮譽&quot;, &quot;#b8941f&quot;]], &quot;ev&quot;: [{&quot;y&quot;: &quot;1947&quot;, &quot;t&quot;: &quot;出生於緬因州波特蘭&quot;, &quot;d&quot;: &quot;9 月 21 日出生。兩歲時父親離家，從此沒有再回來；母親獨力撫養他和領養的哥哥大衛，常常搬家、經濟拮据。&quot;, &quot;g&quot;: &quot;life&quot;}, {&quot;y&quot;: &quot;約 1959&quot;, &quot;t&quot;: &quot;閣樓裡的一箱舊書&quot;, &quot;d&quot;: &quot;在姑姑家的閣樓找到父親留下的平裝恐怖小說，其中有洛夫克萊夫特的作品。他說這是自己「找到方向」的時刻。&quot;, &quot;g&quot;: &quot;life&quot;}, {&quot;y&quot;: &quot;1966～1970&quot;, &quot;t&quot;: &quot;緬因大學&quot;, &quot;d&quot;: &quot;主修英文，在校刊寫專欄；在圖書館打工時認識塔碧莎・史普魯斯，1971 年結婚。&quot;, &quot;g&quot;: &quot;life&quot;}, {&quot;y&quot;: &quot;1971～1973&quot;, &quot;t&quot;: &quot;洗衣廠與教書&quot;, &quot;d&quot;: &quot;在工業洗衣廠工作，後來在漢普登中學教英文；一家人住在拖車裡，靠賣短篇給男性雜誌貼補家用。&quot;, &quot;g&quot;: &quot;life&quot;}, {&quot;y&quot;: &quot;1974&quot;, &quot;t&quot;: &quot;《魔女嘉莉》出版&quot;, &quot;d&quot;: &quot;手稿曾被他丟進垃圾桶，是塔碧莎撿回來的。平裝版權賣出四十萬美元，他辭去教職專心寫作。&quot;, &quot;g&quot;: &quot;work&quot;}, {&quot;y&quot;: &quot;1977&quot;, &quot;t&quot;: &quot;《鬼店》與筆名巴克曼&quot;, &quot;d&quot;: &quot;《鬼店》的靈感來自科羅拉多州史丹利飯店的一晚；同年以理查・巴克曼之名出版《怒》。&quot;, &quot;g&quot;: &quot;work&quot;}, {&quot;y&quot;: &quot;1985&quot;, &quot;t&quot;: &quot;巴克曼身分曝光&quot;, &quot;d&quot;: &quot;一名書店店員在國會圖書館的版權紀錄中查到真相。金宣布巴克曼「死於筆名癌」。&quot;, &quot;g&quot;: &quot;life&quot;}, {&quot;y&quot;: &quot;1986&quot;, &quot;t&quot;: &quot;《牠》&quot;, &quot;d&quot;: &quot;一千多頁的巨作，集童年與恐懼之大成。&quot;, &quot;g&quot;: &quot;work&quot;}, {&quot;y&quot;: &quot;1987&quot;, &quot;t&quot;: &quot;家人介入戒癮&quot;, &quot;d&quot;: &quot;家人與朋友把他房裡的啤酒罐、毒品與藥物倒在他面前，要他選擇。他戒除了酒精與毒品。&quot;, &quot;g&quot;: &quot;life&quot;}, {&quot;y&quot;: &quot;1999&quot;, &quot;t&quot;: &quot;車禍重傷&quot;, &quot;d&quot;: &quot;6 月 19 日在緬因州洛弗爾的路邊散步時被廂型車撞飛，腿、髖骨、肋骨多處骨折，肺部塌陷。&quot;, &quot;g&quot;: &quot;life&quot;}, {&quot;y&quot;: &quot;2000&quot;, &quot;t&quot;: &quot;《史蒂芬・金談寫作》&quot;, &quot;d&quot;: &quot;一半是回憶錄、一半是寫作課，車禍後完成。&quot;, &quot;g&quot;: &quot;work&quot;}, {&quot;y&quot;: &quot;2003&quot;, &quot;t&quot;: &quot;美國國家圖書基金會傑出貢獻獎&quot;, &quot;d&quot;: &quot;首次頒給類型小說作家，引發文學界的爭論。&quot;, &quot;g&quot;: &quot;hon&quot;}, {&quot;y&quot;: &quot;2004&quot;, &quot;t&quot;: &quot;黑暗塔完結&quot;, &quot;d&quot;: &quot;從 1970 年寫下第一句，到 2004 年第七部出版，跨越三十多年。&quot;, &quot;g&quot;: &quot;work&quot;}, {&quot;y&quot;: &quot;2015&quot;, &quot;t&quot;: &quot;美國國家藝術獎章&quot;, &quot;d&quot;: &quot;由歐巴馬總統頒發（2014 年度）。&quot;, &quot;g&quot;: &quot;hon&quot;}, {&quot;y&quot;: &quot;2025&quot;, &quot;t&quot;: &quot;《決不退縮》&quot;, &quot;d&quot;: &quot;荷莉・吉布尼系列的新作；同年《大競走》《逃亡者》等多部作品推出新改編。&quot;, &quot;g&quot;: &quot;work&quot;}]}"></div>

      <h2>5. 黑塔的卡泰特（第 18 課）</h2>

      <div class="nv-w content-figure" style="text-align:left;max-width:680px;margin-left:auto;margin-right:auto" data-cfg="{&quot;t&quot;: &quot;graph&quot;, &quot;h&quot;: 360, &quot;q&quot;: &quot;黑塔的「卡泰特」（ka-tet，命運共同體）——點選人物看說明：&quot;, &quot;nodes&quot;: [{&quot;id&quot;: &quot;ro&quot;, &quot;label&quot;: &quot;羅蘭&quot;, &quot;x&quot;: 320, &quot;y&quot;: 60, &quot;c&quot;: &quot;#b8941f&quot;, &quot;d&quot;: &quot;基列的最後一名槍客，亞瑟王的後裔。為了找到黑塔，可以犧牲任何人——這是他的力量，也是他的罪。&quot;, &quot;en&quot;: &quot;Roland Deschain&quot;}, {&quot;id&quot;: &quot;ed&quot;, &quot;label&quot;: &quot;艾迪&quot;, &quot;x&quot;: 140, &quot;y&quot;: 170, &quot;c&quot;: &quot;#3a6ea5&quot;, &quot;d&quot;: &quot;1987 年紐約的海洛因成癮者，嘴巴停不下來，後來成為槍客。&quot;, &quot;en&quot;: &quot;Eddie Dean&quot;}, {&quot;id&quot;: &quot;su&quot;, &quot;label&quot;: &quot;蘇珊娜&quot;, &quot;x&quot;: 500, &quot;y&quot;: 170, &quot;c&quot;: &quot;#8a5cb8&quot;, &quot;d&quot;: &quot;失去雙腿的民權運動者，原本是歐黛塔與黛塔兩個人格，融合成蘇珊娜。艾迪的妻子。&quot;, &quot;en&quot;: &quot;Susannah Dean&quot;}, {&quot;id&quot;: &quot;ja&quot;, &quot;label&quot;: &quot;傑克&quot;, &quot;x&quot;: 200, &quot;y&quot;: 300, &quot;c&quot;: &quot;#4a9a5e&quot;, &quot;d&quot;: &quot;1977 年紐約的男孩，死過一次又回來。羅蘭心中的兒子。&quot;, &quot;en&quot;: &quot;Jake Chambers&quot;}, {&quot;id&quot;: &quot;oy&quot;, &quot;label&quot;: &quot;小奧&quot;, &quot;x&quot;: 440, &quot;y&quot;: 300, &quot;c&quot;: &quot;#d9822b&quot;, &quot;d&quot;: &quot;像浣熊又像狗的「比利-邦布勒」，會學人說話，對傑克極為忠誠。&quot;, &quot;en&quot;: &quot;Oy&quot;}, {&quot;id&quot;: &quot;wa&quot;, &quot;label&quot;: &quot;黑衣人&quot;, &quot;x&quot;: 320, &quot;y&quot;: 200, &quot;c&quot;: &quot;#d0564f&quot;, &quot;d&quot;: &quot;華特／馬登／藍道・佛萊格。羅蘭追了一輩子的對手，在金的多部作品裡出現。&quot;, &quot;en&quot;: &quot;Walter o'Dim / Randall Flagg&quot;}], &quot;edges&quot;: [[&quot;ro&quot;, &quot;ed&quot;, &quot;拉出的第一張牌&quot;, &quot;#3a6ea5&quot;], [&quot;ro&quot;, &quot;su&quot;, &quot;第二張牌&quot;, &quot;#8a5cb8&quot;], [&quot;ro&quot;, &quot;ja&quot;, &quot;讓他墜落的孩子&quot;, &quot;#4a9a5e&quot;], [&quot;ed&quot;, &quot;su&quot;, &quot;夫妻&quot;, &quot;#666&quot;], [&quot;ja&quot;, &quot;oy&quot;, &quot;形影不離&quot;, &quot;#d9822b&quot;], [&quot;ro&quot;, &quot;wa&quot;, &quot;追逐&quot;, &quot;#d0564f&quot;, 1]]}"></div>

      <h2>6. 作品與黑塔的連結（第 21 課）</h2>

      <div class="nv-w content-figure" style="text-align:left;max-width:680px;margin-left:auto;margin-right:auto" data-cfg="{&quot;t&quot;: &quot;graph&quot;, &quot;h&quot;: 400, &quot;q&quot;: &quot;點選作品看它和黑塔的連結：&quot;, &quot;nodes&quot;: [{&quot;id&quot;: &quot;dt&quot;, &quot;label&quot;: &quot;黑塔&quot;, &quot;x&quot;: 320, &quot;y&quot;: 200, &quot;c&quot;: &quot;#b8941f&quot;, &quot;d&quot;: &quot;所有連結的中心。金說他的許多作品都發生在黑塔支撐的不同世界裡。&quot;}, {&quot;id&quot;: &quot;st&quot;, &quot;label&quot;: &quot;末日逼近&quot;, &quot;x&quot;: 110, &quot;y&quot;: 70, &quot;c&quot;: &quot;#d0564f&quot;, &quot;d&quot;: &quot;藍道・佛萊格首次登場；第四部的堪薩斯就是被同一場流感毀滅的世界。&quot;}, {&quot;id&quot;: &quot;sl&quot;, &quot;label&quot;: &quot;撒冷地&quot;, &quot;x&quot;: 320, &quot;y&quot;: 50, &quot;c&quot;: &quot;#3a6ea5&quot;, &quot;d&quot;: &quot;卡拉漢神父在第五到第七部重新登場。&quot;}, {&quot;id&quot;: &quot;it&quot;, &quot;label&quot;: &quot;牠&quot;, &quot;x&quot;: 530, &quot;y&quot;: 70, &quot;c&quot;: &quot;#4a9a5e&quot;, &quot;d&quot;: &quot;儀式中出現的烏龜，就是守護光束的烏龜馬圖林。&quot;}, {&quot;id&quot;: &quot;in&quot;, &quot;label&quot;: &quot;失眠&quot;, &quot;x&quot;: 560, &quot;y&quot;: 200, &quot;c&quot;: &quot;#8a5cb8&quot;, &quot;d&quot;: &quot;血紅之王首次出現；被主角救下的男孩派崔克・丹維爾，最後在塔前抹去血紅之王。&quot;}, {&quot;id&quot;: &quot;ha&quot;, &quot;label&quot;: &quot;亞特蘭提斯之心&quot;, &quot;x&quot;: 530, &quot;y&quot;: 330, &quot;c&quot;: &quot;#2a9d9d&quot;, &quot;d&quot;: &quot;泰德・布勞提根是「破壞者」，被「穿黃外套的低等人」追捕，第七部被救出。&quot;}, {&quot;id&quot;: &quot;ey&quot;, &quot;label&quot;: &quot;龍之眼&quot;, &quot;x&quot;: 320, &quot;y&quot;: 360, &quot;c&quot;: &quot;#d9822b&quot;, &quot;d&quot;: &quot;童話王國裡的邪惡巫師佛萊格。&quot;}, {&quot;id&quot;: &quot;bh&quot;, &quot;label&quot;: &quot;黑屋／魔符&quot;, &quot;x&quot;: 110, &quot;y&quot;: 330, &quot;c&quot;: &quot;#666&quot;, &quot;d&quot;: &quot;與彼得・史超伯合寫，出現破壞者與塔的力量。&quot;}, {&quot;id&quot;: &quot;sk&quot;, &quot;label&quot;: &quot;作者本人&quot;, &quot;x&quot;: 80, &quot;y&quot;: 200, &quot;c&quot;: &quot;#3a6ea5&quot;, &quot;d&quot;: &quot;第六、七部中，史蒂芬・金是書中的角色；他的車禍成為劇情。&quot;}], &quot;edges&quot;: [[&quot;dt&quot;, &quot;st&quot;, &quot;佛萊格&quot;, &quot;#d0564f&quot;], [&quot;dt&quot;, &quot;sl&quot;, &quot;卡拉漢&quot;, &quot;#3a6ea5&quot;], [&quot;dt&quot;, &quot;it&quot;, &quot;烏龜&quot;, &quot;#4a9a5e&quot;], [&quot;dt&quot;, &quot;in&quot;, &quot;血紅之王&quot;, &quot;#8a5cb8&quot;], [&quot;dt&quot;, &quot;ha&quot;, &quot;泰德&quot;, &quot;#2a9d9d&quot;], [&quot;dt&quot;, &quot;ey&quot;, &quot;佛萊格&quot;, &quot;#d9822b&quot;], [&quot;dt&quot;, &quot;bh&quot;, &quot;破壞者&quot;, &quot;#666&quot;], [&quot;dt&quot;, &quot;sk&quot;, &quot;寫下塔的人&quot;, &quot;#3a6ea5&quot;], [&quot;st&quot;, &quot;ey&quot;, &quot;同一個反派&quot;, &quot;#d0564f&quot;, 1]]}"></div>
