    <article class="lesson-content">

      <script>
      (function () {
        if (window.__saLib) return; window.__saLib = 1;
        function btn(t, k) { var b = document.createElement('button'); b.type = 'button'; b.textContent = t; if (k) b.setAttribute('data-k', k);
          b.style.cssText = 'padding:4px 10px;margin:4px 6px 0 0;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer;font:inherit;font-size:0.9em'; return b; }
        function head(root, q) { if (q) { var p = document.createElement('p'); p.style.margin = '0 0 8px'; p.innerHTML = q; root.appendChild(p); } }
        function el(tag, css, html) { var e = document.createElement(tag); if (css) e.style.cssText = css; if (html !== undefined) e.innerHTML = html; return e; }
        function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
        function n1(v) { return Math.round(v * 10) / 10; }
        function tx(x, y, s, sz, c, anc, ex) { return '<text x="' + n1(x) + '" y="' + n1(y) + '" font-size="' + sz + '" fill="' + (c || 'currentColor') + '" text-anchor="' + (anc || 'middle') + '" ' + (ex || '') + '>' + s + '</text>'; }
        function rc(x, y, w, h, f, s, ex) { return '<rect x="' + n1(x) + '" y="' + n1(y) + '" width="' + n1(w) + '" height="' + n1(h) + '" fill="' + (f || 'none') + '" stroke="' + (s || 'none') + '" ' + (ex || '') + '/>'; }
        function ci(x, y, r, f, s) { return '<circle cx="' + n1(x) + '" cy="' + n1(y) + '" r="' + n1(r) + '" fill="' + f + '" stroke="' + (s || 'none') + '"/>'; }
        function ln(x1, y1, x2, y2, c, w, ex) { return '<line x1="' + n1(x1) + '" y1="' + n1(y1) + '" x2="' + n1(x2) + '" y2="' + n1(y2) + '" stroke="' + c + '" stroke-width="' + (w || 1) + '" ' + (ex || '') + '/>'; }
        function svgw(vb, inner) { return '<svg viewBox="' + vb + '" style="width:100%;display:block;color:var(--text)">' + inner + '</svg>'; }
        function slider(root, lab, min, max, step, val, cb, k) { var l = el('label', 'display:block;font-size:0.88em;margin-top:6px', lab + '：<b></b>'); var s = document.createElement('input');
          s.type = 'range'; s.min = min; s.max = max; s.step = step; s.value = val; s.style.cssText = 'width:100%;display:block'; if (k) s.setAttribute('data-k', k);
          l.appendChild(s); root.appendChild(l); var b = l.querySelector('b'); function u() { b.textContent = cb(+s.value); } s.addEventListener('input', u); u(); return s; }
        var COL = ['#3a6ea5', '#e0605a', '#5aa469', '#e8a33d', '#8e6bbf', '#2a9d8f', '#d17a9b', '#7d8590'];

        /* ---------- 逐步說明 ---------- */
        function initSteps(root, cfg) {
          head(root, cfg.q); var i = 0, B = cfg.b || [];
          var bx = el('div', 'display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px'); if (B.length) root.appendChild(bx);
          var out = el('div', 'border:1px solid var(--border);border-radius:8px;padding:10px 12px;min-height:4.5em'); root.appendChild(out);
          var bar = el('div'); root.appendChild(bar); var b1 = btn('◀ 上一步', 'prev'), b2 = btn('下一步 ▶', 'next'); bar.appendChild(b1); bar.appendChild(b2);
          var cnt = el('span', 'font-size:0.88em;color:var(--text-muted);margin-left:6px'); bar.appendChild(cnt);
          function draw() { var s = cfg.i[i], on = s[2] === undefined || s[2] === null ? [] : [].concat(s[2]);
            bx.innerHTML = B.map(function (n, k) { var a = on.indexOf(k) >= 0; return '<span style="padding:4px 10px;border-radius:6px;font-size:0.88em;border:1px solid ' + (a ? '#3a6ea5' : 'var(--border)') + ';background:' + (a ? '#3a6ea5' : 'transparent') + ';color:' + (a ? '#fff' : 'var(--text-muted)') + '">' + n + '</span>'; }).join('');
            out.innerHTML = '<b>' + (i + 1) + '. ' + s[0] + '</b><div style="margin-top:4px">' + s[1] + '</div>'; cnt.textContent = (i + 1) + ' / ' + cfg.i.length; }
          b1.addEventListener('click', function () { if (i > 0) i--; draw(); }); b2.addEventListener('click', function () { if (i < cfg.i.length - 1) i++; draw(); }); draw();
        }

        /* ---------- 遊戲迴圈：固定 vs 可變時間步長 ---------- */
        function initLoop(root, cfg) {
          head(root, cfg.q); var view = el('div'); root.appendChild(view);
          var ft = 16, W = 600, wall = 470, speed = 600, TH = 24, st;
          function reset() { st = { a: { x: 20, v: speed, hit: 0 }, b: { x: 20, v: speed, hit: 0, acc: 0 }, frames: 0, upd: 0 }; }
          reset();
          var s1 = slider(root, '每一畫格耗時（模擬電腦變慢）', 8, 120, 1, ft, function (v) { ft = v; return v + ' ms（約 ' + Math.round(1000 / v) + ' FPS）'; }, 'ft');
          var bar = el('div'); root.appendChild(bar); var br = btn('↺ 重來', 'reset'); bar.appendChild(br); br.addEventListener('click', reset);
          var info = el('p', 'margin:6px 0 0;font-size:0.92em'); root.appendChild(info);
          var STEP = 1 / 120;
          function stepBall(b, dt) { var nx = b.x + b.v * dt;
            if (b.v > 0 && b.x < wall && nx >= wall && nx <= wall + TH) { nx = wall - (nx - wall); b.v = -b.v; b.hit++; }
            else if (b.v < 0 && nx <= 20) { nx = 20 + (20 - nx); b.v = -b.v; }
            if (nx > W + 40) { nx = 20; b.lost = (b.lost || 0) + 1; }
            b.x = nx; }
          function frame() { var dt = ft / 1000; st.frames++;
            stepBall(st.a, dt);
            st.b.acc += dt; var n = 0; while (st.b.acc >= STEP) { stepBall(st.b, STEP); st.b.acc -= STEP; n++; } st.upd = n;
            var o = rc(0, 0, 640, 150, 'var(--surface)', 'none');
            [[st.a, 50, '可變時間步長', '#e0605a'], [st.b, 110, '固定時間步長（每秒 120 次更新）', '#3a6ea5']].forEach(function (r) {
              o += ln(10, r[1] + 14, 630, r[1] + 14, '#999', 1) + rc(wall, r[1] - 22, TH, 36, '#555') + tx(14, r[1] - 26, r[2], 11, r[3], 'start') + ci(r[0].x, r[1], 9, r[3]);
              o += tx(630, r[1] - 26, '反彈 ' + r[0].hit + ' 次｜穿牆 ' + (r[0].lost || 0) + ' 次', 10, r[3], 'end'); });
            view.innerHTML = svgw('0 0 640 150', o);
            info.innerHTML = '這一畫格：可變步長移動了 <b>' + Math.round(speed * dt) + '</b> 像素（一次跳過去）；固定步長分成 <b>' + n + '</b> 次小更新，每次只移動 ' + Math.round(speed * STEP) + ' 像素。牆有 ' + TH + ' 像素厚，程式只檢查「這一步落在牆裡面嗎」——把畫格耗時拉到 40 ms 以上，看看誰會穿牆。';
            setTimeout(frame, ft); }
          frame();
        }

        /* ---------- ECS 視覺化 ---------- */
        function initECS(root, cfg) {
          head(root, cfg.q);
          var comps = ['Position', 'Velocity', 'Sprite', 'Health', 'AI', 'Input'];
          var ents = [['玩家', [1, 1, 1, 1, 0, 1]], ['史萊姆', [1, 1, 1, 1, 1, 0]], ['樹', [1, 0, 1, 0, 0, 0]], ['子彈', [1, 1, 1, 0, 0, 0]], ['觸發區', [1, 0, 0, 0, 0, 0]], ['寶箱', [1, 0, 1, 1, 0, 0]]];
          var systems = [['MovementSystem', [0, 1], 'Position += Velocity × dt'], ['RenderSystem', [0, 2], '在 Position 畫出 Sprite'], ['DamageSystem', [3], '處理 Health 歸零'],
            ['AISystem', [0, 1, 4], '決定 Velocity'], ['InputSystem', [1, 5], '把按鍵變成 Velocity']], sel = 0;
          var bar = el('div'); root.appendChild(bar); var tbl = el('div', 'overflow-x:auto;margin-top:8px'); root.appendChild(tbl); var info = el('p', 'margin:8px 0 0'); root.appendChild(info);
          systems.forEach(function (s, k) { var b = btn(s[0], 'sys' + k); b.addEventListener('click', function () { sel = k; draw(); }); bar.appendChild(b); });
          function match(e) { return systems[sel][1].every(function (c) { return e[1][c]; }); }
          function draw() { bar.querySelectorAll('button').forEach(function (b, k) { b.style.background = k === sel ? 'var(--accent-soft)' : 'var(--surface)'; b.style.fontWeight = k === sel ? 'bold' : 'normal'; });
            var need = systems[sel][1], h = '<table style="border-collapse:collapse;font-size:0.88em;width:100%"><tr><th style="text-align:left;padding:4px">實體</th>' +
              comps.map(function (c, k) { return '<th style="padding:4px;' + (need.indexOf(k) >= 0 ? 'color:#3a6ea5' : '') + '">' + c + '</th>'; }).join('') + '</tr>';
            ents.forEach(function (e, i) { var m = match(e); h += '<tr style="background:' + (m ? 'rgba(58,110,165,0.15)' : 'transparent') + '"><td style="padding:4px;font-weight:' + (m ? 'bold' : 'normal') + '">' + (m ? '✔ ' : '') + e[0] + '</td>' +
              e[1].map(function (v, k) { return '<td data-e="' + i + '" data-c="' + k + '" style="text-align:center;cursor:pointer;padding:4px;border:1px solid var(--border)">' + (v ? '●' : '·') + '</td>'; }).join('') + '</tr>'; });
            tbl.innerHTML = h + '</table>';
            tbl.querySelectorAll('td[data-e]').forEach(function (td) { td.addEventListener('click', function () { var e = ents[+td.dataset.e]; e[1][+td.dataset.c] = e[1][+td.dataset.c] ? 0 : 1; draw(); }); });
            var n = ents.filter(match).length;
            info.innerHTML = '<b>' + systems[sel][0] + '</b> 需要 ' + need.map(function (c) { return '<code>' + comps[c] + '</code>'; }).join(' ＋ ') + '：' + systems[sel][2] + '。這一畫格它處理 <b>' + n + '</b> 個實體。<br><span style="color:var(--text-muted);font-size:0.9em">點格子可以幫實體加上或拿掉元件——行為跟著改變，不用改任何類別。</span>'; }
          draw();
        }

        /* ---------- 碰撞偵測 ---------- */
        function initColl(root, cfg) {
          head(root, cfg.q); var mode = 'aabb', v = { x: 260, y: 90 };
          var bar = el('div'); root.appendChild(bar); var view = el('div'); root.appendChild(view);
          [['aabb', '方框 vs 方框（AABB）'], ['circle', '圓 vs 圓']].forEach(function (m) { var b = btn(m[1], m[0]); b.addEventListener('click', function () { mode = m[0]; draw(); }); bar.appendChild(b); });
          var info = el('p', 'margin:6px 0 0;font-size:0.92em');
          slider(root, '物體 B 的 x', 60, 560, 1, v.x, function (a) { v.x = a; draw(); return a; }, 'bx'); slider(root, '物體 B 的 y', 20, 200, 1, v.y, function (a) { v.y = a; draw(); return a; }, 'by'); root.appendChild(info);
          function draw() { var o = rc(0, 0, 640, 220, 'var(--surface)', 'none'), A = { x: 320, y: 110 };
            if (mode === 'aabb') { var aw = 140, ah = 80, bw = 100, bh = 60, ax0 = A.x - aw / 2, ay0 = A.y - ah / 2, bx0 = v.x - bw / 2, by0 = v.y - bh / 2;
              var ox = Math.min(ax0 + aw, bx0 + bw) - Math.max(ax0, bx0), oy = Math.min(ay0 + ah, by0 + bh) - Math.max(ay0, by0), hit = ox > 0 && oy > 0;
              o += rc(ax0, ay0, aw, ah, 'rgba(58,110,165,0.2)', '#3a6ea5', 'stroke-width="2"') + rc(bx0, by0, bw, bh, hit ? 'rgba(224,96,90,0.25)' : 'rgba(90,164,105,0.2)', hit ? '#e0605a' : '#5aa469', 'stroke-width="2"');
              o += tx(A.x, A.y + 4, 'A', 14, '#3a6ea5') + tx(v.x, v.y + 4, 'B', 14, hit ? '#e0605a' : '#5aa469');
              if (hit) o += rc(Math.max(ax0, bx0), Math.max(ay0, by0), ox, oy, 'rgba(224,96,90,0.45)');
              info.innerHTML = hit ? '💥 <b>碰撞！</b>重疊 x = ' + Math.round(ox) + '、y = ' + Math.round(oy) + '。碰撞回應通常沿重疊<b>較小</b>的軸（這裡是 ' + (ox < oy ? 'x' : 'y') + ' 軸）把 B 推開 ' + Math.round(Math.min(ox, oy)) + ' 像素。' :
                '沒有碰撞：只要在 x 或 y 任一軸上分開，兩個方框就不相交（分離軸）。判斷只需要 4 次比較。'; }
            else { var ra = 60, rb = 40, dx = v.x - A.x, dy = v.y - A.y, d = Math.sqrt(dx * dx + dy * dy), hit2 = d < ra + rb;
              o += ci(A.x, A.y, ra, 'rgba(58,110,165,0.2)', '#3a6ea5') + ci(v.x, v.y, rb, hit2 ? 'rgba(224,96,90,0.25)' : 'rgba(90,164,105,0.2)', hit2 ? '#e0605a' : '#5aa469') + ln(A.x, A.y, v.x, v.y, '#999', 1, 'stroke-dasharray="4 3"');
              info.innerHTML = '圓心距離 ' + Math.round(d) + '，半徑和 ' + (ra + rb) + '：' + (hit2 ? '💥 <b>碰撞！</b>沿兩圓心連線推開 ' + Math.round(ra + rb - d) + ' 像素。' : '沒有碰撞。') + '（實務上比較距離的平方，省去開根號。）'; }
            view.innerHTML = svgw('0 0 640 220', o); }
          draw();
        }

        /* ---------- A* 尋路 ---------- */
        function initAstar(root, cfg) {
          head(root, cfg.q); var W = 22, H = 12, S = [1, 6], G = [20, 6], wall = {}, res = null, algo = 'astar';
          [[8, 2], [8, 3], [8, 4], [8, 5], [8, 6], [8, 7], [8, 8], [14, 4], [14, 5], [14, 6], [14, 7], [14, 8], [14, 9], [14, 10], [14, 11], [14, 3]].forEach(function (p) { wall[p[0] + ',' + p[1]] = 1; });
          var view = el('div'); root.appendChild(view); var bar = el('div'); root.appendChild(bar); var info = el('p', 'margin:6px 0 0;font-size:0.92em'); root.appendChild(info);
          var b1 = btn('▶ A* 尋路', 'astar'), b2 = btn('▶ 廣度優先（BFS）', 'bfs'), b3 = btn('清除牆', 'clear'); [b1, b2, b3].forEach(function (b) { bar.appendChild(b); });
          b1.addEventListener('click', function () { algo = 'astar'; run(); }); b2.addEventListener('click', function () { algo = 'bfs'; run(); }); b3.addEventListener('click', function () { wall = {}; res = null; draw(); });
          function run() { var open = [[S[0], S[1]]], g = {}, came = {}, closed = {}, order = [], k = function (p) { return p[0] + ',' + p[1]; };
            g[k(S)] = 0; var hf = function (p) { return algo === 'astar' ? Math.abs(p[0] - G[0]) + Math.abs(p[1] - G[1]) : 0; };
            while (open.length) { var bi = 0; for (var i = 1; i < open.length; i++) { var fi = g[k(open[i])] + hf(open[i]), fb = g[k(open[bi])] + hf(open[bi]); if (fi < fb || (algo === 'bfs' && false)) bi = i; }
              if (algo === 'bfs') bi = 0; var c = open.splice(bi, 1)[0]; if (closed[k(c)]) continue; closed[k(c)] = 1; order.push(c); if (c[0] === G[0] && c[1] === G[1]) break;
              [[1, 0], [-1, 0], [0, 1], [0, -1]].forEach(function (d) { var n = [c[0] + d[0], c[1] + d[1]]; if (n[0] < 0 || n[1] < 0 || n[0] >= W || n[1] >= H || wall[k(n)] || closed[k(n)]) return;
                var ng = g[k(c)] + 1; if (g[k(n)] === undefined || ng < g[k(n)]) { g[k(n)] = ng; came[k(n)] = c; open.push(n); } }); }
            var path = [], cur = G; if (came[k(G)]) { while (cur) { path.unshift(cur); cur = came[k(cur)]; } }
            res = { order: order, path: path, shown: 0 }; anim(); }
          function anim() { if (!res) return; res.shown = Math.min(res.order.length, res.shown + 4); draw(); if (res.shown < res.order.length) setTimeout(anim, 30); else draw(true); }
          function draw(done) { var cs = 26, o = '', vis = {}, onp = {};
            if (res) { res.order.slice(0, res.shown).forEach(function (p) { vis[p[0] + ',' + p[1]] = 1; }); if (done || res.shown >= res.order.length) res.path.forEach(function (p) { onp[p[0] + ',' + p[1]] = 1; }); }
            for (var y = 0; y < H; y++) for (var x = 0; x < W; x++) { var kk = x + ',' + y, f = wall[kk] ? '#4a5160' : onp[kk] ? '#e8a33d' : vis[kk] ? 'rgba(58,110,165,0.3)' : 'var(--surface)';
              o += '<rect data-x="' + x + '" data-y="' + y + '" x="' + (x * cs + 4) + '" y="' + (y * cs + 4) + '" width="' + (cs - 1) + '" height="' + (cs - 1) + '" fill="' + f + '" stroke="var(--border)" style="cursor:pointer"/>'; }
            o += tx(S[0] * cs + 17, S[1] * cs + 22, 'S', 14, '#5aa469') + tx(G[0] * cs + 17, G[1] * cs + 22, 'G', 14, '#e0605a');
            view.innerHTML = svgw('0 0 ' + (W * cs + 8) + ' ' + (H * cs + 8), o);
            view.querySelectorAll('rect[data-x]').forEach(function (r) { r.addEventListener('click', function () { var kk = r.dataset.x + ',' + r.dataset.y; if (kk === S.join(',') || kk === G.join(',')) return; if (wall[kk]) delete wall[kk]; else wall[kk] = 1; res = null; draw(); }); });
            info.innerHTML = res ? (algo === 'astar' ? 'A*' : 'BFS') + '：檢查了 <b>' + res.order.length + '</b> 格，' + (res.path.length ? '路徑長度 <b>' + (res.path.length - 1) + '</b> 步。' : '<b>找不到路徑</b>。') + '（藍色＝檢查過的格子，橘色＝路徑）'
              : '點格子可以放牆或拆牆，再按按鈕比較兩種演算法。A* 用「到終點的估計距離」優先往目標方向找，檢查的格子通常少很多。'; }
          draw();
        }

        /* ---------- 狀態機 ---------- */
        function initFSM(root, cfg) {
          head(root, cfg.q); var S = cfg.s, T = cfg.tr, cur = cfg.start, log = [];
          var view = el('div'); root.appendChild(view); var bar = el('div'); root.appendChild(bar); var info = el('p', 'margin:6px 0 0;font-size:0.92em;min-height:2.6em'); root.appendChild(info);
          var evs = []; T.forEach(function (t) { if (evs.indexOf(t[1]) < 0) evs.push(t[1]); });
          evs.forEach(function (e, i) { var b = btn(e, 'ev' + i); b.addEventListener('click', function () { var t = T.filter(function (x) { return x[0] === cur && x[1] === e; })[0];
            if (t) { log.unshift(cur + ' —「' + e + '」→ ' + t[2]); cur = t[2]; info.innerHTML = '✅ 轉換到 <b>' + cur + '</b>。' + (t[3] || ''); } else info.innerHTML = '⛔ 在「' + cur + '」狀態下，「' + e + '」<b>不會發生任何事</b>——狀態機只允許定義好的轉換，所以不會出現「跳到一半又攻擊」這種錯誤。'; draw(); }); bar.appendChild(b); });
          function draw() { var o = rc(0, 0, 640, 210, 'var(--surface)', 'none'), pos = {};
            S.forEach(function (s, i) { var a = Math.PI * 2 * i / S.length - Math.PI / 2; pos[s] = [320 + 230 * Math.cos(a), 105 + 78 * Math.sin(a)]; });
            T.forEach(function (t) { var p = pos[t[0]], q = pos[t[2]]; if (!p || !q || t[0] === t[2]) return; var dx = q[0] - p[0], dy = q[1] - p[1], L = Math.sqrt(dx * dx + dy * dy), ux = dx / L, uy = dy / L, k1 = Math.min(48 / Math.max(Math.abs(ux), 0.01), 17 / Math.max(Math.abs(uy), 0.01)), ox = -uy * 4, oy = ux * 4;
              o += ln(p[0] + ux * k1 + ox, p[1] + uy * k1 + oy, q[0] - ux * (k1 + 2) + ox, q[1] - uy * (k1 + 2) + oy, '#999', 1.2, 'marker-end="url(#ar' + cfg.id + ')"'); });
