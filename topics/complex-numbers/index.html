<meta name="description" content="專為「會算但想像不出來」的人設計的複數課程：不從 i² = -1 的定義出發，而是從它被什麼問題硬逼出來講起——十六世紀的三次方程式明明有三個實數解，唯一的公式卻非得繞道負數開根號，邦貝利以 x³ = 15x + 4 證明照規則算下去不會出錯；接著給出關鍵的那張圖：複數住在平面上，加法是平移，而乘法是旋轉加縮放——乘 -1 是轉半圈，於是「有沒有轉九十度的數」這個問題自然生出 i，i² = -1 不是規定而是「轉兩次九十度」的結果；再由極座標推出棣美弗定理與尤拉公式，說明 e^(iθ) 不是「e 的虛數次方」而是等速旋轉；然後用四個模組展示它真正的用途：交流電的相量與阻抗如何把微分方程變成除法、任何訊號如何拆成旋轉的疊加、量子力學中複數為何寫在基本方程式裡且干涉必須靠相位、以及控制系統中極點落在左半或右半平面如何決定機器會不會失控；最後以代數基本定理、常見誤解的逐一破解、可執行的 Python 驗證程式，與運算、公式、應用三張速查表收束。">
