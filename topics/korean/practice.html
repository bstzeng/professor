<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>拼音聽力練習：100 句實戰韓文 ｜ 韓文字母入門 ｜ 博雅書院</title>
<meta name="description" content="100 句實用旅遊韓文隨機題庫：先看韓文猜拼音，按答案鈕核對羅馬拼音並點擊試聽真人發音">
<link rel="stylesheet" href="../../css/style.css">
</head>
<body>

<header class="site-header">
  <div class="container header-inner">
    <a href="../../index.html" class="brand">🏛 博雅書院</a>
    <nav class="site-nav">
      <a href="../../index.html">首頁</a>
      <a href="../../index.html#topics">主題</a>
    </nav>
  </div>
</header>

<main>
  <div class="container">
    <nav class="breadcrumb">
      <a href="../../index.html">首頁</a>
      <span class="sep">/</span>
      <a href="index.html">韓文字母入門</a>
      <span class="sep">/</span>
      <span>拼音聽力練習</span>
    </nav>

    <header class="lesson-header">
      <div class="eyebrow">獨立練習頁 · 不屬於任何一課</div>
      <h1>拼音聽力練習：100 句實戰韓文</h1>
    </header>

    <article class="lesson-content">

      <div class="callout">
        <h3>怎麼練習</h3>
        <ul>
          <li>題庫涵蓋全部 26 課出現過的場景：打招呼、問路、交通、住宿、餐廳、購物、緊急求助等，共 100 句</li>
          <li>畫面會隨機出題，看到韓文句子先自己試著唸出羅馬拼音</li>
          <li>按「顯示答案」核對羅馬拼音，再按「🔊 聽發音」聽聽看自己唸得準不準</li>
          <li>每一輪會把 100 句都練過一次才重新洗牌，不會一直重複同幾句</li>
        </ul>
      </div>

      <div class="quiz-progress" id="quiz-progress"></div>

      <div class="quiz-card">
        <span class="quiz-category" id="quiz-category"></span>
        <p class="quiz-ko-text" id="quiz-ko-text"></p>

        <button type="button" class="quiz-show-answer" id="quiz-show-answer">顯示答案</button>

        <div class="quiz-answer" id="quiz-answer" hidden>
          <p class="quiz-ro-text" id="quiz-ro-text"></p>
          <p class="quiz-zh-text" id="quiz-zh-text"></p>
          <button type="button" class="quiz-play-btn" id="quiz-play">🔊 聽發音</button>
        </div>
      </div>

      <div class="quiz-controls">
        <button type="button" class="quiz-next-btn" id="quiz-next">下一題 →</button>
      </div>

    </article>

    <nav class="lesson-nav">
      <a href="index.html">← 回主題頁</a>
      <span></span>
      <span></span>
    </nav>
  </div>
</main>

  </div>
</footer>
