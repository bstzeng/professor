      <script>
      (function () {
        if (window.__kcvLib) return; window.__kcvLib = 1;

        function btn(t, k) { var b = document.createElement('button'); b.type = 'button'; b.textContent = t; if (k !== undefined) b.setAttribute('data-k', k);
          b.style.cssText = 'padding:4px 10px;margin:4px 6px 0 0;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer;font:inherit;font-size:0.9em'; return b; }
        function mark(bar, k) { bar.querySelectorAll('button').forEach(function (b) { var on = b.getAttribute('data-k') === String(k); b.style.background = on ? 'var(--accent-soft)' : 'var(--surface)'; b.style.fontWeight = on ? 'bold' : 'normal'; }); }
        function head(root, q) { if (q) { var p = document.createElement('p'); p.style.margin = '0 0 8px'; p.innerHTML = q; root.appendChild(p); } }
        function el(tag, css, html) { var e = document.createElement(tag); if (css) e.style.cssText = css; if (html !== undefined) e.innerHTML = html; return e; }
        function n1(v) { return Math.round(v * 10) / 10; }
        function f1(v) { return (Math.round(v * 10) / 10).toString(); }
        function f2(v) { return (Math.round(v * 100) / 100).toString(); }
        function tx(x, y, s, sz, c, anc) { return '<text x="' + n1(x) + '" y="' + n1(y) + '" font-size="' + sz + '" fill="' + (c || 'currentColor') + '" text-anchor="' + (anc || 'middle') + '">' + s + '</text>'; }
        function ln(x1, y1, x2, y2, c, w, ex) { return '<line x1="' + n1(x1) + '" y1="' + n1(y1) + '" x2="' + n1(x2) + '" y2="' + n1(y2) + '" stroke="' + c + '" stroke-width="' + (w || 1) + '" ' + (ex || '') + '/>'; }
        function svgw(vb, inner) { return '<svg viewBox="' + vb + '" style="width:100%;display:block;color:var(--text)">' + inner + '</svg>'; }
        function slider(root, lab, min, max, step, val, fmt, k, cb) { var l = el('label', 'display:block;font-size:0.88em;margin-top:6px', lab + '：<b></b>'); var s = document.createElement('input');
          s.type = 'range'; s.min = min; s.max = max; s.step = step; s.value = val; s.style.cssText = 'width:100%;display:block'; if (k) s.setAttribute('data-k', k); l.appendChild(s); root.appendChild(l);
          function u() { l.querySelector('b').textContent = fmt(+s.value); cb(+s.value); } s.addEventListener('input', u); return u; }
        function nice(lo, hi, n) { var span = hi - lo || 1, st = Math.pow(10, Math.floor(Math.log10(span / n))), e = span / n / st; st *= e >= 5 ? 5 : e >= 2 ? 2 : 1; var t = [], v = Math.ceil(lo / st - 1e-9) * st; for (; v <= hi + 1e-9; v += st) t.push(Math.round(v / st) * st); return t; }
        function fmtT(v) { var a = Math.abs(v); return a >= 1e6 ? f1(v / 1e6) + 'M' : a >= 1e4 ? f1(v / 1e3) + 'k' : (Math.round(v * 100) / 100).toString(); }
        var CID = 0;
        function chart(W, H, S, o) { o = o || {}; var L = 48, R = 12, T = 22, B = 34, xs = [], ys = [];
          S.forEach(function (s) { s.d.forEach(function (p) { xs.push(p[0]); if (isFinite(p[1])) ys.push(p[1]); }); });
          var x0 = o.x0 !== undefined ? o.x0 : Math.min.apply(null, xs), x1 = o.x1 !== undefined ? o.x1 : Math.max.apply(null, xs);
          var y0 = o.y0 !== undefined ? o.y0 : Math.min(0, Math.min.apply(null, ys)), y1 = o.y1 !== undefined ? o.y1 : Math.max.apply(null, ys) * 1.08 || 1;
          function sx(v) { return L + (v - x0) / (x1 - x0 || 1) * (W - L - R); } function sy(v) { return H - B - (v - y0) / (y1 - y0 || 1) * (H - T - B); }
          var id = 'qc' + (++CID), g = '<clipPath id="' + id + '"><rect x="' + L + '" y="' + (T - 2) + '" width="' + (W - L - R) + '" height="' + (H - T - B + 4) + '"/></clipPath>';
          nice(y0, y1, 4).forEach(function (v) { g += ln(L, sy(v), W - R, sy(v), 'var(--border)', 0.6, 'stroke-dasharray="2 3"') + tx(L - 5, sy(v) + 3, fmtT(v), 9, 'var(--text-muted)', 'end'); });
          nice(x0, x1, 6).forEach(function (v) { g += tx(sx(v), H - B + 14, fmtT(v), 9, 'var(--text-muted)'); });
          g += ln(L, T - 4, L, H - B, '#999') + ln(L, H - B, W - R, H - B, '#999');
          if (o.xl) g += tx((L + W - R) / 2, H - 4, o.xl, 9.5, 'var(--text-muted)');
          if (o.yl) g += tx(L - 40, T - 8, o.yl, 9.5, 'var(--text-muted)', 'start');
          (o.hl || []).forEach(function (h) { g += ln(L, sy(h.y), W - R, sy(h.y), h.c, 1, 'stroke-dasharray="5 4"') + tx(W - R - 2, sy(h.y) - 4, h.n, 9, h.c, 'end'); });
          (o.vl || []).forEach(function (h) { g += ln(sx(h.x), T, sx(h.x), H - B, h.c, 1, 'stroke-dasharray="5 4"') + tx(sx(h.x) + 3, H - B - 6, h.n, 9, h.c, 'start'); });
          S.forEach(function (s) { var d = '', m = 'M'; s.d.forEach(function (p) { if (!isFinite(p[1])) { m = 'M'; return; } d += m + n1(sx(p[0])) + ' ' + n1(sy(Math.max(Math.min(p[1], y1 + (y1 - y0)), y0 - (y1 - y0)))); m = 'L'; });
            g += '<path clip-path="url(#' + id + ')" d="' + d + '" fill="none" stroke="' + s.c + '" stroke-width="' + (s.w || 2) + '"' + (s.dash ? ' stroke-dasharray="' + s.dash + '"' : '') + '/>'; });
          (o.pts || []).forEach(function (p) { g += '<circle cx="' + n1(sx(p.x)) + '" cy="' + n1(sy(Math.min(p.y, y1))) + '" r="5" fill="' + p.c + '"/>' + (p.n ? tx(sx(p.x) + 8, sy(Math.min(p.y, y1)) - 6, p.n, 10, p.c, 'start') : ''); });
          var lx = L + 8, ly = T + 2; S.forEach(function (s) { if (!s.n) return; g += ln(lx, ly, lx + 16, ly, s.c, 2.5, s.dash ? 'stroke-dasharray="' + s.dash + '"' : '') + tx(lx + 20, ly + 4, s.n, 9.5, 'currentColor', 'start'); lx += 34 + s.n.length * 10.5; if (lx > W - 120) { lx = L + 8; ly += 15; } });
          return svgw('0 0 ' + W + ' ' + H, g); }
        function rexp(m) { return -Math.log(1 - Math.random()) * m; }

        var BL = '#3a6ea5', OR = '#d9822b', RD = '#d0564f', GN = '#4a9a5e', GY = '#9aa3ad', PU = '#8a5bb5', TL = '#2a9d8f', YL = '#c9a227';
        function info(root) { var p = el('div', 'margin-top:8px;padding:10px 12px;border-radius:8px;background:var(--accent-soft);line-height:1.7;font-size:0.93em'); root.appendChild(p); return p; }
        function bar(root) { var b = el('div', 'margin:4px 0'); root.appendChild(b); return b; }
        function small(s) { return '<br><span style="font-size:0.88em;color:var(--text-muted)">' + s + '</span>'; }
        function presets(root, list, cb, k0) { var b = bar(root); list.forEach(function (o, i) { var x = btn(o, i); x.onclick = function () { mark(b, i); cb(i); }; b.appendChild(x); }); mark(b, k0 === undefined ? 0 : k0); return b; }
        function setS(root, k, v) { var s = root.querySelector('input[data-k="' + k + '"]'); if (s) s.value = v; }
        function rc(x, y, w, h, f, st, rx) { return '<rect x="' + n1(x) + '" y="' + n1(y) + '" width="' + n1(Math.max(w, 0)) + '" height="' + n1(Math.max(h, 0)) + '" rx="' + (rx === undefined ? 4 : rx) + '" fill="' + f + '"' + (st ? ' stroke="' + st + '"' : '') + '/>'; }
        function ci(x, y, r, f, st, sw) { return '<circle cx="' + n1(x) + '" cy="' + n1(y) + '" r="' + n1(r) + '" fill="' + f + '"' + (st ? ' stroke="' + st + '" stroke-width="' + (sw || 1.5) + '"' : '') + '/>'; }
        function pa(d, c, w, f, ex) { return '<path d="' + d + '" fill="' + (f || 'none') + '" stroke="' + c + '" stroke-width="' + (w || 1.5) + '" ' + (ex || '') + '/>'; }
        function poly(pts) { return pts.map(function (p, i) { return (i ? 'L' : 'M') + n1(p[0]) + ' ' + n1(p[1]); }).join(' '); }
        function tbl(h, rows) { var s = '<table style="border-collapse:collapse;width:100%;font-size:0.86em;margin-top:6px"><tr>' + h.map(function (x) { return '<th style="border:1px solid var(--border);padding:3px 5px;background:var(--accent-soft)">' + x + '</th>'; }).join('') + '</tr>';
          rows.forEach(function (r) { s += '<tr>' + r.map(function (c, j) { return '<td style="border:1px solid var(--border);padding:3px 5px;text-align:' + (j ? 'center' : 'left') + '">' + c + '</td>'; }).join('') + '</tr>'; }); return s + '</table>'; }
        function rng(seed) { var s = seed || 1; return function () { s = (s * 1103515245 + 12345) % 2147483648; return s / 2147483648; }; }
        function gauss(r) { var u = Math.max(r(), 1e-9), v = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); }
        function pct(v) { return f1(v * 100) + '%'; }
        function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

        var IW = 128, IH = 96;
        function scene(noise) { var a = new Float32Array(IW * IH), r = rng(3);
          for (var y = 0; y < IH; y++) for (var x = 0; x < IW; x++) { var v = 60 + x * 0.5;
            if ((x - 38) * (x - 38) + (y - 40) * (y - 40) < 400) v = 220;
            if (x > 70 && x < 108 && y > 20 && y < 52) v = 30;
            if (y > 62 && y < 88 && x > 60 + (88 - y) * 0.2 && x < 120 - (88 - y) * 0.9) v = 170;
            if (Math.abs(y - 75) < 1.2 && x > 8 && x < 50) v = 240;
            v += (noise || 0) * gauss(r); a[y * IW + x] = v; } return a; }
        function conv(a, k, n) { var o = new Float32Array(IW * IH), h = (n - 1) / 2;
          for (var y = 0; y < IH; y++) for (var x = 0; x < IW; x++) { var s = 0;
            for (var j = 0; j < n; j++) for (var i = 0; i < n; i++) { var xx = clamp(x + i - h, 0, IW - 1), yy = clamp(y + j - h, 0, IH - 1); s += a[yy * IW + xx] * k[j * n + i]; }
            o[y * IW + x] = s; } return o; }
        function show(c, a, mode) { var ctx = c.getContext('2d'), img = ctx.createImageData(IW, IH), d = img.data;
          for (var i = 0; i < IW * IH; i++) { var v = mode === 'abs' ? Math.abs(a[i]) : mode === 'mid' ? a[i] + 128 : a[i]; v = clamp(v, 0, 255); d[i * 4] = d[i * 4 + 1] = d[i * 4 + 2] = v; d[i * 4 + 3] = 255; }
          ctx.putImageData(img, 0, 0); }
        function canv(par) { var c = document.createElement('canvas'); c.width = IW; c.height = IH; c.style.cssText = 'width:48%;image-rendering:pixelated;border-radius:6px;margin:1%'; par.appendChild(c); return c; }
        var G3 = [1, 2, 1, 2, 4, 2, 1, 2, 1].map(function (v) { return v / 16; }), SX = [-1, 0, 1, -2, 0, 2, -1, 0, 1], SY = [-1, -2, -1, 0, 0, 0, 1, 2, 1];

        /* 1. 卷積核 */
        function initConv(root, cfg) { head(root, cfg.q); var P = { k: 1, nz: 0 }, box = el('div', 'text-align:center'), view = el('div');
          var K = [['原圖', [0, 0, 0, 0, 1, 0, 0, 0, 0], ''], ['盒狀模糊', [1, 1, 1, 1, 1, 1, 1, 1, 1].map(function (v) { return v / 9; }), ''], ['高斯模糊', G3, ''], ['銳化', [0, -1, 0, -1, 5, -1, 0, -1, 0], ''], ['Sobel 水平梯度', SX, 'mid'], ['Sobel 垂直梯度', SY, 'mid'], ['拉普拉斯', [0, 1, 0, 1, -4, 1, 0, 1, 0], 'mid']];
          presets(root, K.map(function (k) { return k[0]; }), function (i) { P.k = i; draw(); }, 1);
          var u1 = slider(root, '雜訊', 0, 40, 1, 0, function (x) { return x; }, null, function (x) { P.nz = x; draw(); });
          root.appendChild(box); var c1 = canv(box), c2 = canv(box); root.appendChild(view); var inf = info(root);
          function draw() { var a = scene(P.nz), k = K[P.k], o = conv(a, k[1], 3); show(c1, a); show(c2, o, k[2]);
            var t = '<table style="margin:4px auto;border-collapse:collapse;font-family:monospace;font-size:0.9em">';
            for (var j = 0; j < 3; j++) { t += '<tr>'; for (var i = 0; i < 3; i++) t += '<td style="border:1px solid var(--border);padding:3px 8px;text-align:center">' + (Math.round(k[1][j * 3 + i] * 100) / 100) + '</td>'; t += '</tr>'; }
            view.innerHTML = '<div style="text-align:center;font-size:0.85em;color:var(--text-muted)">左：輸入；右：輸出。卷積核：</div>' + t + '</table>';
            inf.innerHTML = '卷積：把 3 × 3 的核放在每個像素上，鄰近像素乘上對應的權重再加總，就是輸出的新值。<br>' + ['原圖的核只有中心是 1，輸出不變。', '盒狀模糊取 9 格平均：雜訊被抹平，但邊緣也變模糊。', '高斯模糊中心權重較大，模糊得更自然；常用來在偵測邊緣前去除雜訊。', '銳化＝原圖＋（原圖 − 模糊），加強邊緣的對比；但雜訊也一起被放大。', 'Sobel 水平梯度：左右亮度的變化，垂直的邊緣最明顯（灰色＝0，亮＝由暗變亮，暗＝由亮變暗）。', 'Sobel 垂直梯度：上下的亮度變化，水平的邊緣最明顯。', '拉普拉斯：二階導數，對所有方向的邊緣與雜訊都很敏感。'][P.k] + small('CNN 的卷積層做的是同一件事，只是核的權重是從資料中學出來的。'); }
          u1();
        }

        /* 2. 邊緣偵測 */
        function initEdge(root, cfg) { head(root, cfg.q); var P = { nz: 15, bl: 1, th: 60 }, box = el('div', 'text-align:center');
          var u1 = slider(root, '雜訊', 0, 40, 1, P.nz, function (x) { return x; }, null, function (x) { P.nz = x; draw(); });
          var u2 = slider(root, '先模糊幾次（高斯）', 0, 4, 1, P.bl, function (x) { return x + ' 次'; }, null, function (x) { P.bl = x; draw(); });
          var u3 = slider(root, '梯度門檻', 10, 200, 5, P.th, function (x) { return x; }, null, function (x) { P.th = x; draw(); });
          root.appendChild(box); var c1 = canv(box), c2 = canv(box); var inf = info(root);
          function draw() { var a = scene(P.nz), i; for (i = 0; i < P.bl; i++) a = conv(a, G3, 3);
            var gx = conv(a, SX, 3), gy = conv(a, SY, 3), m = new Float32Array(IW * IH), e = new Float32Array(IW * IH), cnt = 0;
            for (i = 0; i < IW * IH; i++) { m[i] = Math.sqrt(gx[i] * gx[i] + gy[i] * gy[i]) / 4; e[i] = m[i] > P.th / 4 ? 255 : 0; if (e[i]) cnt++; }
            show(c1, m); show(c2, e);
            inf.innerHTML = '左：梯度強度；右：超過門檻的像素（邊緣），共 <b>' + cnt + '</b> 個。<br>' + (P.nz > 10 && P.bl === 0 ? '雜訊很多又不先模糊，到處都是假的邊緣。' : P.th > 140 ? '門檻太高，連真正的邊緣也斷斷續續。' : P.th < 30 ? '門檻太低，連背景的漸層與雜訊都被當成邊緣。' : '先模糊去除雜訊、再計算梯度、最後取門檻——這就是 Canny 等邊緣偵測器的基本流程。') + small('完整的 Canny 偵測器還會做「非極大值抑制」把邊緣變細，並用高低兩個門檻連接邊緣。'); }
          u1(); u2(); u3();
        }

        /* 3. IoU 與 NMS */
        function initIou(root, cfg) { head(root, cfg.q); var P = { m: 0, dx: 20, dy: 10, s: 100, th: 50 }, view = el('div');
          presets(root, ['IoU：預測框與真實框', 'NMS：去除重複的框'], function (i) { P.m = i; show(); draw(); });
          var g1 = el('div'), g2 = el('div'); root.appendChild(g1); root.appendChild(g2);
          var u1 = slider(g1, '預測框水平偏移', -80, 80, 1, P.dx, function (x) { return x + ' 像素'; }, null, function (x) { P.dx = x; draw(); });
          var u2 = slider(g1, '預測框垂直偏移', -60, 60, 1, P.dy, function (x) { return x + ' 像素'; }, null, function (x) { P.dy = x; draw(); });
          var u3 = slider(g1, '預測框大小', 50, 160, 1, P.s, function (x) { return x + '%'; }, null, function (x) { P.s = x; draw(); });
          var u4 = slider(g2, 'NMS 的 IoU 門檻', 10, 90, 5, P.th, function (x) { return x + '%'; }, null, function (x) { P.th = x; draw(); });
          root.appendChild(view); var inf = info(root);
          function show() { g1.style.display = P.m ? 'none' : ''; g2.style.display = P.m ? '' : 'none'; }
          function iou(a, b) { var x1 = Math.max(a[0], b[0]), y1 = Math.max(a[1], b[1]), x2 = Math.min(a[0] + a[2], b[0] + b[2]), y2 = Math.min(a[1] + a[3], b[1] + b[3]), I = Math.max(0, x2 - x1) * Math.max(0, y2 - y1); return I / (a[2] * a[3] + b[2] * b[3] - I); }
          function draw() { var o = rc(0, 0, 640, 260, 'var(--accent-soft)', null, 6);
            if (!P.m) { var gt = [240, 70, 160, 120], k = P.s / 100, w = 160 * k, h = 120 * k, pr = [320 + P.dx - w / 2, 130 + P.dy - h / 2, w, h], v = iou(gt, pr);
              o += rc(gt[0], gt[1], gt[2], gt[3], 'rgba(74,154,94,0.15)', GN) + rc(pr[0], pr[1], pr[2], pr[3], 'rgba(58,110,165,0.15)', BL) + tx(gt[0] + 4, gt[1] - 4, '真實框', 11, GN, 'start') + tx(pr[0] + pr[2] - 4, pr[1] + pr[3] + 14, '預測框', 11, BL, 'end');
              view.innerHTML = svgw('0 0 640 260', o);
              inf.innerHTML = 'IoU（交集 ÷ 聯集）＝ <b>' + pct(v) + '</b>：' + (v >= 0.5 ? '<span style="color:' + GN + '">≥ 50%，在常見的標準下算「偵測正確」</span>' : '<span style="color:' + RD + '">< 50%，算偵測錯誤</span>') + '。<br>IoU 同時考慮了位置與大小：框偏了、太大、太小，都會降低 IoU。COCO 等評測會在 50%～95% 等多個門檻下計算平均精確度（mAP）。'; return; }
            var B = [[100, 50, 150, 160, 0.95], [112, 60, 145, 150, 0.88], [90, 40, 165, 170, 0.80], [130, 70, 120, 140, 0.62], [380, 60, 140, 150, 0.91], [395, 75, 130, 140, 0.70], [360, 50, 150, 165, 0.55]], keep = [], ord = B.map(function (b, i) { return i; }).sort(function (a, b) { return B[b][4] - B[a][4]; });
            ord.forEach(function (i) { if (keep.every(function (j) { return iou(B[i], B[j]) < P.th / 100; })) keep.push(i); });
            B.forEach(function (b, i) { var on = keep.indexOf(i) >= 0; o += rc(b[0], b[1], b[2], b[3], 'none', on ? RD : GY, 2) + tx(b[0] + 3, b[1] + 13, f2(b[4]), 10, on ? RD : GY, 'start'); });
            view.innerHTML = svgw('0 0 640 260', o);
            inf.innerHTML = '偵測器常對同一個物體輸出好幾個重疊的框。<b>非極大值抑制（NMS）</b>：先留下分數最高的框，刪掉和它重疊（IoU 超過門檻）的其他框，再對剩下的重複這個步驟。保留了 <b>' + keep.length + '</b> 個框（紅色）。<br>' + (keep.length > 2 ? '門檻太高，同一個物體留下了好幾個框。' : keep.length < 2 ? '門檻太低，兩個不同的物體被誤刪成一個。' : '兩個物體各留下一個框——剛好。') + small('左右各有一個物體；數字是偵測器給的信心分數。'); }
          show(); u1(); u2(); u3(); u4();
        }

        /* 4. 立體視覺 */
        function initStereo(root, cfg) { head(root, cfg.q); var P = { B: 12, f: 700, d: 20 }, view = el('div');
          var u1 = slider(root, '兩台相機的間距（基線）', 2, 50, 1, P.B, function (x) { return x + ' 公分'; }, null, function (x) { P.B = x; draw(); });
          var u2 = slider(root, '焦距', 300, 1500, 50, P.f, function (x) { return x + ' 像素'; }, null, function (x) { P.f = x; draw(); });
          var u3 = slider(root, '視差（同一點在兩張影像中的水平位移）', 1, 100, 1, P.d, function (x) { return x + ' 像素'; }, null, function (x) { P.d = x; draw(); });
          root.appendChild(view); var inf = info(root);
          function draw() { var Z = P.f * P.B / P.d / 100, dz = P.f * P.B / (P.d - 0.5) / 100 - Z, d = [], k;
            for (k = 1; k <= 100; k++) d.push([k, P.f * P.B / k / 100]);
            view.innerHTML = chart(640, 230, [{ d: d, c: BL, n: '深度' }], { x0: 1, x1: 100, y0: 0, y1: Math.min(Math.max(P.f * P.B / 100 / 2, 5), 60), xl: '視差（像素）', yl: '深度（公尺）', vl: [{ x: P.d, c: RD, n: '' }] });
            inf.innerHTML = '深度 Z ＝ 焦距 × 基線 ÷ 視差 ＝ ' + P.f + ' × ' + P.B + ' 公分 ÷ ' + P.d + ' ＝ <b>' + f2(Z) + ' 公尺</b>。<br>如果視差量錯 0.5 個像素，深度就差約 <b>' + f2(dz) + ' 公尺</b>。視差越小（越遠），誤差越大——所以雙眼與立體相機只擅長估計近處的距離；想看得更遠，就要加大基線或焦距。' + small('人的雙眼基線約 6.5 公分；車用立體相機常見 12～30 公分。'); }
          u1(); u2(); u3();
        }

        function initAll() { document.querySelectorAll('.kcv-w').forEach(function (w) { if (w.__d) return; w.__d = 1; var cfg = JSON.parse(w.getAttribute('data-cfg'));
          ({ conv: initConv, edge: initEdge, iou: initIou, stereo: initStereo })[cfg.t](w, cfg); }); }
        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', initAll); else initAll();
      })();
      </script>
